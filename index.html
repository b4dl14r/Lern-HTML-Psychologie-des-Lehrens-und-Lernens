et.","loesung":2},{"text":"Man darf konsequent nur dann Fragen beantworten, wenn sich die Schüler gemeldet haben und an der Reihe sind.","loesung":1},{"text":"Man sollte konsequent jeden Mitschüler ermahnen, der reinruft, und die Frage je nach Dringlichkeit sofort oder erst später beantworten.","loesung":0},{"text":"Man sollte Bruno darauf aufmerksam machen, dass er sich ein Beispiel am Klassenbesten nehmen soll, der sich immer ordentlich meldet.","loesung":2},{"text":"Man sollte Brunos Fragen, wenn er reinruft, auf keinen Fall sofort beantworten, sondern konsequent zuerst alle Schüler*innen drannehmen, die sich gemeldet haben und warten.","loesung":1}],"erklaerung":"Nach Bandura wird ein beobachtetes Verhalten enthemmt, wenn das Modell dafür belohnt wird, und gehemmt, wenn es dafür bestraft wird; Voraussetzung dafür ist außerdem, dass das Modell für den Beobachtenden attraktiv ist und die Konsequenz sichtbar wird. Wer konsequent nur Meldende drannimmt, verstärkt das Melden stellvertretend und lässt das Reinrufen leer ausgehen – Zeile 2 und Zeile 5 verringern das Reinrufen. Zeile 3 erhöht es dagegen: Die Ermahnung wirkt bei Bruno nachweislich nicht aversiv, die Frage wird aber weiterhin beantwortet, sodass das Reinrufen am Modell der anderen Reinrufer sichtbar belohnt und damit enthemmt wird. Zeile 1 nennt bewusst „jeden Mitschüler“ und benennt keinerlei Konsequenz für das Modellverhalten; ohne Modellmerkmale und ohne stellvertretende Verstärkung erlaubt die Theorie keine Prognose. Zeile 4 scheitert an der Modellattraktivität: Der Klassenbeste wird von Bruno ausdrücklich nicht geschätzt, sodass eine Nachahmung nicht vorhergesagt werden kann.","folie":"7 Lernen Verhaltensmanagement – Modelllernen, Seite 14-15 (Effekte, Phasen und Prozesse)"},{"id":"hp3b-sose2020-07","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 54","vertrauen":"mittel","teil":"I","thema":"Modelllernen und Verhaltensmanagement","modell":"Bandura (1963, 1977), Hemmung/Enthemmung durch Beobachtungslernen","typ":"matrix","stamm":"Beurteilen Sie für jede der beschriebenen Situationen vor dem Hintergrund der Ergebnisse der Experimente zum Lernen am Modell (Bandura, 1963; 1977), ob das modellierte (fett hervorgehobene) Verhalten bei den BeobachterInnen wahrscheinlich gehemmt oder enthemmt wird oder nicht sicher vorhersagbar ist. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Modelliertes Verhalten wird beim Beobachtenden wahrscheinlich …","spalten":["nicht sicher vorhersagbar","gehemmt","enthemmt"],"zeilen":[{"text":"Hannes lässt in der Schule vor dem Auge des Lehrers Müll auf den Boden fallen. Dieser weist ihn umgehend an, den Müll in den Müllbehälter zu schaffen. Hannes' Kumpel beobachtet diese Situation.","loesung":1},{"text":"Der dreijährige Paul schreit und weint an der Supermarktkasse. Als er einen Schokoladenriegel bekommt, hört er auf. Der dreijährige Bruno beobachtet diese Situation.","loesung":2},{"text":"Im Sportunterricht führt Vanessa (sie turnt als Einzige der Klasse im Verein) einen Salto rückwärts mit Schraube vor. Die MitschülerInnen beobachten sie dabei.","loesung":0},{"text":"Frau Weiß stellt im Unterricht eine Frage, Klara ruft die Antwort rein, ohne sich zu melden. Frau Weiß lässt sie ausreden. Die ganze Klasse beobachtet diese Situation.","loesung":0}],"erklaerung":"Nach Bandura steigt die Hemmschwelle für ein beobachtetes Verhalten, wenn das Modell dafür bestraft wird, und sinkt, wenn das Modell dafür belohnt wird. Hannes wird für das Wegwerfen von Müll sofort zurechtgewiesen, sodass sein Kumpel dieses Verhalten eher gehemmt zeigt; Paul wird für sein Schreien mit Süßigkeiten belohnt, sodass Bruno das Verhalten eher enthemmt zeigt. Bei Vanessas Salto und bei Klaras Reinrufen wird keine eindeutige Konsequenz (Belohnung oder Bestrafung) berichtet – Vanessas Können bleibt folgenlos und Frau Weiß lässt Klara lediglich gewähren, ohne sie zu loben oder zu tadeln –, weshalb die Wirkung auf die BeobachterInnen laut Modell nicht sicher vorhersagbar ist.","folie":"7 Lernen Verhaltensmanagement - Modelllernen, Seite 14 (Hemmung – Enthemmung von bekannten Verhaltensweisen)"},{"id":"erg-premack-01","quelle":"Standardlehrbuch Pädagogische Psychologie (Premack)","vertrauen":"hoch","teil":"I","thema":"Operantes Konditionieren","modell":"Premack-Prinzip","typ":"mc-kombi","frage":"Welche Aussage beschreibt das Premack-Prinzip im Verhaltensmanagement zutreffend?","aussagen":["Eine Verhaltensweise mit hoher Auftretenswahrscheinlichkeit kann als effektiver Verstärker für ein Verhalten mit niedriger Basisrate genutzt werden.","Verhalten wird am schnellsten gelöscht, wenn alle Verstärkerpläne auf variable Quoten umgestellt werden.","Bestrafung Typ I führt schneller zu intrinsischer Motivation als positive Verstärkung.","Lernen am Modell funktioniert ausschließlich bei identischen Geschlechtsmerkmalen von Beobachter und Modell."],"aussagen_richtig":[0],"optionen":["Aussage (1) trifft zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (2) treffen zu; alle anderen treffen nicht zu.","Die Aussagen (3) und (4) treffen zu; alle anderen treffen nicht zu.","Aussage (2) trifft zu; alle anderen treffen nicht zu."],"loesung":0,"hint":"Erst die ungeliebte Pflicht (niedrige Rate), dann das beliebte Privileg (hohe Rate).","erklaerung":"Nach dem Premack-Prinzip (David Premack) fungiert die Gelegenheit zur Ausführung einer hochfrequenten, beliebten Aktivität (z. B. freies Spiel) als wirksamer Verstärker für eine niederfrequente, ungeliebte Aktivität (z. B. Vokabelnlernen)."},{"id":"ex2016-04-1","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 4.1","vertrauen":"mittel","teil":"I","thema":"Operantes Konditionieren","modell":"Operantes Konditionieren – Verstärkung, Bestrafung, Löschung","typ":"mc-kombi","stamm":"Eine Lehrerin gibt ihrer Klasse Werkstattaufgaben, die jeder Schüler für sich und ruhig in einem Unterrichtsblock von zwei Doppelstunden lösen soll. Jeder Schüler ist „Chef“ für eine Aufgabe, das heißt, er löst zuerst diese Aufgabe und überprüft mit Hilfe der von der Lehrerin vorbereiteten Musterlösung, ob alles stimmt. Wenn Mitschüler Fragen zu dieser Aufgabe haben, ist er dann auch die Ansprechperson. Außerdem ist der „Chef“ Ansprechperson für das Kontrollieren der Richtigkeit der Aufgabe. An die Lehrerin sollen sich die Schüler nur dann wenden, wenn ein „Chef“ bei Fragen nicht weiterhelfen kann.\n\nFür Helena ist es besonders wichtig, Rückmeldung zu ihren Aufgaben zu bekommen. Warten empfindet sie als sehr unangenehm. Daher geht sie bei Fragen direkt zur Lehrerin und will, sobald sie eine Aufgabe gelöst hat, diese direkt von der Lehrerin korrigieren lassen. Die Lehrerin schickt sie jedoch jedes Mal zum „Chef“. Helena lässt daraufhin die Richtigkeit ihrer nächsten Lösungen häufiger direkt beim „Chef“ kontrollieren und erhält von ihm entsprechend Rückmeldung zu ihren Aufgaben. Im Verlauf der Doppelstunde muss Helena jedoch manchmal ziemlich lange warten, bis sie beim „Chef“ an der Reihe ist, da dieser auch Fragen anderer Schüler beantworten muss. Beim Warten tippt sie ungeduldig mit dem Fuß. Die Lehrerin erkennt Helenas Problem und ruft alle „Chefs“ noch einmal zusammen. Sie bespricht mit ihnen, wie ein Zeitplan in der Doppelstunde aussehen kann, sodass keine Wartezeit mehr nötig ist. Auf diese Weise muss Helena nicht mehr lange warten, bis sie beim „Chef“ an der Reihe ist. Nun kommt sie nur noch sehr selten zur Lehrerin, anstatt beim „Chef“ die Lösungen kontrollieren zu lassen. Wenn dies doch geschieht, schickt die Lehrerin Helena auch weiterhin konsequent zuerst zu den „Chefs“. Gegen Ende der Stunde verletzt Helena nun genauso wie ihre beste Freundin Maria, die noch nie direkt zur Lehrerin gegangen war, die Werkstattregeln nicht mehr.","frage":"Was passiert aus Sicht der Erkenntnisse zum Operanten Konditionieren mit dem Nicht-Einhalten bzw. Einhalten der Werkstattregeln bei Helena?","aussagen":["Das Einhalten der Werkstattregeln wird positiv verstärkt.","Das Einhalten der Werkstattregeln wird negativ verstärkt.","Das Nicht-Einhalten der Werkstattregeln wird nach Typ 1 bestraft.","Das Nicht-Einhalten der Werkstattregeln wird nach Typ 2 bestraft.","Das Nicht-Einhalten der Werkstattregeln wird gelöscht."],"aussagen_richtig":[4],"optionen":["Die Aussagen (1) und (2) treffen zu, alle anderen aber nicht.","Die Aussagen (2), (3) und (4) treffen zu, alle anderen aber nicht.","Die Aussagen (1), (2) und (5) treffen zu, alle anderen aber nicht.","Die Aussagen (3) und (4) treffen zu, alle anderen aber nicht.","Aussage (5) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":4,"erklaerung":"Helenas Regelverstoß besteht darin, direkt zur Lehrerin zu gehen. Der Verstärker, den sie damit früher erreicht hat – die Rückmeldung der Lehrerin – bleibt nun konsequent aus. Ein Verhalten, das keine Verstärkung mehr erfährt, wird gelöscht. Genau das beschreibt der Schluss der Vignette: Helena geht am Ende nicht mehr zur Lehrerin. Bestrafung scheidet aus, weil die Lehrerin weder etwas Unangenehmes hinzufügt (Typ 1) noch etwas Angenehmes wegnimmt (Typ 2) – sie verweist nur weiter. Zur Abgrenzung: Man könnte argumentieren, dass das Einhalten der Regeln durch die Rückmeldung des „Chefs“ positiv verstärkt wird. Die Aufgabe zielt aber auf die eine Kontingenz, die die Lehrerin steuert, und darauf, dass die Verhaltensrate des Regelverstoßes sinkt. Diese Aufgabe ist ohne amtlichen Lösungsschlüssel nicht vollständig absicherbar; das Klausurexemplar zeigt (e).","folie":"6 Operantes Konditionieren – Verstärkung, Bestrafung, Löschung"},{"id":"ex2016-04-2","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 4.2","vertrauen":"hoch","teil":"I","thema":"Operantes Konditionieren","modell":"Verstärkungspläne","typ":"mc-kombi","stamm":"Eine Lehrerin gibt ihrer Klasse Werkstattaufgaben, die jeder Schüler für sich und ruhig in einem Unterrichtsblock von zwei Doppelstunden lösen soll. Jeder Schüler ist „Chef“ für eine Aufgabe, das heißt, er löst zuerst diese Aufgabe und überprüft mit Hilfe der von der Lehrerin vorbereiteten Musterlösung, ob alles stimmt. Wenn Mitschüler Fragen zu dieser Aufgabe haben, ist er dann auch die Ansprechperson. Außerdem ist der „Chef“ Ansprechperson für das Kontrollieren der Richtigkeit der Aufgabe. An die Lehrerin sollen sich die Schüler nur dann wenden, wenn ein „Chef“ bei Fragen nicht weiterhelfen kann.\n\nFür Helena ist es besonders wichtig, Rückmeldung zu ihren Aufgaben zu bekommen. Warten empfindet sie als sehr unangenehm. Daher geht sie bei Fragen direkt zur Lehrerin und will, sobald sie eine Aufgabe gelöst hat, diese direkt von der Lehrerin korrigieren lassen. Die Lehrerin schickt sie jedoch jedes Mal zum „Chef“. Helena lässt daraufhin die Richtigkeit ihrer nächsten Lösungen häufiger direkt beim „Chef“ kontrollieren und erhält von ihm entsprechend Rückmeldung zu ihren Aufgaben. Im Verlauf der Doppelstunde muss Helena jedoch manchmal ziemlich lange warten, bis sie beim „Chef“ an der Reihe ist, da dieser auch Fragen anderer Schüler beantworten muss. Beim Warten tippt sie ungeduldig mit dem Fuß. Die Lehrerin erkennt Helenas Problem und ruft alle „Chefs“ noch einmal zusammen. Sie bespricht mit ihnen, wie ein Zeitplan in der Doppelstunde aussehen kann, sodass keine Wartezeit mehr nötig ist. Auf diese Weise muss Helena nicht mehr lange warten, bis sie beim „Chef“ an der Reihe ist. Nun kommt sie nur noch sehr selten zur Lehrerin, anstatt beim „Chef“ die Lösungen kontrollieren zu lassen. Wenn dies doch geschieht, schickt die Lehrerin Helena auch weiterhin konsequent zuerst zu den „Chefs“. Gegen Ende der Stunde verletzt Helena nun genauso wie ihre beste Freundin Maria, die noch nie direkt zur Lehrerin gegangen war, die Werkstattregeln nicht mehr.\n\nHelenas Lehrerin bekommt von einer Kollegin die Empfehlung, Helenas Fragen häufiger selbst zu beantworten, da Helena sonst schnell frustriert sein könnte und vielleicht gar nicht mehr an den Aufgaben arbeitet. Helenas Lehrerin ist sich nicht sicher, ob diese Empfehlung sinnvoll ist. Daher beschließt sie, zunächst nur ungefähr jedes dritte Mal Helenas Fragen zu beantworten. Damit Helena jedoch nicht schon vorher weiß, wann sie sich an die Lehrerin wenden darf, will sie manchmal auf jede zweite und manchmal erst auf jede vierte oder fünfte von Helenas Fragen antworten.","frage":"Ist diese Empfehlung aus Sicht der Erkenntnisse zum Operanten Konditionieren sinnvoll, um das Einhalten der Werkstattregeln zu erreichen?","aussagen":["Nein, denn das an-die-Lehrerin-Wenden wird dadurch kontinuierlich verstärkt.","Nein, denn das an-die-Lehrerin-Wenden wird dadurch nach einem variablen Quotenplan verstärkt.","Nein, denn das an-die-Lehrerin-Wenden wird dadurch nach einem fixierten Quotenplan verstärkt.","Nein, denn das an-die-Lehrerin-Wenden wird dadurch sehr schnell wieder aufgebaut.","Nein, denn das an-die-Lehrerin-Wenden wird dadurch löschungsresistenter."],"aussagen_richtig":[1,4],"optionen":["Aussage (1) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (4) treffen zu, alle anderen aber nicht.","Die Aussagen (2) und (4) treffen zu, alle anderen aber nicht.","Aussage (5) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu, alle anderen aber nicht."],"loesung":4,"erklaerung":"Verstärkt wird nach einer wechselnden Anzahl von Reaktionen – mal jede zweite, mal jede vierte oder fünfte Frage. Die Bezugsgröße ist die Anzahl der Reaktionen, nicht verstrichene Zeit, also ein Quotenplan; und die Zahl schwankt, also ein variabler. Damit ist (2) richtig und (1) sowie (3) falsch. Variable Quotenpläne erzeugen die höchste Löschungsresistenz, weil nie vorhersehbar ist, ob gerade die nächste Reaktion verstärkt wird – deshalb trifft (5) zu. Genau das macht die Empfehlung kontraproduktiv: Das unerwünschte Verhalten wird schwerer abzubauen als vorher. (4) trifft nicht zu, weil das Verhalten nicht neu aufgebaut, sondern stabilisiert wird.","folie":"6 Operantes Konditionieren – Verstärkungspläne"},{"id":"ex2024-04-1","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 4.1 (S. 4)","vertrauen":"mittel","teil":"I","thema":"Operantes Konditionieren","modell":"Skinner, Klassifizierung von Verhaltenskonsequenzen","typ":"mc-kombi","stamm":"Frau Schneider gibt den Schüler*innen ihrer Klasse eine Aufgabe, die jeder für sich und ruhig in der Stunde lösen soll. Bei Fragen sollen sich die Schüler*innen melden und warten, bis die Lehrerin zu ihrem Platz kommt. Alle Schüler*innen arbeiten still und konzentriert an der Lösung ihrer Aufgabe. Immer wieder melden sich Schüler*innen, manchmal auch mehrere, sodass man teilweise kurz warten muss, bis die Fragen geklärt werden können. Plötzlich fragt Bruno etwas zur Aufgabe, ohne sich zu melden, und reißt die anderen aus ihrer Tätigkeit heraus. So läuft es nun jedes Mal ab, wenn Bruno nicht weiterkommt. Frau Schneider schimpft dann zwar jedes Mal mit ihm und macht ihn darauf aufmerksam, dass er sich erst melden und warten soll, bis sie zu seinem Platz kommt, um die anderen nicht bei der Aufgabenlösung zu stören. Aber sie beantwortet dann auch gleich anschließend Brunos Frage, selbst wenn andere Schüler*innen bereits darauf warten, dass ihre Frage geklärt wird. Bruno ist ein fleißiger Schüler, der sonst selten ermahnt werden muss und immer bemüht ist, alle Aufgaben richtig und vollständig zu lösen. Kommt es zu Ermahnungen, macht ihm dies nichts aus. Abwarten findet er hingegen blöd. Daher freut er sich, dass er häufig zuerst drankommt, insbesondere vor dem von ihm nicht geschätzten Klassenbesten, der sich immer ordentlich meldet und geduldig abwartet. Außerdem ermöglichen ihm die schnellen Hilfestellungen der Lehrerin, die Aufgaben zügig zu lösen. Frau Schneider weiß sich nicht mehr zu helfen, da trotz ihrer konsequenten Ermahnungen Brunos Reinrufen eher schlimmer als besser wird.","frage":"Mit welchen operanten Lernprinzipien wird Brunos Reinrufen im Fallbeispiel beeinflusst?","aussagen":["Brunos Reinrufen wird positiv verstärkt.","Brunos Reinrufen wird negativ verstärkt.","Brunos Reinrufen wird nach Typ I bestraft.","Brunos Reinrufen wird nach Typ II bestraft.","Brunos Reinrufen wird gelöscht."],"optionen":["Die Aussagen (1) und (5) treffen zu, alle anderen aber nicht.","Die Aussagen (3) und (4) treffen zu, alle anderen aber nicht.","Die Aussagen (1) und (2) treffen zu, alle anderen aber nicht.","Die Aussagen (2) und (3) treffen zu, alle anderen aber nicht.","Die Aussagen (2) und (5) treffen zu, alle anderen aber nicht."],"loesung":2,"aussagen_richtig":[0,1],"erklaerung":"Ob eine Konsequenz verstärkt oder bestraft, entscheidet nicht ihre Erscheinungsform, sondern ihre Wirkung auf die Verhaltensrate. Brunos Reinrufen wird „eher schlimmer als besser“ – die Rate steigt, also liegt Verstärkung vor und keine Bestrafung. Sie wirkt auf zwei Wegen: Frau Schneider beantwortet Brunos Frage sofort, er kommt zuerst dran und kann zügig weiterarbeiten – eine angenehme Konsequenz wird dargeboten, das ist positive Verstärkung (1). Gleichzeitig entgeht er durch das Reinrufen dem Warten, das er ausdrücklich „blöd“ findet – eine unangenehme Konsequenz wird entfernt, das ist negative Verstärkung (2). Die Ermahnungen wären zwar der Form nach Bestrafung Typ I, machen Bruno aber nach eigener Aussage nichts aus und senken die Rate nicht, weshalb (3) und (4) ausscheiden. Löschung (5) liegt nicht vor, weil das Verhalten gerade nicht konsequenzlos bleibt.","folie":"6 Operantes Konditionieren, Seite 20 (Klassifizierung von Verhaltenskonsequenzen)"},{"id":"ex2024-04-2","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 4.2 (S. 5)","vertrauen":"mittel","teil":"I","thema":"Operantes Konditionieren","modell":"Skinner, Verstärkungspläne","typ":"mc-kombi","stamm":"Frau Schneider gibt den Schüler*innen ihrer Klasse eine Aufgabe, die jeder für sich und ruhig in der Stunde lösen soll. Bei Fragen sollen sich die Schüler*innen melden und warten, bis die Lehrerin zu ihrem Platz kommt. Alle Schüler*innen arbeiten still und konzentriert an der Lösung ihrer Aufgabe. Immer wieder melden sich Schüler*innen, manchmal auch mehrere, sodass man teilweise kurz warten muss, bis die Fragen geklärt werden können. Plötzlich fragt Bruno etwas zur Aufgabe, ohne sich zu melden, und reißt die anderen aus ihrer Tätigkeit heraus. So läuft es nun jedes Mal ab, wenn Bruno nicht weiterkommt. Frau Schneider schimpft dann zwar jedes Mal mit ihm und macht ihn darauf aufmerksam, dass er sich erst melden und warten soll, bis sie zu seinem Platz kommt, um die anderen nicht bei der Aufgabenlösung zu stören. Aber sie beantwortet dann auch gleich anschließend Brunos Frage, selbst wenn andere Schüler*innen bereits darauf warten, dass ihre Frage geklärt wird. Bruno ist ein fleißiger Schüler, der sonst selten ermahnt werden muss und immer bemüht ist, alle Aufgaben richtig und vollständig zu lösen. Kommt es zu Ermahnungen, macht ihm dies nichts aus. Abwarten findet er hingegen blöd. Daher freut er sich, dass er häufig zuerst drankommt, insbesondere vor dem von ihm nicht geschätzten Klassenbesten, der sich immer ordentlich meldet und geduldig abwartet. Außerdem ermöglichen ihm die schnellen Hilfestellungen der Lehrerin, die Aufgaben zügig zu lösen. Frau Schneider weiß sich nicht mehr zu helfen, da trotz ihrer konsequenten Ermahnungen Brunos Reinrufen eher schlimmer als besser wird. Frau Schneider bekommt von einem Kollegen die Empfehlung, Brunos Reinrufen teilweise zu ignorieren und nur noch bei jedem dritten Reinrufen auf ihn einzugehen und seine Frage zu beantworten.","frage":"Ist diese Empfehlung aus Sicht der Erkenntnisse zum Operanten Konditionieren sinnvoll?","aussagen":["Ja, denn das Reinrufen wird dadurch nach einem variablen Intervallplan negativ verstärkt.","Nein, denn das Reinrufen wird dadurch nach einem fixierten Quotenplan negativ verstärkt.","Nein, denn das Reinrufen wird dadurch nach einem fixierten Intervallplan positiv verstärkt.","Ja, denn das Reinrufen wird dadurch nach einem variablen Quotenplan negativ verstärkt.","Nein, denn das Reinrufen wird dadurch nach einem fixierten Quotenplan positiv verstärkt."],"optionen":["Die Aussagen (2) und (5) treffen zu, alle anderen aber nicht.","Die Aussagen (1), (2) und (3) treffen zu, alle anderen aber nicht.","Die Aussagen (4) und (5) treffen zu, alle anderen aber nicht.","Die Aussagen (1) und (3) treffen zu, alle anderen aber nicht.","Aussage (2) trifft zu, alle anderen treffen nicht zu."],"loesung":0,"aussagen_richtig":[1,4],"erklaerung":"Verstärkungspläne werden danach unterschieden, ob die Verstärkung an eine Anzahl von Reaktionen (Quotenplan) oder an eine Zeitspanne (Intervallplan) geknüpft ist und ob diese Größe konstant (fixiert) oder wechselnd (variabel) ist. „Jedes dritte Reinrufen“ knüpft die Verstärkung an eine feste Anzahl von Reaktionen, ist also ein fixierter Quotenplan – damit scheiden alle Intervall- und alle variablen Varianten aus, also (1), (3) und (4). Verstärkt wird wie in Aufgabe 4.1 auf beiden Wegen: positiv durch die beantwortete Frage (5) und negativ durch das vermiedene Warten (2). Die Empfehlung ist gerade nicht sinnvoll, denn intermittierend verstärktes Verhalten ist deutlich löschungsresistenter als kontinuierlich verstärktes – das Reinrufen würde dadurch stabiler statt seltener.","folie":"6 Operantes Konditionieren, Seite 34 und 41 (Verstärkungspläne, Löschungsresistenz)"},{"id":"ex2024-05","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 5 (S. 7)","vertrauen":"hoch","teil":"I","thema":"Operantes Konditionieren","modell":"Skinner, Verstärkungspläne","typ":"matrix","frage":"Beim Operanten Konditionieren werden verschiedene Verstärkungspläne unterschieden. Entscheiden Sie für folgende Beispiele aus dem Alltag, welcher Verstärkungsplan jeweils wirkt. Pro Aussage gibt es nur eine korrekte Antwort.","spalten":["Feste Quote","Variable Quote","Festes Intervall","Variables Intervall","Kontinuierliche Verstärkung"],"zeilen":[{"text":"Es ist nicht absehbar, nach wie vielen Geldeinwürfen der Spielautomat Gewinn ausschüttet.","loesung":1},{"text":"Nach jeweils 10 korrekt bearbeiteten Aufgaben erhält man über die Rechen-App Zugriff auf ein Zusatzspiel.","loesung":0},{"text":"Nach jeder korrekt eingetragenen Übersetzung einer Vokabel lobt die Sprach-App: „Das hast du super gemacht.“","loesung":4},{"text":"Nach mehr oder weniger langem Warten taucht eine geeignete Welle zum Surfen auf.","loesung":3},{"text":"Jedes Mal, wenn sich Max im Unterricht meldet, wird er aufgerufen.","loesung":4},{"text":"Immer donnerstags lernen die Schüler*innen fleißig Vokabeln, um auf den jeden Freitag stattfindenden Vokabeltest vorbereitet zu sein.","loesung":2}],"erklaerung":"Zwei Fragen entscheiden: Hängt die Verstärkung an einer Anzahl von Reaktionen (Quote) oder an einer Zeitspanne (Intervall), und ist diese Größe konstant (fest) oder wechselnd (variabel)? Der Spielautomat zahlt nach einer unvorhersehbaren Zahl von Einwürfen aus – variable Quote. Genau zehn Aufgaben sind eine festgelegte Reaktionszahl – feste Quote. Wird jede einzelne korrekte Reaktion verstärkt (jede Vokabel, jede Meldung von Max), liegt kontinuierliche Verstärkung vor. Die Welle kommt nach mal kürzerem, mal längerem Warten, also nach einer wechselnden Zeitspanne – variables Intervall. Der Vokabeltest findet dagegen immer freitags statt, die Zeitspanne ist konstant – festes Intervall. Die beiden letzten Zeilen kommen in dieser Formulierung auch in der Klausur WiSe 2020/21 mit dokumentierter Lösung vor und sind dort ebenso zugeordnet.","folie":"6 Operantes Konditionieren, Seite 34 (Verstärkungspläne: Zeit-Intervall vs. Verhaltensquote)"},{"id":"hp3b-sose2020-01","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 51","vertrauen":"mittel","teil":"I","thema":"Operantes Konditionieren","modell":"Skinner, Verstärkungspläne (Intervall- vs. Quotenpläne)","typ":"matrix","stamm":"Mithilfe von Verstärkungsplänen kann erwünschtes Verhalten aufgebaut oder unerwünschtes Verhalten gelöscht bzw. abgebaut werden. Kreuzen Sie an, ob die folgenden Aussagen auf fixierte oder variable Intervallpläne oder auf keinen der Intervallpläne zutreffen. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Trifft zu für …","spalten":["keinen","variable Intervallpläne","fixierte Intervallpläne"],"zeilen":[{"text":"Lernende, die mithilfe solcher Verstärkungspläne verstärkt werden, erlernen das erwünschte Verhalten im Vergleich zu anderen Plänen relativ schnell.","loesung":0},{"text":"Wenn Lernende mithilfe solcher Verstärkungspläne im erwünschten Verhalten verstärkt werden, zeigen sie typischerweise zu Beginn einer Lernphase eine höhere Verhaltensrate.","loesung":0},{"text":"Lernende, die mithilfe solcher Verstärkungspläne im erwünschten Verhalten verstärkt werden, zeigen typischerweise eine wechselnde Verhaltensrate.","loesung":2},{"text":"Das Verhalten von Lernenden, deren Lernphase mithilfe solcher Verstärkungspläne stattfand, ist im Vergleich zu anderen Plänen äußerst löschungsresistent.","loesung":1}],"erklaerung":"Nach der Vorlesung zeigt fixierte Verstärkung eine wechselnde (scallop-förmige) Verhaltensrate und einen geringeren Löschungswiderstand als variable Verstärkung; variable Verstärkung erzeugt dagegen eine gleichmäßige Verhaltensrate und einen höheren Löschungswiderstand. Die schnellere Lerngeschwindigkeit ist laut Folie ein Unterschied zwischen Quoten- und Intervallplänen, nicht zwischen fixiert und variabel innerhalb der Intervallpläne, weshalb Aussage 1 auf keinen der beiden zutrifft. Für Aussage 2 gibt die Vorlesung keine eindeutige Aussage zur Verhaltensrate speziell zu Beginn der Lernphase, sodass ebenfalls keiner der beiden Pläne eindeutig zutrifft. In der Quelle selbst ist die Lösung nicht markiert; die Zuordnung wurde aus der Foliensystematik zu Verstärkungsplänen abgeleitet.","folie":"6 Operantes Konditionieren, Seite 38/41 (Wirkung von intermittierenden Verstärkungsplänen)"},{"id":"hp3b-sose2020-04","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 53","vertrauen":"mittel","teil":"I","thema":"Operantes Konditionieren","modell":"Operante Konditionierung, Verstärkung und Extinktion","typ":"multi","stamm":"Frau Matschek möchte die Prinzipien des operanten Konditionierens im Unterricht anwenden, um das Einhalten der vereinbarten Regeln zu fördern.","frage":"Welche der folgenden Hinweise kann man mit den Erkenntnissen zum operanten Konditionieren begründen?","optionen":["Bei der Auswahl der Verstärkung muss sie darauf achten, dass diese für die SchülerInnen genug Anreizwert haben.","Die SchülerInnen werden nur dann lernen, sich an die Regeln im Unterricht bei Frau Matschek zu halten, wenn sie konsequent auf deren Einhaltung achtet.","Für die Verstärkung des „Regeln-Einhaltens“ nutzt sie am besten primäre, sekundäre und generalisierte Verstärker.","Wenn sie das Aufspringen und Rufen von SchülerInnen im Unterricht ignoriert, kann es sein, dass es anfangs stärker wird. Dann sollte sie die SchülerInnen lieber dran nehmen, bevor es laut in der Klasse wird.","SchülerInnen, welche gegen die Regeln verstoßen, muss sie vor allem negativ verstärken."],"loesungen":[0,2],"erklaerung":"Ein Verstärker wirkt nur, wenn er für die Lernenden tatsächlich Anreizwert hat, und die operante Theorie unterscheidet systematisch primäre, sekundäre und generalisierte Verstärker als Werkzeuge des Verhaltensaufbaus; beide Aussagen sind daher korrekt begründbar. Die Aussage zur Konsequenz ist als 'nur dann'-Behauptung zu absolut formuliert, denn Verstärkung wirkt graduell und nicht als reine Ja/Nein-Bedingung. Das Ignorieren als Löschung führt zwar tatsächlich häufig zu einem kurzfristigen Anstieg des Verhaltens (Extinktionsburst), doch der Rat, dann doch dranzunehmen, würde das Verhalten intermittierend verstärken und die Löschung untergraben – das widerspricht dem operanten Prinzip. Die letzte Aussage verwechselt Bestrafung mit negativer Verstärkung: Regelverstöße werden bestraft, nicht negativ verstärkt, weshalb diese Aussage falsch ist.","folie":"6 Operantes Konditionieren"},{"id":"hp3b-wise2021-09","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 64","vertrauen":"mittel","teil":"I","thema":"Operantes Konditionieren","modell":"Skinner, Verstärkungspläne (Intervall-/Quotenpläne, kontinuierlich)","typ":"matrix","stamm":"Erkenntnisse des Operanten Konditionierens sind mit Blick auf die Wirkungen der Anreize von Ergebnisfolgen von Bedeutung. Diese Wirkungen hängen u.a. davon ab, nach welchem Verstärkungsplan die Anreize zum Tragen kommen. Entscheiden Sie für folgende Beispiele, welcher Verstärkungsplan jeweils wirkt. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Es wirkt der Verstärkungsplan …","spalten":["variables Intervall","kontinuierliche Verstärkung","variable Quote","feste Quote","festes Intervall"],"zeilen":[{"text":"Vokabeltests erfolgen mal direkt am Tag nach der Lektion oder mal nach 2-4 Tagen.","loesung":0},{"text":"Mit jeder richtigen Antwort in einem computerbasierten Übungsprogramm wird ein Teil mehr aufgedeckt von einem beliebten Fotomotiv.","loesung":1},{"text":"Immer donnerstags lernen die Schüler*innen fleißig Vokabeln, um auf den jeden Freitag stattfindenden Vokabeltest vorbereitet zu sein.","loesung":4},{"text":"Für je drei korrekt bearbeitete täglich Übungsaufgaben trägt die Lehrperson ein „sehr gut“ für die Mitarbeiternote ein.","loesung":3},{"text":"Die Lehrperson vergibt Pluspunkte im Sinne von Tokens manchmal nach 3, 4 oder nach 5 Wortbeiträgen.","loesung":2},{"text":"Jedes Mal, wenn sich Max im Unterricht meldet, wird er aufgerufen.","loesung":1}],"erklaerung":"Verstärkung nach einer unvorhersehbaren Zeitspanne (mal am nächsten Tag, mal nach 2-4 Tagen) entspricht einem variablen Intervallplan, während eine feste, immer gleich lange Zeitspanne (immer donnerstags vor dem Freitagstest) einem festen Intervallplan entspricht. Wird jede einzelne korrekte Reaktion verstärkt (jede richtige Antwort, jede Meldung), handelt es sich um kontinuierliche Verstärkung. Eine feste Anzahl erforderlicher Reaktionen (genau drei Aufgaben) ergibt einen festen Quotenplan, eine wechselnde Anzahl (mal 3, mal 4, mal 5 Wortbeiträge) einen variablen Quotenplan.","folie":"6 Operantes Konditionieren, Seite 34 (Verstärkungspläne)"},{"id":"hp3c-probekl2-09","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"I","thema":"Operantes Konditionieren","modell":"Skinner, Verstärkungspläne / diskriminative Stimuluskontrolle","typ":"mc-kombi","stamm":"Herr Faust unterrichtet Mathematik. Sein Schüler Ferdinand spielt in seinem Unterricht oft mit seinem Smartphone. Er ist der selbsternannte Klassenclown und genießt die Aufmerksamkeit der anderen Schüler. Herr Faust ist von Ferdinands Verhalten sehr genervt, da in seinem Unterricht Handyverbot gilt. Jedes Mal, wenn er den Schüler mit seinem Smartphone erwischt, schickt er ihn schimpfend für fünf Minuten vor die Tür. Die Klassenkameraden fangen stets an zu johlen, wenn Ferdinand aus dem Klassenzimmer geht. So vergehen einige Wochen. Ferdinand spielt immer öfter mit seinem Smartphone. Der Lehrer ist verzweifelt und wendet sich an seine Kollegen. Diese raten ihm, nur jede dritte Stunde auf Ferdinands Verhalten zu reagieren und ihn sonst zu ignorieren, wenn er auf sein Handy schaut. Herr Faust folgt diesem Rat für ein paar Wochen, doch der gewünschte Effekt stellt sich leider nicht ein.","frage":"Welche der folgenden Aussagen trägt/tragen vor dem Hintergrund der Erkenntnisse zum Operanten Konditionieren zur Erklärung von Ferdinands Verhaltensrate bei?","aussagen":["Das Spielen mit dem Smartphone wurde vor dem Austausch mit den Kollegen kontinuierlich verstärkt.","Das Spielen mit dem Smartphone wurde vor dem Austausch mit den Kollegen intermittierend nach einem fixierten Quotenplan verstärkt.","Das Spielen mit dem Smartphone wurde nach dem Austausch mit den Kollegen kontinuierlich verstärkt.","Das Spielen mit dem Smartphone wurde nach dem Austausch mit den Kollegen intermittierend nach einem fixierten Quotenplan verstärkt.","Das Spielen mit dem Smartphone wurde nach dem Austausch mit den Kollegen intermittierend nach einem variablen Intervallplan verstärkt."],"aussagen_richtig":[0],"optionen":["Die Aussage (1) trifft zu, alle anderen Aussagen treffen nicht zu.","Aussagen (2), (3) und (4) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussage (1) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Aussagen (2) und (3) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussage (5) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":0,"erklaerung":"Da Herr Faust vor dem Kollegengespräch jedes Mal reagiert, wenn er Ferdinand mit dem Smartphone erwischt, wird das Verhalten kontinuierlich verstärkt: Das Vor-die-Tür-Schicken ist durch die johlende Aufmerksamkeit der Klasse für den aufmerksamkeitssuchenden Ferdinand ein positiver Verstärker, keine Bestrafung. Kontinuierliche Verstärkung erklärt den beobachteten Anstieg der Verhaltensrate. Nach dem Austausch mit den Kollegen reagiert Herr Faust nur noch jede dritte Stunde, also nach einer festen Stundenzahl unabhängig vom tatsächlichen Verhalten - das ist kein Verstärkungsplan im engeren Sinn, da die Reaktion nicht an Ferdinands Verhalten gekoppelt ist, weshalb die übrigen Aussagen nicht zutreffen.","folie":"6 Operantes Konditionieren, Verstärkungspläne und Aufmerksamkeit als sozialer Verstärker"},{"id":"nar-f30","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL5, Frage 30, S. 9","vertrauen":"hoch","teil":"I","thema":"Operantes Konditionieren","typ":"multi","frage":"Beim operanten Konditionieren wird die Verhaltensrate über Verstärkung bzw. Bestrafung verändert. Welche der folgenden Aussagen über die unterschiedlichen Typen von Verstärkung und Bestrafung sind richtig?","optionen":["Bei der negativen Verstärkung wird bei einem unerwünschten Verhalten ein negativer Reiz hinzugefügt und so die Verhaltensrate verringert.","Bei der Bestrafung Typ 1 wird bei einem unerwünschten Verhalten ein negativer Reiz hinzugefügt und so die Verhaltensrate verringert.","Bei der Löschung wird das gewünschte Verhalten nicht mehr verstärkt und die Verhaltensrate des gewünschten Verhaltens verringert sich bzw. bleibt aus.","Bei der Bestrafung Typ 2 wird bei einem unerwünschten Verhalten ein negativer Reiz entfernt und so die Verhaltensrate verringert.","Bei der positiven Verstärkung wird bei einem unerwünschten Verhalten ein positiver Reiz hinzugefügt und die Verhaltensrate steigt."],"loesungen":[1,2,3],"erklaerung":"Richtig beschrieben sind Bestrafung Typ 1, bei der ein negativer Reiz hinzugefügt wird und die Verhaltensrate sinkt (b), sowie Löschung, bei der ausbleibende Verstärkung ein Verhalten seltener werden lässt (c), und Bestrafung Typ 2, bei der ein positiver Reiz entzogen wird und die Verhaltensrate ebenfalls sinkt (d). Falsch ist (a), da bei negativer Verstärkung ein negativer Reiz entfernt (nicht hinzugefügt) wird, wodurch erwünschtes Verhalten wahrscheinlicher wird; ebenso falsch ist (e), da positive Verstärkung ein erwünschtes und kein unerwünschtes Verhalten durch Hinzufügen eines positiven Reizes verstärkt."},{"id":"nar-f31","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL5, Frage 31, S. 10","vertrauen":"mittel","teil":"I","thema":"Operantes Konditionieren","modell":"Kontiguität und Kontingenz beim operanten Konditionieren","typ":"matrix","frage":"Frau Meier möchte ihre Klasse durch operantes Konditionieren zu aktiverer Mitarbeit motivieren und beachtet dabei Kontiguität (zeitliche Nähe von Verhalten und Konsequenz) und Kontingenz (Verlässlichkeit des Zusammenhangs). Ordnen Sie den beschriebenen Vorgehensweisen die passende Kombination aus Kontiguität und Kontingenz zu.","spalten":["hohe Kontingenz, geringe Kontiguität","hohe Kontingenz, hohe Kontiguität","niedrige Kontingenz, hohe Kontiguität","niedrige Kontingenz, niedrige Kontiguität"],"zeilen":[{"text":"Am Ende jeder Woche zeichnet Frau Meier diejenigen Schüler mit einem Sternchen aus, die in der Woche besonders gut mitgearbeitet haben.","loesung":0},{"text":"Jedes Mal, wenn sich ein Schüler meldet und eine Frage richtig beantwortet, spricht Frau Meier ihm direkt ein Lob aus.","loesung":1},{"text":"Frau Meier ist genervt, weil viele Schüler einfach reinrufen. Manchmal tadelt sie die Schüler fürs Reinrufen; ist die Antwort richtig, greift sie diese manchmal auf, ohne weiter auf das Reinrufen einzugehen.","loesung":2},{"text":"Beim Durchsehen der Arbeitsblätter fällt Frau Meier ab und an auf, dass die Klasse kaum mitgemacht hat. Dann tadelt sie die Klasse nachträglich in der nächsten Stunde.","loesung":3}],"erklaerung":"Kontiguität meint die zeitliche Nähe zwischen Verhalten und Konsequenz, Kontingenz die Verlässlichkeit, mit der eine Konsequenz auf ein Verhalten folgt. Das wöchentliche Sternchen (e) folgt zwar zuverlässig auf gute Mitarbeit, aber zeitlich stark verzögert, also hohe Kontingenz bei geringer Kontiguität. Das direkte Lob nach jeder richtigen Antwort (h) erfüllt beides in hohem Maß. Das nur gelegentliche Tadeln bei Reinrufen (f) zeigt geringe Kontingenz bei vorhandener Kontiguität, wenn es passiert, und das nachträgliche Tadeln der ganzen Klasse in der nächsten Stunde (g) zeigt sowohl geringe Kontingenz als auch geringe Kontiguität."},{"id":"pk2017-09","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 9","vertrauen":"hoch","teil":"I","thema":"Operantes Konditionieren","modell":"Skinner, Verstärkungspläne und Löschungsresistenz","typ":"mc-kombi","stamm":"Herr Faust unterrichtet Mathematik. Sein Schüler Ferdinand spielt in seinem Unterricht oft mit seinem Smartphone. Er ist der selbsternannte Klassenclown und genießt die Aufmerksamkeit der anderen Schüler. Herr Faust ist von Ferdinands Verhalten sehr genervt, da in seinem Unterricht Handyverbot gilt. Jedes Mal, wenn er den Schüler mit seinem Smartphone erwischt, schickt er ihn schimpfend für fünf Minuten vor die Tür. Die Klassenkameraden fangen stets an zu johlen, wenn Ferdinand aus dem Klassenzimmer geht. So vergehen einige Wochen. Ferdinand spielt immer öfter mit seinem Smartphone. Der Lehrer ist verzweifelt und wendet sich an seine Kollegen. Diese raten ihm, nur jede dritte Stunde auf Ferdinands Verhalten zu reagieren und ihn sonst zu ignorieren, wenn er auf sein Handy schaut. Herr Faust folgt diesem Rat für ein paar Wochen, doch der gewünschte Effekt stellt sich leider nicht ein.","frage":"Welche der folgenden Aussagen trägt/tragen vor dem Hintergrund der Erkenntnisse zum Operanten Konditionieren zur Erklärung von Ferdinands Verhaltensrate bei?","aussagen":["Das Spielen mit dem Smartphone wurde vor dem Austausch mit den Kollegen kontinuierlich verstärkt.","Das Spielen mit dem Smartphone wurde vor dem Austausch mit den Kollegen intermittierend nach einem fixierten Quotenplan verstärkt.","Das Spielen mit dem Smartphone wurde nach dem Austausch mit den Kollegen kontinuierlich verstärkt.","Das Spielen mit dem Smartphone wurde nach dem Austausch mit den Kollegen intermittierend nach einem fixierten Quotenplan verstärkt.","Das Spielen mit dem Smartphone wurde nach dem Austausch mit den Kollegen intermittierend nach einem variablen Intervallplan verstärkt."],"optionen":["Die Aussage (1) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2), (3) und (4) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (3) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussage (5) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":0,"aussagen_richtig":[0],"erklaerung":"Entscheidend ist die Wirkung: Ferdinands Verhaltensrate steigt, also wirkt der Hinausschickvorgang trotz des Schimpfens als Verstärker – das Johlen der Klasse liefert ihm genau die Aufmerksamkeit, die er sucht. Vor dem Kollegengespräch folgte diese Konsequenz auf jedes einzelne Ertappen, das Verhalten wurde also kontinuierlich verstärkt (1). Nach dem Gespräch reagiert Herr Faust nur noch jede dritte Stunde: Der Bezugspunkt ist damit eine Zeiteinheit und keine Reaktionszahl, und dieser Zeitabstand ist konstant – es handelt sich also um einen fixierten Intervallplan, den keine der angebotenen Aussagen korrekt benennt. Damit scheiden (3), (4) und (5) aus, und (2) beschreibt die Ausgangslage falsch. Dass die Umstellung nicht hilft, ist gerade der Punkt: Intermittierende Verstärkung macht ein Verhalten löschungsresistenter, statt es abzubauen.","folie":"6 Operantes Konditionieren, Seite 34 und 37 (Verstärkungspläne, Lern- und Löschungskurven)"},{"id":"ex2016-01","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 1","vertrauen":"hoch","teil":"I","thema":"Verhalten und Klassisches Konditionieren","modell":"Abgrenzung Lernen / Reifung / Prägung","typ":"mc-kombi","frage":"Welche Aussagen gehören zu einer psychologischen Beschreibung des Begriffs Lernen? Lernen ist eine …","aussagen":["sensible Veränderung von Verhalten und Verhaltenspotential.","nicht nachholbare Veränderung von Verhalten und Verhaltenspotential.","relativ überdauernde Veränderung von Verhalten und Verhaltenspotential.","reversible Veränderung von Verhalten und Verhaltenspotential.","universelle Veränderung von Verhalten und Verhaltenspotential."],"aussagen_richtig":[2,3],"optionen":["Aussage (2) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (3), (4) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (2) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (4) treffen zu; alle anderen Aussagen treffen nicht zu.","Aussage (3) trifft zu; alle anderen Aussagen treffen nicht zu."],"loesung":3,"erklaerung":"Die Vorlesung stellt Lernen, Reifung und Prägung anhand von drei Merkmalen gegenüber. Lernen ist nicht universell, reversibel (Vergessen) und nachholbar. Reifung ist universell, irreversibel und nachholbar. Prägung ist universell, irreversibel und nicht nachholbar, gebunden an sensible Phasen. Damit treffen (3) relativ überdauernd und (4) reversibel zu. (1) sensibel und (2) nicht nachholbar beschreiben Prägung, (5) universell trifft auf Reifung und Prägung zu, nicht auf Lernen. Dieselbe Aufgabe kam im Winter 2024 wortgleich wieder.","folie":"5 Verhalten – Vergleich Lernen / Reifung / Prägung"},{"id":"ex2024-01","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 1 (S. 1)","vertrauen":"mittel","teil":"I","thema":"Verhalten und Klassisches Konditionieren","modell":"Begriffsabgrenzung Lernen – Reifung – Prägung","typ":"mc-kombi","frage":"Welche Aussagen gehören zu einer psychologischen Beschreibung des Begriffs Lernen? Lernen ist eine…","aussagen":["sensible Veränderung von Verhalten und Verhaltenspotential.","nicht nachholbare Veränderung von Verhalten und Verhaltenspotential.","relativ überdauernde Veränderung von Verhalten und Verhaltenspotential.","reversible Veränderung von Verhalten und Verhaltenspotential.","universelle Veränderung von Verhalten und Verhaltenspotential."],"optionen":["Aussage (2) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (3), (4) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (2) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (4) treffen zu; alle anderen Aussagen treffen nicht zu.","Aussage (3) trifft zu; alle anderen Aussagen treffen nicht zu."],"loesung":3,"aussagen_richtig":[2,3],"erklaerung":"Die Definition in der Vorlesung lautet: Lernen ist eine relativ überdauernde Veränderung von Verhalten und Verhaltenspotential, die auf Erfahrung zurückgeht – damit trifft (3) zu. Die Abgrenzungstabelle Lernen – Reifung – Prägung nennt als Merkmale des Lernens außerdem: nicht universell, reversibel (Vergessen) und nachholbar. Damit trifft auch (4) zu, während (5) falsch ist: universell sind Reifung und Prägung, nicht das Lernen. Aussage (2) beschreibt ebenfalls die Prägung, die an sensible Phasen gebunden und daher nicht nachholbar ist; Lernen ist dagegen nachholbar. Aussage (1) verwendet „sensibel“ als Scheinbegriff, der in der Definition nicht vorkommt. Richtig ist also die Kombination (3) und (4). Hinweis: Im Gedächtnisprotokoll ist eine andere Option markiert; die Markierung stammt von einer Studentin und ist hier nachweislich falsch – die Folie zur Begriffsabgrenzung und die wortgleiche Aufgabe der Staatsprüfung Winter 2016 belegen (3) und (4).","folie":"5 Verhalten, Seite 6 (Begriffsabgrenzung Lernen – Reifung – Prägung)"},{"id":"ex2024-03","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 3 (S. 3)","vertrauen":"mittel","teil":"I","thema":"Verhalten und Klassisches Konditionieren","modell":"Klassisches Konditionieren (Pawlow, Watson)","typ":"matrix","stamm":"Bahir geht in die zweite Klasse einer Grundschule. In den letzten Wochen gab es jeden Morgen zu Hause vor der Schule Tränen. Zunächst wollte Bahir nur nicht in die Schule, wenn Mathematikunterricht auf dem Stundenplan stand. Später brach er schon in Tränen aus, wenn das Gespräch auf den Klassenlehrer Herrn Magos kam. Seit einigen Tagen ist es nun noch schlimmer geworden: „Ich möchte überhaupt nicht in die Schule gehen!“ klagt Bahir. Heute haben sich Bahirs Eltern entschlossen, mit dem Klassenlehrer Herrn Magos über Bahir zu sprechen. Als sie Herrn Magos wegen des morgendlichen „Theaters“ ansprechen, antwortet dieser: „Das kann ich Ihnen schon erklären, warum Bahir keine Lust mehr hat, in die Schule zu gehen. Hier herrscht Ordnung und an diese muss sich nun auch Bahir langsam gewöhnen. Bahir macht beispielsweise oft keine Hausaufgaben in Mathematik. Ich habe ihn schon des Öfteren deswegen getadelt, auch vor der ganzen Klasse, aber er vergisst die Hausaufgaben immer wieder. Neulich wusste ich mir einfach nicht mehr zu helfen und bin leider mal etwas lauter geworden, sodass Bahir angefangen hat zu weinen.“","frage":"Wie lassen sich die im Text benannten Situationen begrifflich in das Konzept des Klassischen Konditionierens einordnen? Kreuzen Sie für jede Situation an, ob es sich dabei um einen unkonditionierten Stimulus (UCS), konditionierten Stimulus (CS), eine unkonditionierte Reaktion (UCR) oder konditionierte Reaktion (CR) handelt. Pro Aussage gibt es nur eine korrekte Antwort.","spalten":["UCS","CS","UCR","CR"],"zeilen":[{"text":"Das Tadeln vor der Klasse","loesung":0},{"text":"Bahirs Angst vor dem Mathematikunterricht","loesung":3},{"text":"Der Klassenlehrer Herr Magos","loesung":1},{"text":"Das Weinen Bahirs bei lautem Tadel","loesung":2},{"text":"Bahirs Sträuben in die Schule zu gehen","loesung":3},{"text":"Bahirs Weinen beim Gedanken an Lehrer Magos","loesung":3}],"erklaerung":"Beim Klassischen Konditionieren löst ein unkonditionierter Stimulus (UCS) ungelernt eine unkonditionierte Reaktion (UCR) aus; ein zunächst neutraler Reiz wird durch wiederholte Paarung mit dem UCS zum konditionierten Stimulus (CS) und löst dann allein die konditionierte Reaktion (CR) aus. Das laute Tadeln vor der Klasse ist der aversive Reiz, der ungelernt wirkt, also der UCS; Bahirs Weinen unmittelbar beim lauten Tadel ist die darauf ungelernt folgende UCR. Der Klassenlehrer Herr Magos war ursprünglich ein neutraler Reiz und ist durch die wiederholte Paarung mit dem Tadel zum CS geworden. Alle Reaktionen, die inzwischen ohne den Tadel selbst auftreten, sind konditionierte Reaktionen: die Angst vor dem Mathematikunterricht, das Weinen schon beim bloßen Gedanken an Herrn Magos und – über Reizgeneralisierung auf die gesamte Schule – das Sträuben, überhaupt in die Schule zu gehen.","folie":"5 Verhalten (Klassisches Konditionieren, UCS/UCR/CS/CR)"},{"id":"hp3b-sose2020-08","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 55","vertrauen":"mittel","teil":"I","thema":"Verhalten und Klassisches Konditionieren","modell":"Klassisches Konditionieren (Pawlow): UCS, NS, UCR, CR","typ":"matrix","stamm":"Herr Paul unterrichtet Englisch und führt einen Vokabel-Wettstreit ein, bei dem leistungsschwächere SchülerInnen unter Zeitdruck vor der Klasse abgefragt werden; seitdem haben immer mehr SchülerInnen Angst vor dem Englischunterricht. Kreuzen Sie für jede Situation an, ob es sich um einen unkonditionierten Stimulus (UCS), einen neutralen Stimulus (NS), eine unkonditionierte Reaktion (UCR) oder eine konditionierte Reaktion (CR) handelt. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"… ist ein/e","spalten":["neutraler Stimulus (NS)","konditionierte Reaktion (CR)","unkonditionierter Stimulus (UCS)","unkonditionierte Reaktion (UCR)"],"zeilen":[{"text":"Das Abfragen vor der Klasse ist ein/e","loesung":2},{"text":"Die Angst vorm Englischunterricht nach Einführung des Wettstreits ist ein/e","loesung":1},{"text":"Der Englischunterricht vor Einführung des Wettstreits ist ein/e","loesung":0},{"text":"Der Stress beim Wettstreit ist ein/e","loesung":3},{"text":"Eine mündliche Leistungssituation ist ein/e","loesung":2}],"erklaerung":"Der Text stellt fest, dass mündliche Leistungssituationen vor Publikum generell Stress auslösen; sie und das konkrete Abfragen vor der Klasse als Instanz einer solchen Situation sind daher der unkonditionierte Stimulus (UCS), der reflexartig Stress auslöst. Der dabei erlebte Stress selbst ist die unkonditionierte Reaktion (UCR). Der Englischunterricht war vor Einführung des Wettstreits neutral (NS), da er noch keine Angst auslöste; durch wiederholte Kopplung mit dem stressauslösenden Wettstreit wurde er zum konditionierten Stimulus, und die nun auftretende Angst vor dem Englischunterricht ist die konditionierte Reaktion (CR).","folie":"5 Verhalten (Klassisches Konditionieren nach Pawlow)"},{"id":"erg-bruner-01","quelle":"Bruner (1966), Theorie des Unterrichts","vertrauen":"hoch","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Bruner, EIS-Prinzip der Wissensrepräsentation","typ":"single","frage":"In welcher sequenziellen Reihenfolge vollzieht sich nach Jerome Bruner der didaktische Aufbau mathematischer und wissenschaftlicher Wissensrepräsentationen (EIS-Prinzip)?","optionen":["Enaktiv (handelnd am Objekt) -> Ikonisch (bildhaft-anschaulich) -> Symbolisch (formal-abstrakt)","Symbolisch (Formeln) -> Ikonisch (Grafiken) -> Enaktiv (Materialerprobung)","Ikonisch -> Enaktiv -> Symbolisch","Deduktiv -> Induktiv -> Konstruktiv"],"loesung":0,"hint":"EIS-Abfolge: Handeln -> Anschauen -> Symbolisieren.","erklaerung":"Bruners EIS-Prinzip verlangt den Wissensaufbau über drei Repräsentationsmodi: zuerst enaktiv (konkrete Handlungsvollzüge an Gegenständen), gefolgt von ikonisch (visuelle Repräsentationen, Skizzen, Schemata) und abschließend symbolisch (abstrakte Zeichen, Formeln, Sprache)."},{"id":"hp3a-ws2021-04","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 8 (Lösung S. 17f.)","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Kintsch (1998), Textverständnis-Modell (Textoberfläche – Textbasis – Situationsmodell)","typ":"matrix","stamm":"In einem Seminar soll zu jeder Sitzung von den Teilnehmenden ein Text gelesen werden, der eine empirische Untersuchung beschreibt. Die Seminarleiterin möchte mittels einer kurzen Abfrage herausfinden, wie tief der für die Sitzung zu lesende Text verarbeitet wurde.","frage":"Ordnen Sie auf Grundlage des Textverständnis-Modells von Kintsch (1998) die Fragen der Textverständnis-Ebene zu, die für die Beantwortung dieser Fragen mindestens erreicht werden muss (nur eine korrekte Antwort pro Aussage).","spalten":["Textoberfläche","Textbasis","Situationsmodell","Keine der Ebenen"],"zeilen":[{"text":"Wie hat sich Ihr Interesse während des Lesens verändert?","loesung":3},{"text":"Wie lang haben Sie gebraucht, um den Text zu lesen?","loesung":3},{"text":"Inwiefern verfolgt der Text einen typisch behavioristischen Ansatz?","loesung":2},{"text":"Welche Modifikationen werden in Experiment 2 im Vergleich zu Experiment 1 vorgenommen?","loesung":1},{"text":"In welche Abschnitte gliedert sich der Diskussionsteil inhaltlich?","loesung":1},{"text":"Inwiefern beinhaltet der Text alle Bestandteile der typischen Struktur einer empirischen Untersuchung?","loesung":2},{"text":"Welche Beispielitems verwenden die Autoren zur Beschreibung der Messinstrumente?","loesung":0},{"text":"Wie lautet die sinngemäße Definition des Konstruktes, das die Autoren der Untersuchung zu Grunde legen?","loesung":1},{"text":"Inwiefern sind die Schlussfolgerungen der Autoren anhand der Daten vertretbar?","loesung":2},{"text":"Für ein Konstrukt nutzen die Autoren zwei verschiedene Definitionen. Was sind Gemeinsamkeiten und Unterschiede dieser zwei Auffassungen?","loesung":1}],"erklaerung":"Nach Kintsch reicht die Textoberfläche (wörtlicher Wortlaut) für Fragen, die sich auf konkret im Text stehende Formulierungen beziehen, etwa Beispielitems. Die Textbasis (propositionale, sinngemäße Bedeutung) genügt für Fragen, die inhaltliches Verständnis ohne Rückgriff auf Weltwissen erfordern, etwa Gliederung, Definitionen oder Vergleiche innerhalb des Textes. Das Situationsmodell (Integration von Textinhalt und Vorwissen zu einer mentalen Repräsentation) ist nötig, wenn über den Text hinausgehendes Einordnen, Bewerten oder Klassifizieren verlangt wird, etwa die Einordnung in einen theoretischen Ansatz oder die Beurteilung der Schlussfolgerungen. Fragen zu Lesezeit oder eigenem Interesse betreffen keine der drei Verständnisebenen, sondern den Leseprozess bzw. die Person selbst. Die Zeilen 1 und 5 sind im Quelldokument mit Fragezeichen versehen, daher mittleres statt hohes Vertrauen."},{"id":"hp3b-sose2020-10","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 56","vertrauen":"hoch","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Kriterien effizienter Wissenserwerbsprozesse: Transfer, Lernaufwand, Behaltensdauer","typ":"matrix","stamm":"Entscheiden Sie für die folgenden Definitionen, welches Kriterium für effiziente Wissenserwerbsprozesse jeweils beschrieben wird.","frage":"Definition beschreibt das Kriterium …","spalten":["Transfer","Lernaufwand","keines","Behaltensdauer"],"zeilen":[{"text":"Ein angemessenes Verhältnis zwischen der für die Unterrichtsvorbereitung benötigten Zeit und den Testleistungen der SchülerInnen.","loesung":2},{"text":"Der relativ überdauernde Aufbau und die fortlaufende Modifikation von Wissensrepräsentation.","loesung":2},{"text":"Eine relativ überdauernde Veränderung von Wissen und Können.","loesung":3},{"text":"Ein angemessenes Verhältnis zwischen der zur Erreichung von Lernzielen benötigten Zeit und dem Umfang des erworbenen Wissens und Könnens.","loesung":1},{"text":"Die Anwendung des erworbenen Wissens und Könnens auf unterschiedliche Aufgaben und Fragestellungen.","loesung":0}],"erklaerung":"Die Folie nennt genau drei Kriterien, jeweils mit einer Definition, die hier wörtlich abgefragt wird. Lernaufwand ist das angemessene Verhältnis zwischen der zur Erreichung von Lernzielen benötigten Zeit und dem Umfang des erworbenen Wissens bzw. Könnens. Behaltensdauer ist die relativ überdauernde Veränderung von Wissen und Können. Transfer ist die Anwendung des Erworbenen auf unterschiedliche Aufgaben oder Fragestellungen. Zwei Aussagen sind absichtlich dicht daneben gebaut. Der relativ überdauernde Aufbau und die fortlaufende Modifikation von Wissensrepräsentationen ist die Definition des Wissenserwerbs selbst nach Steiner (2006), nicht die eines Effizienzkriteriums – die Ähnlichkeit zur Behaltensdauer ist die Falle. Und das Zeit-Ertrags-Verhältnis der Unterrichtsvorbereitung bezieht sich auf die Lehrperson statt auf die Lernzeit der Schüler und trifft damit ebenfalls keines der Kriterien.","folie":"2 Wissenserwerb Kognition, Folie 8 – Kriterien für effiziente Wissenserwerbsprozesse"},{"id":"hp3b-sose2020-12","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 57","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Wissensrepräsentation: Prototypenmodell, Skript, Produktionssystem","typ":"matrix","stamm":"Prototypenmodelle, Skripte und Produktionssysteme sind psychologische Modelle der Wissensrepräsentation. Mit welchem dieser Modelle sind jeweils folgende Beispielsituationen zu erklären? Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Situation wird erklärt durch …","spalten":["Produktionssystem","Skript","Prototypenmodell"],"zeilen":[{"text":"Frau Schindler gibt zum Anfang ihrer Englisch-Stunden meist eine kurze Begebenheit in Englisch zum Besten, dann werden Grammatik-Regeln besprochen, zum Schluss wird Konversation geübt.","loesung":1},{"text":"Frank, 1,70m groß und sehr sportlich, spielt Basketball, wird in seinem Sportverein aber ständig als Fußballer angesehen.","loesung":2},{"text":"Personen brauchen signifikant länger zur Beantwortung der Frage: „Ist der Pinguin ein Vogel?“ als zur Beantwortung der Frage: „Ist die Amsel ein Vogel?“","loesung":2},{"text":"Lisa befolgt beim Erledigen der Mathe-Hausaufgabe genau die Regeln zur Auflösung von Klammern.","loesung":0},{"text":"Wenn Carla morgens zur Arbeit kommt, lüftet sie üblicherweise erst durch, schaltet dann den PC an und kocht danach Kaffee.","loesung":1}],"erklaerung":"Ein Skript ist eine feste, stereotype Handlungsabfolge für wiederkehrende Situationen; das trifft auf Frau Schindlers immer gleichen Stundenaufbau und auf Carlas Morgenroutine zu. Ein Prototypenmodell erklärt Kategorisierung anhand typischer Merkmale: Frank wird aufgrund seines Körperbaus dem Fußballer-Prototyp zugeordnet statt dem tatsächlich ausgeübten Sport, und der Pinguin ist ein untypisches Vogel-Exemplar, weshalb der Vergleich mit dem Prototyp länger dauert (klassischer Typikalitätseffekt nach Rosch). Ein Produktionssystem besteht aus Wenn-Dann-Regeln zur Ausführung prozeduraler Fertigkeiten, wie Lisas regelgeleitetem Vorgehen beim Klammern-Auflösen.","folie":"2 Wissenserwerb Kognition (Wissensrepräsentation: Prototypen, Skripte, Produktionssysteme)"},{"id":"ueb-010","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 5, Klausuraufgabe 4","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"matrix","frage":"Entscheiden Sie für die folgenden Definitionen, welches Kriterium für effiziente Wissenserwerbsprozesse jeweils beschrieben wird.","spalten":["keines","Behaltensdauer","Lernaufwand","Transfer"],"zeilen":[{"text":"eine relativ überdauernde Veränderung von Wissen und Können","loesung":1},{"text":"ein angemessenes Verhältnis zwischen der zur Erreichung von Lernzielen benötigten Zeit und dem Umfang des erworbenen Wissens und Könnens","loesung":2},{"text":"den relativ überdauernden Aufbau und fortlaufende Modifikationen von Wissensrepräsentationen","loesung":0},{"text":"die Anwendung des erworbenen Wissens und Könnens auf unterschiedliche Aufgaben und Fragestellungen","loesung":3},{"text":"ein angemessenes Verhältnis zwischen der für die Unterrichtsvorbereitung benötigten Zeit und den Testleistungen der Schüler*innen","loesung":0}],"erklaerung":"Die Vorlesung nennt drei Kriterien für effiziente Wissenserwerbsprozesse: Lernaufwand (angemessenes Verhältnis von Lernzeit zu erworbenem Wissen/Können), Behaltensdauer (relativ überdauernde Veränderung von Wissen und Können) und Transfer (Anwendung des Gelernten auf neue Aufgaben). Zeile 1 entspricht wörtlich der Definition von Behaltensdauer, Zeile 2 der von Lernaufwand und Zeile 4 der von Transfer. Zeile 3 beschreibt dagegen die allgemeine Definition von Wissenserwerb selbst (Aufbau und Modifikation von Wissensrepräsentationen, Steiner 2006) und ist kein Effizienzkriterium, und Zeile 5 bezieht das Zeit-Ertrags-Verhältnis auf die Vorbereitungszeit der Lehrperson statt auf die Lernzeit der Schüler*innen und passt damit zu keinem der drei Kriterien.","folie":"2 Wissenserwerb Kognition.txt"},{"id":"ueb-023","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 12, Übung 1 (a)","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Craik & Lockhart (1975), Levels-of-Processing","typ":"single","frage":"Durch welchen Faktor erklären Craik & Lockhart (1975) Unterschiede in der Behaltensleistung?","optionen":["Verarbeitungszeit","Verarbeitungstiefe","Verarbeitungsmodus"],"loesung":1,"erklaerung":"Der Verarbeitungstiefeansatz von Craik und Lockhart (1975) erklärt Unterschiede in der Behaltensleistung nicht über getrennte Speicher-Subsysteme, sondern über die Tiefe der Verarbeitung: Je tiefer (semantischer) ein Reiz verarbeitet wird, desto besser die spätere Erinnerung. Verarbeitungszeit und ein 'Verarbeitungsmodus' sind in diesem Modell keine benannten Erklärungsfaktoren.","folie":"2 Wissenserwerb Kognition.txt, Verarbeitungstiefeansatz"},{"id":"ueb-024","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 12, Übung 1 (b)","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Craik & Lockhart (1975), Levels-of-Processing","typ":"multi","frage":"Welche Art(en) der Reizanalyse wird/werden von Craik & Lockhart (1975) definiert?","optionen":["graphisch","haptisch","phonemisch"],"loesungen":[0,2],"erklaerung":"Craik und Lockhart unterscheiden drei Ebenen der Reizanalyse: graphisch/strukturell (Form, flache Verarbeitung), phonemisch (Laut, mittlere Verarbeitung) und semantisch (Bedeutung, tiefe Verarbeitung). Eine haptische (taktile) Reizanalyse ist im Modell nicht vorgesehen.","folie":"2 Wissenserwerb Kognition.txt, Verarbeitungstiefeansatz"},{"id":"ueb-025","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 12-13, Übung 1 (c)","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Craik & Lockhart (1975), Levels-of-Processing","typ":"single","frage":"Welche Verarbeitungstiefe hat die semantische Reizanalyse von Craik & Lockhart (1975)?","optionen":["flach","mittel","tief"],"loesung":2,"erklaerung":"Die semantische Reizanalyse (Analyse der Bedeutung eines Reizes) entspricht im Verarbeitungstiefeansatz der tiefsten Verarbeitungsebene und geht mit der höchsten Behaltensleistung einher, im Gegensatz zur flachen graphischen und der mittleren phonemischen Analyse.","folie":"2 Wissenserwerb Kognition.txt, Verarbeitungstiefeansatz"},{"id":"ueb-026","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 13, Übung 1 (d)","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"multi","frage":"Welche Konzepte zählen zu den semantischen Netzwerkmodellen?","optionen":["Propositionales Netzwerk","Merkmalsmodell","Prototypen-Modell"],"loesungen":[0,1,2],"erklaerung":"In der Vorlesung werden Merkmalsmodell, Prototypen-/Exemplarmodelle und das propositionale Netzwerk gemeinsam unter der Überschrift 'Semantische Netzwerkmodelle' als Modelle der Repräsentation semantischen Wissens behandelt. Alle drei Konzepte zählen daher zu dieser Modellfamilie.","folie":"3 Ged_chtnis_.txt, Semantische Netzwerkmodelle"},{"id":"ueb-027","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 13, Klausuraufgabe 1","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"single","stamm":"Der Lehrer weiß, dass eine gute Strukturierung und Organisation von Informationen eine wichtige Voraussetzung für den gezielten Abruf dieser Informationen ist. Deshalb bietet er seinen Schülern am Ende jeder Unterrichtseinheit gut strukturierte Übersichten, die sie zur Vorbereitung auf Klassenarbeiten nutzen sollen.","frage":"Unter welchen Bedingungen wird sich aus Sicht der Gedächtnispsychologie diese Organisationshilfe nur bedingt bewähren, obwohl sich die Schüler große Mühe geben beim Einprägen der Übersichten?","optionen":["Die strukturierte Übersicht bezieht sich auf eine Unterrichtseinheit, in der es primär um das Erlernen und Behalten reinen Faktenwissens geht.","Die Schüler prägen sich die Übersicht ohne nachzudenken genauso ein, wie der Lehrer sie dargestellt hat.","Die Struktur der Übersicht des Lehrers ist für die Schüler mit ihrem eigenen Wissen nur schwer zu verstehen.","Die Schüler haben aufgrund ihres eigenen Wissens die Informationen der Unterrichtseinheit bereits anders strukturiert.","Die strukturierte Übersicht macht Zusammenhänge zwischen den Informationen der Unterrichtseinheit eher konkret als abstrakt deutlich."],"loesung":1,"erklaerung":"Eine Organisationshilfe wirkt nur, wenn sie aktiv und elaboriert mit dem eigenen Wissen verarbeitet wird. Prägen sich die Schüler die vorgegebene Struktur dagegen bloß mechanisch ein, ohne sie gedanklich zu durchdringen, bleibt die Verarbeitung trotz hohem Aufwand flach und die organisierende Wirkung entfaltet sich nicht – Mühe allein ersetzt keine tiefe Verarbeitung. Die anderen Optionen beschreiben zwar ebenfalls denkbare Erschwernisse (z. B. Unverständlichkeit oder abweichende Vorstrukturierung), zielen aber nicht auf den in der Frage betonten Kontrast zwischen hohem Einprägeaufwand und ausbleibendem Nutzen.","folie":"2 Wissenserwerb Kognition.txt"},{"id":"ueb-028","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 13-14, Klausuraufgabe 2","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"matrix","frage":"Welche der folgenden Aussagen über semantische Netzwerke sind korrekt?","spalten":["Ja","Nein"],"zeilen":[{"text":"Je häufiger man einer Information über einen Begriff begegnet, desto stärker wird diese Information mit dem Begriff assoziiert.","loesung":0},{"text":"Grundbestandteile eines semantischen Netzwerks sind Variablen mit Freistellen, die situationsspezifisch spezifiziert werden können.","loesung":1},{"text":"In semantischen Netzen ist das Wissen hoch organisiert abgebildet. Die einzelnen Begriffe sind mit gerichteten Relationen versehen.","loesung":0},{"text":"Jede Eigenschaft ist nur ein einziges Mal repräsentiert, und zwar auf dem höchstmöglichen Niveau.","loesung":0},{"text":"Im semantischen Netzwerk wird prozedurales Wissen als ein Netzwerk von miteinander verbundenen Handlungssequenzen und Teilhandlungen repräsentiert.","loesung":1},{"text":"Ein großer Teil des Wissens wird aus im Gedächtnis gespeicherten Informationen neu gebildet.","loesung":0}],"erklaerung":"Semantische Netzwerke bestehen aus Knoten (Begriffen) und gerichteten, benannten Relationen; Verbindungsstärke wächst mit der Häufigkeit der Aktivierung (Zeile 1, 3 richtig). Nach dem Prinzip der kognitiven Ökonomie (Collins & Quillian) wird jede Eigenschaft nur einmal auf der höchstmöglichen hierarchischen Ebene gespeichert und für untergeordnete Begriffe erschlossen statt wiederholt (Zeile 4 richtig), wodurch auch neues, nicht explizit gespeichertes Wissen durch Inferenz erzeugt werden kann (Zeile 6 richtig). Variablen mit Freistellen sind dagegen das Kennzeichen von Schemata/Scripts, nicht von semantischen Netzwerken (Zeile 2 falsch), und prozedurales Wissen wird im Kurs eigenständig durch Produktionssysteme repräsentiert, nicht durch semantische Netzwerke (Zeile 5 falsch).","folie":"3 Ged_chtnis_.txt, Semantische Netzwerkmodelle"},{"id":"ueb-029","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 14, Klausuraufgabe 3","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"multi","frage":"Was sind die Vorteile von Schemata (mehrere Antworten sind richtig)?","optionen":["neues Wissen wird tiefer elaboriert","neues Wissen wird öfter wiederholt","neues Wissen wird in überschaubare Einheiten organisiert","neues Wissen wird mit bereits bekanntem Wissen verknüpft","neues Wissen mit besonderen Merkmalen kann in freie Plätze eingeordnet werden","neues Wissen muss nicht jeweils an einem gesonderten Platz abgespeichert werden"],"loesungen":[2,3,4,5],"erklaerung":"Schemata sind generische Wissensstrukturen mit variablen Leerstellen ('freien Plätzen'), die neue, situationsspezifische Information aufnehmen können (e), neues Wissen in überschaubare, vorstrukturierte Einheiten organisieren (c), es mit bereits vorhandenem Wissen verknüpfen (d) und dadurch ökonomische Speicherung ermöglichen, da nicht jede Instanz einzeln, sondern nur die generische Struktur gespeichert werden muss (f). Häufigere Wiederholung (b) und tiefere Elaboration (a) sind allgemeine Gedächtnisstrategien, aber keine spezifische Funktion von Schemata selbst.","folie":"3 Ged_chtnis_.txt, Modelle der Wissensrepräsentation"},{"id":"ueb-030","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 14, Klausuraufgabe 4","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Smith, Shoben & Rips (1974), Typikalitätseffekt","typ":"single","stamm":"Daten aus Begriffserkennungs-Experimenten zeigen, dass Personen signifikant länger für die Antwort auf die Frage 'Ist der Pinguin ein Vogel?' benötigen als für die Frage 'Ist die Amsel ein Vogel?'.","frage":"Mit welchem der folgenden Konzepterwerbsmodelle lässt sich dieser Forschungsbefund erklären?","optionen":["Merkmalsmodell","Prototypenmodell","Propositionsmodell","Episodenmodell","Stereotypenmodell"],"loesung":1,"erklaerung":"Das Prototypenmodell erklärt Kategorienurteile über den Vergleich mit einem typischen Vertreter (Prototyp) der Kategorie. Die Amsel liegt dem Prototyp 'Vogel' näher als der atypische Pinguin, wodurch der Vergleichsprozess bei der Amsel schneller und bei untypischen Exemplaren wie dem Pinguin langsamer abläuft – der klassische Typikalitätseffekt (Smith, Shoben & Rips, 1974). Das Merkmalsmodell sagt dagegen eine reine, distanzunabhängige Kategorienzugehörigkeit über notwendige und hinreichende Merkmale vorher und erklärt abgestufte Reaktionszeiten nicht in gleicher Weise.","folie":"3 Ged_chtnis_.txt, Prototypen-Modelle"},{"id":"ueb-031","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 14-15, Klausuraufgabe 5","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","modell":"Schank & Abelson (1977), Scripts","typ":"single","frage":"Mit dem Begriff 'Script' wird in der Gedächtnispsychologie eine Form der Wissensrepräsentation bezeichnet. Zur Repräsentation welcher Wissensart ist diese Repräsentationsform geeignet?","optionen":["Prozedurales Wissen","Semantisches Wissen","Episodisches Wissen","Konzeptuelles Wissen","Sensorisches Wissen"],"loesung":2,"erklaerung":"Scripts (Schank & Abelson, 1977) repräsentieren häufig erfahrene, stereotype Ereignisfolgen wie einen Restaurantbesuch und damit episodisches Wissen. Prozedurales Wissen wird im Kurs eigenständig über Produktionssysteme, semantisches Wissen über semantische Netzwerke repräsentiert.","folie":"3 Ged_chtnis_.txt, Episodisches Wissen - Scripts"},{"id":"ueb-032","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 15, Klausuraufgabe 6","vertrauen":"niedrig","teil":"I","thema":"Wissenserwerb und Kognition","typ":"multi","stamm":"Um ihren Schüler*innen im Physikunterricht komplizierte Themen verständlich zu machen, produziert Frau Svobodova gemeinsam mit Fachkolleg*innen Erklärvideos, die sie im Unterricht zeigt. Nach dem Anschauen stellt Frau Svobodova jedoch fest, dass sich die Schüler*innen kaum daran erinnern können, was in den Videos erklärt wurde.","frage":"Wie könnte Frau Svobodova ihre Schüler*innen unterstützen, um die Erinnerungsleistung zu verbessern? Welche der folgenden Empfehlungen sind gedächtnispsychologisch begründbar?","optionen":["Die Schüler*innen sollen die Videos an den gekennzeichneten Stellen anhalten und sich selbst die Inhalte zusammenfassen.","Die Schüler*innen sollen alle Videos zu Beginn komplett durchschauen, um einen Überblick zu erhalten.","Die Schüler*innen sollen während des Anschauens der Videos das dazugehörige Arbeitsblatt parallel ausfüllen.","Die Schüler*innen sollen sich immer nur ein Video anschauen. Bevor sie das nächste Video starten, sollen sie eine längere Pause machen.","Die Schüler*innen sollen sich vor dem Anschauen die vom Lehrer bereitgestellten Fragen zu den Videos anschauen und diese nach dem Anschauen beantworten."],"loesungen":[0,3,4],"erklaerung":"Begründbar sind Strategien, die aktive, elaborierte Verarbeitung anregen, ohne die begrenzte Kapazität des Arbeitsgedächtnisses zu überlasten: Pausieren und selbst Zusammenfassen (a) fördert aktive Verarbeitung in überschaubaren Segmenten, Pausen zwischen den Videos (d) beugen Interferenz zwischen unmittelbar aufeinanderfolgenden Inhalten vor, und vorab gestellte Fragen mit anschließender Beantwortung (e) lenken die Aufmerksamkeit gezielt und nutzen den Retrieval-Practice-Effekt. Ein bloßer Überblick ohne Verarbeitungstiefe (b) und das gleichzeitige Ausfüllen eines Arbeitsblatts während des Anschauens (c) erzeugen dagegen eher geteilte Aufmerksamkeit und eine Doppelbelastung des Arbeitsgedächtnisses; Option (c) ist allerdings nicht eindeutig, da ein Arbeitsblatt auch aktiv-generative Verarbeitung anregen könnte – die Einschätzung erfolgt daher mit niedrigem Vertrauen.","folie":"2 Wissenserwerb Kognition.txt; 4 Instruktionsdesign Ged_chtnis.txt"},{"id":"ueb-033","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 15-16, Klausuraufgabe 7","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"matrix","frage":"Prototypenmodelle, Scripte und Produktionssysteme sind psychologische Modelle der Wissensrepräsentation. Mit welchem dieser Modelle sind jeweils folgende Beispielsituationen zu erklären? (pro Aussage nur eine korrekte Antwort)","spalten":["Produktionssystem","Script","Prototypenmodell"],"zeilen":[{"text":"Lisa befolgt beim Erledigen der Mathe-Hausaufgaben genau die Regeln zur Auflösung von Klammern.","loesung":0},{"text":"Frau Schindler gibt zum Anfang ihrer Englisch-Stunden meist eine kurze Begebenheit in Englisch zum Besten, dann werden Grammatik-Regeln besprochen, zum Schluss wird Konversation geübt.","loesung":1},{"text":"Personen brauchen signifikant länger zur Beantwortung der Frage 'Ist der Pinguin ein Vogel?' als zur Beantwortung der Frage 'Ist die Amsel ein Vogel?'.","loesung":2},{"text":"Frank, 1,70m groß und sehr sportlich, spielt Basketball, wird in seinem Sportverein aber ständig als Fußballer angesehen.","loesung":2},{"text":"Wenn Carla morgens zur Arbeit kommt, lüftet sie üblicherweise erst durch, schaltet dann den PC an und kocht danach Kaffee.","loesung":1}],"erklaerung":"Lisas regelgeleitetes Vorgehen entspricht einem Produktionssystem (WENN-DANN-Regeln). Der feste Ablauf von Frau Schindlers Unterrichtsstunden und Carlas morgendliche Routine sind stereotype Ereignisfolgen und damit Scripts. Der Typikalitätseffekt bei Pinguin/Amsel und die Fehlkategorisierung Franks als Fußballer aufgrund seines sportlichen, athletischen Erscheinungsbilds beruhen beide auf einem Vergleich mit einem typischen Vertreter der Kategorie und sind damit durch das Prototypenmodell erklärbar.","folie":"3 Ged_chtnis_.txt, Prototypen-Modelle"},{"id":"ueb-034","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 16-17, Klausuraufgabe 8 (4.2)","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"mc-kombi","stamm":"Ein erfolgreicher Wissenserwerb ist von verschiedenen Faktoren abhängig.","frage":"Welche der folgenden Strategien von Lehrern führen nach lernpsychologischer Sicht zu erfolgreichem Lernen?","aussagen":["Die Schüler werden zum Fehlersuchen und Hinterfragen angeregt.","Die leistungsschwächeren Schüler genießen einen freieren Unterricht.","Der Lehrer setzt Alltagsbezüge, um Vorwissen zu aktivieren.","Bei leistungsschwächeren Schülern hängt der Erfolg von der Lernumgebung ab.","Der Lehrer berücksichtigt Aptitude-Treatment-Interactions (ATI)."],"optionen":["Alle Aussagen sind richtig.","Die Aussagen (1), (3), (4) und (5) sind richtig, alle anderen nicht.","Die Aussagen (2) und (3) sind richtig, alle anderen nicht.","Die Aussage (1), (4) und (5) sind richtig, alle anderen nicht.","Die Aussagen (2) und (5) sind richtig, alle anderen nicht."],"loesung":1,"aussagen_richtig":[0,2,3,4],"erklaerung":"Aktives, konstruktives Lernen wird gefördert, wenn Schüler zum Fehlersuchen und kritischen Hinterfragen angeregt werden (1), wenn Vorwissen über Alltagsbezüge aktiviert wird (3) und wenn der Unterricht über Aptitude-Treatment-Interactions gezielt an die individuellen Voraussetzungen angepasst wird (5); gerade bei leistungsschwächeren Schülern hängt der Lernerfolg stark von einer passenden, unterstützenden Lernumgebung ab (4). Ein grundsätzlich 'freierer', also weniger strukturierter Unterricht ist für leistungsschwächere Schüler dagegen nicht per se förderlich (2), da sie in der Regel von klarer Strukturierung und Anleitung profitieren. Richtig sind daher 1, 3, 4 und 5, also Option (b).","folie":"2 Wissenserwerb Kognition.txt"},{"id":"ueb-035","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 17, Klausuraufgabe 9","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"mc-kombi","frage":"Beurteilen Sie, welche der folgenden Aussagen über die Modelle der Wissensrepräsentation zutreffen.","aussagen":["Merkmalsmodell gehört zu syntaktischen Netzwerk.","Der Ablauf einer Klassenarbeit ist ein mögliches Beispiel für ein Skript.","Produktionssysteme setzen sich aus Je-desto-Zyklen zusammen.","Zu Analogien zählen funktionelle, visuelle, räumliche.","Schemata beeinflussen die Aufmerksamkeit und erzeugen Interferenzen."],"optionen":["1 und 3 treffen zu.","1, 3 und 4 treffen zu.","2 trifft zu.","2, 3 und 5 treffen zu.","2 und 5 treffen zu."],"loesung":2,"aussagen_richtig":[1],"erklaerung":"Ein wiederkehrender Ablauf wie eine Klassenarbeit lässt sich als Script fassen (2 richtig). Das Merkmalsmodell gehört zu den semantischen, nicht zu 'syntaktischen' Netzwerken (1 falsch – Begriffsverwechslung), und Produktionssysteme bestehen aus WENN-DANN-Regeln, nicht aus 'Je-desto-Zyklen' (3 falsch – Begriffsverwechslung). Schemata lenken zwar die Aufmerksamkeit auf schemarelevante Information, ihre typische Fehlerquelle ist aber die systematische Verzerrung durch schemakonforme Rekonstruktion, nicht die Interferenz – ein im Kurs klar getrennter, anderer Vergessensmechanismus (5 falsch). Richtig ist daher nur Aussage 2, also Option (c).","folie":"3 Ged_chtnis_.txt"},{"id":"ueb-036","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 17-18, Klausuraufgabe 10","vertrauen":"mittel","teil":"I","thema":"Wissenserwerb und Kognition","typ":"matrix","frage":"Es gibt verschiedene Modelle der Wissensrepräsentation. Entscheiden Sie für jedes Beispiel, welches Modell die Art der verwendeten Wissensrepräsentation am besten beschreibt (pro Aussage nur eine korrekte Antwort).","spalten":["Schema","Script","Analogie","Prototypmodell","Produktionssystem"],"zeilen":[{"text":"Katja weiß, dass sie morgens auf Arbeit zuerst die eingegangene Post verteilen, dann Kaffee kochen und die Emails checken muss.","loesung":1},{"text":"Farine
