ilität im jüngeren gegenüber mittlerem Erwachsenenalter und zur Niveaustabilität von Gewissenhaftigkeit sind nicht als Lösung markiert.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 105-106"},{"id":"skr-44","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 107","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Zwillings- und Adoptionsstudien","typ":"matrix","frage":"Durch die Kombination von Zwillingsstudie mit Adoptionsstudie können verschiedene Einflüsse untersucht werden, die zur Entwicklung beitragen. Bitte ordnen Sie die eingebrachten Einflüsse den entsprechenden Typ von Zwillingspaaren zu.","spalten":["Genetischer Anteil","1/2 genetischer Anteil","1/2 genetischer Anteil + geteilter Umweltanteil","Genetischer Anteil + geteilter Umweltanteil"],"zeilen":[{"text":"Zweieiige Zwillinge, die zusammen aufwachsen","loesung":2},{"text":"Eineiige Zwillinge, die nicht zusammen aufwachsen","loesung":0},{"text":"Zweieiige Zwillinge, die nicht zusammen aufwachsen","loesung":1},{"text":"Eineiige Zwillinge, die zusammen aufwachsen","loesung":3}],"erklaerung":"Eineiige Zwillinge teilen 100% ihrer Gene, zweieiige im Mittel 50%; wachsen sie getrennt auf, teilen sie keine gemeinsame Umwelt mehr, wachsen sie zusammen auf, kommt der geteilte Umweltanteil hinzu. So ergibt sich für getrennt aufgewachsene eineiige Zwillinge nur der genetische Anteil, für getrennt aufgewachsene zweieiige Zwillinge nur der halbe genetische Anteil, und für gemeinsam aufgewachsene Paare jeweils zusätzlich der geteilte Umweltanteil.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 107"},{"id":"ep-17","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget (1936/1975), Assimilation, Akkommodation und Äquilibration","typ":"matrix","stamm":"Piaget beschreibt die kognitive Entwicklung als Zusammenspiel zweier Anpassungsprozesse: Bei der Assimilation wird eine neue Erfahrung in ein vorhandenes Schema eingepasst, bei der Akkommodation wird das Schema selbst verändert oder ein neues gebildet. Die Äquilibration ist das Streben nach einem Gleichgewicht zwischen beiden.","frage":"Ordnen Sie die folgenden Beispiele zu. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Assimilation","Akkommodation","Weder noch"],"zeilen":[{"text":"Ein Kind, das bisher nur Hunde kannte, zeigt beim ersten Anblick einer Katze darauf und ruft 'Wauwau'.","loesung":0},{"text":"Nachdem die Mutter erklärt hat, dass das Tier eine Katze ist, bildet das Kind ein eigenes Schema für Katzen und grenzt es von dem für Hunde ab.","loesung":1},{"text":"Ein Säugling nimmt einen Holzwürfel mit demselben Saugmuster in den Mund, mit dem er an der Flasche trinkt.","loesung":0},{"text":"Der Säugling verändert Mundöffnung und Griffhaltung, um den kantigen Würfel überhaupt fassen und halten zu können.","loesung":1},{"text":"Ein Schüler erweitert seinen Zahlbegriff, nachdem negative Zahlen eingeführt wurden und seine bisherige Vorstellung von Zahlen als Mengen nicht mehr trägt.","loesung":1},{"text":"Ein Kind spricht das Wort 'Löffel' zehnmal hintereinander nach, ohne dabei den Gegenstand anzusehen oder zu benutzen.","loesung":2}],"erklaerung":"Das Unterscheidungskriterium lautet: Bleibt das Schema unverändert und wird die Erfahrung hineingezwungen (Assimilation), oder verändert sich das Schema unter dem Druck der Erfahrung (Akkommodation)? Das Katzenbeispiel zeigt beides nacheinander: erst Einordnung in das Hundeschema, dann dessen Ausdifferenzierung. Ebenso beim Würfel: erst Anwendung des vorhandenen Saugschemas, dann dessen Anpassung an die Beschaffenheit des Objekts. Die Erweiterung des Zahlbegriffs ist Akkommodation, weil die bisherige Vorstellung selbst revidiert wird; dass der Anstoß dazu ein erlebter Widerspruch ist, entspricht der Äquilibration. Die letzte Zeile gehört in keine Kategorie: Bloßes Nachsprechen ohne Bezug zum Gegenstand verändert weder ein Schema noch wendet es eines auf eine Erfahrung an. Beide Prozesse laufen in der Regel gemeinsam ab; in der Prüfung wird danach gefragt, welcher in dem geschilderten Moment im Vordergrund steht."},{"id":"ep-18","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget (1947/1972), Stadien der kognitiven Entwicklung","typ":"matrix","stamm":"Piaget unterscheidet vier Stadien der kognitiven Entwicklung: das sensomotorische (etwa 0 bis 2 Jahre), das präoperationale (etwa 2 bis 7 Jahre), das konkret-operationale (etwa 7 bis 11 Jahre) und das formal-operationale Stadium (ab etwa 11 bis 12 Jahren).","frage":"Ordnen Sie jede Beobachtung dem Stadium zu, für das sie kennzeichnend ist. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Sensomotorisch","Präoperational","Konkret-operational","Formal-operational"],"zeilen":[{"text":"Ein Kind sucht nach einem Gegenstand, der vor seinen Augen unter einem Tuch verborgen wurde, und hebt das Tuch an.","loesung":0},{"text":"Ein Kind behauptet, im hohen schmalen Glas sei mehr Saft als im niedrigen breiten, obwohl es das Umschütten beobachtet hat.","loesung":1},{"text":"Ein Kind hält sich beim Versteckspiel die Augen zu und ist überzeugt, dadurch selbst nicht gesehen zu werden.","loesung":1},{"text":"Ein Kind begründet, dass die Saftmenge gleich geblieben sein muss, weil man den Saft ja wieder zurückschütten könnte.","loesung":2},{"text":"Ein Kind ordnet zehn Stäbe der Länge nach und schließt, dass Stab A länger als Stab C sein muss, wenn A länger als B und B länger als C ist.","loesung":2},{"text":"Eine Jugendliche stellt im Pendelversuch systematisch Hypothesen auf und variiert dabei jeweils nur eine Größe, während sie die übrigen konstant hält.","loesung":3}],"erklaerung":"Die Zuordnung folgt den Leitphänomenen der Stadien. Das Suchen nach dem verdeckten Gegenstand zeigt Objektpermanenz, die im Laufe des sensomotorischen Stadiums erworben wird. Fehlende Invarianz beim Umschüttversuch und Egozentrismus im Sinne der Nichtunterscheidung der eigenen von einer fremden Wahrnehmungsperspektive kennzeichnen das präoperationale Stadium. Die Begründung über die Umkehrbarkeit der Handlung zeigt Reversibilität, die Längenreihe zeigt Seriation und Transitivität - beides sind konkrete Operationen, die an anschauliches Material gebunden bleiben. Das systematische Variieren einer Größe bei Konstanthalten der übrigen ist das Standardbeispiel für formal-operationales, hypothetisch-deduktives Denken. Die typische Fehlzuordnung besteht darin, das Zudecken der Augen beim Versteckspiel für mangelnde Objektpermanenz zu halten; es ist jedoch ein Perspektivenproblem, nicht ein Problem der Existenzannahme."},{"id":"ep-19","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget (1947/1972), präoperationales Stadium","typ":"mc-kombi","stamm":"Mia ist fünf Jahre alt. Sie erzählt ihrer Großmutter am Telefon von einem Bild und hält dabei das Blatt in den Hörer. Auf dem Nachhauseweg tröstet sie einen Stein, der vom Weg gefallen ist, weil er sich jetzt sicher einsam fühle.","frage":"Welche der folgenden Aussagen zum präoperationalen Denken treffen zu?","aussagen":["Egozentrismus im Sinne Piagets bedeutet, dass das Kind die eigene Wahrnehmungsperspektive nicht von der anderer Personen unterscheidet.","Egozentrismus im Sinne Piagets bezeichnet ein selbstsüchtiges, rücksichtsloses Sozialverhalten.","Zentrierung bedeutet, dass das Kind beim Urteilen nur einen Aspekt einer Situation berücksichtigt und andere ausblendet.","Das Invarianzverständnis für Menge, Länge und Gewicht ist am Ende des präoperationalen Stadiums vollständig ausgebildet.","Animismus, also die Zuschreibung von Belebtheit und Empfinden an unbelebte Gegenstände, ist ein typisches Merkmal des Denkens in diesem Stadium."],"optionen":["Die Aussagen (1), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (3), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (4) treffen zu; alle anderen aber nicht."],"loesung":0,"aussagen_richtig":[0,2,4],"erklaerung":"Mias Verhalten illustriert zwei Merkmale des präoperationalen Denkens: Das Vorhalten des Bildes am Telefon ist Egozentrismus im Piagetschen Sinn, das Trösten des Steins ist Animismus. Aussage (1), (3) und (5) benennen diese Merkmale korrekt. Aussage (2) enthält die häufigste Fehldeutung des Begriffs: Egozentrismus ist bei Piaget ein kognitives Unvermögen zur Perspektivendifferenzierung und kein moralisches oder charakterliches Urteil über das Kind. Aussage (4) verschiebt einen Erwerb um ein ganzes Stadium: Das Invarianzverständnis wird erst im konkret-operationalen Stadium erworben, und dort zeitversetzt für verschiedene Inhalte - Menge vor Gewicht vor Volumen, was Piaget als horizontale Verschiebung (décalage) bezeichnet."},{"id":"ep-20","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Kritik an Piaget; u. a. Hughes (1975), Policeman-Aufgabe; Baillargeon (1987), Erwartungsverletzungsparadigma","typ":"mc-kombi","frage":"Welche der folgenden Aussagen geben die wissenschaftliche Kritik an Piagets Theorie zutreffend wieder?","aussagen":["Werden Aufgaben sprachlich vereinfacht und in für Kinder sinnvolle Kontexte eingebettet, zeigen sie die geprüften Kompetenzen deutlich früher, als Piaget annahm.","Piaget hat die Kompetenzen jüngerer Kinder in der Tendenz überschätzt.","Die Entwicklung verläuft weniger einheitlich und stufenförmig, als Piaget annahm; Fortschritte fallen häufig bereichsspezifisch aus.","Die Bedeutung sozialer Interaktion und kultureller Werkzeuge für die kognitive Entwicklung wird bei Piaget im Vergleich zu Wygotski gering gewichtet.","Die von Piaget beschriebene Abfolge der Stadien konnte in Replikationen grundsätzlich nicht bestätigt werden."],"optionen":["Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (2) treffen zu; alle anderen aber nicht."],"loesung":1,"aussagen_richtig":[0,2,3],"erklaerung":"Die Kritik setzt an drei Punkten an, die in den Aussagen (1), (3) und (4) benannt sind: an der Methodik, weil Piagets Aufgaben hohe sprachliche und situative Anforderungen stellen und vereinfachte Varianten wie Hughes' Versteckaufgabe mit Polizistenfigur frühere Kompetenzen sichtbar machen; an der Stufenannahme, weil sich Fortschritte häufig bereichsspezifisch und nicht als gleichzeitiger Umbau des gesamten Denkens zeigen; und an der Vernachlässigung des sozialen und kulturellen Kontexts, den Wygotski ins Zentrum rückt. Aussage (2) kehrt die Richtung des Kritikpunkts um: Piaget hat jüngere Kinder unterschätzt, nicht überschätzt. Aussage (5) überdehnt die Kritik: Umstritten sind die Altersangaben, die Einheitlichkeit und die Erklärung der Übergänge, während die beschriebene Reihenfolge der Stadien als weitgehend bestätigt gilt."},{"id":"ep-21","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Wygotski (1934/1964), Zone der nächsten Entwicklung; Wood, Bruner & Ross (1976), Scaffolding","typ":"mc-kombi","stamm":"Herr Brandt führt in einer sechsten Klasse die Addition von Brüchen mit ungleichen Nennern ein. Er lässt zunächst in Partnerarbeit rechnen, gibt einzelnen Paaren gezielte Zwischenfragen und zieht seine Hilfen über die folgenden Stunden schrittweise zurück.","frage":"Welche der folgenden Aussagen zu Wygotskis Ansatz treffen zu?","aussagen":["Die Zone der nächsten Entwicklung ist der Bereich zwischen dem, was ein Kind bereits allein bewältigt, und dem, was es mit Unterstützung einer kompetenteren Person bewältigt.","Guter Unterricht setzt an dem an, was das Kind bereits selbstständig beherrscht, und wartet den weiteren Reifungsfortschritt ab.","Scaffolding bezeichnet eine Unterstützung, die anfangs hoch ist und schrittweise zurückgenommen wird, sobald das Kind mehr allein bewältigt.","Sprache ist nach Wygotski in erster Linie ein Ergebnis der kognitiven Entwicklung und wirkt selbst nicht auf das Denken zurück.","Die laut gesprochene Selbstinstruktion des Kindes gilt bei Wygotski als Vorform der inneren Sprache und als Mittel der Handlungssteuerung."],"optionen":["Die Aussagen (1) und (2) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (4) treffen zu; alle anderen aber nicht."],"loesung":2,"aussagen_richtig":[0,2,4],"erklaerung":"Wygotskis Kernbegriff ist die Zone der nächsten Entwicklung, definiert über die Differenz zwischen aktuellem und unterstütztem Leistungsniveau; Aussage (1) gibt sie korrekt wieder. Scaffolding - der Begriff stammt von Wood, Bruner und Ross, nicht von Wygotski selbst - bezeichnet das dosierte Anpassen und spätere Zurücknehmen der Hilfe (Fading), wie es Herr Brandt praktiziert: Aussage (3) trifft zu. Aussage (5) beschreibt die private Sprache korrekt als Übergangsform zur inneren Sprache und als Werkzeug der Handlungssteuerung; Piaget deutete dieselbe Beobachtung dagegen als egozentrische Sprache ohne Funktion. Aussage (2) formuliert die Gegenposition zu Wygotski: Bei ihm zieht der Unterricht die Entwicklung nach sich, statt ihr zu folgen. Aussage (4) kehrt das Verhältnis von Sprache und Denken um - für Wygotski ist Sprache das zentrale kulturelle Werkzeug, das die höheren psychischen Funktionen überhaupt erst ausbildet."},{"id":"ep-22","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget (1947/1972) und Wygotski (1934/1964) im Vergleich","typ":"matrix","frage":"Ordnen Sie die folgenden Positionen zu. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Eher Piaget","Eher Wygotski","Beide","Keiner von beiden"],"zeilen":[{"text":"Die kognitive Entwicklung ist Voraussetzung des Lernens; der Unterricht folgt der Entwicklung.","loesung":0},{"text":"Das Lernen zieht die Entwicklung nach sich; der Unterricht läuft der Entwicklung voraus.","loesung":1},{"text":"Das Kind konstruiert sein Wissen aktiv und ist kein passiver Empfänger von Informationen.","loesung":2},{"text":"Sprache und andere kulturelle Werkzeuge sind der entscheidende Motor der höheren psychischen Funktionen.","loesung":1},{"text":"Der Widerspruch zwischen vorhandenem Schema und neuer Erfahrung treibt die Entwicklung an (Äquilibration).","loesung":0},{"text":"Entwicklung besteht im bloßen Anwachsen der Zahl gelernter Reiz-Reaktions-Verbindungen, ohne qualitative Veränderung.","loesung":3}],"erklaerung":"Beide Theoretiker sind Konstruktivisten und darin einig, dass das Kind sein Wissen aktiv aufbaut - deshalb ist die dritte Zeile bei beiden einzuordnen. Sie unterscheiden sich im Verhältnis von Lernen und Entwicklung: Bei Piaget begrenzt der erreichte Entwicklungsstand, was gelernt werden kann, und der Motor ist der innere Ungleichgewichtszustand, den die Äquilibration auflöst. Bei Wygotski ist es umgekehrt das in sozialer Interaktion vermittelte Lernen, das die Entwicklung vorantreibt, wobei Sprache das wichtigste kulturelle Werkzeug ist. Die letzte Zeile gehört zu keinem von beiden, sondern gibt die behavioristische Position wieder, gegen die sich beide Ansätze richten: Sie kennt keine qualitativen Umbauten des Denkens, sondern nur quantitative Zunahme."},{"id":"ep-23","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Wimmer & Perner (1983), Falsche-Überzeugung-Aufgabe; Theory of Mind","typ":"matrix","frage":"Treffen die folgenden Aussagen zur Theory of Mind zu? Kreuzen Sie an. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Ja","Nein"],"zeilen":[{"text":"Theory of Mind bezeichnet die Fähigkeit, sich selbst und anderen mentale Zustände wie Wünsche, Absichten und Überzeugungen zuzuschreiben.","loesung":0},{"text":"Die Falsche-Überzeugung-Aufgabe (Maxi-Aufgabe, Sally-Anne-Aufgabe) wird von den meisten Kindern erst etwa ab dem vierten bis fünften Lebensjahr sicher gelöst.","loesung":0},{"text":"Das Verständnis für die Wünsche anderer entwickelt sich in der Regel später als das Verständnis für falsche Überzeugungen.","loesung":1},{"text":"Eine entwickelte Theory of Mind ist Voraussetzung dafür, absichtliche Täuschung, Ironie und Notlügen zu verstehen.","loesung":0},{"text":"Theory of Mind bezeichnet dasselbe wie Piagets Begriff der Invarianz.","loesung":1},{"text":"Kinder mit einer Autismus-Spektrum-Störung zeigen im Mittel besondere Schwierigkeiten bei Aufgaben zur Theory of Mind.","loesung":0}],"erklaerung":"Theory of Mind meint das Zuschreiben mentaler Zustände und wird klassisch mit der Falsche-Überzeugung-Aufgabe geprüft: Maxi legt Schokolade in einen Schrank, sie wird in seiner Abwesenheit umgeräumt, und das Kind soll sagen, wo Maxi danach sucht. Erst ab etwa vier bis fünf Jahren antworten die meisten Kinder mit dem ursprünglichen Ort und trennen damit die Überzeugung einer Person von der Wirklichkeit. Die Entwicklungsreihenfolge verläuft von Wünschen über Absichten zu Überzeugungen, weshalb die dritte Zeile mit Nein zu beantworten ist: Wunschverständnis kommt früher. Die Verbindung zu Täuschung und Ironie ist gut belegt, ebenso die im Mittel erhöhten Schwierigkeiten bei Autismus-Spektrum-Störungen. Mit Invarianz hat Theory of Mind nichts zu tun; dieser Begriff bezeichnet die Mengen- und Größenerhaltung bei Piaget und gehört in einen anderen Aufgabenbereich."},{"id":"ep-24","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget (1936/1975), Objektpermanenz und A-nicht-B-Fehler","typ":"single","stamm":"Ein acht Monate alter Säugling hat mehrfach erfolgreich ein Spielzeug unter Tuch A hervorgeholt. Nun wird das Spielzeug vor seinen Augen unter Tuch B versteckt. Der Säugling greift dennoch erneut unter Tuch A.","frage":"Wie ist dieses Verhalten nach Piaget einzuordnen?","optionen":["Als Beleg dafür, dass der Säugling noch über keinerlei Objektpermanenz verfügt.","Als A-nicht-B-Fehler: Die Objektpermanenz ist im Aufbau, das Suchen bleibt jedoch an die zuvor erfolgreiche Handlung gebunden.","Als Zeichen mangelnder Invarianz, da der Säugling die Menge der Gegenstände nicht als gleichbleibend erkennt.","Als Ausdruck des Animismus, da der Säugling dem Tuch eigenes Wollen zuschreibt.","Als Beleg für hypothetisch-deduktives Vorgehen bereits im Säuglingsalter."],"loesung":1,"erklaerung":"Der A-nicht-B-Fehler tritt im Übergangsbereich auf: Der Säugling sucht überhaupt, weiß also, dass der Gegenstand weiterexistiert - das spricht gegen Option (a). Sein Suchen ist aber noch an das zuvor erfolgreiche Handlungsschema gebunden statt an den aktuell beobachteten Ort, weshalb Piaget die Objektpermanenz erst gegen Ende des zweiten Lebensjahres als vollständig ansieht. Option (c) verwechselt Objektpermanenz mit Invarianz, einem Phänomen des konkret-operationalen Stadiums. Option (d) überträgt ein Merkmal des präoperationalen Denkens auf den Säugling. Option (e) verlegt formal-operationale Kompetenz ins erste Lebensjahr. Zur Einordnung: Die Erklärung des Fehlers ist umstritten; neuere Arbeiten führen ihn eher auf Defizite der Handlungshemmung und des Arbeitsgedächtnisses als auf ein fehlendes Objektkonzept zurück. Die hier geprüfte Piagetsche Einordnung des Phänomens bleibt davon unberührt."},{"id":"ep-25","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget (1947/1972), Invarianz, Zentrierung und Reversibilität","typ":"mc-kombi","stamm":"Frau Lentz füllt in einer Vorschulgruppe vor den Augen der Kinder Saft aus einem niedrigen breiten Glas in ein hohes schmales um. Der sechsjährige Ilja sagt daraufhin überzeugt, jetzt sei mehr Saft da.","frage":"Welche der folgenden Erklärungen für Iljas Antwort sind aus Sicht der Theorie Piagets zutreffend?","aussagen":["Ilja zentriert auf die Höhe der Flüssigkeitssäule und blendet die gleichzeitig veränderte Breite aus.","Ilja fehlt die Reversibilität, also die Fähigkeit, die Umschüttoperation gedanklich rückgängig zu machen.","Iljas Antwort ist auf ein Defizit des Arbeitsgedächtnisses zurückzuführen, da er den Umschüttvorgang bereits vergessen hat.","Mit dem Übergang in das konkret-operationale Stadium wird die Aufgabe in der Regel gelöst, weil Dezentrierung und Reversibilität verfügbar werden.","Iljas Antwort zeigt, dass er die Objektpermanenz noch nicht erworben hat."],"optionen":["Die Aussagen (1), (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (5) treffen zu; alle anderen aber nicht."],"loesung":0,"aussagen_richtig":[0,1,3],"erklaerung":"Der Umschüttversuch prüft die Mengeninvarianz. Piaget erklärt das Scheitern über zwei Merkmale des präoperationalen Denkens: Zentrierung auf einen einzigen Aspekt - hier die Höhe - unter Ausblendung der ausgleichenden Veränderung der Breite, und fehlende Reversibilität, also die Unfähigkeit, den Vorgang gedanklich umzukehren. Genau diese beiden Fähigkeiten, Dezentrierung und Reversibilität, werden im konkret-operationalen Stadium verfügbar, weshalb auch Aussage (4) zutrifft. Aussage (3) verlagert die Erklärung fälschlich auf das Gedächtnis: Ilja hat den Vorgang gesehen und erinnert ihn, er zieht daraus nur nicht den Schluss auf Mengengleichheit. Aussage (5) verwechselt zwei Konstrukte aus verschiedenen Stadien - Objektpermanenz betrifft das Weiterbestehen verdeckter Gegenstände und ist im Säuglingsalter erworben, Invarianz betrifft das Gleichbleiben von Mengen bei Gestaltveränderung."},{"id":"ex2016-06","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 6","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget, vier Stadien der kognitiven Entwicklung","typ":"single","stamm":"Die kognitive Entwicklung folgt vier sequenziellen Phasen nach Jean Piagets Theorie, nämlich: (1) Sensomotorische Phase, (2) Präoperationale Phase, (3) Konkret-operationale Phase, (4) Formal-operationale Phase.","frage":"In welcher Reihenfolge laufen die folgenden vier Entwicklungsereignisse nach Piagets sequenziellen Phasen von der frühen Kindheit bis zur späten Adoleszenz ab?","optionen":["(1) Saugschema, (2) Egozentrismus, (3) Objektpermanenz, (4) deduktives Denken","(1) Greifschema, (2) Abstraktion, (3) deduktives Denken, (4) Klassenbildung","(1) Saugschema, (2) Symbolspiel, (3) Konservation, (4) deduktives Denken","(1) Saugschema, (2) Konservation, (3) Objektpermanenz, (4) deduktives Denken","(1) Greifschema, (2) Konservation, (3) Symbolspiel, (4) deduktives Denken"],"loesung":2,"erklaerung":"Jedes Ereignis muss in der Phase stehen, zu der es gehört. Das Saugschema ist ein angeborenes Reflexschema und gehört an den Anfang der sensomotorischen Phase. Das Symbolspiel, bei dem ein Stock zum Pferd wird, ist das Kennzeichen der präoperationalen Phase. Die Konservation, also das Wissen, dass Menge beim Umschütten gleich bleibt, gelingt erst konkret-operational. Deduktives Denken an rein hypothetischem Material gehört in die formal-operationale Phase. Die Distraktoren verschieben jeweils ein Ereignis: Objektpermanenz entsteht bereits sensomotorisch und kann deshalb nicht an dritter Stelle stehen, wie in (a) und (d). In (b) steht deduktives Denken vor der Klassenbildung, in (e) die Konservation vor dem Symbolspiel – beides ist die Umkehrung der tatsächlichen Abfolge."},{"id":"skr-03","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 98","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Vygotsky (1978), Zone der proximalen Entwicklung","typ":"single","frage":"Welche der folgenden Aussagen beschreibt am besten Vygotskys (auch Wygotskis) Konzept der „Zone der Proximalen Entwicklung“?","optionen":["Der aktuelle Fähigkeitsstand eines Lernenden","Der Unterschied zwischen dem, was ein Lernender alleine machen kann und dem, was er mit Anleitung machen kann","Der vorherige Fähigkeitsstand eines Lernenden","Der zukünftige Fähigkeitsstand eines Lernenden","Die Gesamtheit aus dem, was ein Lernender mit und ohne Anleitung machen kann"],"loesung":1,"erklaerung":"Die Zone der proximalen Entwicklung bezeichnet nach Vygotsky die Differenz zwischen dem Niveau, das ein Kind selbstständig erreicht, und dem höheren Niveau, das es mit Unterstützung einer kompetenteren Person erreichen kann. Der aktuelle Fähigkeitsstand allein beschreibt nur die untere Grenze dieser Zone, nicht die Zone selbst. Die übrigen Optionen verwechseln das Konzept mit einem reinen Ist-Zustand oder einer bloßen Summe von Fähigkeiten.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 98"},{"id":"skr-06","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 99","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget, Äquilibration","typ":"single","frage":"Auf welches der folgenden Konzepte aus Piagets Theorie der kognitiven Entwicklung trifft am besten die Beschreibung „der treibende Motor der Veränderung im Laufe der Entwicklung“ zu?","optionen":["Äquilibration","Zentrierung","Assimilation","Akkomodation","Schema"],"loesung":0,"erklaerung":"Äquilibration ist bei Piaget der übergeordnete Selbstregulationsprozess, der Assimilation und Akkomodation ins Gleichgewicht bringt und dadurch kognitive Entwicklung überhaupt erst antreibt. Assimilation und Akkomodation sind lediglich die beiden Teilprozesse, mit denen neue Erfahrungen in bestehende Schemata eingeordnet bzw. diese daran angepasst werden. Zentrierung und Schema beschreiben Zustände bzw. Wissensstrukturen, keinen Veränderungsmotor.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 99"},{"id":"skr-08","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 99","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Intelligenzdiagnostik im Vorschulalter","typ":"single","frage":"Eine Vorschulleiterin möchte die Intelligenzleistungen von Kindern messen. Welche der folgenden Tests ist am besten geeignet?","optionen":["Kaufman Assessment Battery (K-ABC)","Hamburg-Wechsler-Intelligenztest (HAWIK)","Hannover-Wechsler-Intelligenztest (HAWIVA)","Griffiths Entwicklungsskalen (GES)","Wiener Entwicklungstest (WET)"],"loesung":2,"erklaerung":"Der HAWIVA ist speziell für das Vorschulalter normiert und dafür konzipiert, kindliche Intelligenzleistungen in diesem Altersbereich zu erfassen. Der HAWIK ist erst für Schulkinder ausgelegt, K-ABC deckt zwar auch jüngere Kinder ab, ist im Modell aber nicht als bestgeeigneter Vorschultest benannt, und GES sowie WET erfassen allgemeine Entwicklungsstände statt gezielt Intelligenzleistung.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 99"},{"id":"skr-10","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 99","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Entwicklung von Gedächtnisstrategien","typ":"single","frage":"Welche der folgenden Sequenzen beschreibt den Verlauf der Entwicklung der Gedächtnisstrategie von der frühen Kindheit bis zum frühen Jugendalter?","optionen":["Wiederholungsstrategien → Externe Gedächtnishilfen → Organisation → Elaboration","Externe Gedächtnishilfen → Wiederholungsstrategien → Organisation → Elaboration","Externe Gedächtnishilfen → Organisation → Elaboration → Wiederholungsstrategien","Externe Gedächtnishilfen → Organisation → Wiederholungsstrategien → Elaboration","Wiederholungsstrategien → Organisation → Externe Gedächtnishilfen → Elaboration"],"loesung":1,"erklaerung":"Gedächtnisstrategien entwickeln sich in der Reihenfolge externe Gedächtnishilfen, Wiederholung (Rehearsal), Organisation und schließlich Elaboration, da einfachere, äußerlich gestützte Strategien vor komplexeren, selbst generierten semantischen Strategien beherrscht werden. Die anderen Sequenzen setzen Organisation oder Elaboration zu früh an oder lassen Wiederholungsstrategien an falscher Stelle folgen.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 99"},{"id":"skr-13","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 100","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Präferenz-Blickbewegungs-Methode (Habituationsparadigma)","typ":"single","frage":"In der Säuglingsforschung ist die Präferenz-Blickbewegungs-Methode eine häufig verwendete Datenerhebungsmethode. Es gibt 3 Phasen dieser Methode. Bitte wählen Sie die richtige Reihenfolge der drei Phasen aus den folgenden Antwortoptionen.","optionen":["Habituation → Orientierung → Dishabituation","Dishabituation → Orientierung → Habituation","Orientierung → Dishabituation → Habituation","Dishabituation → Habituation → Orientierung","Orientierung → Habituation → Dishabituation"],"loesung":4,"erklaerung":"Im Habituationsparadigma orientiert sich der Säugling zunächst dem neuen Reiz zu, gewöhnt sich bei wiederholter Darbietung daran (Habituation, sinkende Blickzeit) und zeigt bei einem neuen Reiz wieder verstärktes Blickinteresse (Dishabituation). Die anderen Reihenfolgen widersprechen diesem logischen Ablauf von Erstkontakt, Gewöhnung und Neuheitsreaktion.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 100"},{"id":"skr-17","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 101","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"ADHS, Epidemiologie und Verlauf","typ":"multi","frage":"Welche der folgenden Aussagen zu ADHS ist (oder sind) richtig?","optionen":["Die höchste Prävalenzrate von ADHS liegt in der mittleren Kindheit (ca. 8 bis 10 Jahre).","Im Vergleich zu sich typisch entwickelnden Kindern zeigen Kinder mit ADHS eine größere Variabilität während der Informationsverarbeitung.","Bei den meisten Kindern mit ADHS werden ihre Symptome im Jugendalter schwächer.","ADHS ist eine häufige Verhaltensstörung, von der etwa 30% der Kinder und Jugendlichen betroffen sind.","Mehr Jungen als Mädchen leiden an ADHS."],"loesungen":[0,2,3,4],"erklaerung":"Als richtig markiert sind der Prävalenzgipfel in der mittleren Kindheit, der abnehmende Symptomschweregrad im Jugendalter, die hohe Prävalenz von etwa 30% sowie die höhere Betroffenheit von Jungen. Die größere Variabilität der Informationsverarbeitung bei ADHS-Kindern ist zwar ebenfalls empirisch gut belegt, wird im Dokument aber nicht als angekreuzte Lösung geführt.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 101"},{"id":"skr-18","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 101","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Alzheimer-Demenz","typ":"multi","frage":"Welche der folgenden Aussagen zur Alzheimer Demenz sind (ist) korrekt?","optionen":["Das Alter der 3 Hauptgruppen von pflegenden Bezugspersonen („caregivers“) für Demenzpatienten ist zwischen 45-54, 55-64 und 65-84 Jahren.","Ältere Erwachsene mit 22 bis 26 Punkten auf dem Mini-Mental-Status-Test sind extrem pflegebedürftig.","Das größte Risiko für die Alzheimer Demenz stellt das Alter dar.","Ein schrumpfender medialer Temporallappen (insbesondere entorhinaler Kortex) ist ein Kennzeichen von Alzheimer Demenz.","Alzheimer Demenz tritt normalerweise zwischen dem 50. und 60. Lebensjahr auf."],"loesungen":[0,1,2,3],"erklaerung":"Als korrekt markiert sind die Altersspannen typischer pflegender Angehöriger, der Punktebereich 22-26 im Mini-Mental-Status-Test als Hinweis auf ausgeprägte Pflegebedürftigkeit, das Alter als stärkster Risikofaktor sowie die Schrumpfung des medialen Temporallappens als neuronales Kennzeichen. Ein typischer Beginn bereits zwischen dem 50. und 60. Lebensjahr widerspricht dagegen dem in der Regel deutlich späteren Erkrankungsalter.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 101"},{"id":"skr-20","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 102","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Aufmerksamkeit und auditorische Verarbeitung über die Lebensspanne","typ":"multi","frage":"Welche der folgenden Aussagen über die Interaktion zwischen Aufmerksamkeit und auditorischer Informationsverarbeitung über die Lebensspanne ist (sind) korrekt?","optionen":["Die Leistung von Kindern ist hauptsächlich durch ihre nicht ausgereifte Aufmerksamkeit limitiert.","Verglichen mit Kindern und älteren Erwachsenen reagieren junge Erwachsene am wenigsten auf Wahrnehmungshinweise (z.B. Hinweisreize, die angeben, den Fokus nach rechts, links oder beides zu lenken).","Verglichen mit jungen und älteren Erwachsenen sind Kinder flexibler in ihrer Aufmerksamkeitsausrichtung auf relevante Stimuli.","Die Leistung älterer Erwachsener ist hauptsächlich durch eine verschlechterte auditorische Wahrnehmung limitiert.","Verglichen mit jungen und älteren Erwachsenen ist die kindliche auditorische Informationsverarbeitung am wenigsten durch Veränderungen der Lautstärke des Stimulus beeinflusst."],"loesungen":[0,2,3],"erklaerung":"Bei Kindern begrenzt vor allem die noch unreife Aufmerksamkeitssteuerung die Verarbeitungsleistung, bei älteren Erwachsenen dagegen zusätzlich die nachlassende auditorische Wahrnehmung selbst. Kinder gelten hier nicht als flexibler, sondern eher als weniger flexibel in der Aufmerksamkeitsausrichtung als Erwachsene; die als markiert geführte Option zur Flexibilität bezieht sich auf den im Dokument angekreuzten, aus Sicht der Fachliteratur eher untypischen Befund, der dennoch als Lösung übernommen wird, weil er im Quelldokument so markiert ist.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 101-102"},{"id":"skr-22","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 102","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Hämmerer et al. (2011), Entwicklung der Belohnungsverarbeitung","typ":"multi","frage":"Die Verarbeitung von Belohnungsinformationen wurde in ihrer Entwicklung über die Lebensspanne in verschiedenen Stufen erforscht (z.B. Hämmerer et al., 2011). Welche der folgenden Aussagen dazu ist/sind korrekt?","optionen":["Evozierte Hirnpotentiale zeigen geringere Unterschiede nach Gewinnen und Verlusten bei älteren Erwachsenen im Vergleich zu Adoleszenten und Erwachsenen.","Evozierte Hirnpotentiale zeigen geringere Unterschiede nach Gewinnen und Verlusten bei Kindern im Vergleich zu Adoleszenten und jungen Erwachsenen.","Die Verarbeitung von Gewinnen und Verlusten ist im Alter eingeschränkt.","Evozierte Hirnpotentiale (die sogenannten feedback-related negativities) sind größer nach Gewinnen und Verlusten.","Bis zum mittleren Kindesalter (ca. 10 Jahren) ist bei der Verarbeitung von monetären Gewinnen und Verlusten der Reifestand von Erwachsenen erreicht."],"loesungen":[0,1,2],"erklaerung":"Sowohl bei Kindern als auch bei älteren Erwachsenen fallen die feedback-bezogenen Hirnpotentiale zur Unterscheidung von Gewinn und Verlust schwächer aus als bei Jugendlichen und jungen Erwachsenen, was für eine im Alter eingeschränkte Verarbeitung spricht. Die Aussage, feedback-related negativities seien generell größer, ist zu unspezifisch und wird nicht als Lösung geführt, und der Reifestand von Erwachsenen wird im mittleren Kindesalter noch nicht erreicht.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 102"},{"id":"skr-26","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 103","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Fluide und kristalline Intelligenz","typ":"multi","frage":"Welche der folgenden Aussagen zur Entwicklung der Intelligenz sind (ist) richtig?","optionen":["Die Dimensionen der Intelligenzstruktur verändern sich über die Lebensspanne.","Fluide Intelligenz bezieht sich auf elementare Informationsverarbeitungsprozesse.","Fluide Intelligenz ist stark kulturabhängig.","Kristalline Intelligenz zeigt eine stärkere Veränderung während des Alterungsprozesses auf als fluide Intelligenz.","Die Korrelation zwischen fluider Intelligenz und kristalliner Intelligenz ist in der Kindheit und im hohen Alter stärker als im jungen und mittleren Erwachsenenalter."],"loesungen":[0,1,4],"erklaerung":"Die Struktur der Intelligenz verändert sich über die Lebensspanne, fluide Intelligenz basiert auf grundlegenden, kulturunabhängigen Verarbeitungsprozessen, und fluide sowie kristalline Intelligenz korrelieren in Kindheit und hohem Alter stärker (Dedifferenzierung) als in der Lebensmitte. Fluide Intelligenz ist gerade nicht stark kulturabhängig, und im Alterungsprozess baut die fluide, nicht die kristalline Intelligenz stärker ab.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 103"},{"id":"skr-32","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 104","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Gedächtnisplastizität über die Lebensspanne","typ":"multi","frage":"Welche der folgenden Aussagen charakterisiert/charakterisieren die Entwicklung von Gedächtnisplastizität über die Lebensspanne?","optionen":["Erwachsene zeigen weniger Plastizität als Kinder.","Ältere Erwachsene zeigen weniger Plastizität als Kinder.","Kinder zeigen weniger Plastizität als junge Erwachsene.","Intensives Gedächtnistraining vergrößert den Leistungsunterschied zwischen Kindern und älteren Erwachsenen.","Intensives Gedächtnistraining reduziert den Leistungsunterschied zwischen jüngeren Erwachsenen und Kindern."],"loesungen":[0,1,2,4],"erklaerung":"Junge Erwachsene zeigen die höchste Gedächtnisplastizität, sowohl Kinder als auch ältere Erwachsene liegen darunter, weshalb Training den Abstand zwischen jüngeren Erwachsenen und Kindern eher verringert als vergrößert. Die Aussage, Training würde den Unterschied zwischen Kindern und älteren Erwachsenen vergrößern, ist nicht als Lösung markiert.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 104"},{"id":"skr-33","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 104","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Entwicklung von Gedächtnisstrategien","typ":"multi","frage":"Welche der folgenden Aussagen zu Gedächtnisstrategien stimmt/stimmen?","optionen":["Kinder können semantische Assoziationen zwischen Objekten herstellen, noch bevor sie diese Objekte nach Kategorien sortieren können.","Die „Phonologische Schleife“ (Phonological Loop), als ein Bestandteil des Arbeitsgedächtnismodells nach Alan Baddeley, ist relevant für Wiederholungsstrategien.","Ab etwa dem 10. Lebensjahr beginnen Kinder, aktiv Wiederholungsstrategien zu verwenden.","Etwa ab dem 4. Lebensjahr beginnen Kinder, aktiv externe Gedächtnishilfen zu verwenden.","Elaboration als Gedächtnisstrategie können Kinder erst am Ende der späten Kindheit verwenden."],"loesungen":[1,2,4],"erklaerung":"Die phonologische Schleife stützt artikulatorisches Wiederholen und ist damit Grundlage von Rehearsal-Strategien, die selbst aktiv erst ab etwa dem 10. Lebensjahr eingesetzt werden, während Elaboration als anspruchsvollste Strategie erst gegen Ende der späten Kindheit beherrscht wird. Semantische Assoziationen setzen in der Regel bereits vorhandene Kategorisierungsfähigkeit voraus statt ihr vorauszugehen, und externe Gedächtnishilfen werden nicht erst ab dem 4. Lebensjahr, sondern früher bzw. zu einem anderen im Dokument nicht bestätigten Zeitpunkt eingesetzt.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 104"},{"id":"skr-34","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 104","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Reifung von Hirnregionen","typ":"single","frage":"Welche der folgenden Aussagen über die Entwicklung der Hirnregionen sind (ist) korrekt?","optionen":["Der visuelle Kortex entwickelt sich früher als der Hippocampus.","Der parietale Kortex entwickelt sich später als der präfrontale Kortex.","Der präfrontale Kortex entwickelt sich später als der auditorische Kortex.","Der Hippocampus entwickelt sich später als der präfrontale Kortex.","Der parietale Kortex entwickelt sich später als der somatosensorische Kortex."],"loesung":2,"erklaerung":"Sensorische Areale wie der auditorische Kortex reifen früh, während der präfrontale Kortex zu den am spätesten ausreifenden Hirnregionen gehört und erst bis ins frühe Erwachsenenalter voll entwickelt ist. Die übrigen Optionen kehren dieses posterior-vor-anterior-Reifungsmuster fälschlich um.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 104"},{"id":"skr-35","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 105","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"ICD-10, Lese-Rechtschreibstörung","typ":"multi","frage":"Was ist/sind (ein) Kriterium/Kriterien für die Diagnose einer Lese-/Rechtschreibstörung nach ICD-10?","optionen":["Klare neurologische Beeinträchtigungen","IQ über 70","Lese- und/oder Rechtschreibleistungen liegen 2 Standardabweichungen unter dem Durchschnittsniveau, aber nicht wegen mangelnder Schulbildung.","Lese- und/oder Rechtschreibleistungen liegen 3 Standardabweichungen unter dem Durchschnittsniveau, aber nicht wegen des Alters.","Keine allgemeinen Beeinträchtigungen der Intelligenzleistung"],"loesungen":[1,2,4],"erklaerung":"Nach ICD-10 setzt die Diagnose einen IQ über 70, eine unerwartete Diskrepanz von mindestens zwei Standardabweichungen zur altersgemäßen Lese-/Rechtschreibleistung ohne Erklärung durch mangelnden Unterricht sowie das Fehlen allgemeiner intellektueller Beeinträchtigungen voraus. Klare neurologische Beeinträchtigungen sind kein Diagnosekriterium, und die geforderte Diskrepanz liegt bei zwei, nicht drei Standardabweichungen.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 105"},{"id":"skr-40","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 106","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Testing-the-Limits-Paradigma","typ":"multi","frage":"Welche der folgenden Aussagen zur Interventionsmethode „Test-the-Limits“ ist (oder sind) richtig?","optionen":["Unterschiedliche Personen können sich in ihrer Lernrate oder ihrer maximalen Leistung unterscheiden.","Die Altersunterschiede sind am Ende der „Test-the-Limits“ Intervention geringer als vor der Intervention.","Diese Interventionsmethode eignet sich auch zur Untersuchung von Altersunterschieden in der kognitiven Plastizität.","Die Altersunterschiede sind am Ende der „Test-the-Limits“ Intervention größer als vor der Intervention.","Die individuellen Unterschiede sind am Ende der „Test-the-Limits“ Intervention geringer als vor der Intervention."],"loesungen":[0,2,3,4],"erklaerung":"Testing-the-Limits macht interindividuelle Unterschiede in Lernrate und Maximalleistung sichtbar und eignet sich zur Untersuchung altersbezogener Unterschiede in kognitiver Plastizität; dabei vergrößern sich typischerweise die Altersunterschiede, während individuelle Unterschiede innerhalb einer Gruppe eher abnehmen, weil alle näher an ihr individuelles Limit herangeführt werden. Die gegenteilige Aussage, Altersunterschiede würden kleiner, ist damit nicht zutreffend.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 106"},{"id":"skr-42","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 106","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget, Assimilation und Akkomodation","typ":"matrix","frage":"Assimilation und Akkomodation sind zwei wichtige Konzepte in Piagets Theorie. Bitte ordnen Sie die Konzepte den entsprechenden Erklärungen zu.","spalten":["Assimilation","Akkomodation"],"zeilen":[{"text":"Eingliederung von neuen Informationen in bereits ausgearbeitete kognitive Strukturen","loesung":0},{"text":"Anpassung und Veränderung bestehender kognitiver Strukturen.","loesung":1}],"erklaerung":"Assimilation bezeichnet das Einordnen neuer Informationen in bereits vorhandene Schemata, Akkomodation die Anpassung dieser Schemata selbst, wenn die neue Information nicht dazu passt. Beide Prozesse zusammen treiben über Äquilibration die kognitive Entwicklung voran.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 106-107"},{"id":"skr-43","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 107","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Entwicklungspsychologische Testverfahren","typ":"matrix","frage":"Verschiedene Tests (oder Messmethoden) können verwendet werden, um die Entwicklung unterschiedlicher Verhaltensweisen bei Kindern zu bewerten. Bitte ordnen Sie die folgenden Tests dem entsprechenden Verhalten zu.","spalten":["Der Rouge-Test","Der Sally-Anne-Test","Der Fremde-Situations-Test","Der A-nicht-B-Test","Der Präferenzblick-Test"],"zeilen":[{"text":"Selbsterkennung im Spiegel","loesung":0},{"text":"Theory of Mind","loesung":1},{"text":"Bindungsverhalten","loesung":2},{"text":"Kognitive Fähigkeiten von Säuglingen","loesung":4},{"text":"Objektpermanenz","loesung":3}],"erklaerung":"Der Rouge-Test prüft Selbsterkennung im Spiegel, der Sally-Anne-Test die Theory of Mind, der Fremde-Situations-Test das Bindungsverhalten und der A-nicht-B-Test speziell das Verständnis von Objektpermanenz. Der Präferenzblick-Test dient allgemeiner zur Untersuchung früher kognitiver und perzeptueller Fähigkeiten von Säuglingen, für die kein spezifisches Zielkonstrukt wie Objektpermanenz vorausgesetzt wird.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 107"},{"id":"skr-46","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 107","vertrauen":"hoch","teil":"EP","thema":"Kognitive Entwicklung","modell":"Piaget, Stadien der kognitiven Entwicklung","typ":"matrix","frage":"Piagets Theorie der kognitiven Entwicklung besteht aus 4 Stufen. Bitte ordnen Sie die wichtigsten Entwicklungsaufgaben (bzw. Eigenschaften) den entsprechenden Phasen.","spalten":["Sensumotorische Phase","Präoperationale Phase","Formal-operationale Phase","Konkret-operationale Phase"],"zeilen":[{"text":"Objektpermanenz","loesung":0},{"text":"Zentrierung","loesung":1},{"text":"Hypothetisch-deduktives Denken","loesung":2},{"text":"Konservationsaufgaben","loesung":3}],"erklaerung":"In der sensumotorischen Phase erwirbt das Kind Objektpermanenz, in der präoperationalen Phase ist das Denken noch von Zentrierung geprägt, in der konkret-operationalen Phase werden Konservationsaufgaben gelöst, und in der formal-operationalen Phase wird hypothetisch-deduktives Denken möglich.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 107"},{"id":"ep-26","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Kohlberg (1976), Stufen des moralischen Urteils","typ":"matrix","stamm":"Im Heinz-Dilemma kann ein Mann ein lebensrettendes Medikament für seine schwer kranke Frau nicht bezahlen und erwägt, es zu stehlen. Kohlberg ordnet die Antworten nicht danach ein, ob der Diebstahl befürwortet oder abgelehnt wird, sondern danach, wie die Entscheidung begründet wird.","frage":"Ordnen Sie die folgenden Begründungen der Ebene des moralischen Urteils zu, der sie nach Kohlberg entsprechen. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Präkonventionelle Ebene","Konventionelle Ebene","Postkonventionelle Ebene"],"zeilen":[{"text":"'Er darf das Medikament nicht stehlen, sonst kommt er ins Gefängnis.'","loesung":0},{"text":"'Er sollte es stehlen, denn dann hat er seine Frau wieder, und sie kann ihm später auch einmal helfen.'","loesung":0},{"text":"'Er sollte es stehlen, denn ein guter Ehemann tut alles für seine Frau; sonst würden ihn alle für herzlos halten.'","loesung":1},{"text":"'Er darf es nicht stehlen, denn Gesetze gelten für alle; würde jeder sie brechen, gäbe es keine Ordnung mehr.'","loesung":1},{"text":"'Er sollte es stehlen, denn das Recht auf Leben wiegt schwerer als das Eigentumsrecht, unabhängig davon, was die Gesetze sagen.'","loesung":2},{"text":"'Man müsste das Gesetz ändern, denn eine Gesellschaft beruht auf gemeinsam vereinbarten Regeln, die im Interesse aller revidierbar bleiben müssen.'","loesung":2}],"erklaerung":"Das Ordnungskriterium ist die Bezugsgröße der Begründung. Auf der präkonventionellen Ebene liegt sie außerhalb der sozialen Ordnung: Strafvermeidung (Stufe 1) und der eigene Nutzen im Austausch (Stufe 2). Auf der konventionellen Ebene ist sie die soziale Ordnung selbst: die Erwartungen nahestehender Personen und das Bild vom guten Menschen (Stufe 3) sowie Gesetz und Systemerhalt (Stufe 4). Auf der postkonventionellen Ebene werden die Regeln selbst zum Gegenstand der Prüfung: der Gesellschaftsvertrag mit veränderbaren Regeln (Stufe 5) und universelle ethische Prinzipien, denen das Gesetz nachgeordnet wird (Stufe 6). Entscheidend ist, dass sowohl Zustimmung als auch Ablehnung des Diebstahls auf jeder Ebene begründbar sind - die Position selbst verrät die Stufe nicht. Zur Einordnung: Über Stufe 6 besteht in der Literatur keine Einigkeit; Kohlberg hat sie später aus dem Auswertungsmanual genommen, weil sie sich empirisch kaum nachweisen ließ. Die hier geprüfte Zuordnung zur postkonventionellen Ebene ist davon nicht betroffen."},{"id":"ep-27","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Kohlberg (1976); Gilligan (1982), Kritik am Gerechtigkeitsbias","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zu Kohlbergs Theorie und ihrer Kritik treffen zu?","aussagen":["Nach Kohlberg ist für die Einordnung nicht der Inhalt des moralischen Urteils entscheidend, sondern dessen Begründungsstruktur.","Die Stufen werden nach Kohlberg in fester Reihenfolge und ohne Überspringen durchlaufen; nicht jede Person erreicht dabei die höchste Stufe.","Gilligan kritisiert, dass Kohlbergs Modell an einer ausschließlich männlichen Stichprobe entwickelt wurde und eine an Fürsorge und Beziehungserhalt orientierte Moral systematisch niedriger einstuft.","Metaanalysen bestätigen durchgängig deutliche Geschlechtsunterschiede im Niveau des moralischen Urteils zugunsten der Jungen.","Aus der erreichten Stufe des moralischen Urteils lässt sich das tatsächliche moralische Handeln zuverlässig vorhersagen."],"optionen":["Die Aussagen (1), (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (3), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2), (3) und (5) treffen zu; die andere Aussage aber nicht."],"loesung":0,"aussagen_richtig":[0,1,2],"erklaerung":"Kohlbergs Modell ist ein Strukturmodell: Eingestuft wird die Begründung, nicht die vertretene Position, und die Stufenfolge gilt als invariant, unumkehrbar und nicht überspringbar, wobei die höheren Stufen nur von einem Teil der Personen erreicht werden. Damit sind (1) und (2) richtig. Gilligans Einwand richtet sich gegen die Stichprobe der Ursprungsstudie und gegen die Bevorzugung einer Gerechtigkeitsmoral vor einer Fürsorgemoral, die dadurch tendenziell auf Stufe 3 verortet werde - (3) gibt das korrekt wieder. Aussage (4) ist die verbreitete Fehlannahme über die Befundlage: Metaanalysen finden allenfalls geringe und inkonsistente Geschlechtsunterschiede, sodass Gilligans Kritik zwar als theoretische Erweiterung des Moralbegriffs fortwirkt, ihre empirische Kernthese aber nicht bestätigt ist. Aussage (5) überschätzt die Vorhersagekraft: Zwischen moralischem Urteil und moralischem Handeln besteht nur ein mäßiger Zusammenhang, weil Handeln zusätzlich von Situation, Motivation und Selbstregulation abhängt."},{"id":"ep-28","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Selman (1980), Stufen der sozialen Perspektivenübernahme","typ":"matrix","stamm":"Selman beschreibt die Entwicklung der sozialen Perspektivenübernahme in aufeinander aufbauenden Niveaus, die von der Nichtunterscheidung der eigenen und der fremden Sicht bis zur Einordnung von Perspektiven in gesellschaftliche Zusammenhänge reichen.","frage":"Ordnen Sie die folgenden Äußerungen von Kindern und Jugendlichen dem Niveau zu, das sie erkennen lassen. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Stufe 0: undifferenziert-egozentrisch","Stufe 1: differenziert-subjektiv","Stufe 2: selbstreflexiv-reziprok","Stufe 3: wechselseitig, Perspektive der dritten Person"],"zeilen":[{"text":"'Ich finde das Geschenk toll, also findet sie es auch toll.'","loesung":0},{"text":"'Ich habe Hunger, also hat der Kater bestimmt auch Hunger.'","loesung":0},{"text":"'Sie ist traurig, weil sie nicht weiß, dass ich ihr Buch nur ausgeliehen und nicht verloren habe.'","loesung":1},{"text":"'Ich weiß, dass sie glaubt, ich sei sauer auf sie - deshalb gehe ich zuerst auf sie zu.'","loesung":2},{"text":"'Von außen betrachtet stecken wir beide fest: Jeder wartet darauf, dass der andere den ersten Schritt macht.'","loesung":3}],"erklaerung":"Das Ordnungskriterium ist, wie viele Perspektiven gleichzeitig koordiniert werden. Auf Stufe 0 wird die eigene Sicht unbesehen auf andere übertragen - beide ersten Zeilen zeigen genau diesen Kurzschluss. Auf Stufe 1 wird erkannt, dass andere anders denken können, weil sie über anderes Wissen verfügen; das erklärt die Zeile zum ausgeliehenen Buch. Auf Stufe 2 kann die eigene Person aus der Sicht des anderen betrachtet werden, die Perspektiven werden also wechselseitig aufeinander bezogen, aber nacheinander. Auf Stufe 3 tritt eine Beobachterposition hinzu, von der aus die Beziehung als Ganzes betrachtet wird - kenntlich an der Formulierung 'von außen betrachtet'. Die häufigste Verwechslung betrifft Stufe 2 und 3: Das bloße Wissen darüber, was der andere über mich denkt, ist noch Stufe 2; erst der Blick auf das wechselseitige Verhältnis als Drittes ist Stufe 3. Altersangaben schwanken in der Literatur und sind als grobe Orientierung zu lesen."},{"id":"ep-29","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Erikson (1959/1973), psychosoziale Entwicklungskrisen","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zum Stufenmodell Eriksons treffen zu?","aussagen":["Im Grundschulalter steht nach Erikson die Krise Werksinn gegen Minderwertigkeitsgefühl im Mittelpunkt.","Im Jugendalter steht nach Erikson die Krise Identität gegen Identitäts- beziehungsweise Rollendiffusion im Mittelpunkt.","Krisen sind bei Erikson Störungen, deren Auftreten auf eine bereits misslungene Entwicklung hinweist.","Eine Krise gilt bei Erikson als gelöst, wenn der positive Pol vollständig ausgebildet und der negative Pol gar nicht vorhanden ist.","Erikson erweitert Freuds Modell um die soziale Dimension und um Stufen des Erwachsenenalters."],"optionen":["Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (4) treffen zu; alle anderen aber nicht."],"loesung":0,"aussagen_richtig":[0,1,4],"erklaerung":"Eriksons vierte Stufe fällt in das Schulalter und trägt den Konflikt Werksinn gegen Minderwertigkeitsgefühl: Das Kind erfährt in Schule und Gleichaltrigengruppe erstmals systematisch, ob sein Tun etwas bewirkt - deshalb ist Aussage (1) richtig. Die fünfte Stufe des Jugendalters trägt den Konflikt Identität gegen Rollendiffusion, Aussage (2) ist ebenfalls richtig. Aussage (5) benennt Eriksons Erweiterung gegenüber Freud korrekt: acht statt fünf Stufen, psychosoziale statt psychosexuelle Konflikte, Fortsetzung bis ins hohe Alter. Aussage (3) missdeutet den Krisenbegriff: Krise meint bei Erikson einen normativen Wendepunkt mit erhöhter Störanfälligkeit und erhöhtem Entwicklungspotenzial, nicht eine Fehlentwicklung. Aussage (4) missdeutet die Lösung: Angestrebt ist ein Überwiegen des positiven Pols, nicht dessen Alleinherrschaft - ein Mindestmaß an Misstrauen oder Zweifel ist funktional. Die Formulierungen der Stufennamen unterscheiden sich in deutschen Lehrbüchern; geprüft wird der Konfliktinhalt, nicht der Wortlaut."},{"id":"ep-30","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Marcia (1966), Identitätsstatus über Exploration und Commitment","typ":"matrix","stamm":"Marcia operationalisiert Eriksons Identitätskrise über zwei Merkmale: Exploration, also das aktive Erkunden und Abwägen von Alternativen, und Commitment, also die verbindliche Festlegung auf Ziele und Werte. Aus deren Kombination ergeben sich vier Identitätsstatus.","frage":"Ordnen Sie die folgenden Äußerungen von Jugendlichen dem jeweiligen Identitätsstatus zu. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Diffusion","Übernahme (Foreclosure)","Moratorium","Erarbeitete Identität (Achievement)"],"zeilen":[{"text":"'Ich werde Zahnärztin wie mein Vater. Etwas anderes stand nie zur Debatte, darüber habe ich nie nachgedacht.'","loesung":1},{"text":"'Ich mache gerade ein Praktikum nach dem anderen und weiß noch nicht, wo ich lande - aber ich bin dran und will es herausfinden.'","loesung":2},{"text":"'Nach viel Hin und Her, mehreren Praktika und einem Studienabbruch weiß ich jetzt, dass ich Lehrerin werden will, und dabei bleibe ich.'","loesung":3},{"text":"'Beruf? Keine Ahnung, interessiert mich auch nicht besonders. Irgendwas wird sich schon ergeben.'","loesung":0},{"text":"'Ich lebe nach den Werten der Gemeinde, in der ich aufgewachsen bin, und habe sie nie in Frage gestellt.'","loesung":1}],"erklaerung":"Die vier Status ergeben sich aus dem Kreuz der beiden Merkmale. Diffusion: weder Exploration noch Commitment - kenntlich an der Gleichgültigkeit in der vierten Zeile. Übernahme: Commitment ohne vorherige Exploration - die Festlegung wurde von Eltern oder Milieu übernommen, was beide entsprechenden Zeilen kennzeichnet. Moratorium: Exploration ohne Commitment - die Person sucht aktiv, hat sich aber noch nicht entschieden. Erarbeitete Identität: Commitment nach durchlaufener Exploration, wie in der dritten Zeile ausdrücklich geschildert. Die häufigste Verwechslung ist die von Übernahme und erarbeiteter Identität: Beide klingen entschieden und stabil, doch nur bei der erarbeiteten Identität ging eine eigene Auseinandersetzung voraus. Die Status sind keine feste Stufenfolge; Wechsel in beide Richtungen sind möglich."},{"id":"ep-31","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Harter (1999), Entwicklung des Selbstkonzepts; Shavelson et al. (1976), hierarchisches Selbstkonzeptmodell","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zur Entwicklung des Selbstkonzepts treffen zu?","aussagen":["Jüngere Kinder beschreiben sich vorwiegend über konkrete, beobachtbare Merkmale und einzelne Fertigkeiten.","Mit zunehmendem Alter wird das Selbstkonzept abstrakter, stärker psychologisch und zunehmend nach Bereichen differenziert.","Das Fähigkeitsselbstkonzept fällt vor der Einschulung typischerweise sehr hoch aus und wird im Verlauf der Grundschulzeit realistischer, weil soziale Vergleiche an Bedeutung gewinnen.","Das schulische Selbstkonzept ist ein einheitliches Globalmerkmal, das sich über die Fächer hinweg kaum unterscheidet.","Widersprüche zwischen den eigenen Selbstbeschreibungen in verschiedenen Situationen werden vor allem in der frühen Kindheit als belastend erlebt."],"optionen":["Die Aussagen (1) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (3), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht."],"loesung":1,"aussagen_richtig":[0,1,2],"erklaerung":"Die Entwicklung des Selbstkonzepts verläuft in drei gut belegten Richtungen, die in den Aussagen (1) bis (3) benannt sind: von konkret-beobachtbaren zu abstrakt-psychologischen Selbstbeschreibungen, von global zu bereichsspezifisch differenziert und von überhöht-optimistisch zu realistisch, sobald mit dem Schuleintritt soziale Vergleiche und Rückmeldungen regelmäßig verfügbar werden. Aussage (4) widerspricht direkt der Differenzierungsannahme und dem hierarchischen Modell: Schon im Grundschulalter unterscheiden Kinder etwa zwischen ihrem mathematischen und ihrem sprachlichen Selbstkonzept, und diese beiden hängen untereinander erstaunlich schwach zusammen. Aussage (5) verschiebt ein Phänomen um mehrere Jahre: Das Erleben widersprüchlicher Selbstbilder als belastend setzt voraus, dass die Widersprüche überhaupt bemerkt und aufeinander bezogen werden; es ist typisch für die frühe und mittlere Adoleszenz, nicht für die frühe Kindheit."},{"id":"ep-32","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Ekman & Friesen (1969), Darbietungsregeln; Entwicklung der Emotionsregulation","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zur emotionalen Entwicklung treffen zu?","aussagen":["Die Grundemotionen, darunter Freude, Ärger, Trauer, Angst, Überraschung und Ekel, gelten hinsichtlich Ausdruck und Erkennen als weitgehend universell.","Darbietungsregeln legen kulturell fest, welche Emotion in welcher Situation in welcher Intensität gezeigt werden darf.","Selbstbezogene Emotionen wie Scham, Schuld und Stolz setzen ein Selbstkonzept und Bewertungsmaßstäbe voraus und treten deshalb später auf als die Grundemotionen.","Kinder setzen Darbietungsregeln bereits im ersten Lebensjahr willentlich ein.","Im Verlauf der Entwicklung verschiebt sich die Emotionsregulation von der Regulation durch die Bezugsperson hin zu selbstständigen und zunehmend kognitiven Strategien."],"optionen":["Die Aussagen (1), (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2), (3) und (5) treffen zu; die andere Aussage aber nicht.","Die Aussagen (1) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (3), (4) und (5) treffen zu; alle anderen aber nicht."],"loesung":2,"aussagen_richtig":[0,1,2,4],"erklaerung":"Die emotionale Entwicklung folgt drei Linien, die in den Aussagen (1), (2), (3) und (5) zusammengefasst sind: Die Grundemotionen sind früh vorhanden und gelten als weitgehend universell, während die Darbietungsregeln für ihren Ausdruck kulturell erworben werden; die selbstbezogenen Emotionen setzen ein Selbstkonzept und Standards voraus und erscheinen daher erst im zweiten und dritten Lebensjahr; und die Regulation verlagert sich von der Fremdregulation durch die Bezugsperson zur Selbstregulation mit zunehmend kognitiven Mitteln wie Umbewertung. Aussage (4) ist der einzige Fehler und verlegt eine anspruchsvolle Leistung viel zu früh: Der willentliche Einsatz von Darbietungsregeln, etwa das freundliche Gesicht beim ungeliebten Geschenk, beginnt im Vorschulalter und wird über das Grundschulalter hinweg sicherer, weil er ein Wissen darüber voraussetzt, dass Ausdruck und Erleben auseinanderfallen können. Zur Einordnung: Die Universalitätsannahme für Grundemotionen wird in der neueren Emotionsforschung diskutiert; sie ist hier in der in Lehrbüchern und Prüfungen üblichen Form wiedergegeben."},{"id":"ep-33","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Gross (1998), Prozessmodell der Emotionsregulation","typ":"matrix","stamm":"Das Prozessmodell der Emotionsregulation ordnet Regulationsstrategien danach, an welcher Stelle des Emotionsverlaufs sie ansetzen: bei der Situation selbst, bei der Aufmerksamkeit, bei der Bewertung oder erst bei der bereits entstandenen Reaktion.","frage":"Ordnen Sie die folgenden Beispiele aus dem Schulalltag zu. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Situationsauswahl oder -veränderung","Aufmerksamkeitslenkung","Kognitive Umbewertung","Modulation der Reaktion (Ausdrucksunterdrückung)"],"zeilen":[{"text":"Jonas setzt sich vor der Klassenarbeit bewusst weit weg von dem Sitznachbarn, der ihn sonst nervös macht.","loesung":0},{"text":"Tom bittet die Lehrerin, die Gruppenarbeit in einem ruhigeren Nebenraum machen zu dürfen.","loesung":0},{"text":"Lea zählt während der mündlichen Prüfung im Kopf die Fenster, um nicht an ihre Angst zu denken.","loesung":1},{"text":"Mert sagt sich vor dem Referat: 'Das Kribbeln heißt, dass ich wach und bereit bin - das hilft mir.'","loesung":2},{"text":"Ida ist über ihre Note sehr enttäuscht, zeigt vor der Klasse aber ein gleichmütiges Gesicht.","loesung":3}],"erklaerung":"Das Ordnungskriterium ist der Zeitpunkt des Eingriffs im Emotionsverlauf. Situationsauswahl und -veränderung setzen am frühesten an: Die belastende Situation wird gemieden oder umgestaltet, wie beim Platzwechsel und beim Nebenraum. Aufmerksamkeitslenkung lässt die Situation bestehen und verschiebt den Fokus, etwa durch Ablenkung. Kognitive Umbewertung verändert die Deutung der Situation oder der eigenen Erregung, wie bei Merts Umdeutung des Lampenfiebers in Bereitschaft. Die Modulation der Reaktion greift erst ein, wenn die Emotion bereits entstanden ist, und betrifft meist den Ausdruck - Idas gleichmütiges Gesicht ist zugleich ein Beispiel für die Anwendung einer Darbietungsregel. Der Unterschied ist folgenreich: Frühe Strategien, besonders die Umbewertung, gelten als wirksamer und weniger belastend als die nachträgliche Ausdrucksunterdrückung, die das Erleben selbst kaum verändert."},{"id":"skr-04","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 98","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Soziometrische Statusgruppen (Peer-Nominierung)","typ":"single","frage":"Zur Betrachtung der sozialen Entwicklung werden Soziogramme verwendet. In welche Kategorie gehört jeweils ein Schüler, der sowohl sehr wenige positive als auch sehr wenige negative Nominierungen bekommen hat?","optionen":["Ignoriert","Abgelehnt","Durchschnittlich","Kontrovers","Beliebt"],"loesung":0,"erklaerung":"Kinder, die kaum positive und kaum negative Nominierungen erhalten, fallen ihren Mitschülern insgesamt kaum auf und werden deshalb als „ignoriert“ klassifiziert. Abgelehnte Kinder erhalten viele negative, beliebte Kinder viele positive Nominierungen, kontroverse Kinder sowohl viele positive als auch viele negative. Durchschnittlich beschreibt einen mittleren, nicht extrem niedrigen Wert auf beiden Dimensionen.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 98"},{"id":"skr-05","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 98","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Bandura (1993), Selbstwirksamkeit und Leistung","typ":"single","frage":"Das Fähigkeitsniveau interagiert mit Selbstwirksamkeit. Ein Artikel von Albert Bandura (Educational Psychologist, 1993) hat gezeigt, dass...","optionen":["der Einfluss der Selbstwirksamkeit auf die Leistung am stärksten bei einem hohen Fähigkeitsniveau ist.","die Selbstwirksamkeit keinen Einfluss auf die Leistung hat.","der Einfluss der Selbstwirksamkeit auf die Leistung am stärksten bei einem mittleren Fähigkeitsniveau ist.","der Einfluss der Selbstwirksamkeit auf die Leistung am stärksten bei einem niedrigen Fähigkeitsniveau ist.","die Selbstwirksamkeit bei allen Fähigkeitsniveaus den gleichen Einfluss auf die Leistung hat."],"loesung":3,"erklaerung":"Bandura zeigte, dass Selbstwirksamkeitsüberzeugungen die Leistung besonders dann beeinflussen, wenn objektiv wenig Fähigkeit vorhanden ist, weil hier Zuversicht und Anstrengungsbereitschaft über den Umgang mit Schwierigkeiten entscheiden. Bei hohem Fähigkeitsniveau reicht die Kompetenz meist unabhängig von der subjektiven Einschätzung aus, sodass der Zusatzeffekt der Selbstwirksamkeit geringer ausfällt. Die Annahme eines fehlenden oder überall gleichen Einflusses widerspricht dem zentralen Befund des Artikels.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 98"},{"id":"skr-12","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 100","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Einsamkeit über die Lebensspanne","typ":"single","frage":"Welche der folgenden Aussagen über die Veränderung der emotionalen Belastung über die Lebensspanne aufgrund von Einsamkeit ist korrekt?","optionen":["Diese Form der emotionalen Belastung ist sehr hoch sowohl im Jugendalter und im älteren Erwachsenenalter.","Diese Form der emotionalen Belastung ist im mittleren Erwachsenenalter am höchsten.","Diese Form der emotionalen Belastung ist im jüngeren Erwachsenenalter am höchsten.","Diese Form der emotionalen Belastung ist im älteren Erwachsenenalter am höchsten.","Diese Form der emotionalen Belastung ist im Jugendalter am höchsten."],"loesung":2,"erklaerung":"Studien zur subjektiven Belastung durch Einsamkeit zeigen, dass jüngere Erwachsene Einsamkeit am stärksten als emotional belastend erleben, während ältere Erwachsene trotz teils objektiv kleinerer Netzwerke besser damit umgehen können. Die übrigen Optionen verorten das Maximum an einem falschen Lebensabschnitt.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 100"},{"id":"skr-15","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 100","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Kübler-Ross (1975), Stufentheorie des Sterbens","typ":"single","frage":"Welche der folgenden Antworten beschreibt die Stufen der Stufentheorie des Sterbens nach Kübler-Ross (1975) in der richtigen Reihenfolge?","optionen":["Niedergeschlagenheit → Nichtwahrhabenwollen → Zorn → Verhandeln → Zustimmung","Nichtwahrhabenwollen → Zorn → Verhandeln → Niedergeschlagenheit → Zustimmung","Nichtwahrhabenwollen → Zorn → Niedergeschlagenheit → Verhandeln → Zustimmung","Zorn → Nichtwahrhabenwollen → Verhandeln → Niedergeschlagenheit → Zustimmung","Zorn → Nichtwahrhabenwollen → Niedergeschlagenheit → Verhandeln → Zustimmung"],"loesung":1,"erklaerung":"Kübler-Ross beschreibt den Sterbeprozess als Abfolge von Nichtwahrhabenwollen (Verleugnung), Zorn, Verhandeln, Niedergeschlagenheit (Depression) und schließlich Zustimmung (Akzeptanz). Die übrigen Optionen vertauschen die Reihenfolge der mittleren Stufen.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 100"},{"id":"skr-16","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 101","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Soziale Netzwerke über die Lebensspanne (sozioemotionale Selektivität)","typ":"single","frage":"Welche der folgenden Aussagen zur Veränderung der sozialen Beziehungen über die Lebensspanne ist korrekt?","optionen":["Die subjektiv wahrgenommene Belastung durch Einsamkeit ist im Alter am stärksten.","Mit zunehmendem Alter sinkt die Anzahl von weniger nahestehenden Netzwerkpartnern am wenigsten.","Die altersbezogene Abnahme von sozialen Netzwerken ist generell unabhängig von den Arten der Beziehungen.","Mit zunehmendem Alter sinkt die Anzahl von nahestehenden Netzwerkpartnern am meisten.","Die Anzahl sehr nahestehender Personen bleibt über die Lebensspanne relativ konstant."],"loesung":4,"erklaerung":"Nach der sozioemotionalen Selektivitätstheorie ziehen sich ältere Menschen gezielt aus weniger engen Kontakten zurück, während der engste Kern nahestehender Beziehungen über die Lebensspanne weitgehend erhalten bleibt. Die Abnahme betrifft also vor allem periphere, nicht die engsten Kontakte, und ist nicht unabhängig von der Beziehungsart, wie die anderen Optionen unterstellen.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 101"},{"id":"skr-19","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 101","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Fortner & Neimeyer (1999), Todesangst im Alter","typ":"multi","frage":"Welche der folgenden Faktoren korreliert (korrelieren) positiv mit der Angst vor dem Tod im älteren Erwachsenenalter? (Nach einer Metaanalyse von Fortner & Neimeyer, 1999)","optionen":["Alter","Psychische Probleme","Geschlecht","Institutionalisierung","Positives Befinden"],"loesungen":[1,2,3],"erklaerung":"Psychische Probleme, das Geschlecht (Frauen berichten im Mittel höhere Todesangst) und Institutionalisierung hängen laut der Metaanalyse positiv mit Todesangst zusammen. Das Alter selbst zeigt entgegen der Intuition keinen durchgängig positiven Zusammenhang, und positives Befinden korreliert naturgemäß negativ statt positiv mit Todesangst.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 101"},{"id":"skr-21","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 102","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Belohnungsaufschub und Selbstkontrolle (Marshmallow-Test)","typ":"multi","frage":"Die Fähigkeit zum Belohnungsaufschub ist wichtig für die Entwicklung von Selbstkontrolle. Welche der folgenden Aussagen zu dieser Fähigkeit ist/sind richtig?","optionen":["Wenn Kinder den Hinweis bekommen, dass sie an ein interessantes Spiel statt an die Belohnung denken sollen, können sie länger auf die Belohnung warten, als wenn sie nicht an etwas Ablenkendes denken.","Die Fähigkeit zum Belohnungsaufschub hängt zum Teil von der Entwicklung des präfrontalen Kortex ab.","Aufmerksamkeit und Belohnungsaufschub haben nichts miteinander zu tun.","Die meisten Kinder unter 2,5 Jahren können schon den sogenannten „Marshmallow-Test“ bestehen.","Wenn Kinder keine Hinweise bekommen, dass sie an etwas anderes denken sollen, können sie länger auf die Belohnung warten, wenn diese abgedeckt ist, als wenn sie offen liegt."],"loesungen":[0,1,4],"erklaerung":"Ablenkung von der Belohnung, sei es durch gezielte gedankliche Umlenkung oder durch das Abdecken der Belohnung, verlängert die Wartezeit, und die Fähigkeit dazu reift mit dem präfrontalen Kortex. Aufmerksamkeitskontrolle ist damit zentral für den Belohnungsaufschub statt irrelevant, und der Marshmallow-Test gelingt erst deutlich später als im Alter von 2,5 Jahren zuverlässig.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 102"},{"id":"skr-24","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 102","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Emotionale Entwicklung über die Lebensspanne","typ":"multi","frage":"Welche der folgenden Aussagen der emotionalen Entwicklung sind (ist) korrekt?","optionen":["Die Fähigkeit Freude zu erkennen entwickelt sich früher in der Kindheit als die Fähigkeit Traurigkeit zu erkennen.","Im Vergleich zu jüngeren Erwachsenen fühlen sich ältere Erwachsene bei Einsamkeit weniger gestresst.","Kinder fühlen sich bei Einsamkeit gestresster als jüngere Erwachsene.","Das Kompetenzgefühl ist am höchsten im mittleren Erwachsenenalter.","Die negative Emotionalität steigt bei Erwachsenen mit zunehmendem Alter."],"loesungen":[0,1],"erklaerung":"Freude wird von Kindern entwicklungspsychologisch früher zuverlässig erkannt als Traurigkeit, und ältere Erwachsene berichten bei Einsamkeit geringere subjektive Belastung als jüngere Erwachsene, was zur besseren Emotionsregulation im Alter passt. Die übrigen Aussagen zu Kindern, Kompetenzgefühl und negativer Emotionalität sind nicht als Lösung markiert.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 102-103"},{"id":"skr-31","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 104","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Erikson, Stufenmodell der psychosozialen Entwicklung","typ":"multi","frage":"Welche der folgenden Aussagen zu Erik Eriksons Stufenmodell der psychosozialen Entwicklung treffen (trifft) zu?","optionen":["Die Theorie hat den Entwicklungsverlauf über die Lebensspanne in 16 Phasen eingeteilt.","Die Theorie ist ein Beispiel für die Annahme einer kontinuierlichen Entwicklung.","Die erste Phase „Vertrauen vs. Misstrauen“ ist im Alter von ca. 1,5 Jahren abgeschlossen.","Jede Phase ist durch einen bestimmten Konflikt gekennzeichnet, an dessen Bewältigung das Individuum wachsen kann.","Die Phase „Identität vs. Rollendiffusion“ findet während der Adoleszenz statt."],"loesungen":[2,3,4],"erklaerung":"Erikson beschreibt acht (nicht 16) Phasen, von denen die erste, Vertrauen vs. Misstrauen, im Säuglingsalter bis etwa 1,5 Jahre abgeschlossen ist; jede Phase ist durch einen altersspezifischen Konflikt gekennzeichnet, dessen Bewältigung Entwicklung ermöglicht, und Identität vs. Rollendiffusion fällt in die Adoleszenz. Da die Stufen aufeinander aufbauende, qualitativ unterschiedliche Krisen darstellen, gilt das Modell als stufenförmig-diskontinuierlich, nicht als Beispiel für kontinuierliche Entwicklung.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 104"},{"id":"skr-36","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 105","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklu
