ng","modell":"Berridge & Robinson, „Liking“ und „Wanting“","typ":"single","frage":"Welche der folgenden Aussagen über zwei Aspekte der Motivation, nämlich „Mögen“ und „Wollen“, ist (sind) korrekt?","optionen":["Wollen betrifft angeborene Reaktionen auf elementare Anreize (z.B. Nahrung).","Mögen betrifft motivationale Ausdrücke, die Menschen mit anderen Tierarten teilen.","Mögen basiert auf komplexeren Prozessen als Wollen.","Wollen betrifft die erlernte Bewertung der hedonistischen Eigenschaften der Belohnung oder Bestrafung.","Lernerfahrungen haben mehr Einfluss auf das Wollen als auf das Mögen."],"loesung":4,"erklaerung":"Nach dem „Liking“-„Wanting“-Modell von Berridge und Robinson ist das motivationale „Wollen“ stärker durch Lern- und Konditionierungsprozesse formbar als das affektive „Mögen“, das stärker auf angeborenen hedonistischen Reaktionen beruht. Die übrigen Optionen vertauschen die den beiden Prozessen zugeschriebenen Eigenschaften.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 105"},{"id":"skr-37","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 105","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Neuronale Netzwerke der Motivationsregulation","typ":"multi","frage":"Verschiedene Hirnnetzwerke sind bei der Regulierung motivationaler Prozesse wichtig. Welche der folgenden Aussagen dazu sind (ist) korrekt?","optionen":["Der orbitofrontale Kortex reguliert emotionale Bewertungen von Belohnungs- und Bestrafungssignalen.","Die Amygdala reguliert emotionale Reaktionen (wie z.B. Angst und Furcht).","Der orbitofrontale Kortex reguliert direkt die Einstellung der Belohnungs- und Bestrafungssignale.","Dopaminausschüttung im Nucleus Accumbens führt zu Festigung zielgerichteten Verhaltens (Wollen) und hat wenig Einfluss auf hedonistische Bewertung des Anreizes (Mögen).","Der präfrontale Kortex signalisiert emotionale Reaktionen direkt."],"loesungen":[0,1,3],"erklaerung":"Der orbitofrontale Kortex bewertet Belohnungs- und Bestrafungssignale emotional, die Amygdala reguliert Furcht- und Angstreaktionen, und dopaminerge Aktivität im Nucleus Accumbens stärkt vor allem das zielgerichtete „Wollen“ mit vergleichsweise geringem Einfluss auf das hedonistische „Mögen“. Eine direkte Regulation der Signal-Einstellung durch den orbitofrontalen Kortex sowie eine direkte emotionale Signalgebung durch den präfrontalen Kortex sind zu unspezifisch formuliert und nicht als Lösung markiert.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 105"},{"id":"skr-39","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 106","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Deci & Ryan (1985), Selbstbestimmungstheorie, Regulationsformen","typ":"multi","frage":"Nach der Selbstbestimmungstheorie der Motivation (Deci & Ryan, 1985) können die Arten der Regulation der extrinsischen Motivation in vier Kategorien eingeteilt werden. Welche der folgenden Aussagen dazu stimmt/stimmen?","optionen":["Ein Kind verwendet identifizierte Regulation, wenn es externale Einflüsse als eigene Ziele akzeptiert.","Ein Kind verwendet introjizierte Regulation, wenn es externale Faktoren verinnerlicht, ohne sich jedoch mit ihnen zu identifizieren.","Ein Kind verwendet identifizierte Regulation, wenn es bestimmte externale Ziele vollständig in seinem eigenen Selbstkonzept integriert.","Ein Kind verwendet externe Regulation, wenn es eine Handlung ausführt, um eine Bestrafung zu vermeiden.","Autonomie hilft bei der Transformation von identifizierter Regulation der extrinsischen Motivation zu intrinsischer Motivation."],"loesungen":[1,3],"erklaerung":"Introjizierte Regulation liegt vor, wenn äußere Vorgaben verinnerlicht, aber nicht wirklich als eigen akzeptiert werden (z.B. aus Schuld- oder Schamvermeidung), während externe Regulation Verhalten beschreibt, das rein zur Vermeidung von Strafe oder für Belohnung gezeigt wird. Identifizierte Regulation bedeutet, ein externes Ziel als für sich selbst wertvoll zu akzeptieren, ohne es zwingend vollständig ins Selbstkonzept zu integrieren – das wäre bereits die noch weiterreichende integrierte Regulation; die Aussage zur Autonomie als Transformationshilfe ist im Dokument nicht als Lösung geführt.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 105-106"},{"id":"skr-41","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 106","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Wohlbefindensparadoxon im Alter","typ":"multi","frage":"Das Wohlbefindensparadoxon besagt, dass Menschen im hohen Erwachsenenalter trotz physischer Einschränkungen ein hohes Maß an Wohlbefinden aufrechterhalten. Wie lässt sich das erklären?","optionen":["Im Alter ist Emotionsregulation eine stärkere Zielkategorie als Wissenserwerb.","Bewältigungsprozesse durch soziale Abwärtsvergleiche finden statt.","Die Suche nach Information und Wissenserwerb nimmt zu.","Im Alter werden motivationale Konflikte weniger.","Es werden verstärkt Strategien der primären Kontrolle angewendet."],"loesungen":[0,1,3],"erklaerung":"Das Paradoxon erklärt sich unter anderem dadurch, dass im Alter emotionale Ziele gegenüber Wissenserwerb an Priorität gewinnen, soziale Abwärtsvergleiche das subjektive Befinden stützen und motivationale Zielkonflikte insgesamt abnehmen. Ein zunehmender Fokus auf Informationssuche sowie verstärkter Einsatz primärer (statt sekundärer) Kontrollstrategien passen nicht zu diesem Erklärungsmuster und sind nicht als Lösung markiert.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 106"},{"id":"skr-45","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 107","vertrauen":"hoch","teil":"EP","thema":"Moralische und sozial-emotionale Entwicklung","modell":"Formen des sozialen Lernens (Imitation, Emulation, Mimikry, Aufmerksamkeitslenkung)","typ":"matrix","frage":"Es gibt vier Hauptformen des sozialen Lernens. Bitte ordnen Sie die verschiedenen Lernformen den entsprechenden Beispielen zu.","spalten":["Emulationslernen","Aufmerksamkeitslenkung","Imitation","Mimikry"],"zeilen":[{"text":"Ein Kind schiebt einen Spielzeugrasenmäher auf dem Rasen, ohne die Funktion eines Rasenmähers zu kennen","loesung":0},{"text":"Ein Baby folgt der Kopfbewegung der Mutter und dreht sich in Richtung der offenen Tür","loesung":1},{"text":"Ein Kind gibt vor, das Abendessen auf einem Spielzeugofen zu kochen","loesung":2},{"text":"Junge Säuglinge reproduzieren unreflektiert die einfachen Verhaltensweisen, die sie sehen","loesung":3}],"erklaerung":"Emulationslernen bezeichnet das Nachahmen eines beobachteten Effekts ohne Verständnis der zugrundeliegenden Handlung, Aufmerksamkeitslenkung das Ausrichten der eigenen Aufmerksamkeit auf denselben Reiz wie ein Modell, Imitation die zielgerichtete Nachahmung einer verstandenen Handlung, und Mimikry die unreflektierte, rein motorische Nachahmung einfacher Bewegungen bei jungen Säuglingen.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 107"}];

}
applyTheme();

};

const app = $("#app"), footslot = $("#footslot"), titleEl = $("#title"), btnBack = $("#btnBack"), pbar = $("#pbar");

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const BUCHST = "abcdefghijklmn";

function themenMap(pool){
  const m = new Map();
  pool.forEach(f => {
    const k = f.thema || "Allgemein";
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(f);
  });
  return m;
}

function bewerte(f, ans){
  if(ans==null) return {status:"leer", rz:0, gz:0};
  if(f.typ==="matrix"){
    const gz = f.zeilen.length;
    let rz = 0;
    f.zeilen.forEach((z,i)=>{ if(ans[i]===z.loesung) rz++; });
    return {status: rz===gz ? "ok" : (rz===0 ? "bad" : "part"), rz, gz};
  }
  if(f.typ==="multi"){
    const soll = (f.loesungen||[]).slice().sort().join(",");
    const ist = (ans||[]).slice().sort().join(",");
    const gz = (f.optionen||[]).length;
    let rz = 0;
    for(let i=0;i<gz;i++){
      const s = (f.loesungen||[]).includes(i), a = (ans||[]).includes(i);
      if(s===a) rz++;
    }
    return {status: soll===ist ? "ok" : (rz>gz/2 ? "part" : "bad"), rz, gz};
  }
  return {status: ans===f.loesung ? "ok" : "bad", rz: ans===f.loesung?1:0, gz:1};
}

function istBeantwortet(f, ans){
  if(ans==null) return false;
  if(f.typ==="matrix") return ans.some(x=>x!=null);
  if(f.typ==="multi") return ans.length>0;
  return true;
}

let view = "start";
let S = null;

function setTitle(t, sub){
  titleEl.innerHTML = esc(t) + (sub?' <span class="sub">'+esc(sub)+'</span>':'');
}
function setProgress(p){ pbar.style.width = Math.max(0,Math.min(100,p*100)) + "%"; }

function go(v, opts){
  view = v; window.scrollTo(0,0);
  if(v==="start") renderStart();
  else if(v==="training-menu") renderTrainingMenu();
  else if(v==="klausur-setup") renderKlausurSetup();
  else if(v==="frage") renderFrage();
  else if(v==="ergebnis") renderErgebnis();
  else if(v==="statistik") renderStatistik();
}
btnBack.onclick = ()=>{
  if(view==="frage" && S && S.modus==="klausur" && !S.abgegeben){
    if(!confirm("Klausursimulation abbrechen?")) return;
  }
  S = null; go("start");
};

/* Startseite */
function renderStart(){
  btnBack.hidden = true; footslot.innerHTML = ""; setProgress(0);
  setTitle("Staatsexamen", "Pädagogische Psychologie");

  const ges = FRAGEN.length;
  const geuebt = Object.keys(store.fortschritt).filter(id=>store.fortschritt[id].v>0).length;
  const offeneFehler = FRAGEN.filter(f=>{ const p=store.fortschritt[f.id]; return p && p.v>0 && p.last===false; }).length;

  app.innerHTML = `
  <div class="stats">
    <div class="stat"><b>${ges}</b><span>Fragen im Pool</span></div>
    <div class="stat"><b>${geuebt}</b><span>Bearbeitet</span></div>
    <div class="stat"><b style="color:${offeneFehler?'var(--bad)':'inherit'}">${offeneFehler}</b><span>Fehler</span></div>
  </div>

  <button class="mode" onclick="go('klausur-setup')">
    <b>Klausur simulieren</b>
    <span>16 Originalaufgaben im Quotenmix (Teil I, Teil II, Entwicklungspsychologie). Auswertung erst nach Abgabe inklusive Notenberechnung nach SBA-Schlüssel.</span>
  </button>

  <button class="mode" onclick="go('training-menu')">
    <b>Training</b>
    <span>Gezieltes Üben nach Themengebiet oder alle 300+ Aufgaben im Durchlauf. Mit kurzen Denkanstößen und vollständigen, detaillierten Musterlösungen.</span>
  </button>

  <button class="mode" onclick="startFehler()" ${offeneFehler?"":"disabled"}>
    <b>Fehler wiederholen</b>
    <span>${offeneFehler ? offeneFehler+" zuletzt falsch beantwortete Aufgabe(n) gezielt trainieren." : "Aktuell keine ungelösten Fehler im Speicher."}</span>
  </button>

  <button class="mode" onclick="go('statistik')">
    <b>Wo ich stehe</b>
    <span>Beherrschungsgrad und Trefferquoten aufgeschlüsselt nach Vorlesungskapiteln.</span>
  </button>
  `;
}

/* Training Menu (Themenauswahl) */
function renderTrainingMenu(){
  btnBack.hidden = false; footslot.innerHTML = ""; setProgress(0);
  setTitle("Training", "Themenauswahl");

  let html = `
  <button class="btn wide" style="margin-bottom:14px" onclick="startUebung('alle', 'Alle Themen (Vollpool)')">Alle ${FRAGEN.length} Aufgaben trainieren</button>
  <div class="card" style="padding:6px 14px">
  `;

  const m = themenMap(FRAGEN);
  [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],"de")).forEach(([thema, list])=>{
    let s=0, n=0;
    list.forEach(f=>{ const p=store.fortschritt[f.id]; if(p&&p.v>0){ n++; if(p.last) s++; } });
    const pct = n ? Math.round(s/n*100) : 0;
    html += `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer;" onclick="startUebung('${esc(thema)}')">
      <div style="font-weight:600; font-size:14px">${esc(thema)}</div>
      <div style="display:flex; align-items:center; gap:8px">
        <span style="font-size:12px; color:var(--text-faint)">${n ? pct+'%' : ''} (${list.length})</span>
        <span style="font-size:12px">›</span>
      </div>
    </div>`;
  });
  html += `</div>`;
  app.innerHTML = html;
}

/* Klausur-Setup */
function renderKlausurSetup(){
  btnBack.hidden = false; footslot.innerHTML = ""; setProgress(0);
  setTitle("Klausursimulation");

  app.innerHTML = `
  <div class="card">
    <p style="font-size:14px; color:var(--text-dim); margin-bottom:14px">
      Entsprechend dem Prüfungsschlüssel der Sächsischen Bildungsagentur (SBA) besteht die Klausur aus 16 Aufgaben mit standardisierter Quotenverteilung:
      <strong>7 Aufgaben aus Teil I</strong>, <strong>6 Aufgaben aus Teil II</strong> und <strong>3 Aufgaben aus der Entwicklungspsychologie</strong>.
    </p>

    <label class="fld"><span>Aufgabenpool</span>
      <select id="selWahl">
        <option value="mix" selected>Prüfungsfokus: Belegte Altklausuren & Originalprüfungen</option>
        <option value="alle">Gesamter Fragenpool (inkl. Seminare & Übungen)</option>
        <option value="schwach">Schwerpunkt auf meinen bisherigen Fehlern</option>
      </select>
    </label>

    <div style="margin-top:20px">
      <button class="btn wide" onclick="startKlausur()">Klausur jetzt starten (16 Aufgaben)</button>
    </div>
  </div>`;
}

function startKlausur(){
  const wahl = $("#selWahl").value;
  let pool = FRAGEN.slice();
  if(wahl==="schwach"){
    pool.sort((a,b)=>{
      const pa = store.fortschritt[a.id], pb = store.fortschritt[b.id];
      const fa = (pa && pa.v && !pa.last) ? 1 : 0;
      const fb = (pb && pb.v && !pb.last) ? 1 : 0;
      return fb - fa;
    });
  }

  const pI = shuffle(pool.filter(f=>f.teil==="I")).slice(0, 7);
  const pII = shuffle(pool.filter(f=>f.teil==="II")).slice(0, 6);
  const pEP = shuffle(pool.filter(f=>f.teil==="EP")).slice(0, 3);

  const finalPool = shuffle([...pI, ...pII, ...pEP]);
  neueSitzung("klausur", finalPool, "Klausursimulation");
}

function startUebung(thema, customLabel){
  let list = [];
  if(thema==="alle") list = shuffle(FRAGEN);
  else list = shuffle(FRAGEN.filter(f=>(f.thema||"Allgemein")===thema));

  neueSitzung("training", list, customLabel || thema);
}

function startFehler(){
  const list = shuffle(FRAGEN.filter(f=>{ const p=store.fortschritt[f.id]; return p && p.v>0 && p.last===false; }));
  if(!list.length) return;
  neueSitzung("training", list, "Fehler wiederholen");
}

function neueSitzung(modus, liste, label){
  S = {
    modus, label,
    q: liste,
    i: 0,
    ans: liste.map(f => f.typ==="matrix" ? f.zeilen.map(()=>null) : (f.typ==="multi" ? [] : null)),
    gezeigt: liste.map(()=>false),
    abgegeben: false
  };
  go("frage");
}

/* Aufgabenansicht */
function renderFrage(){
  const f = S.q[S.i], ans = S.ans[S.i];
  const zeigen = S.gezeigt[S.i] || S.abgegeben;
  btnBack.hidden = false;
  setTitle(S.modus==="klausur" ? "Klausur" : "Training", `Aufgabe ${S.i+1} von ${S.q.length}`);
  setProgress((S.i+1)/S.q.length);

  let html = `
  <div class="tags">
    <span class="tag">${esc(f.thema||"")}</span>
    ${f.modell?`<span class="tag">${esc(f.modell)}</span>`:""}
    <span class="tag q-${esc(f.vertrauen||'mittel')}">${f.vertrauen==='hoch'?'belegt':'abgeleitet'}</span>
  </div>`;

  if(f.stamm){
    html += `<div class="stamm">${esc(f.stamm)}</div>`;
  }

  html += `<div class="frage">${esc(f.frage)}</div>`;

  if(f.typ==="mc-kombi"){
    html += `<ul class="aussagen">`;
    const kennt = Array.isArray(f.aussagen_richtig);
    (f.aussagen||[]).forEach((a,i)=>{
      let cls = "";
      if(zeigen && kennt) cls = f.aussagen_richtig.includes(i) ? "mark-ok" : "mark-no";
      html += `<li class="${cls}">${esc(a)}</li>`;
    });
    html += `</ul>` + optionenHtml(f, ans, zeigen);
  } else if(f.typ==="single" || f.typ==="multi"){
    html += optionenHtml(f, ans, zeigen);
  } else if(f.typ==="matrix"){
    html += `
    <div class="matrix-box">
      <table class="m-table">
        <thead><tr><th>Item / Sachverhalt</th>${f.spalten.map(c=>`<th class="center">${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>
          ${f.zeilen.map((z,ri)=>{
            let rcls = "";
            if(zeigen){
              if(ans[ri]==null) rcls = "r-bad";
              else rcls = ans[ri]===z.loesung ? "r-ok" : "r-bad";
            }
            return `
            <tr class="${rcls}">
              <td>${esc(z.text)}</td>${f.spalten.map((c,ci)=>`
                <td class="center">
                  <input type="radio" name="m_${S.i}_${ri}" value="${ci}" onchange="setMAns(${ri},${ci})" ${ans[ri]===ci?'checked':''} ${zeigen?'disabled':''}>
                </td>
              `).join("")}
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
  }

  // Kurzer Denkanstoß (ohne Lösung zu spoilern)
  const kurzerTipp = f.hint || (f.modell ? `Konzentriere dich auf die Kernaussage von: ${f.modell}.` : "Analysiere die Bedingungen im Fallbeispiel genau.");
  html += `
  <div class="inline-hint" id="hintBox">💡 <strong>Denkimpuls:</strong> ${esc(kurzerTipp)}</div>
  `;

  if(zeigen) html += revealHtml(f, ans);

  app.innerHTML = html;

  /* Klicks Optionen */
  app.querySelectorAll(".opt:not(.locked)").forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.i;
      if(f.typ==="multi"){
        const a = S.ans[S.i] || [];
        const k = a.indexOf(i);
        if(k>=0) a.splice(k,1); else a.push(i);
        S.ans[S.i] = a;
      } else {
        S.ans[S.i] = i;
      }
      renderFrage();
    };
  });

  renderFoot();
}

function setMAns(ri, ci){
  if(!Array.isArray(S.ans[S.i])) S.ans[S.i] = [];
  S.ans[S.i][ri] = ci;
  renderFoot();
}

function optionenHtml(f, ans, zeigen){
  let html = `<div class="opts">`;
  (f.optionen||[]).forEach((o,i)=>{
    const sel = f.typ==="multi" ? (ans||[]).includes(i) : ans===i;
    let c = "opt", key = BUCHST[i]||(i+1);
    if(!zeigen){
      if(sel) c += " sel";
    } else {
      const soll = f.typ==="multi" ? (f.loesungen||[]).includes(i) : f.loesung===i;
      c += " locked";
      if(soll && sel){ c += " right"; key = "✓"; }
      else if(soll && !sel){ c += " right"; key = "✓"; }
      else if(!soll && sel){ c += " wrong"; key = "✗"; }
    }
    html += `
    <button class="${c}" data-i="${i}">
      <span class="key">${key}</span>
      <span>${esc(o)}</span>
    </button>`;
  });
  return html + `</div>`;
}

/* Detaillierte Musterlösung */
function revealHtml(f, ans){
  const b = bewerte(f, ans);
  let cls = "neutral", lbl = "Nicht beantwortet";
  if(istBeantwortet(f, ans)){
    cls = b.status==="ok" ? "ok" : "bad";
    lbl = b.status==="ok" ? "✓ Vollständig Richtig" : (b.status==="part" ? `Teilweise Richtig (${b.rz}/${b.gz})` : "✗ Nicht zutreffend");
  }

  let src = [];
  if(f.quelle) src.push("Klausur: " + esc(f.quelle));
  if(f.folie) src.push("Folie: " + esc(f.folie));

  return `
  <div class="reveal ${cls}">
    <b class="verdict">${lbl}</b>
    <div class="exp-text"><strong>Musterlösung & Fachliche Begründung:</strong><br>${esc(f.erklaerung || "Keine ausführliche Erklärung hinterlegt.")}</div>
    ${src.length ? `<div class="src-box">📌 ${src.join(" · ")}</div>` : ""}
  </div>`;
}

function aufloesen(){
  if(!S.gezeigt[S.i]){
    S.gezeigt[S.i] = true;
    const b = bewerte(S.q[S.i], S.ans[S.i]);
    const p = fort(S.q[S.i].id);
    p.v++;
    if(b.status==="ok") p.r++;
    p.last = b.status==="ok";
    p.ts = Date.now();
    save();
  }
  renderFrage();
}

function renderFoot(){
  const f = S.q[S.i], zeigen = S.gezeigt[S.i] || S.abgegeben;
  const letzte = S.i === S.q.length - 1;
  const beantwortet = istBeantwortet(f, S.ans[S.i]);

  let btns = "";
  if(S.i > 0) btns += `<button class="btn ghost narrow" id="fPrev" title="Zurück">←</button>`;

  // Kurzer Denkimpuls Toggle
  btns += `<button class="btn hint" onclick="$('#hintBox').classList.toggle('open')">💡 Hinweis</button>`;

  if(S.modus==="klausur" && !S.abgegeben){
    btns += letzte
      ? `<button class="btn" style="background:var(--ok)" id="fDone">Klausur abgeben</button>`
      : `<button class="btn" id="fNext">Weiter →</button>`;
  } else if(!zeigen){
    btns += `<button class="btn" id="fCheck" ${beantwortet?"":"disabled"}>Auflösen</button>`;
  } else {
    btns += letzte
      ? `<button class="btn" id="fDone">Gesamtauswertung</button>`
      : `<button class="btn" id="fNext">Nächste Aufgabe →</button>`;
  }

  footslot.innerHTML = `<div class="foot"><div class="wrap">${btns}</div></div>`;

  const prev = $("#fPrev"); if(prev) prev.onclick = ()=>{ S.i--; renderFrage(); };
  const next = $("#fNext"); if(next) next.onclick = ()=>{ S.i++; renderFrage(); };
  const chk = $("#fCheck"); if(chk) chk.onclick = aufloesen;
  const done = $("#fDone");
  if(done) done.onclick = ()=>{
    if(S.modus==="klausur" && !S.abgegeben){
      const offen = S.q.filter((q,i)=>!istBeantwortet(q, S.ans[i])).length;
      if(offen && !confirm(`${offen} Aufgabe(n) sind noch unbeantwortet. Wirklich abgeben?`)) return;
      S.abgegeben = true;
      S.q.forEach((q,i)=>{
        const b = bewerte(q, S.ans[i]);
        const p = fort(q.id);
        p.v++; if(b.status==="ok") p.r++;
        p.last = b.status==="ok";
        p.ts = Date.now();
      });
      save();
    }
    go("ergebnis");
  };
}

/* Klausurergebnis nach offiziellem SBA-Schlüssel */
function renderErgebnis(){
  btnBack.hidden = false; footslot.innerHTML = ""; setProgress(1);
  setTitle("Ergebnis", S.label);

  let pR = 0, pG = 0, volltreffer = 0;
  S.q.forEach((f,i)=>{
    const b = bewerte(f, S.ans[i]);
    pR += b.rz; pG += b.gz;
    if(b.status==="ok") volltreffer++;
  });
  const pct = pG ? Math.round(pR / pG * 100) : 0;

  let note = "5.0", gClass = "grade-fail";
  if(pct >= 95) { note = "1.0"; gClass = "grade-pass"; }
  else if(pct >= 90) { note = "1.3"; gClass = "grade-pass"; }
  else if(pct >= 85) { note = "1.7"; gClass = "grade-pass"; }
  else if(pct >= 80) { note = "2.0"; gClass = "grade-pass"; }
  else if(pct >= 75) { note = "2.3"; gClass = "grade-pass"; }
  else if(pct >= 70) { note = "2.7"; gClass = "grade-pass"; }
  else if(pct >= 65) { note = "3.0"; gClass = "grade-pass"; }
  else if(pct >= 60) { note = "3.3"; gClass = "grade-pass"; }
  else if(pct >= 55) { note = "3.7"; gClass = "grade-pass"; }
  else if(pct >= 50) { note = "4.0"; gClass = "grade-pass"; }

  let html = `
  <div class="card" style="text-align:center; padding:20px">
    <div style="font-size:12px; font-weight:700; color:var(--text-faint); text-transform:uppercase">Ergebnis nach SBA-Schlüssel</div>
    <div class="grade-badge ${gClass}" style="margin:10px 0">${note}</div>
    <div style="font-size:16px; font-weight:700">${pR} von ${pG} Punkten (${pct}%)</div>
    <div style="font-size:13px; color:var(--text-dim); margin-top:4px">${volltreffer} von ${S.q.length} Aufgaben komplett fehlerfrei</div>
  </div>

  <h3>Aufgabenübersicht</h3>
  <div class="card" style="padding:4px 14px">
  `;

  S.q.forEach((f,i)=>{
    const b = bewerte(f, S.ans[i]);
    const ok = b.status==="ok";
    html += `
    <div style="display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer" onclick="S.i=${i}; go('frage')">
      <div style="font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80%">
        <span style="color:${ok?'var(--ok)':'var(--bad)'}; font-weight:700">${ok?'✓':'✗'}</span> Aufgabe ${i+1}: ${esc(f.thema||'')}
      </div>
      <div style="font-size:12.5px; font-weight:600; color:var(--text-faint)">${b.rz}/${b.gz} P</div>
    </div>`;
  });

  html += `
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn wide" onclick="go('start')">Zurück zur Hauptübersicht</button>
  </div>`;

  app.innerHTML = html;
}

/* Statistik */
function renderStatistik(){
  btnBack.hidden = false; footslot.innerHTML = ""; setProgress(0);
  setTitle("Wo ich stehe", "Lernstandsanalyse");

  const m = themenMap(FRAGEN);
  let html = `<div class="card" style="padding:6px 14px">`;

  [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],"de")).forEach(([thema, list])=>{
    let s=0, n=0;
    list.forEach(f=>{ const p=store.fortschritt[f.id]; if(p&&p.v>0){ n++; if(p.last) s++; } });
    const pct = n ? Math.round(s/n*100) : 0;
    html += `
    <div style="padding:10px 0; border-bottom:1px solid var(--border)">
      <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:4px">
        <span>${esc(thema)}</span>
        <span>${n ? s+'/'+n+' ('+pct+'%)' : 'Noch nicht geübt'}</span>
      </div>
      <div style="height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden">
        <div style="height:100%; width:${pct}%; background:${pct>=75?'var(--ok)':(pct>=50?'var(--hint)':'var(--bad)')}"></div>
      </div>
    </div>`;
  });

  html += `
  </div>
  <button class="btn ghost wide" onclick="if(confirm('Fortschritt zurücksetzen?')){store.fortschritt={}; save(); go('statistik');}">Fortschritt löschen</button>
  `;
  app.innerHTML = html;
}

if(!FRAGEN.length){
  app.innerHTML = `<div class="card" style="text-align:center">Keine Aufgaben geladen. Starte build.py zum Befüllen.</div>`;
} else {
  go("start");
}
</script>
