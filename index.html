l (Heckhausen 1977)?","optionen":["Zielsetzung","Familiäres Umfeld","Selbstbewertung","Attribution","Kompetenzausprägung"],"loesungen":[0,3,4],"erklaerung":"Aus dem Selbstbewertungsmodell lassen sich Fördermöglichkeiten an den Stellen ableiten, an denen es selbst ansetzt: bei der Zielsetzung (a), bei der Attribution der Ergebnisse (d) und bei der Kompetenzausprägung als Grundlage realistischer Selbsteinschätzung (e). Das familiäre Umfeld (b) ist kein im Modell benannter Mechanismus, und die Selbstbewertung selbst (c) ist der zu beeinflussende Prozess, kein eigenständiger Ansatzpunkt außerhalb der übrigen drei Größen."},{"id":"nar-f13","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL2, Frage 13, S. 5","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Heckhausen (1977), Selbstbewertungsmodell der Leistungsmotivation","typ":"multi","stamm":"Grundschullehrerin Frau Müller beobachtet, dass Tabea im Matheunterricht zwar stets gut mitarbeitet, beim „Freien Üben“, wo die Schüler und Schülerinnen selbständig Aufgaben aus dem Trainingsheft auswählen können, über das Abschreiben der Aufgaben aber häufig nicht hinauskommt. Frau Müller bemerkt, dass Tabea immer versucht, die besonders schwierigen Aufgaben zu bearbeiten. Auf Nachfragen meint Tabea: „Ich glaube, ich bin einfach nicht schlau genug für Mathe.“","frage":"Grundschullehrerin Frau Müller beobachtet, dass Tabea im Matheunterricht zwar stets gut mitarbeitet, beim „Freien Üben“, wo die Schüler selbständig Aufgaben aus dem Trainingsheft auswählen können, über das Abschreiben der Aufgaben aber häufig nicht hinauskommt. Tabea wählt dabei immer die besonders schwierigen Aufgaben und sagt: „Ich glaube, ich bin einfach nicht schlau genug für Mathe.“ Welche Empfehlungen zur Unterstützung von Tabea lassen sich aus Heckhausens Selbstbewertungsmodell der Leistungsmotivation (1977) ableiten?","optionen":["Frau Müller sollte Tabea damit trösten, dass sie ja in anderen Fächern sehr begabt ist.","Frau Müller sollte Tabea dabei unterstützen, Aufgaben entsprechend ihrer Fähigkeiten auszuwählen.","Frau Müller sollte ihr raten, möglichst einfache Übungsaufgaben auszuwählen.","Frau Müller sollte ihr erklären, dass die Übungsaufgaben regelmäßig benotet werden.","Frau Müller sollte Tabea verdeutlichen, dass Misserfolge bei besonders schwierigen Aufgaben nicht verwunderlich sind."],"loesungen":[1,4],"erklaerung":"Tabea zeigt ein misserfolgsmeidendes Muster: Sie wählt zu schwere Aufgaben und attribuiert Misserfolg auf mangelnde Begabung. Hilfreich ist deshalb, sie bei der Wahl von Aufgaben passend zu ihrem Leistungsniveau zu unterstützen (b) und ihr zu verdeutlichen, dass Misserfolge bei überfordernden Aufgaben normal und nicht Beleg fehlender Begabung sind (e). Trost über andere Fächer (a) ändert nichts am Attributionsmuster in Mathe, ausschließlich leichte Aufgaben zu empfehlen (c) verhindert echte Erfolgserlebnisse und Kompetenzzuwachs, und Benotung der Übungsaufgaben anzukündigen (d) würde den Druck und die Misserfolgsangst eher verstärken."},{"id":"nar-f78","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL9, Frage 78, S. 18","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Weiner, Attributionstheorie (Kausaldimensionen)","typ":"multi","frage":"SuS können ihren Erfolg oder Misserfolg unterschiedlichen Faktoren zuschreiben. Welche der folgenden Attributionsmuster begünstigen nach einem Misserfolg die zukünftige Lernmotivation?","optionen":["internal, variabel, kontrollierbar, z.B. Faulheit","internal, stabil, unkontrollierbar, z.B. Begabung","external, variabel, unkontrollierbar, z.B. Pech","internal, stabil, kontrollierbar, z.B. kein Interesse"],"loesungen":[0,2],"erklaerung":"Motivationsgünstig nach Misserfolg sind Attributionen auf internal-variable-kontrollierbare Ursachen wie Faulheit (a), weil dadurch eine Verbesserung durch eigenes Handeln möglich erscheint, und auf external-variable-unkontrollierbare Ursachen wie Pech (c), weil sie die Selbstbewertung schonen und keine stabile Ursache unterstellen. Ungünstig sind dagegen internal-stabil-unkontrollierbare Attributionen wie mangelnde Begabung (b), weil sie Hoffnungslosigkeit erzeugen, und internal-stabil-kontrollierbare Attributionen wie generell fehlendes Interesse (d), weil sie ebenfalls eine überdauernde, wenig veränderbar erscheinende Ursache nahelegen."},{"id":"pk2017-05","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 5","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Heckhausen (1977), Selbstbewertungsmodell der Leistungsmotivation","typ":"mc-kombi","stamm":"Grundschullehrerin Frau Müller beobachtet, dass Tabea im Matheunterricht zwar stets fleißig mitarbeitet, im „Freien Üben“, wo die Schüler*innen selbstständig Aufgaben aus dem Trainingsheft auswählen können, über das Abschreiben der Aufgaben aber nicht hinauskommt. Frau Müller bemerkt, dass Tabea immer versucht, die besonders schwierigen Aufgaben zu bearbeiten. Auf Nachfragen meint Tabea: „Ich glaube, ich bin einfach nicht schlau genug für Mathe.“","frage":"Welche Empfehlungen zur Unterstützung von Tabea lassen sich aus Heckhausens Selbstbewertungsmodell der Leistungsmotivation (1977) ableiten?","aussagen":["Frau Müller sollte Tabea damit trösten, dass sie ja in anderen Fächern sehr begabt ist.","Frau Müller sollte Tabea dabei unterstützen, Aufgaben entsprechend ihrer Fähigkeiten auszuwählen.","Frau Müller sollte Tabea den Rat geben, möglichst einfache Übungsaufgaben auszuwählen.","Frau Müller sollte Tabea erklären, dass die Übungsaufgaben regelmäßig benotet werden.","Frau Müller sollte Tabea verdeutlichen, dass Misserfolge bei besonders schwierigen Aufgaben nicht verwunderlich sind."],"optionen":["Die Aussage (1) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (4) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Aussage (5) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":2,"aussagen_richtig":[1,4],"erklaerung":"Tabea zeigt das misserfolgsmeidende Muster: unrealistische Zielsetzung durch die Wahl zu schwerer Aufgaben und Attribution des Misserfolgs auf mangelnde Begabung. Das Modell setzt genau an diesen beiden Stellen an. Erstens bei der Zielsetzung: Mittelschwere, zu ihren Fähigkeiten passende Aufgaben liefern überhaupt erst diagnostische Information und ermöglichen echte Erfolgserlebnisse (2). Zweitens bei der Ursachenerklärung: Wenn Misserfolg bei besonders schwierigen Aufgaben als normal und durch die Aufgabenschwierigkeit erklärbar eingeordnet wird, entlastet das die Zuschreibung auf die eigene fehlende Begabung (5). Der Trost mit Begabung in anderen Fächern (1) bestätigt dagegen gerade die Vorstellung, Mathematik sei eine Frage stabiler Begabung. Ausschließlich einfache Aufgaben (3) sind ebenso unrealistisch wie ausschließlich schwere und erzeugen keinen Stolz. Die Ankündigung einer Benotung (4) verschiebt den Fokus auf die Fremdbewertung und erhöht den Druck, statt die Selbstbewertung zu stabilisieren.","folie":"3_Leistungsmotivation_02_11_2021, Seite 41-43 (Prozessvariablen, Maßnahmen zur Motivationsförderung)"},{"id":"pk2017-08","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 8","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Paradoxe Effekte von Lob und Tadel (Meyer)","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zu Lob und Tadel und deren Wirkung treffen zu?","aussagen":["Ein paradoxer Effekt von Lob tritt ein, wenn ein Schüler für die Bewältigung einer schwierigen Aufgabe gelobt wird, weil hohe Fähigkeiten bei ihm vermutet werden.","Ein paradoxer Effekt von Lob tritt ein, wenn ein Schüler für die Bewältigung einer schwierigen Aufgabe gelobt wird, weil seine Fähigkeiten als fehlend vermutet werden.","Ein paradoxer Effekt von Tadel tritt ein, wenn ein Schüler für die falsche Lösung einer schwierigen Aufgabe getadelt wird, weil hohe Fähigkeiten bei ihm vermutet werden.","Ein paradoxer Effekt von Tadel tritt ein, wenn ein Schüler für die Bewältigung einer einfachen Aufgabe getadelt wird, weil seine Fähigkeiten als fehlend vermutet werden.","Ein paradoxer Effekt von Lob tritt ein, wenn ein Schüler für die Bewältigung einer einfachen Aufgabe gelobt wird, weil seine Fähigkeiten als fehlend vermutet werden."],"optionen":["Die Aussagen (1) und (3) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1), (4) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1), (3), (4) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussage (3) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":2,"aussagen_richtig":[2,4],"erklaerung":"Paradox heißt der Effekt, weil die Rückmeldung inhaltlich das Gegenteil dessen signalisiert, was ihre Form nahelegt. Lernende schließen aus dem Verhältnis von Aufgabenschwierigkeit und Reaktion der Lehrperson auf deren Fähigkeitseinschätzung. Lob für eine einfache Aufgabe ist unverhältnismäßig und lässt sich nur so erklären, dass die Lehrperson geringe Fähigkeit vermutet – das Lob wirkt deshalb entmutigend (5). Tadel für eine falsch gelöste schwierige Aufgabe ist ebenfalls unverhältnismäßig und signalisiert, dass die Lehrperson dem Schüler eigentlich mehr zugetraut hätte, also hohe Fähigkeit unterstellt – der Tadel wirkt deshalb ermutigend (3). Die Aussagen (1), (2) und (4) beschreiben entweder verhältnismäßige Rückmeldungen oder kehren die Fähigkeitszuschreibung um und treffen daher nicht zu."},{"id":"hp3c-probekl2-03","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Motivation: Begriff und Modelle","modell":"Erweitertes Kognitives Motivationsmodell (Heckhausen, 1980; Rheinberg, 1989) - Flow","typ":"mc-kombi","stamm":"Tom geht in die 7. Klasse und ist sehr interessiert am Fach Geographie. Wenn Tom Geographieaufgaben bearbeitet, konzentriert er sich praktisch wie von selbst und vergisst auch gern die Zeit dabei. Nun steht ein wichtiger Test bevor und er soll die Topographie Afrikas lernen. Das Thema macht Tom viel Spaß und er hatte bisher immer gute Noten in Topographie-Tests, aber heute gerät er nicht in einen Flow-Zustand beim Bearbeiten der Geographieaufgaben. Tom hat seinen Atlas in der Schule vergessen. Vaters Atlas, den er nun zum Lernen nutzt, enthält alle Bezeichnungen nur in Englisch. Mit Englisch steht Tom eher auf Kriegsfuß. Außerdem hört Toms Bruder nebenan sehr laut Musik.","frage":"Tom gerät in dieser Situation nicht in einen Flow-Zustand, weil ...","aussagen":["das Verstehen der englischen Bezeichnungen das Aufgabenbearbeiten stört.","die Noten für ihn der einzige Ansporn sind.","es keine klaren Ziele für die Vorbereitung gibt.","die Anforderungen höher sind als seine Fähigkeiten.","seine Situations-Folge-Erwartung niedrig ist."],"aussagen_richtig":[0,3],"optionen":["Die Aussagen (1) und (2) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (4) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (1), (3) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Aussage (4) trifft zu; alle anderen Aussagen treffen nicht zu."],"loesung":1,"erklaerung":"Flow setzt ein Passungsverhältnis zwischen wahrgenommenen Fähigkeiten und Anforderungen sowie eine ungestörte, auf die Tätigkeit selbst gerichtete Aufmerksamkeit voraus. Durch die fremdsprachigen Bezeichnungen im Atlas des Vaters steigen die Anforderungen über Toms Fähigkeiten (Englisch), was den Flow verhindert; gleichzeitig lenkt das Verstehen-Müssen der englischen Begriffe zusätzlich von der eigentlichen Aufgabe ab. Die übrigen Aussagen treffen laut Fallbeschreibung nicht zu: Tom hat intrinsisches Interesse (nicht nur Noten als Ansporn), ein klares Lernziel (Topographie Afrikas) und aufgrund bisheriger Erfolge keine niedrige Erwartung bezüglich der Handlungsfolgen.","folie":"02_Motivation_Modell_25_10_2022, Seite 40-41 (Erweitertes Kognitives Motivationsmodell: tätigkeitsspezifische Anreize, Flow)"},{"id":"nar-f01","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL1, Frage 1, S. 2","vertrauen":"hoch","teil":"II","thema":"Motivation: Begriff und Modelle","typ":"single","frage":"Vor dem Hintergrund der psychologischen Definition für Motivation: Welche Verhaltensmerkmale lassen erkennen, dass Lernende motiviert sind?","optionen":["Daran, dass sie Interesse, Spaß und gute Laune beim Lernen haben.","Daran, dass sie sich Aufgaben zu ihrem Lieblingsthema auswählen.","Daran, dass sie zielgerichtet, intensiv und ausdauernd lernen.","Daran, dass sie viele Fragen stellen."],"loesung":2,"erklaerung":"Die psychologische Definition beschreibt Motivation als eine zielgerichtete, intensive und ausdauernde Verhaltenstendenz. Beobachtbar ist Motivation deshalb am Verhalten selbst – daran, dass Lernende zielgerichtet, intensiv und ausdauernd lernen (c) – nicht an inneren Zuständen wie Spaß oder Interesse (a), an bloßer Themenwahl (b) oder an häufigem Fragenstellen (d), die alle nur indirekte oder unsichere Indikatoren sind."},{"id":"nar-f02","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL1, Frage 2, S. 2","vertrauen":"mittel","teil":"II","thema":"Motivation: Begriff und Modelle","modell":"Heckhausen (1980), Rheinberg (1989), Erweitertes Kognitives Motivationsmodell (EKM)","typ":"multi","frage":"Das erweiterte kognitive Motivationsmodell – EKM (Heckhausen, 1980, Rheinberg 1989) enthält Bausteine auf 3 Ebenen. Welche der folgenden Ebenen gehören zum EKM?","optionen":["Kognitive Ebene","Erwartungsebene","Anreizebene","Objektive Episodenstruktur","Emotionale Ebene","Subjektive Episodenstruktur"],"loesungen":[1,2,5],"erklaerung":"Das EKM unterscheidet eine Erwartungsebene (verschiedene Erwartungstypen), eine Anreizebene (tätigkeits-, ergebnis- und folgenbezogene Anreize) und die subjektive Episodenstruktur als Rahmen, in dem diese Erwartungen und Anreize verortet werden. Eine eigenständige „kognitive Ebene“ (a) oder „emotionale Ebene“ (e) benennt das Modell nicht gesondert, und die objektive Episodenstruktur (d) ist gerade nicht Teil des Modells, weil das EKM auf der subjektiven, nicht der objektiven Wahrnehmung der Situation aufbaut."},{"id":"nar-f04","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL2, Frage 4, S. 2","vertrauen":"mittel","teil":"II","thema":"Motivation: Begriff und Modelle","modell":"Heckhausen (1980), Rheinberg (1989), Erweitertes Kognitives Motivationsmodell (EKM)","typ":"multi","frage":"Welche der folgenden Aussagen kann aus dem erweiterten kognitiven Motivationsmodell nach Heckhausen (1980) und Rheinberg (1989) wirklich ableiten?","optionen":["Wenn die Situations-Ergebnis-Erwartung hoch ist, wird die resultierende Motivation wahrscheinlich gering sein.","Wenn die Handlungs-Ergebnis-Erwartung hoch ist, wird die resultierende Motivation wahrscheinlich gering sein.","Wenn die Ergebnis-Folge-Erwartung gering ist, wird die resultierende Motivation wahrscheinlich gering sein.","Wenn die Situations-Handlungs-Erwartung gering ist, wird die resultierende Motivation wahrscheinlich hoch sein."],"loesungen":[0,2],"erklaerung":"Im EKM ergibt sich resultierende Motivation aus dem Zusammenspiel mehrerer Erwartungen und Anreize; einzelne Erwartungen wirken multiplikativ mit den übrigen Modellkomponenten zusammen. Eine hohe Situations-Ergebnis-Erwartung (a) bedeutet, dass das Ergebnis auch ohne eigenes Handeln eintritt, was die Notwendigkeit eigenen Handelns und damit tendenziell die Motivation senkt, während eine geringe Ergebnis-Folge-Erwartung (c) bedeutet, dass das Ergebnis kaum erwünschte Folgen hat, was die Motivation ebenfalls senkt. Eine hohe Handlungs-Ergebnis-Erwartung (b) und eine geringe Situations-Handlungs-Erwartung (d) sprechen dagegen für hohe bzw. hohe Motivation, sodass diese beiden Aussagen falsch sind."},{"id":"nar-f06","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL2, Frage 6, S. 3","vertrauen":"mittel","teil":"II","thema":"Motivation: Begriff und Modelle","modell":"Heckhausen (1980), Erweitertes Kognitives Motivationsmodell (EKM)","typ":"multi","stamm":"Anton ist Schüler der 8. Klasse und muss demnächst sein Berufspraktikum organisieren. Dieses würde er gern in der Metallbranche absolvieren, weil er hier später eine Ausbildung machen möchte. Außerdem hat er gehört, dass Schülerpraktikanten in der Metallbranche sehr willkommen sind. Da Anton immer mal die Kinder der Nachbarn betreut, haben ihm die Eltern der Nachbarskinder gesagt, dass im Kindergarten ein Praktikumsplatz frei wird und sie ihm diesen ohne Probleme besorgen könnten. Anton bedankt sich, lehnt das Angebot jedoch ab. Er beginnt stattdessen voller Vorfreude mit der Recherche für ein Praktikum in der Metallbranche.","frage":"Anton möchte lieber ein Praktikum in der Metallbranche machen statt einen sicher verfügbaren Platz im Kindergarten anzunehmen, weil er sich davon einen Einstieg in seine gewünschte Ausbildung erhofft. Wie lässt sich Antons Verhalten anhand des Erweiterten Kognitiven Motivationsmodells von Heckhausen (1980) erklären?","optionen":["Anton möchte den Praktikumsplatz im Kindergarten aufgrund seiner diesbezüglich niedrigen Situations-Ergebnis-Erwartung nicht annehmen.","Anton beginnt aufgrund seiner hohen Handlungs-Ergebnis-Erwartung gleich mit der Recherche für ein Praktikum in der Metallbranche.","Anton verdient sich das Taschengeld via Babysitten aufgrund seiner hohen Handlungs-Folge-Erwartung dazu.","Anton würde sich nicht für ein Praktikum in der Metallbranche bewerben, wenn er eine geringe Situations-Ergebnis-Erwartung hätte.","Anton erwartet sich durch das Praktikum einen guten Einstieg in die Ausbildung, was seine Ergebnis-Folge-Erwartung erhöht."],"loesungen":[1,4],"erklaerung":"Anton beginnt begeistert mit der Recherche zur Metallbranche, weil er von seinem eigenen Handeln (der Bewerbung) einen für ihn erwünschten Ausbildungseinstieg erwartet – das ist eine hohe Handlungs-Ergebnis-Erwartung (b). Zugleich erhöht der erwartete gute Ausbildungseinstieg als Folge des Praktikumsergebnisses seine Ergebnis-Folge-Erwartung (e). Den sicheren Kindergartenplatz lehnt er dagegen nicht wegen einer niedrigen Situations-Ergebnis-Erwartung ab (a, d falsch, denn diese wäre hier sogar hoch, da der Platz ohne sein Zutun zustande käme), und das Taschengeld durchs Babysitten ist im Text kein Thema (c falsch)."},{"id":"pk2017-01","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 1","vertrauen":"hoch","teil":"II","thema":"Motivation: Begriff und Modelle","typ":"matrix","frage":"Es können verschiedene Maßnahmen ergriffen werden, um motivationsförderliche Bedingungen zu schaffen. Entscheiden Sie, welche der folgenden Maßnahmen zur Motivationsförderung beitragen und welche nicht.","spalten":["förderlich","nicht förderlich"],"zeilen":[{"text":"Übereinstimmung von Lernvoraussetzungen und Aufgabenschwierigkeiten herstellen.","loesung":0},{"text":"Bei Gruppenarbeiten nur die Gesamtleistung aller bewerten.","loesung":1},{"text":"Für einen Aufgabenbereich globale Ziele setzen.","loesung":1},{"text":"Verschiedene Möglichkeiten der Aufgabenbearbeitung anbieten.","loesung":0},{"text":"Größere, aber zeitlich entfernte Belohnungen anbieten.","loesung":1},{"text":"Konkrete Rückmeldungen über Leistung geben.","loesung":0}],"erklaerung":"Motivationsförderung setzt an der Passung, der Handlungskontrolle und der Rückmeldequalität an. Die Passung zwischen Lernvoraussetzungen und Aufgabenschwierigkeit ist die Grundbedingung dafür, dass Erfolg überhaupt als eigenes Verdienst erlebt werden kann, und zugleich die zentrale Flow-Bedingung. Wahlmöglichkeiten bei der Aufgabenbearbeitung stärken das Autonomieerleben, konkrete Rückmeldungen machen den Lernfortschritt sichtbar und ermöglichen eine realistische Selbstbewertung. Ungünstig ist dagegen die reine Gesamtbewertung von Gruppenarbeiten, weil der eigene Beitrag nicht mehr identifizierbar ist und die Handlungs-Ergebnis-Erwartung sinkt. Globale Ziele für einen ganzen Aufgabenbereich liefern keinen Maßstab, an dem das Erreichen unmittelbar festgestellt werden kann – wirksam sind konkrete Teilziele. Zeitlich weit entfernte Belohnungen verlieren durch die große Verzögerung ihren Anreizwert, selbst wenn sie groß sind."},{"id":"ep-09","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Bindung","modell":"Bowlby (1969/1982), Bindungstheorie","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zur Bindungstheorie nach Bowlby treffen zu?","aussagen":["Das Bindungsverhaltenssystem wird vor allem dann aktiviert, wenn das Kind Angst, Schmerz, Erschöpfung oder Trennung erlebt.","Bindung entsteht nach Bowlby dadurch, dass die Bezugsperson das Kind füttert und damit ein primäres Bedürfnis befriedigt.","Eine sichere Bindung stellt für das Kind eine sichere Basis dar, von der aus es die Umwelt erkundet.","Bindungs- und Explorationssystem arbeiten komplementär: Ist das Bindungssystem stark aktiviert, tritt die Exploration zurück.","Innere Arbeitsmodelle sind angeborene Schemata und werden durch spätere Beziehungserfahrungen nicht mehr verändert."],"optionen":["Die Aussagen (1), (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (4) und (5) treffen zu; alle anderen aber nicht."],"loesung":2,"aussagen_richtig":[0,2,3],"erklaerung":"Bowlby begreift Bindung als eigenständiges, evolutionär entstandenes Verhaltenssystem mit der Funktion, Schutz durch Nähe zu sichern. (1) nennt die typischen Aktivierungsbedingungen, (3) den Begriff der sicheren Basis, (4) das komplementäre Verhältnis von Bindung und Exploration: Ein verängstigtes Kind exploriert nicht. Aussage (2) gibt die ältere lerntheoretische Triebreduktionsthese wieder, gegen die sich Bowlby ausdrücklich wendet und die durch Harlows Versuche mit Rhesusaffen widerlegt wurde - die Jungtiere suchten die Stoffmutter, nicht die fütternde Drahtmutter. Aussage (5) verkehrt den Begriff des inneren Arbeitsmodells: Es ist gerade nicht angeboren, sondern wird aus wiederholten Interaktionserfahrungen aufgebaut, und es bleibt durch neue Beziehungserfahrungen veränderbar, wenn auch mit zunehmendem Alter träger."},{"id":"ep-10","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Bindung","modell":"Ainsworth et al. (1978), Fremde-Situations-Test; Main & Solomon (1990), desorganisierte Bindung","typ":"matrix","stamm":"In der Fremden Situation wird das Verhalten eines etwa einjährigen Kindes in acht standardisierten Episoden beobachtet, in denen die Bezugsperson zweimal den Raum verlässt und zurückkehrt. Die Klassifikation stützt sich vor allem auf das Verhalten bei der Wiedervereinigung.","frage":"Ordnen Sie die folgenden Beobachtungen dem Bindungsmuster zu, für das sie kennzeichnend sind. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Sicher (B)","Unsicher-vermeidend (A)","Unsicher-ambivalent (C)","Desorganisiert (D)"],"zeilen":[{"text":"Das Kind protestiert bei der Trennung, begrüßt die Bezugsperson bei ihrer Rückkehr aktiv, lässt sich rasch beruhigen und wendet sich dann wieder dem Spiel zu.","loesung":0},{"text":"Das Kind zeigt bei der Trennung kaum sichtbaren Kummer und ignoriert die zurückkehrende Bezugsperson oder wendet sich von ihr ab.","loesung":1},{"text":"Das Kind ist bereits vor der Trennung schwer von der Bezugsperson zu lösen, ist bei der Trennung sehr verzweifelt, sucht bei der Rückkehr Nähe, wehrt sie zugleich ärgerlich ab und ist schwer zu beruhigen.","loesung":2},{"text":"Das Kind nähert sich der zurückkehrenden Bezugsperson mit abgewandtem Kopf, erstarrt mitten in der Bewegung oder zeigt Annäherung und Abwehr gleichzeitig.","loesung":3},{"text":"Das Kind erkundet in Anwesenheit der Bezugsperson aktiv den Raum und vergewissert sich dabei immer wieder ihrer Verfügbarkeit.","loesung":0},{"text":"Das Kind spielt auffällig ausdauernd weiter und wirkt von An- und Abwesenheit der Bezugsperson unberührt; physiologische Messungen zeigen dennoch eine deutliche Stressreaktion.","loesung":1}],"erklaerung":"Entscheidend ist nicht die Menge des gezeigten Kummers, sondern die Organisation des Verhaltens bei der Wiedervereinigung. Sicher gebundene Kinder nutzen die Bezugsperson wirksam zur Beruhigung und kehren danach zur Exploration zurück. Unsicher-vermeidende Kinder regulieren ihr Bindungsbedürfnis herunter: äußerlich unbeteiligt, physiologisch jedoch gestresst - dieser Dissoziationsbefund macht die letzte Zeile eindeutig und widerlegt zugleich die naheliegende Fehldeutung, hier liege besondere Selbstständigkeit vor. Unsicher-ambivalente Kinder zeigen das Nebeneinander von Nähesuche und ärgerlicher Abwehr und lassen sich nicht beruhigen. Die desorganisierte Klassifikation nach Main und Solomon kennzeichnet nicht eine vierte Strategie, sondern den Zusammenbruch jeder kohärenten Strategie, erkennbar an widersprüchlichen, abgebrochenen oder erstarrten Bewegungen."},{"id":"ep-11","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Bindung","modell":"Ainsworth et al. (1978), Feinfühligkeitskonzept; Main & Hesse (1990)","typ":"matrix","stamm":"Die Bindungsqualität eines Kindes wird in der Bindungsforschung auf wiederkehrende Erfahrungen mit dem Verhalten der Bezugsperson zurückgeführt. Feinfühligkeit umfasst dabei vier Schritte: die Signale des Kindes wahrnehmen, richtig interpretieren, prompt und angemessen darauf reagieren.","frage":"Ordnen Sie jedes beschriebene Verhalten der Bezugsperson dem Bindungsmuster zu, mit dem es in der Bindungsforschung vorrangig in Verbindung gebracht wird. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Sicher (B)","Unsicher-vermeidend (A)","Unsicher-ambivalent (C)","Desorganisiert (D)"],"zeilen":[{"text":"Die Bezugsperson nimmt die Signale des Kindes prompt wahr, deutet sie zutreffend und beantwortet sie verlässlich.","loesung":0},{"text":"Die Bezugsperson weist Nähewünsche des Kindes regelmäßig zurück und reagiert auf Kummer eher mit Rückzug oder Aufforderung zur Selbstbeherrschung.","loesung":1},{"text":"Die Bezugsperson reagiert unvorhersehbar: mal zugewandt, mal unerreichbar, wobei sich die Reaktion eher nach ihrem eigenen Befinden als nach den Signalen des Kindes richtet.","loesung":2},{"text":"Die Bezugsperson ist für das Kind gleichzeitig die Quelle von Schutz und von Angst, etwa bei Misshandlung oder bei eigener unverarbeiteter Traumatisierung.","loesung":3},{"text":"Die Bezugsperson ermutigt das Kind zur Erkundung und steht ihm zugleich verlässlich als Rückzugsort zur Verfügung.","loesung":0}],"erklaerung":"Das Ordnungskriterium ist die Vorhersagbarkeit und Angemessenheit der Reaktion. Verlässliche Feinfühligkeit erlaubt dem Kind die Erwartung, dass Bindungssignale wirken - das begünstigt eine sichere Bindung. Systematische Zurückweisung von Nähe macht das Zeigen von Kummer unwirksam oder sogar nachteilig; das Kind lernt, sein Bindungsverhalten zu minimieren, was dem vermeidenden Muster entspricht. Unvorhersehbares, von den eigenen Zuständen der Bezugsperson gesteuertes Verhalten macht es für das Kind lohnend, sein Bindungsverhalten zu maximieren, um überhaupt Beachtung zu erreichen - das entspricht dem ambivalenten Muster. Die desorganisierte Bindung ist an eine besondere Konstellation gebunden: Die Person, zu der das Kind bei Angst flüchten müsste, ist selbst die Angstquelle, wodurch Annäherung und Flucht gleichzeitig aktiviert werden. Die häufigste Verwechslung ist die von Zurückweisung (führt zu Vermeidung) und Unberechenbarkeit (führt zu Ambivalenz)."},{"id":"ep-12","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Bindung","modell":"van IJzendoorn & Kroonenberg (1988), kulturvergleichende Metaanalyse zur Fremden Situation","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zu kulturvergleichenden Befunden der Bindungsforschung treffen zu?","aussagen":["In allen bislang mit der Fremden Situation untersuchten Stichproben ist die sichere Bindung das häufigste Muster.","In norddeutschen Stichproben wurde ein im Vergleich hoher Anteil unsicher-vermeidend gebundener Kinder gefunden.","In japanischen und israelischen Stichproben wurde ein im Vergleich hoher Anteil unsicher-ambivalent gebundener Kinder gefunden.","Die Unterschiede zwischen den untersuchten Ländern fielen größer aus als die Unterschiede zwischen den Stichproben innerhalb eines Landes.","Die gefundenen Verteilungsunterschiede belegen, dass das Bindungssystem selbst kulturell erworben und nicht biologisch verankert ist."],"optionen":["Die Aussagen (1) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (4) und (5) treffen zu; alle anderen aber nicht."],"loesung":2,"aussagen_richtig":[0,1,2],"erklaerung":"Die Metaanalyse von van IJzendoorn und Kroonenberg fasst Stichproben aus acht Ländern zusammen. Drei Befunde sind für die Prüfung zentral und in den Aussagen (1) bis (3) wiedergegeben: Die sichere Bindung überwiegt überall; norddeutsche Stichproben weisen erhöhte Anteile vermeidender Muster auf, was mit einer stärkeren Betonung früher Selbstständigkeit in Verbindung gebracht wird; japanische und israelische Stichproben weisen erhöhte Anteile ambivalenter Muster auf, was auf die dort geringere Alltagserfahrung mit Trennungen und fremden Personen zurückgeführt wird, sodass die Prozedur stärker belastet. Aussage (4) kehrt das wichtigste Ergebnis um: Die Variation innerhalb der Länder war rund anderthalbmal so groß wie die zwischen den Ländern. Aussage (5) zieht einen unzulässigen Schluss - variierende Verteilungen der Ausprägungen sagen nichts darüber aus, ob das zugrunde liegende System universell angelegt ist. Zur Einordnung: Die Interpretation der Länderunterschiede ist umstritten, weil unklar bleibt, ob die Prozedur in allen Kulturen dasselbe misst; die reinen Verteilungsbefunde sind davon unberührt."},{"id":"ep-13","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Bindung","modell":"Bowlby (1969/1982), innere Arbeitsmodelle; Bindungsforschung zur Lehrer-Schüler-Beziehung","typ":"mc-kombi","stamm":"Herr Kalb unterrichtet eine erste Klasse. Ihm fällt auf, dass Nora bei Schwierigkeiten nie um Hilfe bittet, sondern still weiterarbeitet und Aufgabenblätter unbearbeitet abgibt, während Tarek sich nur dann an eine Aufgabe traut, wenn Herr Kalb unmittelbar neben ihm steht. Herr Kalb fragt sich, ob er die Bindungstheorie zum Verständnis heranziehen kann.","frage":"Welche der folgenden Überlegungen sind aus Sicht der Bindungsforschung zutreffend?","aussagen":["Eine Lehrkraft kann für ein Kind eine sekundäre Bindungsperson werden; eine als sicher erlebte Lehrer-Schüler-Beziehung geht im Mittel mit höherer Explorationsbereitschaft und besserer Unterrichtsbeteiligung einher.","Der Bindungstyp eines Kindes lässt sich im Unterricht mit der Fremden Situation zuverlässig feststellen.","Ein unsicher-vermeidend gebundenes Kind sucht bei Überforderung besonders häufig und offen Hilfe bei der Lehrkraft.","Innere Arbeitsmodelle wirken als Erwartungen darüber, ob andere in Belastungssituationen verfügbar und verlässlich sind, und beeinflussen deshalb auch Beziehungen außerhalb der Familie.","Frühe Bindungserfahrungen legen den weiteren Entwicklungsverlauf unumkehrbar fest, sodass spätere korrigierende Beziehungserfahrungen ohne Wirkung bleiben."],"optionen":["Die Aussagen (1) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (4) und (5) treffen zu; alle anderen aber nicht.","Aussage (1) trifft zu; alle anderen Aussagen treffen nicht zu."],"loesung":0,"aussagen_richtig":[0,3],"erklaerung":"Die Bindungstheorie ist im schulischen Kontext über zwei Brücken anschlussfähig: über die Lehrkraft als mögliche sekundäre Bindungsperson und über die inneren Arbeitsmodelle, die als Beziehungserwartungen in neue Beziehungen mitgenommen werden. Deshalb sind (1) und (4) richtig. Aussage (2) überschreitet die Reichweite des Verfahrens: Die Fremde Situation ist ein standardisiertes Laborverfahren für Kinder von etwa zwölf bis achtzehn Monaten und lässt sich weder auf Schulkinder noch auf den Klassenraum übertragen. Aussage (3) kehrt das vermeidende Muster um - gerade die Minimierung von Hilfesuche und Kummerausdruck ist dessen Kennzeichen, weshalb Noras Verhalten und nicht Tareks in diese Richtung weist. Aussage (5) überdehnt die Stabilitätsannahme: Bindungsmuster zeigen mittlere Stabilität, sind aber durch neue Beziehungserfahrungen veränderbar, und genau darin liegt der pädagogische Handlungsspielraum."},{"id":"ep-14","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Bindung","modell":"Ainsworth et al. (1978), Fremde-Situations-Test","typ":"matrix","frage":"Treffen die folgenden Aussagen zum Verfahren der Fremden Situation zu? Kreuzen Sie an. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Ja","Nein"],"zeilen":[{"text":"Die Fremde Situation ist ein standardisiertes Beobachtungsverfahren mit acht kurzen, festgelegten Episoden.","loesung":0},{"text":"Die Klassifikation stützt sich vor allem auf das Verhalten des Kindes bei der Wiedervereinigung mit der Bezugsperson.","loesung":0},{"text":"Die Klassifikation stützt sich vor allem auf die Stärke des Weinens während der Trennungsepisoden.","loesung":1},{"text":"Das Verfahren wurde für Kinder im Alter von etwa zwölf bis achtzehn Monaten entwickelt.","loesung":0},{"text":"Ein Kind kann gegenüber Mutter und Vater unterschiedliche Bindungsqualitäten aufweisen.","loesung":0},{"text":"Die Bindungsklassifikation ist zugleich ein Maß für die kognitive Leistungsfähigkeit des Kindes.","loesung":1},{"text":"Die Kategorie der desorganisierten Bindung wurde erst nach Ainsworths ursprünglicher Dreiteilung ergänzt.","loesung":0}],"erklaerung":"Die Fremde Situation ist ein standardisiertes Laborverfahren mit acht Episoden von je etwa drei Minuten, in denen Bezugsperson und fremde Person systematisch kommen und gehen. Die Klassifikation stützt sich auf das Wiedervereinigungsverhalten, nicht auf die Trennungsreaktion - das ist der am häufigsten gemachte Fehler, denn auch sicher gebundene Kinder weinen bei der Trennung, und vermeidend gebundene weinen oft gerade nicht. Das Verfahren ist an das Alter zwischen etwa zwölf und achtzehn Monaten gebunden. Bindung ist beziehungsspezifisch, nicht ein Merkmal des Kindes, weshalb unterschiedliche Klassifikationen gegenüber Mutter und Vater möglich sind. Mit Intelligenz hat die Klassifikation nichts zu tun. Die vierte Kategorie desorganisiert wurde erst später von Main und Solomon ergänzt; ältere Darstellungen nennen deshalb nur drei Typen, was die Uneinheitlichkeit in der Literatur erklärt."},{"id":"ep-15","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Bindung","modell":"Bowlby (1969/1982), inneres Arbeitsmodell (internal working model)","typ":"single","frage":"Was bezeichnet Bowlby mit dem Begriff des inneren Arbeitsmodells?","optionen":["Die angeborene Fähigkeit des Säuglings, Gesichter von anderen Objekten zu unterscheiden.","Eine aus wiederholten Interaktionserfahrungen aufgebaute mentale Repräsentation der eigenen Person und der Verfügbarkeit von Bindungspersonen, die spätere Beziehungserwartungen steuert.","Das Verhaltensrepertoire, mit dem die Bezugsperson die Signale des Kindes beantwortet.","Die im Labor beobachtbare Reaktion des Kindes auf die Rückkehr der Bezugsperson.","Die kulturell geteilte Vorstellung davon, wie eine gute Bezugsperson sich verhalten sollte."],"loesung":1,"erklaerung":"Das innere Arbeitsmodell ist die Repräsentationsebene der Bindungstheorie: Aus wiederholten Erfahrungen damit, ob Bindungssignale beantwortet werden, bildet das Kind Erwartungen darüber, ob andere verfügbar sind und ob es selbst dieser Zuwendung wert ist. Diese Erwartungen steuern spätere Beziehungen und erklären, warum frühe Bindungserfahrungen über die Kindheit hinaus wirken. Option (a) beschreibt eine frühe Wahrnehmungsleistung ohne Bezug zum Begriff. Option (c) verlagert den Begriff auf die Bezugsperson, obwohl das Arbeitsmodell eine Repräsentation im Kind ist. Option (d) verwechselt die Repräsentation mit dem beobachtbaren Verhalten, aus dem in der Fremden Situation auf sie geschlossen wird. Option (e) verschiebt den Begriff auf die kulturelle Normebene."},{"id":"ep-16","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Bindung","modell":"Ainsworth et al. (1978); Main & Solomon (1990)","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zu den Bindungsmustern treffen zu?","aussagen":["Unsicher-vermeidend gebundene Kinder zeigen bei der Trennung wenig äußeren Kummer, weil sie gelernt haben, ihr Bindungsbedürfnis herunterzuregulieren.","Unsicher-ambivalent gebundene Kinder erkunden auch in Anwesenheit der Bezugsperson wenig und bleiben stark auf sie fixiert.","Die desorganisierte Bindung ist dadurch gekennzeichnet, dass das Kind eine der drei organisierten Strategien besonders konsequent anwendet.","Die unsicheren Muster A und C sind als Verhaltensstörungen des Kindes einzuordnen.","Sichere Bindung geht im weiteren Verlauf im Mittel mit besserer Emotionsregulation und sozialer Kompetenz einher, ist dafür aber keine hinreichende Bedingung."],"optionen":["Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (5) treffen zu; alle anderen aber nicht."],"loesung":0,"aussagen_richtig":[0,1,4],"erklaerung":"Vermeidung und Ambivalenz sind zwei gegenläufige, aber jeweils in sich stimmige Anpassungen an das Verhalten der Bezugsperson: Minimierung des Bindungsverhaltens im einen, Maximierung im anderen Fall. Deshalb sind (1) und (2) richtig. (5) trifft die Befundlage korrekt: Es handelt sich um mittlere Zusammenhänge und nicht um eine Garantie; spätere Einflüsse bleiben wirksam. Aussage (3) beschreibt das Gegenteil dessen, was desorganisierte Bindung meint - dort bricht die Strategie zusammen, erkennbar an widersprüchlichen, unvollendeten oder erstarrten Verhaltensweisen. Aussage (4) pathologisiert die unsicheren Muster zu Unrecht: A und C sind organisierte, unter den gegebenen Bedingungen funktionale Strategien und keine klinischen Diagnosen; ein erhöhtes Risiko besteht vor allem bei desorganisierter Bindung."},{"id":"skr-23","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 102","vertrauen":"hoch","teil":"EP","thema":"Bindung","modell":"Ainsworth, Fremde-Situation-Test","typ":"multi","frage":"Was sind die Verhaltensmerkmale laut dem „Fremde-Situationen-Test“, die ein Kind mit einem „unsicher-vermeidenden“ Bindungsstil zeigt, wenn die Bezugsperson (i) noch in dem Raum ist (die Szenen 1/2) und (ii) den Raum verlässt (die Szenen 4/6)?","optionen":["Erkundungsverhalten (Szenen 1/2)","Bindungsverhalten (Szenen 4/6)","Wenig Exploration (Szenen 1/2)","Zeigt wenig Kummer (Szenen 4/6)","Zeigt Angst (Szenen 4/6)"],"loesungen":[2,3],"erklaerung":"Unsicher-vermeidend gebundene Kinder explorieren schon in Anwesenheit der Bezugsperson auffällig wenig und zeigen beim Verlassen des Raums kaum sichtbaren Kummer, da sie emotionale Reaktionen unterdrücken. Aktives Erkundungsverhalten, deutliches Bindungsverhalten oder sichtbare Angst beim Trennungserleben sind dagegen eher Kennzeichen einer sicheren oder ambivalenten Bindung.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 102"},{"id":"ep-01","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Interaktionistische Anlage-Umwelt-Position; Plomin et al. (1977), Genotyp-Umwelt-Korrelationen","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zum Verhältnis von Anlage und Umwelt treffen zu?","aussagen":["Die interaktionistische Position geht davon aus, dass Anlage- und Umwelteinflüsse sich in ihrer Wirkung wechselseitig bedingen und nicht bloß additiv zusammenwirken.","Ein Heritabilitätskoeffizient von .50 besagt, dass bei einer einzelnen Person die Hälfte des Merkmals genetisch festgelegt ist.","Passive, evokative und aktive Genotyp-Umwelt-Korrelationen beschreiben, dass Menschen mit unterschiedlicher genetischer Ausstattung systematisch unterschiedliche Umwelten erfahren und aufsuchen.","Der Nachweis eines genetischen Einflusses auf ein Merkmal bedeutet, dass dieses Merkmal pädagogisch nicht mehr beeinflussbar ist.","Das Konzept der Plastizität besagt, dass Entwicklungsverläufe innerhalb biologischer Grenzen veränderbar bleiben."],"optionen":["Die Aussagen (1) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Aussage (5) trifft zu; alle anderen Aussagen treffen nicht zu."],"loesung":1,"aussagen_richtig":[0,2,4],"erklaerung":"Maßgeblich ist die interaktionistische Position: Anlage und Umwelt sind nicht zwei getrennt addierbare Anteile, sondern bedingen einander. Aussage (1) gibt genau das wieder, Aussage (3) benennt die drei Formen der Genotyp-Umwelt-Korrelation (passiv über die Eltern, evokativ über die ausgelösten Reaktionen, aktiv über die selbst gesuchte Nische) und Aussage (5) das Prinzip der Plastizität. Aussage (2) enthält den klassischen Fehler: Heritabilität ist ein Populationsmaß und beschreibt den Anteil genetischer Varianz an der Merkmalsvarianz einer Gruppe, nie den Anteil bei einer Einzelperson. Aussage (4) schließt aus einem genetischen Einfluss fälschlich auf Unveränderbarkeit; Heritabilität und Beeinflussbarkeit sind logisch unabhängig (Beispiel Kurzsichtigkeit: hoch erblich und dennoch korrigierbar). Damit bleiben nur (1), (3) und (5)."},{"id":"ep-02","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Lorenz (1935), Prägung; Konzept kritischer und sensibler Phasen","typ":"matrix","stamm":"In der Entwicklungspsychologie werden Zeitfenster unterschieden, in denen bestimmte Einflüsse besonders oder ausschließlich wirksam sind. Eine kritische Phase ist ein eng umgrenztes Zeitfenster, außerhalb dessen der Erwerb bzw. die Schädigung nicht mehr nachholbar oder nicht mehr rückgängig zu machen ist. Eine sensible Phase ist ein breiteres Zeitfenster, in dem der Erwerb besonders leicht gelingt, später aber noch möglich bleibt.","frage":"Ordnen Sie die folgenden Beispiele zu. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Kritische Phase","Sensible Phase","Weder noch"],"zeilen":[{"text":"Graugansküken folgen dem Objekt, das sie in den ersten Stunden nach dem Schlüpfen bewegt sehen; danach ist die Nachfolgereaktion nicht mehr auszubilden.","loesung":0},{"text":"Eine Zweitsprache wird vor der Pubertät leichter akzentfrei erworben, ist aber auch danach noch erlernbar.","loesung":1},{"text":"Eine Rötelninfektion der Mutter in den ersten Schwangerschaftswochen schädigt die gerade angelegten Organe dauerhaft.","loesung":0},{"text":"Der Aufbau einer ersten Bindungsbeziehung gelingt im ersten Lebensjahr besonders leicht; unter günstigen Bedingungen ist er auch später noch möglich.","loesung":1},{"text":"Bleibt ein Auge in den ersten Lebensjahren ohne Seheindruck, entwickelt sich das räumliche Sehen dauerhaft nicht.","loesung":0},{"text":"Das Auswendiglernen der europäischen Hauptstädte gelingt einem Kind mit zehn Jahren besser als mit acht.","loesung":2}],"erklaerung":"Das Unterscheidungskriterium ist die Nachholbarkeit. Kritische Phasen sind eng begrenzt und ihr Verpassen ist irreversibel: die Prägung der Nachfolgereaktion (Lorenz), die Organogenese im ersten Trimenon und die Ausbildung des binokularen Sehens sind die drei Standardbeispiele. Sensible Phasen sind breiter und weicher: Zweitspracherwerb und Bindungsaufbau gelingen in einem bestimmten Fenster leichter, sind aber später noch möglich, wie Studien an nachträglich adoptierten Heimkindern zeigen. Die letzte Zeile gehört in keine der beiden Kategorien: Der Lernvorteil des älteren Kindes beruht auf allgemeinem Wissens- und Strategiezuwachs, nicht auf einem Zeitfenster, dessen Verpassen den Erwerb erschweren würde. Typischer Fehler ist, jede Altersabhängigkeit vorschnell als sensible Phase zu etikettieren."},{"id":"ep-03","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Baltes, Reese & Lipsitt (1980), Systematik normativer und nicht-normativer Einflüsse","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zu normativen und nicht-normativen Entwicklungseinflüssen treffen zu?","aussagen":["Die Einschulung mit sechs Jahren ist ein normativer altersbezogener Einfluss.","Das Aufwachsen während einer Pandemie mit monatelangem Distanzunterricht ist ein normativer geschichtsbezogener Einfluss.","Der Unfalltod eines Elternteils ist ein normativer geschichtsbezogener Einfluss.","Nicht-normative Einflüsse betreffen nur einen kleinen Teil der Personen und sind in ihrem Auftreten zeitlich nicht vorhersagbar.","Normative geschichtsbezogene Einflüsse wirken auf alle Altersgruppen einer Gesellschaft in gleicher Weise."],"optionen":["Die Aussagen (1), (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (4) treffen zu; alle anderen aber nicht."],"loesung":0,"aussagen_richtig":[0,1,3],"erklaerung":"Baltes unterscheidet drei Einflussklassen. Normative altersbezogene Einflüsse treffen fast alle Menschen zu einem ähnlichen Lebensalter, etwa die Einschulung: Aussage (1) ist richtig. Normative geschichtsbezogene Einflüsse treffen eine ganze Kohorte zu einem bestimmten historischen Zeitpunkt, etwa eine Pandemie oder ein Krieg: Aussage (2) ist richtig. Nicht-normative Einflüsse sind individuell, selten und zeitlich unvorhersagbar: Aussage (4) ist richtig, und genau deshalb ist Aussage (3) falsch - der Unfalltod eines Elternteils ist der Prototyp eines nicht-normativen, nicht eines geschichtsbezogenen Ereignisses. Aussage (5) verkennt den Kern des Kohortenbegriffs: Dasselbe historische Ereignis wirkt je nach Lebensalter unterschiedlich, weshalb geschichtsbezogene Einflüsse Kohorten voneinander trennen, statt alle gleich zu treffen."},{"id":"ep-04","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Schaie (1965), Kohortensequenzielle Designs der Entwicklungsforschung","typ":"matrix","stamm":"Zur Untersuchung von Veränderungen über die Lebensspanne stehen der Entwicklungsforschung verschiedene Untersuchungsdesigns zur Verfügung.","frage":"Ordnen Sie jede Beschreibung dem Design zu, das sie kennzeichnet. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Querschnittdesign","Längsschnittdesign","Kohortensequenzielles Design"],"zeilen":[{"text":"Im Mai werden acht-, elf- und vierzehnjährige Kinder einmalig mit demselben Lesetest untersucht.","loesung":0},{"text":"Dieselben 200 Kinder werden im Alter von acht, elf und vierzehn Jahren mit demselben Lesetest untersucht.","loesung":1},{"text":"Drei aufeinanderfolgende Geburtsjahrgänge werden jeweils über sechs Jahre hinweg mehrfach getestet, sodass sich die abgedeckten Altersbereiche überlappen.","loesung":2},{"text":"Das Design ist besonders anfällig dafür, dass Altersunterschiede mit Unterschieden der Geburtsjahrgänge vermengt werden.","loesung":0},{"text":"Das Design ist besonders anfällig für selektiven Stichprobenausfall und für Effekte wiederholter Testung.","loesung":1},{"text":"Das Design erlaubt es, Alters-, Kohorten- und Testzeitpunkteffekte rechnerisch voneinander zu trennen.","loesung":2}],"erklaerung":"Das Unterscheidungskriterium ist, was jeweils variiert wird. Im Querschnitt werden verschiedene Altersgruppen zu einem Messzeitpunkt verglichen: schnell und billig, aber Alter und Geburtsjahrgang sind vollständig konfundiert, sodass ein gefundener Unterschied ebenso gut ein Kohorteneffekt sein kann. Im Längsschnitt werden dieselben Personen wiederholt untersucht: Das trennt Alter von Kohorte, handelt sich aber selektiven Stichprobenausfall (wer bleibt dabei?), Testübungseffekte und die Konfundierung von Alter mit historischer Zeit ein. Das kohortensequenzielle Design nach Schaie kombiniert beides, indem mehrere Kohorten längsschnittlich mit überlappenden Altersbereichen verfolgt werden; erst diese Anlage erlaubt die rechnerische Trennung von Alters-, Kohorten- und Testzeitpunkteffekten. Die häufigste Verwechslung besteht darin, den Stichprobenausfall dem Querschnitt zuzuschreiben - dort gibt es nur eine Messung, also keinen Ausfall über die Zeit."},{"id":"ep-05","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Markus & Kitayama (1991), independente und interdependente Selbstkonstruktion","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zu Universalien und Kulturspezifika der Entwicklung treffen zu?","aussagen":["Independent orientierte Kulturen betonen in der Erziehung Autonomie, Selbstbehauptung und die Einzigartigkeit der Person.","Interdependent orientierte Kulturen betonen soziale Eingebundenheit, Rücksichtnahme und die Erfüllung von Rollenerwartungen.","Die Abfolge der motorischen Meilensteine im ersten Lebensjahr ist weitgehend universell, während das Tempo ihres Erwerbs kulturell variiert.","Independenz und Interdependenz sind Merkmale ganzer Kulturen, die innerhalb einer Kultur nicht zwischen Personen variieren.","Das Erkennen der Basisemotionen am Gesichtsausdruck gilt als kulturspezifisch, während die Darbietungsregeln für Emotionen universell sind."],"optionen":["Die Aussagen (1) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (4) treffen zu; alle anderen aber nicht."],"loesung":1,"aussagen_richtig":[0,1,2],"erklaerung":"Die Unterscheidung von Markus und Kitayama betrifft die kulturell vorherrschende Selbstkonstruktion: independent meint Abgrenzung und Autonomie, interdependent meint Eingebundenheit und Rollenerfüllung. (1) und (2) geben das korrekt wieder. (3) nennt das Standardmuster: Die Reihenfolge der motorischen Meilensteine gilt als universell, das Tempo ist durch Pflegepraktiken beeinflussbar. (4) ist falsch, weil Independenz und Interdependenz Orientierungen sind, die innerhalb jeder Kultur erheblich zwischen Personen und Milieus streuen; die Beschreibung ganzer Kulturen ist eine Vergröberung, keine Eigenschaftszuschreibung an jedes Mitglied. (5) enthält den klassischen Vertauschungsfehler: Es verhält sich genau umgekehrt - die Basisemotionen und ihr Ausdruck gelten traditionell als weitgehend universell, kulturspezifisch sind die Darbietungsregeln darüber, welche Emotion wann wie stark gezeigt werden darf. Zur Einordnung: Die Universalitätsannahme für Basisemotionen wird in der neueren Emotionsforschung diskutiert; die hier geprüfte Kernaussage, dass Darbietungsregeln der kulturspezifische Anteil sind, ist davon unberührt."},{"id":"ep-06","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Havighurst (1948/1972), Entwicklungsaufgaben","typ":"matrix","stamm":"Havighurst beschreibt Entwicklungsaufgaben als Anforderungen, die sich in einem bestimmten Lebensabschnitt aus körperlicher Reifung, gesellschaftlichen Erwartungen und individuellen Zielsetzungen ergeben.","frage":"Ordnen Sie die folgenden Entwicklungsaufgaben dem Lebensabschnitt zu, dem Havighurst sie zuweist. Achtung, pro Zeile gibt es nur eine korrekte Antwort!","spalten":["Frühe Kindheit","Mittlere Kindheit (Schulkindalter)","Jugendalter"],"zeilen":[{"text":"Erwerb des aufrechten Gangs, des Sprechens und der Kontrolle über die Körperausscheidungen","loesung":0},{"text":"Erlernen der Kulturtechniken Lesen, Schreiben und Rechnen","loesung":1},{"text":"Lernen, mit Gleichaltrigen zurechtzukommen, und Aufbau eines Freundeskreises","loesung":1},{"text":"Akzeptieren der eigenen veränderten körperlichen Erscheinung und Aufbau einer Geschlechtsrolle","loesung":2},{"text":"Erwerb emotionaler Unabhängigkeit von den Eltern und anderen Erwachsenen","loesung":2},{"text":"Vorbereitung auf eine berufliche Laufbahn und Aufbau eines eigenen Werte- und Ethiksystems","loesung":2}],"erklaerung":"Havighurst ordnet Aufgaben nach dem Zusammentreffen von Reifung und gesellschaftlicher Erwartung. In der frühen Kindheit dominieren die basalen körperlichen und sprachlichen Errungenschaften. In der mittleren Kindheit stehen die schulischen Kulturtechniken, der Umgang mit der Gleichaltrigengruppe und die Ausbildung von Gewissen und Wertmaßstäben im Vordergrund - deshalb gehören die Zeilen zu Kulturtechniken und Peers hierher. Das Jugendalter ist durch die Auseinandersetzung mit dem veränderten Körper, die Ablösung von den Eltern, die Berufsvorbereitung und den Aufbau eines eigenen Wertesystems gekennzeichnet. Die häufigste Verwechslung betrifft den Freundeskreis: Der Aufbau von Beziehungen zu Gleichaltrigen ist bereits eine Aufgabe der mittleren Kindheit, im Jugendalter verschiebt sich der Schwerpunkt auf reifere Beziehungen und die Ablösung von den Eltern."},{"id":"ep-07","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Baltes (1987), Leitsätze der Entwicklungspsychologie der Lebensspanne","typ":"single","frage":"Welche Aussage kennzeichnet den lebensspannenpsychologischen Entwicklungsbegriff nach Baltes am besten?","optionen":["Entwicklung ist ein Reifungsprozess, der mit dem Ende der Adoleszenz abgeschlossen ist.","Entwicklung umfasst über die gesamte Lebensspanne hinweg gleichzeitig Gewinne und Verluste und verläuft mehrdirektional.","Entwicklung verläuft in universellen Stufen, die alle Menschen in gleichem Tempo durchlaufen.","Entwicklung ist die Summe aller Lernprozesse und damit vollständig durch die Umwelt bestimmt.","Entwicklung bezeichnet ausschließlich diejenigen Veränderungen, die auf biologische Reifung zurückgehen."],"loesung":1,"erklaerung":"Die Lebensspannenpsychologie nach Baltes fasst Entwicklung als lebenslangen Prozess, der in jedem Abschnitt zugleich Gewinne und Verluste enthält, mehrdirektional und mehrdimensional verläuft und durch Plastizität sowie historische Einbettung gekennzeichnet ist. Option (b) gibt genau diese Kernsätze wieder. Option (a) beschreibt den älteren, auf Kindheit und Jugend verengten Entwicklungsbegriff. Option (c) trifft auf klassische Stufenmodelle wie das Piagets zu, nicht auf den Lebensspannenansatz, und unterstellt zudem ein einheitliches Tempo, das selbst innerhalb der Stufenmodelle nicht behauptet wird. Option (d) und Option (e) greifen jeweils eine Seite der Anlage-Umwelt-Frage heraus und stehen damit der interaktionistischen Position entgegen, auf der der Lebensspannenansatz aufbaut."},{"id":"ep-08","quelle":"Konstruiert nach Standardkanon der Entwicklungspsychologie - keine Vorlesungsgrundlage im Materialordner","vertrauen":"niedrig","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"van IJzendoorn & Kroonenberg (1988), Metaanalyse; Markus & Kitayama (1991)","typ":"mc-kombi","stamm":"Frau Doberitz unterrichtet eine fünfte Klasse, in der Kinder aus sehr unterschiedlichen Herkunftskulturen zusammenkommen. Sie bereitet einen Elternabend vor und möchte dabei vermeiden, Verhaltensunterschiede vorschnell als Auffälligkeiten zu deuten.","frage":"Welche der folgenden Überlegungen von Frau Doberitz sind aus Sicht der kulturvergleichenden Entwicklungspsychologie zutreffend?","aussagen":["Dass ein Kind bei Lob nicht lächelt, sondern den Blick senkt, kann Ausdruck kulturspezifischer Darbietungsregeln sein und nicht fehlender Freude.","Unterschiede zwischen Kulturen im Ausmaß des jugendlichen Autonomiestrebens und in der Häufigkeit der damit einhergehenden Generationenkonflikte sind belegt.","Weil das Bindungssystem universell ist, sind kulturvergleichend gefundene Unterschiede in der Verteilung der Bindungstypen methodische Artefakte ohne inhaltliche Bedeutung.","Die Unterschiede zwischen Kulturen fallen in kulturvergleichenden Untersuchungen regelmäßig größer aus als die Unterschiede innerhalb einer Kultur.","In interdependent orientierten Kulturen wird ein Kind häufiger dazu angehalten, eigene Bedürfnisse zugunsten der Gruppe zurückzustellen."],"optionen":["Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2), (3) und (5) treffen zu; die andere Aussage aber nicht."],"loesung":0,"aussagen_richtig":[0,1,4],"erklaerung":"Kulturspezifika betreffen typischerweise nicht das Vorhandensein einer Fähigkeit, sondern ihre Ausgestaltung. (1) trifft zu: Grundemotionen gelten als universell, die Darbietungsregeln für ihren Ausdruck sind kulturell geformt. (2) ist ein belegtes Kulturspezifikum des Jugendalters. (5) beschreibt die interdependente Orientierung korrekt. (3) ist falsch, weil Universalität des Systems und kulturelle Variation der Ausprägung einander nicht ausschließen; die in der Metaanalyse von van IJzendoorn und Kroonenberg gefundenen Verteilungsunterschiede sind reale Befunde. (4) kehrt das zentrale Ergebnis dieser Metaanalyse um: Die Variation innerhalb der Länder war größer als die zwischen den Ländern. Genau deshalb verbietet sich der Schluss von der Herkunftskultur auf das einzelne Kind."},{"id":"ex2016-03","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 3","vertrauen":"mittel","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Entwicklungspsychologische Untersuchungsdesigns","typ":"single","stamm":"Ein(e) Erziehungswissenschaftler(in) interessiert sich für den potenziellen Zusammenhang zwischen dem Umfang des TV-Konsums und der sozial-emotionalen Entwicklung. Er (Sie) möchte dabei sowohl Fragen zu Altersunterschieden als auch zu Entwicklungsveränderungen klären. Er (Sie) beabsichtigt, Daten von einer Stichprobe von Schülern der 1. bis 3. Klasse (je 200 Schüler pro Klasse) zu Beginn des Schuljahres 2016 und erneut in 2018 zu sammeln.\n\nZur Auswahl stehen: (1) Korrelationsmethode, (2) Laboruntersuchungen, (3) Querschnittsdesign, (4) Längsschnittsdesign.","frage":"Welche Kombination der folgenden entwicklungspsychologischen Untersuchungsmethoden sollte er oder sie anwenden?","optionen":["(1) mit (3)","(1) mit (4)","(2) mit (3)","(3) mit (1) und (4)","(3) mit (2) und (4)"],"loesung":3,"erklaerung":"Drei Anforderungen stecken im Text. Erstens wird ein Zusammenhang zwischen Fernsehdauer und Entwicklung gesucht, ohne dass etwas manipuliert wird – das ist die Korrelationsmethode, keine Laboruntersuchung. Zweitens sollen Altersunterschiede geklärt werden; dafür werden mehrere Jahrgänge gleichzeitig erhoben, also ein Querschnitt. Drittens sollen Entwicklungsveränderungen geklärt werden; dafür werden dieselben Kinder zweimal im Abstand von zwei Jahren erhoben, also ein Längsschnitt. Die Verbindung von Quer- und Längsschnitt heißt Kohortensequenzdesign und trennt Alters- von Kohorteneffekten. Nur Option (d) nennt alle drei Elemente. Im Klausurexemplar ist (b) angekreuzt, am Rand steht aber fragend „d“ – (b) lässt die Altersunterschiede unbeantwortet."},{"id":"ex2024-02","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 2 (S. 2)","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","typ":"mc-kombi","frage":"Nicht alle Entwicklungsphänomene sind gleichermaßen durch Kultur und Gesellschaft geprägt. Welche der folgenden Aussagen beschreiben zutreffende kulturspezifische Entwicklungsphänomene (d.h. sogenannte Kulturspezifika der Entwicklung)?","aussagen":["Es zeigen sich kulturelle Unterschiede darin, wie gut Säuglinge dazu in der Lage sind, durch positive und negative Signale die Aufmerksamkeit ihrer Umwelt zu erlangen, ihre Emotionen mittels Gesichtsmimik zu kommunizieren und die Reaktionen ihrer Umwelt wahrzunehmen.","Bei der kulturvergleichenden Untersuchung von Bindungstypen haben sich in unterschiedlichen Kulturen unterschiedliche Verteilungsmuster der Bindungstypen (sicher, vermeidend, ambivalent) gezeigt.","Grundemotionen gelten als universell, allerdings zeigen sich kulturelle Unterschiede in der Art, wie Emotionen ausgedrückt werden (d.h. hinsichtlich sogenannter „Darbietungsregeln“ für Emotionen).","Im Jugendalter können sich kulturelle Unterschiede im Ausmaß des Autonomiebestrebens der Jugendlichen gegenüber ihren Eltern sowie in der Häufigkeit der damit einhergehenden Konflikte zwischen den Generationen zeigen.","Independent orientierte Kulturen fördern in der Kindheit stärker die Entwicklung von sozialen Kompetenzen, wohingegen interdependent orientierte Kulturen stärker auf abstrakte Kompetenzen fokussieren."],"optionen":["Aussage (1) trifft zu, alle anderen treffen nicht zu.","Die Aussagen (1) und (3) treffen zu, alle anderen nicht.","Die Aussagen (2), (3) und (4) treffen zu, alle anderen nicht.","Die Aussagen (2) und (4) treffen zu, alle anderen nicht.","Aussage (5) trifft zu, alle anderen treffen nicht zu."],"loesung":2,"aussagen_richtig":[1,2,3],"erklaerung":"Kulturspezifika sind Entwicklungsphänomene, die je nach Kultur unterschiedlich ausfallen – im Gegensatz zu Universalien, die überall gleich verlaufen. Die kulturvergleichende Bindungsforschung findet unterschiedliche Verteilungsmuster der Bindungstypen (2), die Darbietungsregeln für den Ausdruck von Emotionen unterscheiden sich kulturell, obwohl die Grundemotionen selbst universell sind (3), und das Ausmaß des jugendlichen Autonomiestrebens sowie die Konflikthäufigkeit variieren kulturell (4). Aussage (1) ist falsch, weil die frühe Signal- und Ausdrucksfähigkeit von Säuglingen nach heutigem Forschungsstand als universelle Grundausstattung gilt. Aussage (5) ist vertauscht: Interdependent orientierte Kulturen betonen soziale Kompetenzen, independent orientierte Kulturen die individuelle, abstrakt-kognitive Kompetenz."},{"id":"skr-02","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 98","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Bronfenbrenner (1979), Bioökologisches Modell der Entwicklung","typ":"single","frage":"Zu welchem Entwicklungssubsystemen in Bronfenbrenners „Bioökologischem Modell der Entwicklung“ gehören jeweils Massenmedien (M), Schule (S) und historische Ereignisse (hE), wie z.B. die deutsche Wiedervereinigung?","optionen":["Exosystem (M), Microsystem (S), Chronosystem (hE)","Exosystem (M), Microsystem (S), Macrosystem (hE)","Macrosystem (M), Mesosystem (S), Exosystem (hE)","Exosystem (M), Mesosystem (S), Chronosystem (hE)","Chronosystem (M), Microsystem (S), Macrosystem (hE)"],"loesung":1,"erklaerung":"Massenmedien wirken auf das Kind ein, ohne dass es selbst darin aktiv beteiligt ist, und zählen deshalb zum Exosystem. Die Schule ist ein Lebensbereich, in dem das Kind unmittelbar handelt, also Mikrosystem. Gesamtgesellschaftliche historische Ereignisse wie die Wiedervereinigung betreffen die kulturellen und gesellschaftlichen Rahmenbedingungen aller Kinder eines Jahrgangs gleichermaßen und werden in diesem Modell dem Makrosystem zugeordnet, während das Chronosystem individuelle zeitliche Veränderungen der Person selbst erfasst. Die übrigen Antworten ordnen mindestens einen der drei Faktoren einer falschen Systemebene zu.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 98"},{"id":"skr-07","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 99","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Maslow, Bedürfnishierarchie","typ":"single","frage":"In Bezug auf die Entwicklung der Motivation: Welche der folgenden Sequenzen beschreibt die Bedürfnishierarchie von Abraham Maslow?","optionen":["Sicherheitsbedürfnisse → Physiologische Bedürfnisse → Soziale Bedürfnisse → Individualbedürfnisse → Selbstverwirklichung","Sicherheitsbedürfnisse → Physiologische Bedürfnisse → Individualbedürfnisse → Soziale Bedürfnisse → Selbstverwirklichung","Physiologische Bedürfnisse → Individualbedürfnisse → Soziale Bedürfnisse → Sicherheitsbedürfnisse → Selbstverwirklichung","Physiologische Bedürfnisse → Sicherheitsbedürfnisse → Individualbedürfnisse → Soziale Bedürfnisse → Selbstverwirklichung","Physiologische Bedürfnisse → Sicherheitsbedürfnisse → Soziale Bedürfnisse → Individualbedürfnisse → Selbstverwirklichung"],"loesung":4,"erklaerung":"Maslows Bedürfnispyramide beginnt mit den physiologischen Grundbedürfnissen, gefolgt von Sicherheitsbedürfnissen, sozialen Bedürfnissen, Individualbedürfnissen (Wertschätzung) und schließlich der Selbstverwirklichung an der Spitze. Alle anderen Optionen vertauschen mindestens zwei benachbarte Stufen dieser festen Reihenfolge.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 99"},{"id":"skr-09","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 99","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Entwicklungspsychologische Forschungsdesigns","typ":"single","frage":"Einen Oberschulrat interessiert der potentielle Zusammenhang zwischen der Häufigkeit der Internetnutzung und vollständiger Hausaufgabenerledigung. Dafür untersucht er 6 Gruppen von Schülern der 6. bis 12. Klasse, die aus verschiedenen Stadtteilen stammen. Welches entwicklungspsychologische Forschungsdesign hatte er angewendet?","optionen":["Beschleunigtes Längsschnittdesign","Beobachtungsdesign","Sequenzielles Design","Querschnittliches Design","Längsschnittliches Design"],"loesung":3,"erklaerung":"Es werden verschiedene Altersgruppen zu einem einzigen Zeitpunkt miteinander verglichen, ohne dieselben Personen über die Zeit erneut zu untersuchen; das ist die Definition eines Querschnittdesigns. Ein Längsschnitt- oder beschleunigtes Längsschnittdesign würde dieselben Personen wiederholt untersuchen, ein sequenzielles Design kombiniert mehrere Querschnitte mit Längsschnittmessungen, was hier nicht beschrieben ist.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 99"},{"id":"skr-11","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 100","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Verhaltensgenetik, Erblichkeitsschätzung","typ":"single","frage":"Der geschätzte Umwelteinfluss von „Extraversion“ liegt bei ca. 30%. Wie hoch kann die geschätzte Erblichkeit von „Extraversion“ sein?","optionen":["ca. 70%","ca. (70% - Fehleranteil der Schätzungsmethode)","ca. (100% - Fehleranteil der Schätzungsmethode)","ebenfalls ca. 30%","ca. (30% - Fehleranteil der Schätzungsmethode)"],"loesung":1,"erklaerung":"Da sich Erblichkeit, Umwelteinfluss und Messfehleranteil zu 100% aufsummieren, ergibt sich die Erblichkeit rechnerisch als Rest von 100% minus Umweltanteil minus Fehleranteil der Schätzmethode, also ca. 70% abzüglich des Fehleranteils. Die Angabe von glatt 70% ignoriert den Messfehler, die übrigen Optionen rechnen mit falschen Ausgangsanteilen.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 100"},{"id":"skr-14","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 100","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Stabilitätsbegriffe in der Entwicklungspsychologie","typ":"single","frage":"Welche der folgenden Stabilitätsbegriffe beschreibt/beschreiben die Tatsache, dass die erhobenen Mittelwerte von Variablen in einer Gruppe über die Zeit hinweg gleich bleiben?","optionen":["Strukturale Stabilität","Korrelative (rank-order) Stabilität","Niveaustabilität","Ipsative Stabilität","Absolute Stabilität"],"loesung":2,"erklaerung":"Niveaustabilität bezeichnet die Konstanz von Gruppenmittelwerten über die Zeit. Korrelative Stabilität betrifft dagegen die Rangreihenfolge der Personen untereinander, strukturale Stabilität die Konstanz der zugrundeliegenden Faktorenstruktur eines Konstrukts, und ipsative Stabilität die relative Ausprägung mehrerer Merkmale innerhalb einer einzelnen Person.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 100"},{"id":"skr-25","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 103","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Arnett (2000), Emerging Adulthood","typ":"multi","frage":"Jeffrey Arnett (2000) entwarf den Begriff „Emerging Adulthood“ (entstehendes Erwachsenenalter). Welche der folgenden Aussagen zu diesem Begriff ist (sind) korrekt?","optionen":["„Emerging Adulthood“ ist in Entwicklungsländern weniger ausgeprägt als in Industriestaaten.","Mit 21 Jahren sind die meisten Menschen sicher, dass sie schon erwachsen sind.","Soziale Beziehungen sind enorm entwickelt und stabil in dieser Lebensphase.","„Emerging Adulthood“ ist eine Übergangsphase zwischen Adoleszenz und Erwachsenenalter, die durch große Mobilität und Ungewissheit gekennzeichnet ist.","Mit 28 Jahren sind immer noch mehr als 25% der Menschen nicht ganz sicher, ob sie schon erwachsen sind."],"loesungen":[0,3,4],"erklaerung":"Emerging Adulthood ist als Übergangsphase mit hoher Mobilität und Ungewissheit definiert, tritt vor allem in Industriestaaten mit späterer sozialer Verselbstständigung auf, und selbst mit 28 Jahren ist ein relevanter Anteil der Menschen noch unsicher über den eigenen Erwachsenenstatus. Mit 21 fühlen sich die meisten noch nicht sicher erwachsen, und soziale Beziehungen gelten in dieser Phase gerade als instabil, nicht als gefestigt.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 103"},{"id":"skr-27","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 103","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Entwicklungsmodelle (endogenistisch, exogenistisch, aktional, transaktional)","typ":"multi","frage":"In welchen Entwicklungsmodellen wird das Individuum als aktiv betrachtet?","optionen":["Exogenistische Modelle","In allen Modellen","Transaktionale Modelle","Aktionale Modelle","Endogenistische Modelle"],"loesungen":[2,3],"erklaerung":"In aktionalen und transaktionalen Modellen wird die Person als aktiv gestaltendes Element ihrer eigenen Entwicklung im Austausch mit der Umwelt verstanden. Exogenistische Modelle betonen dagegen die formende Kraft der Umwelt und endogenistische Modelle die reine Entfaltung innerer Anlagen, in beiden Fällen ohne aktive Mitgestaltung durch das Individuum.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 103"},{"id":"skr-28","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 103","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Entwicklungsplastizität, Testing-the-Limits","typ":"multi","frage":"Welche der folgenden Aussagen über Entwicklungsplastizität sind (ist) korrekt?","optionen":["Entwicklungsplastizität ist nur bis zum Erwachsenenalter beschränkt.","Interventionsmethoden, wie z.B. „Testing-the-Limits“, sind für Untersuchungen von Altersunterschieden in der Entwicklungsplastizität geeignet.","Nicht für alle Menschen funktionieren die gleichen Lernstrategien gleich gut.","Das Lernpotential über die gesamte Lebensspanne nimmt mit dem Alter zu.","Beim Gedächtnistraining zeigen alte Erwachsene geringere Lerneffekte als Jugendliche."],"loesungen":[1,2,4],"erklaerung":"Die Testing-the-Limits-Methode eignet sich, um Altersunterschiede in der Plastizität sichtbar zu machen, wobei interindividuelle Unterschiede in wirksamen Lernstrategien bestehen und ältere Erwachsene beim Gedächtnistraining im Mittel geringere Zugewinne erzielen als Jugendliche. Plastizität bleibt über die gesamte Lebensspanne, nicht nur bis zum Erwachsenenalter, prinzipiell erhalten, nimmt aber mit dem Alter tendenziell ab statt zu.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 103"},{"id":"skr-29","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 103","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Heckhausen (1999), Handlungsmodell der Entwicklungsregulation","typ":"multi","frage":"Welche der folgenden Aussagen über das Handlungsmodell der Entwicklungsregulation (nach Heckhausen, 1999) sind (ist) richtig?","optionen":["Kompensatorische primäre Kontrolle wird für dringliche Ziele in der Phase des Zielengagements verwendet.","Die Dringlichkeit der Ziele ist abhängig von dem Zeithorizont der Entwicklungsfrist.","Selektive kompensatorische primäre Kontrolle wird nach Erfolg in der Postaktionalen Phase verwendet.","Die Entwicklungsfrist wird auch als Rubikon bezeichnet.","Kompensatorische sekundäre Kontrolle wird nach Misserfolg in der Postaktionalen Phase verwendet."],"loesungen":[0,1,4],"erklaerung":"Im Modell wird bei dringlichen, an eine Entwicklungsfrist gebundenen Zielen verstärkt kompensatorische primäre Kontrolle im Zielengagement eingesetzt, wobei die Dringlichkeit selbst vom verbleibenden Zeithorizont abhängt; nach Misserfolg in der postaktionalen Phase kommt kompensatorische sekundäre Kontrolle zur emotionalen Bewältigung zum Einsatz. Selektive primäre Kontrolle nach Erfolg in der postaktionalen Phase sowie die Gleichsetzung von Entwicklungsfrist und Rubikon entsprechen nicht der Modellterminologie.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 103-104"},{"id":"skr-30","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 104","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Heckhausen & Krüger (1993), erwarteter Entwicklungswandel","typ":"multi","frage":"Hinsichtlich des Ergebnisses von Heckhausen & Krüger (1993), welche der folgenden Aussagen über den erwarteten Entwicklungswandel bei erwünschten und unerwünschten Merkmalen sind (ist) korrekt? (Der erwartete Wandelpunkt ist als das erwartete Alter definiert, ab dem die Erwartungen für unerwünschte Merkmale mehr werden als die für erwünschte Merkmale.)","optionen":["Junge Erwachsene erwarten einen späteren Wandelpunkt als mittelalte Erwachsene.","Mittelalte Erwachsene erwarten einen späteren Wandelpunkt als ältere Erwachsene.","Alte Erwachsene erwarten einen späteren Wandelpunkt als junge Erwachsene.","Der erwartete Wandelpunkt ändert sich über die Lebensspanne.","Der erwartete Wandelpunkt bleibt stabil über die Lebensspanne."],"loesungen":[2,3],"erklaerung":"Mit zunehmendem eigenen Alter verschieben Befragte den erwarteten Wandelpunkt selbst nach hinten, sodass ältere Erwachsene ihn später ansetzen als junge Erwachsene; der Wandelpunkt ist damit über die Lebensspanne nicht stabil, sondern verschiebt sich. Die Annahme eines späteren Wandelpunkts bei jungen gegenüber mittelalten bzw. bei mittelalten gegenüber älteren Erwachsenen widerspricht dieser Verschiebungsrichtung.","folie":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll, S. 104"},{"id":"skr-38","quelle":"Skript Psycho + Fragen, EP-Gedächtnisprotokoll Online-Klausur 2020, S. 105","vertrauen":"hoch","teil":"EP","thema":"Entwicklung: Grundlagen und Kulturvergleich","modell":"Persönlichkeitsstabilität im Erwachsenenalter","typ":"multi","frage":"Welche der folgenden Aussagen über Altersunterschiede in Persönlichkeitsfaktoren sind (ist) korrekt?","optionen":["Die korrelative Stabilität von Extraversion nimmt während der Lebensspanne von Erwachsenen linear ab.","Die korrelative Stabilität von Offenheit ist höher im jüngeren Erwachsenenalter als im mittleren Erwachsenenalter.","Die korrelative Stabilität von Gewissenhaftigkeit nimmt während der Lebensspanne von Erwachsenen linear zu.","Die Niveaustabilität von Gewissenhaftigkeit ist am höchsten im jüngeren Erwachsenenalter.","Die Niveaustabilität von Offenheit ist am höchsten im jüngeren Erwachsenenalter."],"loesungen":[2,4],"erklaerung":"Die korrelative (Rangreihen-)Stabilität von Gewissenhaftigkeit steigt mit zunehmendem Erwachsenenalter linear an, während die Niveaustabilität von Offenheit im jüngeren Erwachsenenalter am höchsten ausfällt. Die Aussagen zu abnehmender Extraversionsstabilität, höherer Offenheitsstab
