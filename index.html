"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 12","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Heckhausen, Erweitertes Kognitives Motivationsmodell (Erwartungstypen)","typ":"mc-kombi","stamm":"Anton ist Schüler der 8. Klasse und muss demnächst sein Berufspraktikum organisieren. Dies würde er gern in der Metallbranche absolvieren, weil er hier später eine Ausbildung machen möchte und gehört hat, dass Schülerpraktikanten in der Metallbranche sehr willkommen sind. Da Anton immer mal die Kinder der Nachbarn betreut, haben ihm die Eltern der Nachbarskinder gesagt, dass im Kindergarten ein Praktikumsplatz frei wird und sie ihm diesen ohne Probleme besorgen könnten. Anton bedankt sich, lehnt das Angebot jedoch ab. Er beginnt stattdessen voller Vorfreude mit der Recherche für ein Praktikum in der Metallbranche.","frage":"Wie lässt sich Antons Verhalten anhand des Erweiterten Kognitiven Motivationsmodells nach Heckhausen erklären?","aussagen":["Anton möchte den Praktikumsplatz im Kindergarten aufgrund seiner diesbezüglich niedrigen Situations-Folge-Erwartung nicht annehmen.","Anton beginnt aufgrund seiner hohen Handlungs-Ergebnis-Erwartung gleich mit der Recherche für ein Praktikum in der Metallbranche.","Anton verdient sich das Taschengeld via Babysitten aufgrund seiner hohen Handlungs-Folge-Erwartung dazu.","Anton würde sich nicht für ein Praktikum in der Metallbranche bewerben, wenn er eine geringe Situations-Ergebnis-Erwartung hätte.","Anton erwartet sich durch das Praktikum einen guten Einstieg in die Ausbildung, was seine Ergebnis-Folge-Erwartung erhöht."],"optionen":["Aussage (2) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1), (3) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (4) treffen zu, alle anderen Aussagen treffen nicht zu.","Aussage (4) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":2,"aussagen_richtig":[1,4],"erklaerung":"Das Modell kennt drei Erwartungstypen. Die Handlungs-Ergebnis-Erwartung fragt, ob das eigene Handeln zum angestrebten Ergebnis führt: Anton hat gehört, dass Praktikanten in der Metallbranche willkommen sind, rechnet also fest damit, dass seine Recherche und Bewerbung zum Platz führen – deshalb legt er sofort los (2). Die Ergebnis-Folge-Erwartung fragt, ob das Ergebnis die gewünschten Folgen nach sich zieht: Anton erwartet vom Praktikum einen guten Einstieg in die Ausbildung, was den Anreiz des Ergebnisses erhöht (5). Aussage (1) und (3) verwenden mit „Situations-Folge-Erwartung“ und der Handlungs-Folge-Erwartung Begriffe, die den Fall nicht treffen – den Kindergartenplatz lehnt Anton nicht wegen einer Erwartung ab, sondern weil ihm dessen Folgen keinen Anreiz bieten. Aussage (4) kehrt die Logik um: Eine geringe Situations-Ergebnis-Erwartung bedeutet, dass sich das Ergebnis eben nicht von selbst einstellt, und spricht damit gerade für eigenes Handeln statt dagegen.","folie":"4_Motivation_Anreize_09_11_2021, Seite 5 (Erweitertes Kognitives Motivationsmodell)"},{"id":"ex2016-08","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 8","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2008, 2013), ITFL-Modell","typ":"mc-kombi","stamm":"Sabine und Stephan sollen im Physikunterricht ein Experiment zur Messung der Periodendauer beim Fadenpendel vorbereiten. Dazu soll jeder für sich Hypothesen aufstellen und den Versuchsaufbau individuell planen. Anschließend sollen sie sich gegenseitig Rückmeldung zu ihrer Planung geben und das Experiment dann gemeinsam durchführen. Nachdem beide mit der Planung fertig sind, analysiert Sabine die Planung von Stephan und gibt ihm folgende Rückmeldung:\n\n„Im Vergleich zum letzten Mal sind deine Hypothesen nun alle richtig. Aber beim Versuchsplan fehlt dir wohl einfach das Talent, da machst du immer zu viele Fehler. Wollen wir nicht einfach meine Lösung nehmen und das Experiment angehen? Dann sind wir einfach schneller, als wenn du jetzt alles noch einmal von vorn anfängst.“","frage":"Welche der folgenden Aussagen erklären, warum dieses Feedback aus Sicht der aktuellen Feedback-Forschung eher schlecht formuliert ist?","aussagen":["Das Feedback thematisiert als Fehlerursache keine veränderbaren Verhaltensaspekte.","Das Feedback liefert keine Hinweise zu aufgabenspezifischen Lösungsstrategien.","Das Feedback weist nicht auf konkrete Fehlerbereiche hin.","Das Feedback regt kein internes Feedback an.","Das Feedback macht Lernerfolge und Lernfortschritte nicht sichtbar."],"aussagen_richtig":[0,1,3],"optionen":["Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (2) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (4) treffen zu; alle anderen aber nicht."],"loesung":3,"erklaerung":"Drei Mängel stecken in Sabines Rückmeldung. „Dir fehlt das Talent“ schreibt den Fehler einem stabilen, unveränderbaren Personenmerkmal zu, statt einem veränderbaren Vorgehen – das ist (1). Sie sagt nirgends, wie ein Versuchsplan aufzubauen wäre, liefert also keine aufgabenspezifische Lösungsstrategie – das ist (2). Und indem sie anbietet, einfach ihre Lösung zu übernehmen, nimmt sie Stephan genau die Auseinandersetzung ab, aus der internes Feedback entstünde – das ist (4). Zwei Aussagen sind bewusst als Fallen gebaut. (3) stimmt nicht: Sie benennt den Fehlerbereich sehr wohl, nämlich den Versuchsplan im Unterschied zu den Hypothesen. (5) stimmt ebenfalls nicht: Der Satz „Im Vergleich zum letzten Mal sind deine Hypothesen nun alle richtig“ macht den Lernfortschritt ausdrücklich sichtbar. Wer die Vignette nur überfliegt und „schlechtes Feedback“ pauschal abhakt, kreuzt hier falsch.","folie":"9 Feedback Grundlagen; 10 Feedback Teil 2 – ITFL-Modell"},{"id":"ex2024-14","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 14 (S. 19)","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Merkmale motivierenden Feedbacks","typ":"mc-kombi","stamm":"Nach einer intensiven Übungsphase in einem naturwissenschaftlichen Fach im Leistungskurs einer 11. Klasse wurde eine Klausur geschrieben. Herr Mayer kontrolliert die Arbeiten und macht sich in der nächsten Stunde etwas Luft: „Ich bin ja so enttäuscht! Wir haben doch so lange geübt! Da kann es doch nicht sein, dass so schlechte Leistungen erbracht werden und mehr als die Hälfte durchfällt. Und mal ehrlich: So schwer waren die Aufgaben doch gar nicht!“","frage":"Welche der folgenden Aussagen wären für die Schüler*innen motivationsgünstiger gewesen, da sie die Merkmale für motivierendes Feedback berücksichtigen?","aussagen":["Ich mache mir Gedanken. Was meint ihr, woran es gelegen hat, dass so viele von euch durchgefallen sind?","Ich bin frustriert. Wir haben sehr intensiv geübt, aber es hat leider nur bei manchen gefruchtet.","Mir ist aufgefallen, dass die meisten von euch den Fehler gemacht haben, sich nicht genau herauszuschreiben, was gegeben und was gesucht war.","An alle, die durchgefallen sind – bitte nehmt euch doch ein Beispiel an denen, die die Arbeit gut bewältigt haben.","Ich denke, viele von euch haben die Aufgabenstellungen wieder nicht genau gelesen."],"optionen":["Die Aussagen (1), (2) und (4) sind motivationsgünstiger, alle anderen nicht.","Die Aussagen (1) und (3) sind motivationsgünstiger, alle anderen nicht.","Die Aussagen (2) und (3) sind motivationsgünstiger, alle anderen nicht.","Die Aussagen (2), (4) und (5) sind motivationsgünstiger, alle anderen nicht.","Die Aussagen (1), (3) und (5) sind motivationsgünstiger, alle anderen nicht."],"loesung":1,"aussagen_richtig":[0,2],"erklaerung":"Motivierendes Feedback ist nach der Vorlesung verhaltens- und kriteriumsorientiert statt personenbezogen, zeigt konkrete Fehler und Verbesserungsmöglichkeiten auf und vermeidet den sozialen Vergleich. Aussage (1) erfüllt das, indem sie die Ursachensuche gemeinsam mit den Lernenden eröffnet, statt ein Urteil über sie zu fällen – das ist die Voraussetzung für eine günstige Attribution. Aussage (3) benennt präzise den konkreten Fehler im Vorgehen und liefert damit genau die verhaltensbezogene Information, aus der sich eine Korrekturmaßnahme ableiten lässt. Aussage (2) stellt die Enttäuschung der Lehrperson in den Mittelpunkt und teilt die Klasse implizit in Erfolgreiche und Gescheiterte. Aussage (4) verweist ausdrücklich auf die soziale Bezugsnorm und macht den Vergleich mit den Mitschüler*innen zum Maßstab. Aussage (5) ist ein pauschaler Vorwurf, der durch das „wieder“ ein stabiles Defizit unterstellt und keinen konkreten Korrekturhinweis enthält.","folie":"10_Feedback_Teil2_21_12_2021, Seite 9-11 und 14 (Motivierendes Feedback – wichtige Merkmale)"},{"id":"ex2024-15-1","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 15.1 (S. 20)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2008, 2013), ITFL-Modell","typ":"mc-kombi","stamm":"Frau Müller übt Rechtschreibung mit einem Lernprogramm für Französisch. Sie muss dabei deutsche Vokabeln eintippen und korrekt in ein Textfeld schreiben. Das Lernprogramm reagiert bereits beim Schreiben. Solange Frau Müller richtige Buchstaben eingibt, ist das Feld grün unterlegt. Sobald sie einen falschen Buchstaben eingibt, wird das Feld rot. Frau Müller tauscht dann immer schnell den falschen Buchstaben gegen einen anderen aus und versucht es so lange, bis das Feld wieder grün ist. Nach je zehn Vokabeln bekommt sie vom Programm gemeldet: „Super, Sie haben 10 von 10 Vokabeln richtig geschrieben. Sie sind ein Sprachgenie!“","frage":"Welche der folgenden Aussagen erklären, warum diese Feedbackstrategie aus Sicht der aktuellen Feedbackforschung (z. B. Studien zum ITFL-Modell; Narciss, 2008; 2013) eher schlecht gestaltet ist?","aussagen":["Das externe fehlerbezogene Feedback beinhaltet knowledge of result.","Das externe fehlerbezogene Feedback wird unmittelbar gegeben.","Das externe summative Feedback spricht ein stabiles Personenmerkmal an.","Das externe summative Feedback ist zu ausführlich.","Das externe summative Feedback ist ungenau."],"optionen":["Die Aussagen (1), (3) und (4) liefern eine Erklärung; alle anderen nicht.","Die Aussagen (2), (3) und (5) liefern eine Erklärung; alle anderen nicht.","Die Aussagen (1), (4) und (5) liefern eine Erklärung; alle anderen nicht.","Die Aussagen (2) und (4) liefern eine Erklärung; alle anderen nicht.","Die Aussagen (2) und (5) liefern eine Erklärung; alle anderen nicht."],"loesung":1,"aussagen_richtig":[1,2,4],"erklaerung":"Drei Gestaltungsfehler erklären die schwache Wirkung. Erstens der Zeitpunkt: Die Rot-Grün-Rückmeldung erfolgt nach jedem einzelnen Buchstaben und damit so unmittelbar, dass Frau Müller gar keine Gelegenheit hat, selbst internes Feedback zu erzeugen und den Fehler eigenständig zu bemerken (2). Zweitens der Bezugspunkt der Bilanz: „Sie sind ein Sprachgenie“ schreibt der Person ein stabiles, globales Merkmal zu, statt das konkrete Verhalten zu benennen – ein Muster, das Attribution und Selbstkonzept ungünstig beeinflusst (3). Drittens die Genauigkeit: „10 von 10 richtig“ blendet aus, wie viele Korrekturversuche pro Vokabel nötig waren, und beschreibt den tatsächlichen Leistungsstand damit ungenau (5). Aussage (1) beschreibt lediglich, was die Rückmeldung enthält; knowledge of result ist im ITFL-Modell eine reguläre Feedbackkomponente und für sich genommen kein Gestaltungsfehler. Aussage (4) trifft nicht zu: Die summative Rückmeldung ist zu knapp, nicht zu ausführlich.","folie":"9_Feedback_Grundlagen_13_12_2022, Seite 30 (Feedbackkomponenten KR, KCR, KM, KH)"},{"id":"ex2024-15-2","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 15.2 (S. 21)","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Narciss (2008, 2013), ITFL-Modell","typ":"mc-kombi","stamm":"Frau Müller übt Rechtschreibung mit einem Lernprogramm für Französisch. Sie muss dabei deutsche Vokabeln eintippen und korrekt in ein Textfeld schreiben. Das Lernprogramm reagiert bereits beim Schreiben. Solange Frau Müller richtige Buchstaben eingibt, ist das Feld grün unterlegt. Sobald sie einen falschen Buchstaben eingibt, wird das Feld rot. Frau Müller tauscht dann immer schnell den falschen Buchstaben gegen einen anderen aus und versucht es so lange, bis das Feld wieder grün ist. Nach je zehn Vokabeln bekommt sie vom Programm gemeldet: „Super, Sie haben 10 von 10 Vokabeln richtig geschrieben. Sie sind ein Sprachgenie!“","frage":"Welche Wirkung(en) des externen fehlerbezogenen Feedbacks ist/sind vor dem Hintergrund der aktuellen Feedbackforschung (z. B. ITFL-Modell) wahrscheinlich zu erwarten?","aussagen":["Frau Müller kann bei Nutzung des Programms die Vokabeln fehlerfrei schreiben.","Frau Müller kann auch ohne das Programm die Vokabeln fehlerfrei schreiben.","Frau Müller macht immer wieder Fehler beim Schreiben der Vokabeln.","Frau Müller kann das im Programm Gelernte auf andere Vokabeln transferieren.","Frau Müller lernt die für die Vokabeln relevanten Orthographieregeln."],"optionen":["Die Aussagen (1), (3) und (4) beschreiben die wahrscheinliche Wirkung; alle anderen nicht.","Die Aussagen (2), (3) und (5) beschreiben die wahrscheinliche Wirkung; alle anderen nicht.","Die Aussagen (1) und (3) beschreiben die wahrscheinliche Wirkung; alle anderen nicht.","Die Aussagen (2) und (4) beschreiben die wahrscheinliche Wirkung; alle anderen nicht.","Die Aussage (1) beschreibt die wahrscheinliche Wirkung; alle anderen Aussagen nicht."],"loesung":2,"aussagen_richtig":[0,2],"erklaerung":"Die Rot-Grün-Anzeige liefert ausschließlich knowledge of result: richtig oder falsch. Sie enthält weder Informationen über die Fehlerart oder Fehlerquelle (knowledge about mistakes) noch Hinweise zum weiteren Vorgehen (knowledge on how to proceed) oder zur zugrunde liegenden Regel (knowledge about concepts). Solange das Programm läuft, führt das dazu, dass Frau Müller jeden falschen Buchstaben durch Ausprobieren ersetzt, bis das Feld grün wird – das Ergebnis ist fehlerfrei (1), die Fehler werden aber nur im Verlauf korrigiert und treten immer wieder auf (3). Weil sie dabei nie erfährt, warum ein Buchstabe falsch war, baut sie kein Regelwissen auf: (5) ist damit ausgeschlossen, und ohne Regelwissen gibt es weder einen Transfer auf andere Vokabeln (4) noch eine fehlerfreie Schreibung ohne die ständige Rückmeldung des Programms (2).","folie":"9_Feedback_Grundlagen_13_12_2022, Seite 30 (elaborierte Feedbackkomponenten)"},{"id":"hp3a-mp2019-11-01","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Du bist zur richtigen Antwort gekommen.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0],"erklaerung":"Der Satz teilt lediglich mit, dass die Antwort richtig war (Knowledge of Response), ohne weitere Informationen zu geben. Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-02","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Nein, das ist falsch. Bei einer Begriffsabgrenzungsaufgabe muss man die definitorischen Merkmale der Begriffe vergleichen.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,2],"erklaerung":"„Nein, das ist falsch“ ist Knowledge of Response; der Hinweis auf den Vergleich definitorischer Merkmale beschreibt die Anforderung der Aufgabenart und ist damit Knowledge on Task Constraints. Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-03","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Du hast Aufgabe 3 teilweise richtig gelöst, deine Lösung enthält jedoch noch fünf Fehler.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,3],"erklaerung":"Die Rückmeldung „teilweise richtig“ ist Knowledge of Response, die Angabe der Fehleranzahl ist Knowledge of Mistakes. Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-04","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Du hast den richtigen Rechenschritt ausgewählt, Dich aber leider verrechnet und damit ist deine Lösung falsch.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,3],"erklaerung":"In dieser kürzeren Fassung ohne Hinweis auf die Umkehroperation enthält die Rückmeldung nur die Falsch-Meldung (Knowledge of Response) und die Benennung des Fehlers, des Verrechnens (Knowledge of Mistakes); anders als in der ausführlicheren Fassung derselben Aufgabe in der Klausur WiSe 2020/21 fehlt hier der Hinweis auf ein konkretes Vorgehen (Knowledge on How to Proceed), da der Satz zur Umkehroperation in diesem Protokoll nicht enthalten ist. Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-05","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Die letzte Antwort war richtig, somit hast Du 50% der Aufgaben richtig gelöst. Um für die Klausur zu üben, solltest du dir die falsch gelösten Fragen erneut bearbeiten.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,6,7],"erklaerung":"Die Angabe „50% der Aufgaben richtig gelöst“ ist eine leistungsbezogene Gesamtrückmeldung (Knowledge of Performance), „die letzte Antwort war richtig“ ist Knowledge of Response, und der Rat, falsch gelöste Fragen erneut zu bearbeiten, ist eine strategische Handlungsempfehlung (Knowledge on How to Proceed). Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-06","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Du hast den falschen Ansatz gewählt. Schau dir die Musterlösung an und versuch es erneut!“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[3,6],"erklaerung":"„Du hast den falschen Ansatz gewählt“ benennt die Fehlerart (Knowledge of Mistakes), der Verweis auf die Musterlösung als Vorgehen zur Korrektur liefert Knowledge on How to Proceed. Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-07","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Du hast Fachbegriffe verwechselt. Operantes Konditionieren kommt häufig in Forschungsarbeiten zum Behaviorismus vor.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[3,5],"erklaerung":"Die Rückmeldung „Fachbegriffe verwechselt“ ist Knowledge of Mistakes, der inhaltliche Hinweis zum Zusammenhang von operantem Konditionieren und Behaviorismus vermittelt begriffliches Wissen (Knowledge about Concepts). Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-08","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Deine Zuordnung ist falsch. Kann denn der Autor überhaupt Berührungspunkte mit dem Behaviorismus gehabt haben?“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,5],"erklaerung":"„Deine Zuordnung ist falsch“ ist Knowledge of Response, die Rückfrage nach Berührungspunkten mit dem Behaviorismus regt zur inhaltlichen Reflexion über den Begriff an (Knowledge about Concepts). Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-09","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Das richtige Ergebnis ist 99.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[1],"erklaerung":"Die Nennung des richtigen Ergebnisses ohne weitere Erklärung ist Knowledge of the Correct Response. Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-10","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Das ist nicht ganz richtig. Du hast Fehler beim Auflösen der Klammern gemacht. Versuche zunächst die Klammern von innen nach außen aufzulösen.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,3,6],"erklaerung":"„Das ist nicht ganz richtig“ ist Knowledge of Response, die Benennung des Fehlers beim Klammernauflösen ist Knowledge of Mistakes, und der Hinweis, von innen nach außen aufzulösen, ist eine Vorgehensstrategie (Knowledge on How to Proceed). Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-mp2019-11-11","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 25f.","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält: „Die Hälfte der Teilschritte in deinem Lösungsweg ist richtig. Dein Endergebnis ist jedoch falsch.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,7],"erklaerung":"Die Angabe, die Hälfte der Teilschritte sei richtig, ist eine leistungsbezogene Rückmeldung zum Lösungsweg (Knowledge of Performance) in Kombination mit der Ergebnisrückmeldung, dass das Endergebnis falsch ist (Knowledge of Response). Diese Lösung entspricht der im Quelldokument selbst als offizielle Korrektur vermerkten Angabe (\"Laut Lösungen\") bzw. der unstrittigen Erstantwort, und stimmt mit der Parallelaufgabe der Klausur WiSe 2020/21 überein (siehe hp3a-ws2021-05).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-01","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Du bist zur richtigen Antwort gekommen.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0],"erklaerung":"Der Satz teilt lediglich mit, dass die Antwort richtig war (Knowledge of Response), ohne weitere Informationen zu Fehlern, Aufgabenanforderungen oder Vorgehen zu geben.","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-02","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Nein, das ist falsch. Bei einer Begriffsabgrenzungsaufgabe muss man die definitorischen Merkmale der Begriffe vergleichen.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,2],"erklaerung":"„Nein, das ist falsch“ ist Knowledge of Response (Ergebnisrückmeldung); der Hinweis, dass bei Begriffsabgrenzungsaufgaben definitorische Merkmale verglichen werden müssen, beschreibt die Anforderung der Aufgabenart und damit Knowledge on Task Constraints, nicht aber den konkreten Fehler oder Lösungsweg.","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-03","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Du hast Aufgabe 3 teilweise richtig gelöst, deine Lösung enthält jedoch noch fünf Fehler.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,3],"erklaerung":"Die Rückmeldung „teilweise richtig“ ist Knowledge of Response; die Angabe der Fehleranzahl („fünf Fehler“) ist Knowledge of Mistakes, ohne dass Fehlerart, -ort oder Korrekturhinweise genannt werden.","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-04","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Du hast den richtigen Rechenschritt ausgewählt, Dich aber leider verrechnet und damit ist deine Lösung falsch. Um solche Fehler zu vermeiden, führe auch die Umkehroperation durch, um deine Rechnung zu überprüfen.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,3,6],"erklaerung":"Die Aussage „damit ist deine Lösung falsch“ ist Knowledge of Response, der genannte Fehler (Verrechnen) ist Knowledge of Mistakes, und der Hinweis auf die Umkehroperation zur Fehlervermeidung liefert eine aufgabenspezifische Strategie und damit Knowledge on How to Proceed.","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-05","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Die letzte Antwort war richtig, somit hast Du 50% der Aufgaben richtig gelöst. Um für die Klausur zu üben, solltest du die falsch gelösten Fragen erneut bearbeiten.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,6,7],"erklaerung":"Die Angabe „50% der Aufgaben richtig gelöst“ ist eine leistungsbezogene Gesamtrückmeldung (Knowledge of Performance) und „die letzte Antwort war richtig“ ist Knowledge of Response; der Rat, falsch gelöste Fragen erneut zu bearbeiten, ist eine strategische Handlungsempfehlung (Knowledge on How to Proceed).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-06","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Du hast den falschen Ansatz gewählt. Schau dir die Musterlösung an und versuch es erneut!“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[3,6],"erklaerung":"„Du hast den falschen Ansatz gewählt“ benennt die Fehlerart (Knowledge of Mistakes), der Verweis auf die Musterlösung als Vorgehen zur Korrektur liefert Knowledge on How to Proceed.","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-07","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Du hast Fachbegriffe verwechselt. Operantes Konditionieren kommt häufig in Forschungsarbeiten zum Behaviorismus vor.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[3,5],"erklaerung":"Die Rückmeldung „Fachbegriffe verwechselt“ ist Knowledge of Mistakes (Fehlerart), der inhaltliche Hinweis zum Zusammenhang von operantem Konditionieren und Behaviorismus vermittelt begriffliches Wissen und damit Knowledge about Concepts.","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-08","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Deine Zuordnung ist falsch. Kann denn der Autor überhaupt Berührungspunkte mit dem Behaviorismus gehabt haben?“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,5],"erklaerung":"„Deine Zuordnung ist falsch“ ist Knowledge of Response; die Rückfrage nach Berührungspunkten mit dem Behaviorismus regt zur inhaltlichen Reflexion über den Begriff an und ist damit Knowledge about Concepts.","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-09","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Das richtige Ergebnis ist 99.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[1],"erklaerung":"Die Nennung des richtigen Ergebnisses ohne weitere Erklärung ist Knowledge of the Correct Response.","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-10","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Das ist nicht ganz richtig. Du hast Fehler beim Auflösen der Klammern gemacht. Versuche zunächst die Klammern von innen nach außen aufzulösen.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,3,6],"erklaerung":"„Das ist nicht ganz richtig“ ist Knowledge of Response, die Benennung des Fehlers beim Klammernauflösen ist Knowledge of Mistakes, und der Hinweis, von innen nach außen aufzulösen, ist eine Vorgehensstrategie (Knowledge on How to Proceed).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-05-11","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), inhaltliche Klassifikation von Feedback-Komponenten","typ":"multi","stamm":"Es gibt zahlreiche inhaltliche Feedback-Komponenten, die man bei der Gestaltung von tutoriellen Feedbackstrategien kombinieren kann. Notieren Sie, welche inhaltlichen Feedback-Komponenten das folgende Beispiel nach der Klassifikation von Narciss (2006) explizit enthält (pro Beispiel 1-3 Komponenten): „Die Hälfte der Teilschritte in deinem Lösungsweg ist richtig. Dein Endergebnis ist jedoch falsch.“","frage":"Welche inhaltlichen Feedback-Komponenten nach Narciss (2006) enthält dieses Beispiel explizit?","optionen":["KR – Knowledge of Response/Result","KCR – Knowledge of the Correct Response","KTC – Knowledge on Task Constraints","KM – Knowledge of Mistakes","KMC – Knowledge on Metacognition","KC – Knowledge about Concepts","KH – Knowledge on How to Proceed","KP – Knowledge of Performance"],"loesungen":[0,7],"erklaerung":"Die Angabe, die Hälfte der Teilschritte sei richtig, ist eine leistungsbezogene Rückmeldung zum Lösungsweg (Knowledge of Performance) in Kombination mit der Ergebnisrückmeldung, dass das Endergebnis falsch ist (Knowledge of Response).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 26 (Inhaltsbezogene Klassifikation von Feedbackkomponenten nach Narciss, 2006)"},{"id":"hp3a-ws2021-09","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 10f. (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), ITFL-Modell","typ":"multi","stamm":"Maria übt Rechtschreibung mit einem computerbasierten Lernprogramm. Sie muss dabei Wörter, die vom Programm vorgesprochen werden, korrekt in ein Textfeld schreiben. Das Lernprogramm reagiert bereits beim Schreiben: Solange Maria richtige Buchstaben eingibt, ist das Feld grün unterlegt, sobald sie einen falschen Buchstaben eingibt, wird das Feld rot. Maria tauscht dann immer sehr schnell den falschen Buchstaben gegen einen anderen aus und versucht es so lange, bis das Feld wieder grün ist. Nach je zehn Vokabeln bekommt sie vom Programm gemeldet: „Super, du hast 10 von 10 Wörtern richtig geschrieben. Sie sind ein Sprachgenie!“","frage":"Welche der folgenden Aussagen erklären, warum diese Feedbackstrategie aus Sicht der aktuellen Feedbackforschung (z. B. IFTL-Modell) eher schlecht gestaltet ist?","optionen":["Das externe summative Feedback ist ungenau.","Das externe fehlerbezogene Feedback wird unmittelbar gegeben.","Das externe summative Feedback ist zu ausführlich.","Das externe fehlerbezogene Feedback gibt klar und eindeutig Knowledge of Result.","Das externe summative Feedback spricht ein stabiles Personenmerkmal an."],"loesungen":[0,1,4],"erklaerung":"Die abschließende Rückmeldung „10 von 10 Wörtern richtig“ ist als summative Bilanz ungenau, da sie nur die Anzahl richtig geschriebener Wörter nennt, aber nicht, wie viele Korrekturversuche pro Wort nötig waren oder welche Fehler wiederholt auftraten (a). Die sofortige Grün/Rot-Rückmeldung bei jedem Buchstaben ist ein unmittelbares fehlerbezogenes Feedback, das dem Lernenden keine Gelegenheit lässt, selbst internes Feedback zu generieren und den Fehler eigenständig zu erkennen (b). Die Aussage „Sie sind ein Sprachgenie“ bezieht sich nicht auf das konkrete Verhalten, sondern schreibt der Person ein stabiles, globales Merkmal zu, was nach der Feedbackforschung negative motivationale Effekte begünstigt (e). Die Rückmeldung ist dagegen nicht zu ausführlich (c) und liefert kein eindeutiges Knowledge of Result, da nicht klar wird, welche der zehn Vokabeln ohne Korrekturschleifen richtig geschrieben wurden (d)."},{"id":"hp3a-ws2021-15","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 14 (Lösung S. 20)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), ITFL-Modell","typ":"multi","stamm":"Beate informiert sich im Internet zum Thema „Feedback“. Auf einer Webseite findet sie die „Top 5 der Regeln für kompetenzorientiertes Feedback“. Leider finden sich auf dieser Liste auch eher ungünstige Empfehlungen zur Gestaltung von Feedback.","frage":"Welche der folgenden Regeln lassen sich mit Hilfe des ITFL-Modells (Narciss, 2006) begründen?","optionen":["Kompetenzorientiertes Feedback soll Leitfragen, Erklärungen etc. anbieten, falls es Lernenden nicht selbst gelingt, passende Korrekturmaßnahmen zu finden.","Kompetenzorientiertes Feedback soll sich auf die konkrete Aufgabenbearbeitung beziehen.","Kompetenzorientiertes Feedback soll den Feedbacknehmenden zu Reflexionen über die eigene Person und seine/ihre Begabungen anregen.","Kompetenzorientiertes Feedback soll bei erfolgreicher Bewältigung von Lernanforderungen den Wert/das Besondere des Erreichten hervorheben, um die Motivation zu fördern.","Kompetenzorientiertes Feedback soll Informationen simultan nach dem Prinzip „so viel Information wie möglich“ anbieten."],"loesungen":[0,1,3],"erklaerung":"Das ITFL-Modell empfiehlt, Feedback erst dann mit ausführlichen Korrekturhilfen wie Leitfragen oder Erklärungen anzureichern, wenn interne Selbstkorrekturversuche nicht gelingen (a), und es soll sich immer auf die konkrete Aufgabenbearbeitung und veränderbare Verhaltensaspekte beziehen statt auf die Person (b). Das Hervorheben des Wertes einer erfolgreichen Bewältigung stärkt motivationale Funktionen wie Selbstwirksamkeit (d). Reflexionen über die eigene Person und Begabungen sind dagegen nach der Feedbackforschung (Kluger & DeNisi, 1996) mit negativen Effekten assoziiert, da sie von der Aufgabe weg auf stabile Personenmerkmale lenken (c, falsch). Auch die simultane Darbietung möglichst vieler Informationen widerspricht dem Prinzip, Feedback dosiert und schrittweise an das Vorwissen und den Bedarf des Lernenden anzupassen (e, falsch).","folie":"9_Feedback_Grundlagen_13_12_2022.txt, Folie 22-23 (Gestaltungsprinzipien: konkret/verhaltensbezogen statt personenbezogen; negative Effekte von Feedback zu Reflexionen über die eigene Person)"},{"id":"hp3b-wise2021-01","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 61","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Narciss (2006), Gestaltung motivierenden Feedbacks","typ":"matrix","stamm":"Andreas musste eine Hausaufgabe in Mathematik abgeben; bei den geübten Aufgaben hat er sich besonders angestrengt und alles richtig gelöst, bei nicht geübten Aufgaben unterliefen ihm beim Ausrechnen Fehler. Bei der Rückgabe gibt der Lehrer Andreas Feedback. Entscheiden Sie für die folgenden Feedback-Komponenten, inwiefern sie bei Andreas die Motivation fördern, für Mathematik zu üben (nach den Hinweisen zur Gestaltung motivierenden Feedbacks, Narciss, 2006).","frage":"Die Feedback-Komponente fördert die Motivation, zu üben:","spalten":["fördert Motivation","fördert Motivation nicht"],"zeilen":[{"text":"„Beim Korrigieren der Aufgaben ist mir aufgefallen, dass du die Prozente immer falsch berechnet hast. Schau dir das nochmal an.“","loesung":0},{"text":"„Super, Andreas, ich wusste doch, dass du eigentlich ein kluger Kopf bist!“","loesung":1},{"text":"„Ich bin mir sicher, wenn du dich das nächste Mal noch mehr anstrengst, dann wirst du alle Aufgaben korrekt lösen können.“","loesung":0},{"text":"„Du hast dich im Vergleich zum letzten Mal verbessert. Die Aufgaben zum ersten Thema hast du alle richtig gelöst.“","loesung":0},{"text":"„Im zweiten Teil der Aufgaben sind dir viele Fehler passiert. Was denkst du, woran das lag?“","loesung":0}],"erklaerung":"Nach Narciss (2006) fördert Feedback die Motivation, wenn es konkret und aufgabenbezogen ist, auf Anstrengung statt auf stabile Fähigkeit attribuiert und die individuelle Bezugsnorm (Vergleich mit der eigenen Vorleistung) nutzt. Die anstrengungsbezogene Ermutigung, die Rückmeldung nach individueller Bezugsnorm und die zur Selbstreflexion anregende Frage entsprechen diesen Prinzipien, ebenso die konkrete, aufgabenbezogene Fehlerrückmeldung zu den Prozentrechnungen. Das Lob „kluger Kopf“ attribuiert den Erfolg dagegen auf eine stabile, unveränderliche Fähigkeit; solche begabungsbezogenen Attributionen gelten nach der Attributions- und Feedbackforschung als motivational ungünstig, insbesondere im Fall künftiger Misserfolge.","folie":"9_Feedback_Grundlagen (Narciss, motivierendes Feedback)"},{"id":"hp3b-wise2021-02","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 61","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Narciss (2006), Faktoren der Feedbackwirksamkeit","typ":"matrix","stamm":"Die Wirksamkeit von Feedback wird von vielen unterschiedlichen Faktoren beeinflusst (Narciss, 2006). Kreuzen Sie für jeden der folgenden Faktoren an, zu welcher Gruppe (Aufgabenanforderungen, individuelle oder externe Faktoren) er gehört. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Faktor gehört zu …","spalten":["individuelle Faktoren","Aufgabenanforderungen","externe Faktoren"],"zeilen":[{"text":"Adäquatheit der internen Repräsentation der Aufgabenanforderungen","loesung":0},{"text":"Komplexität des Lehrmaterials","loesung":1},{"text":"Fertigkeiten zur Selbstevaluation","loesung":0},{"text":"Diagnostische Kompetenz der Lehrperson","loesung":2},{"text":"Transparente Beschreibung der Aufgabenziele","loesung":2},{"text":"Motivation und Wille zur Verbesserung","loesung":0}],"erklaerung":"Die Feedback-Folie nach Narciss (2006) listet unter den individuellen Faktoren explizit die subjektive (interne) Repräsentation der Anforderungen, die Selbstevaluations-Skills sowie Motivation und Willen zur Verbesserung – das entspricht drei der sechs Zeilen wörtlich. Unter Aufgabenanforderungen fällt die Komplexität des Materials, da die Folie diese Gruppe explizit über die 'erforderlichen Kompetenzen' und deren Komplexität definiert. Diagnostische Kompetenz der Lehrperson und eine transparente Zielbeschreibung sind dagegen der Gruppe der externen Faktoren zugeordnet, da diese Gruppe laut Folie die externe Repräsentation der Anforderungen/Ziele sowie die Qualität der externen diagnostischen Verfahren umfasst.","folie":"9_Feedback_Grundlagen_13_12_2022, Seite 19 (Faktoren - Feedbackwirksamkeit)"},{"id":"hp3b-wise2021-12","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 66","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Narciss (2006), Feedback-Komponenten (KR, KP, KC, KTC, KMC)","typ":"matrix","stamm":"In einer mündlichen Zwischenprüfung im Fach Biologie soll Paula den Aufbau einer pflanzlichen Zelle an die Tafel zeichnen und erklären. Paula ist aufgeregt und zeichnet eine tierische Zelle; außerdem vergisst sie teilweise, die gezeichneten Elemente zu erklären. Klassifizieren Sie die Feedbackbestandteile der Biologielehrerin nach Narciss (2006), ob es sich um Knowledge of Result (KR), Knowledge of Performance (KP), Knowledge about Concepts (KC), Knowledge on Task Constraints (KTC) oder Knowledge on Metacognition (KMC) handelt. Pro Zeile gibt es nur eine korrekte Antwort.","frage":"Feedbackbestandteil ist …","spalten":["KTC","KR","KP","KMC","KC"],"zeilen":[{"text":"Nur tierische Zellen haben Lysosomen, Pflanzenzellen dagegen nicht.","loesung":4},{"text":"Du solltest den Aufbau nicht nur zeichnen, sondern auch alles erklären.","loesung":0},{"text":"Das ist leider nicht korrekt.","loesung":1},{"text":"Pflanzenzellen haben Chloroplasten. Hier findet die Photosynthese statt.","loesung":4},{"text":"Versuche beim Lernen die Bestandteile der pflanzlichen Zelle in eine Geschichte einzubauen, um sie Dir besser zu merken.","loesung":3},{"text":"Du hast 5 von 8 Bestandteilen einer Zelle korrekt beschrieben.","loesung":2},{"text":"Orientiere dich an den Leitfragen, die wir zum Aufbau von Zellen im Unterricht erarbeitet haben.","loesung":0}],"erklaerung":"Knowledge of Result (KR) ist die schlichte Richtig-Falsch-Rückmeldung ('Das ist leider nicht korrekt'), Knowledge of Performance (KP) die quantifizierte Leistungsangabe ('5 von 8 Bestandteilen'). Knowledge about Concepts (KC) liefert inhaltlich-fachliches Zusatzwissen zur Korrektur, hier die Fakten zu Lysosomen bzw. Chloroplasten. Knowledge on Task Constraints (KTC) erinnert an die Aufgabenanforderungen selbst (zeichnen UND erklären, an die erarbeiteten Leitfragen halten), während Knowledge on Metacognition (KMC) eine übergeordnete Lernstrategie vermittelt, hier den Rat, sich die Inhalte über eine Geschichte einzuprägen.","folie":"9_Feedback_Grundlagen (Narciss, Feedback-Komponenten)"},{"id":"hp3c-probekl2-08","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Rheinberg (1998), Paradoxe Effekte von Lob und Tadel","typ":"mc-kombi","frage":"Welche der folgenden Aussagen zu Lob und Tadel und deren Wirkung treffen zu?","aussagen":["Ein paradoxer Effekt von Lob tritt ein, wenn ein Schüler für die Bewältigung einer schwierigen Aufgabe gelobt wird, weil hohe Fähigkeiten bei ihm vermutet werden.","Ein paradoxer Effekt von Lob tritt ein, wenn ein Schüler für die Bewältigung einer schwierigen Aufgabe gelobt wird, weil seine Fähigkeiten als fehlend vermutet werden.","Ein paradoxer Effekt von Tadel tritt ein, wenn ein Schüler für die falsche Lösung einer schwierigen Aufgabe getadelt wird, weil hohe Fähigkeiten bei ihm vermutet werden.","Ein paradoxer Effekt von Tadel tritt ein, wenn ein Schüler für die Bewältigung einer einfachen Aufgabe getadelt wird, weil seine Fähigkeiten als fehlend vermutet werden.","Ein paradoxer Effekt von Lob tritt ein, wenn ein Schüler für die Bewältigung einer einfachen Aufgabe gelobt wird, weil seine Fähigkeiten als fehlend vermutet werden."],"aussagen_richtig":[2,4],"optionen":["Die Aussagen (1) und (3) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (1), (4) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (1), (3), (4) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussage (3) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":2,"erklaerung":"Nach dem Attributionsmodell zu Lob und Tadel schließen Lernende aus der Bewertung ihrer Leistung auf die Fähigkeitseinschätzung des Lehrers. Wird ein Schüler für das Scheitern an einer schwierigen Aufgabe getadelt, obwohl gerade schwierige Aufgaben nur mit Fähigkeit und Anstrengung lösbar sind, impliziert dies paradoxerweise eine hohe Fähigkeitszuschreibung und kann motivierend wirken. Wird umgekehrt für das Lösen einer einfachen Aufgabe gelobt, deutet dies auf eine niedrige Fähigkeitseinschätzung hin, da bei leichten Aufgaben Erfolg kaum lobenswert ist, wenn hohe Fähigkeit unterstellt wird - dieses paradoxe Lob wirkt demotivierend. Lob für eine schwierige, mit hoher oder fehlender Fähigkeit assoziierte Aufgabe sowie Tadel für die Bewältigung einer einfachen Aufgabe entsprechen nicht diesem Muster.","folie":"10_Feedback_Teil2_21_12_2021, Seite 47-49 (Paradoxe Effekte von Lob und Tadel, Rheinberg 1998)"},{"id":"hp3c-probekl2-11","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"ITFL-Modell / Interaktives Tutorielles Feedbackmodell (Narciss, 2006)","typ":"matrix","frage":"Kreuzen Sie für jede der folgenden Komponenten an, inwiefern sie im ITFL-Modell zur lernenden Person, zur lehrenden Person oder beiden Komponenten zugeordnet werden.","spalten":["lernende Person","lehrende Person","beide"],"zeilen":[{"text":"Informationsverarbeitungsstrategien","loesung":0},{"text":"Lehrziele","loesung":1},{"text":"Repräsentation von Standards für Lernaufgaben","loesung":2},{"text":"Regeleinrichtung","loesung":2},{"text":"Stellglied","loesung":0}],"erklaerung":"Im Interaktiven Tutoriellen Feedbackmodell (ITFL, Narciss 2006) stehen kognitive und metakognitive Informationsverarbeitungsstrategien sowie das Stellglied (Korrigieren, Monitoring, Anstrengen) auf der Seite der lernenden Person. Lehrziele gehören zu den Faktoren der Lehr-Lernsituation und damit zur lehrenden Seite. Die Repräsentation der Aufgabenanforderungen (Soll-Wert) existiert im Modell sowohl intern bei der lernenden Person als auch extern bei der lehrenden Person, ebenso die Regeleinrichtung, die als interne und als externe Regeleinrichtung jeweils einen Soll-Ist-Vergleich vornimmt - beide Komponenten sind daher beiden Seiten zugeordnet.","folie":"10_Feedback_Teil2_21_12_2021, Seite 4-5 (ITFL-Modell: Regelkreis mit lernender und lehrender Person)"},{"id":"nar-f52","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL7, Frage 52, S. 14","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006), Feedbackbegriff","typ":"multi","frage":"Welche der folgenden Aspekte sind begriffsbestimmend für Feedback (Narciss, 2006)?","optionen":["bietet Informationen über den aktuellen Stand der Bearbeitung von Lernaufgaben","wird formativ und/oder summativ gegeben.","bettet negative Kritik in positive Wertung ein","dient der Optimierung des Bearbeitungsprozesses","fokussiert auf die Schwächen des Lernenden"],"loesungen":[0,1,3],"erklaerung":"Nach Narciss (2006) bietet Feedback Informationen über den aktuellen Bearbeitungsstand einer Lernaufgabe (a), kann formativ und/oder summativ gegeben werden (b) und dient der Optimierung des Bearbeitungsprozesses (d). Feedback bettet negative Kritik nicht grundsätzlich in positive Wertung ein (c) und fokussiert begrifflich auch nicht per Definition auf die Schwächen des Lernenden (e); beides sind keine definierenden Merkmale, sondern höchstens Gestaltungsempfehlungen bzw. unzutreffende Engführungen des Begriffs."},{"id":"nar-f53","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL7, Frage 53, S. 14","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), Interaktives Tutorielles Feedback-Modell (ITFL)","typ":"multi","frage":"Welche Komponenten gehören zum externen Regelkreis des Interaktiven Tutoriellen Feedback-Modells (Narciss, 2006/13)?","optionen":["Stellglied","Regelgröße","Faktoren der Lehr-Lernsituation","Externe Messung","Faktoren der lernenden Person"],"loesungen":[2,3],"erklaerung":"Der externe Regelkreis des ITFL-Modells umfasst die Faktoren der Lehr-Lernsituation (c) sowie die externe Messung des Lernstands durch die Lehrperson bzw. das System (d), aus denen das externe Feedback abgeleitet wird. Stellglied (a) und Regelgröße (b) sind Bestandteile des internen Regelkreises der lernenden Person, und die Faktoren der lernenden Person (e) sind ein eigener Einflussfaktor, kein Bestandteil des externen Regelkreises selbst."},{"id":"nar-f54","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL7, Frage 54, S. 14","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), Interaktives Tutorielles Feedback-Modell (ITFL)","typ":"multi","frage":"Welche der folgenden Prinzipien für kompetenzorientiertes Feedback lassen sich aus dem ITFL-Modell (Narciss, 2006/13) ableiten?","optionen":["Sollwert soll geklärt und kommuniziert werden","Externes Feedback soll unmittelbar gegeben werden","Anwendung und Transfer der Feedbackinformation soll ermöglicht werden","Feedback muss sich auf regelbare Größen beziehen","Feedback muss sich auf personenbezogene Eigenschaften beziehen","Reflexion über Korrektur-/Verbesserungsmaßnahmen soll angeregt werden","Lernerfolge und Lernfortschritte sollen sichtbar gemacht werden","Bewertungen im Feedback sollen an Beispielen verdeutlicht werden"],"loesungen":[0,2,3,5,6],"erklaerung":"Aus dem ITFL-Modell lassen sich ableiten: den Sollwert klären und kommunizieren (a), Anwendung und Transfer der Feedbackinformation ermöglichen (c), Feedback auf regelbare, veränderbare Größen statt auf die Person beziehen (d), Reflexion über Korrektur- und Verbesserungsmaßnahmen anregen (f) sowie Lernerfolge und Lernfortschritte sichtbar machen (g). Dass externes Feedback unmittelbar gegeben werden muss (b), ist keine zwingende ITFL-Empfehlung, und Feedback auf personenbezogene Eigenschaften zu beziehen (e) widerspricht dem Modell sogar ausdrücklich, ebenso wie das bloße Bewerten an Beispielen (h) kein eigenständiges Prinzip des Modells ist."},{"id":"nar-f55","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL7, Frage 55, S. 14","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"Die Lehrperson gibt folgendes Feedback: „Du hast 3 von 10 Kriterien beachtet.“ Zu welcher Kategorie der inhaltlichen Feedbackkomponenten (Narciss) gehört dieses Beispiel?","optionen":["Knowledge of performance","Knowledge of result","Knowledge about mistakes","Knowledge on meta-cognition"],"loesung":0,"erklaerung":"Diese Rückmeldung gibt eine quantitative Einschätzung der Gesamtleistung anhand mehrerer Kriterien wieder, ohne die einzelnen Fehler zu benennen oder Hinweise zum weiteren Vorgehen zu geben. Das entspricht Knowledge of performance, also einer Information über den Grad der Aufgabenbewältigung, und unterscheidet sich damit von Knowledge of result (bloßes richtig/falsch), Knowledge about mistakes (konkrete Fehlerbenennung) und Knowledge on meta-cognition (Hinweise zur Selbststeuerung)."},{"id":"nar-f56","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL7, Frage 56, S. 14","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"Die Lehrperson gibt folgendes Feedback: „Versuche die Klammern von innen nach außen aufzulösen.“ Zu welcher Kategorie der inhaltlichen Feedbackkomponenten (Narciss) gehört dieses Beispiel?","optionen":["Knowledge of correct result","Knowledge of result","Knowledge on how to proceed","Knowledge about concepts"],"loesung":2,"erklaerung":"Diese Rückmeldung gibt eine konkrete, prozessbezogene Handlungsanweisung zum weiteren Vorgehen bei der Aufgabe und nennt weder das korrekte Ergebnis noch einen bestimmten Fehler. Das entspricht Knowledge on how to proceed und unterscheidet sich damit von Knowledge of correct result (Nennung der richtigen Lösung), Knowledge of result (bloßes richtig/falsch) und Knowledge about concepts (Erläuterung eines Begriffs)."},{"id":"nar-f68","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 68, S. 16","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), interner Regelkreis des ITFL-Modells","typ":"matrix","stamm":"Frau Ziesel behandelt im Biologie-Unterricht das Thema „Zellen“. Timo soll heute zum ersten Mal mit dem Mikroskop eine pflanzliche Zelle untersuchen und zeichnen, tut sich aber schwer und zeichnet fälschlicherweise eine tierische Zelle ab.","frage":"Ordnen Sie die folgenden Komponenten dem passenden Element des internen Regelkreises des ITFL-Modells (Narciss, 2006, 2013) zu. Kontext: Frau Ziesel behandelt im Biologieunterricht das Mikroskopieren und Zeichnen einer pflanzlichen Zelle; Timo hat dabei Schwierigkeiten.","spalten":["Interne Repräsentation von Standards","Interne Stellgröße","Messung/Diagnose","Diskrepanz (Vergleich Soll-Ist)","Regelgröße(n)","Stellglied (Umsetzung)","Internes Feedback/Ist-Wert"],"zeilen":[{"text":"Interpretation der Anforderungen aus dem Lehrplan","loesung":0},{"text":"„Ich will mir Mitschriften ausleihen und im Unterricht aufpassen.“","loesung":1},{"text":"wöchentlicher Test","loesung":2},{"text":"Diskrepanz","loesung":3},{"text":"Mikroskopieren und Zeichnen","loesung":4},{"text":"Mitschriften ausleihen, Anleitung zum Mikroskop lesen","loesung":5},{"text":"im Unterricht mitmachen und aufpassen","loesung":5},{"text":"„Die Zeichnung ist schön, aber das Mikroskop kann ich nicht bedienen.“","loesung":6}],"erklaerung":"Im internen Regelkreis repräsentiert die lernende Person zunächst intern die an sie gestellten Standards (Interpretation der Lehrplananforderungen), setzt sich eine interne Stellgröße (die eigene Handlungsabsicht), erzeugt über Handlungen wie das Mikroskopieren die Regelgröße (das tatsächliche Ergebnis), misst bzw. diagnostiziert dieses Ergebnis, vergleicht es im internen Feedback mit dem Sollwert und erkennt dabei eine Diskrepanz, die wiederum zu konkreten Stellglied-Handlungen wie dem Ausleihen von Mitschriften oder aktiver Mitarbeit führt."},{"id":"nar-f69","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 69, S. 17","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"„Du hast die Aufgabe falsch gelöst.“ Welcher inhaltlichen Feedbackkomponente entspricht diese Aussage?","optionen":["Knowledge of correct results","Knowledge of results"],"loesung":1,"erklaerung":"Die Rückmeldung teilt nur mit, dass das Ergebnis nicht stimmt, ohne die richtige Lösung zu nennen oder den Fehler zu benennen. Das entspricht Knowledge of results, während Knowledge of correct results zusätzlich die richtige Lösung nennen würde."},{"id":"nar-f70","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 70, S. 17","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"„Du kannst die Linse scharf stellen, indem du das kleinere der zwei Rädchen auf der rechten Seite leicht drehst.“ Welcher inhaltlichen Feedbackkomponente entspricht diese Aussage?","optionen":["Knowledge on how to proceed","Knowledge of task constraints"],"loesung":0,"erklaerung":"Diese Rückmeldung erklärt konkret, wie beim weiteren Vorgehen zu handeln ist, und entspricht damit Knowledge on how to proceed, nicht Knowledge of task constraints, das lediglich Rahmenbedingungen der Aufgabe (z. B. Materialvorgaben) beschreiben würde."},{"id":"nar-f71","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 71, S. 17","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"„Eine pflanzliche Zelle unterscheidet sich durch vorhandene Zellwände von einer tierischen Zelle.“ Welcher inhaltlichen Feedbackkomponente entspricht diese Aussage?","optionen":["Knowledge about concepts","Knowledge of task constraints"],"loesung":0,"erklaerung":"Diese Aussage erläutert einen fachlichen Begriff bzw. Sachverhalt (das Unterscheidungsmerkmal Zellwand) und entspricht damit Knowledge about concepts, nicht Knowledge of task constraints, das sich auf äußere Rahmenbedingungen der Aufgabenbearbeitung bezieht."},{"id":"nar-f72","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 72, S. 17","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"„Ein Fehler ist, dass du eine tierische Zelle gezeichnet hast.“ Welcher inhaltlichen Feedbackkomponente entspricht diese Aussage?","optionen":["Knowledge of correct results","Knowledge about mistakes"],"loesung":1,"erklaerung":"Die Rückmeldung benennt konkret den begangenen Fehler und entspricht damit Knowledge about mistakes, im Unterschied zu Knowledge of correct results, das die richtige Lösung nennen, aber nicht den Fehler selbst benennen würde."},{"id":"nar-f73","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 73, S. 17","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"„Gib beim nächsten Mal nicht so schnell auf und überlege, was du bisher schon über Zellen weißt.“ Welcher inhaltlichen Feedbackkomponente entspricht diese Aussage?","optionen":["Knowledge on meta-cognition","Knowledge on how to proceed"],"loesung":0,"erklaerung":"Diese Rückmeldung regt zur Selbststeuerung und Reflexion des eigenen Vorwissens und Lernverhaltens an und entspricht damit Knowledge on meta-cognition, nicht Knowledge on how to proceed, das eine konkrete fachliche Handlungsanweisung geben würde."},{"id":"nar-f74","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 74, S. 17","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"„Du hast 3 von 10 Kriterien beachtet.“ Welcher inhaltlichen Feedbackkomponente entspricht diese Aussage?","optionen":["Knowledge of performance","Knowledge of result"],"loesung":0,"erklaerung":"Die Rückmeldung gibt eine quantifizierte Gesamteinschätzung der Aufgabenbewältigung anhand mehrerer Kriterien und entspricht damit Knowledge of performance, nicht dem einfacheren Knowledge of result, das nur richtig/falsch mitteilen würde."},{"id":"nar-f75","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 75, S. 17","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"„Beim Zeichnen sollte man immer mit Bleistift und weißem Papier vorgehen.“ Welcher inhaltlichen Feedbackkomponente entspricht diese Aussage?","optionen":["Knowledge of task constraints","Knowledge on how to proceed"],"loesung":0,"erklaerung":"Diese Aussage nennt eine allgemeine Rahmenbedingung bzw. formale Vorgabe für die Aufgabenbearbeitung und entspricht damit Knowledge of task constraints, nicht Knowledge on how to proceed, das eine konkrete inhaltliche Handlungsanweisung zur Lösung geben würde."},{"id":"nar-f76","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL8, Frage 76, S. 17","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), inhaltliche Feedbackkomponenten","typ":"single","frage":"„Hier siehst du die vollständige Zeichnung einer pflanzlichen Zelle.“ Welcher inhaltlichen Feedbackkomponente entspricht diese Aussage?","optionen":["Knowledge of correct results","Knowledge about concepts"],"loesung":0,"erklaerung":"Diese Rückmeldung zeigt direkt die korrekte Lösung und entspricht damit Knowledge of correct results, nicht Knowledge about concepts, das einen fachlichen Begriff erläutern, aber nicht die vollständige richtige Lösung präsentieren würde."},{"id":"nar-f77","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL9, Frage 77, S. 17","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), Interaktives Tutorielles Feedback-Modell (ITFL)","typ":"multi","stamm":"Frau Meier nimmt am Ende des ersten Halbjahres die Schüler ihrer Klasse einzeln zur Seite und teilt ihnen ihre mündlichen Noten mit.","frage":"Frau Meier teilt Leon am Ende des ersten Halbjahres seine mündliche Note mit. Welche der folgenden Beschreibungen des Feedbacks für Leon sind vor dem Hintergrund des ITFM sinnvoll?","optionen":["Frau Meier teilt Leon seine Mitarbeitsnote für das erste Halbjahr mit. Als er anschließend
