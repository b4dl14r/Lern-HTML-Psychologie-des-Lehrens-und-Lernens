ines davon"],"zeilen":[{"text":"Martina hatte vor vier Wochen angefangen für die Prüfung zu lernen. Als sie nun nach einer Definition aus dem Skript gefragt wird, kann sie diese nicht wiedergeben.","loesung":0},{"text":"Olaf spricht fließend Spanisch und Französisch. Als er nun versucht Portugiesisch zu lernen, fällt es ihm sehr schwer, sich Vokabeln korrekt einzuprägen.","loesung":4},{"text":"Nadja hat anhand von Bildern die Namen von Singvögeln gelernt. Als sie nun im Wald ist und die Vögel von weitem beobachtet, fallen ihr die Namen nicht ein, da die Farben im Dämmerlicht ganz anders erscheinen.","loesung":1},{"text":"Tim macht Praktikum im Krankenhaus. Nachdem er gestern viele neue Namen gelernt hatte, ist er heute auf einer anderen Station mit anderen Menschen. Während er versucht, sich die neuen Namen zu merken, merkt er, wie er die Namen von gestern wieder vergisst.","loesung":2},{"text":"Claudia beschreibt ihren neuen Professor als zynischen Mann mit einer dicken Hornbrille. Ihre Kommilitonin aber meint, der Professor habe gar keine Brille getragen.","loesung":3}],"erklaerung":"Martinas Fall ist reiner Zeitverlauf ohne Wiederholung oder konkurrierendes Lernen – Spurenzerfall. Nadjas Problem entsteht durch veränderte Abrufreize (andere Farbwirkung im Dämmerlicht) bei intaktem Gedächtnisinhalt – eine Zugriffsstörung. Tims neu gelernte Namen überlagern die tags zuvor gelernten – retroaktive Interferenz. Claudias widersprüchliche Erinnerung an die Brille entsteht durch eine schemakonforme Rekonstruktion ('zynischer Professor trägt Brille') – eine systematische Verzerrung. Olafs Schwierigkeit, Portugiesisch zu lernen, weil er bereits Spanisch und Französisch spricht, ist ein Fall von proaktiver Interferenz; da diese in den angebotenen Spalten nicht als Option zur Verfügung steht, ist hier 'keines davon' zutreffend.","folie":"3 Ged_chtnis_.txt"},{"id":"ueb-022","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 12, Klausuraufgabe 13","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Baddeley (1986), Arbeitsgedächtnismodell","typ":"matrix","frage":"Welche der folgenden Aussagen zum Arbeitsgedächtnismodell von Baddeley (1986) ist aus gedächtnispsychologischer Sicht sinnvoll?","spalten":["sinnvoll","nicht sinnvoll"],"zeilen":[{"text":"Zur Aufrechterhaltung sprachlicher Informationen im Arbeitsgedächtnis ist fortwährende Wiederholung in Gedanken (rehearsal) notwendig.","loesung":0},{"text":"Damit sprachliche Informationen ins Langzeitgedächtnis übertragen werden können, müssen sie durch die zentrale Exekutive als relevant beurteilt werden.","loesung":0},{"text":"Der episodische Puffer (Zwischenspeicher) integriert sprachliche und visuelle Informationen und hält Reihenfolgeinformationen aufrecht.","loesung":0},{"text":"Die zentrale Exekutive ist modalitätsspezifisch und bei manchen Menschen eher für den visuellen Kanal, bei anderen Menschen eher für den auditiven Kanal ausgeprägt.","loesung":1}],"erklaerung":"Die phonologische Schleife hält sprachliche Information durch fortlaufendes artikulatorisches Rehearsal aufrecht, die zentrale Exekutive steuert Aufmerksamkeit und Relevanzbewertung für die Weiterverarbeitung, und der episodische Puffer integriert Informationen aus phonologischer Schleife, visuell-räumlichem Notizblock und Langzeitgedächtnis zu einer geordneten Sequenz. Falsch ist dagegen, dass die zentrale Exekutive modalitätsspezifisch sei: Genau umgekehrt gilt sie als domänen-allgemeines, modalitätsunabhängiges Kontrollsystem, während nur die beiden untergeordneten Systeme (phonologische Schleife, visuell-räumlicher Notizblock) modalitätsspezifisch arbeiten."},{"id":"ex2016-05-2","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 5.2","vertrauen":"hoch","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Cognitive Load / Gestaltung von Erklärungen","typ":"matrix","stamm":"Den Teilnehmern ist deutlich geworden, dass das Kurzzeitgedächtnis nicht unbegrenzt belastbar ist, und sie wollen dieses Wissen für die Unterrichtsgestaltung nutzen. In Gruppenarbeit lassen Sie Ideen sammeln, wie man das Kurzzeitgedächtnis in verschiedenen Unterrichtssituationen entlasten kann. Bei der Vorstellung merken Sie, dass nicht alle Ideen wirklich empfehlenswert sind.","frage":"Welche der folgenden Empfehlungen sind beim Erklären von Unterrichtsinhalten sinnvoll, um das Kurzzeitgedächtnis zu entlasten?","spalten":["sinnvoll","nicht sinnvoll"],"zeilen":[{"text":"Man sollte nicht gleichzeitig schon das nächste Thema erläutern, wenn sich die Schüler noch Notizen zu den vorherigen Erklärungen der Lehrperson machen.","loesung":0},{"text":"Man sollte mündliche Erklärungen möglichst gleichzeitig noch einmal wortwörtlich auf einer Folie (oder an der Tafel) präsentieren.","loesung":1},{"text":"Man sollte die Schüler für wichtige Informationen, die noch nicht im Langzeitgedächtnis gespeichert sind, einen externen Speicher anlegen lassen.","loesung":0},{"text":"Man sollte mündliche Erklärungen visuell unterstützen, indem man gleichzeitig möglichst viele verschiedene Bilder zum Thema präsentiert.","loesung":1},{"text":"Man sollte die Schüler dazu auffordern, mündlich gegebene Aufgabenstellungen immer wieder vor sich hin zu sprechen, damit sie die Aufgabe nicht vergessen.","loesung":1}],"erklaerung":"Entlastung heißt: weniger gleichzeitige Anforderungen an den begrenzten Arbeitsspeicher. Das gelingt, wenn man Notieren und neue Erklärung zeitlich trennt, und wenn man Information nach außen verlagert – ein Hefteintrag oder Tafelbild ist ein externer Speicher und entlastet genau deshalb. Die drei anderen tun das Gegenteil. Gesprochenen Text wortwörtlich zusätzlich einzublenden zwingt zum Abgleich zweier identischer Quellen und belastet zusätzlich; das ist der Redundanzeffekt. Viele Bilder gleichzeitig erzwingen Suchen und Zuordnen statt Verstehen. Und lautes Vor-sich-hin-Sprechen bindet die phonologische Schleife dauerhaft, statt sie freizumachen – es hält die Aufgabe zwar präsent, aber auf Kosten der Kapazität, die zum Lösen gebraucht wird.","folie":"4 Instruktionsdesign Gedächtnis"},{"id":"hp3a-lu-02","quelle":"Praktisch – Lernumgebung: Aufgaben und Lösungen, HP3-Sammlung S. 33f.","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Reinmann & Mandl (2006); Friedrich & Mandl (1997), gegenstandszentrierte vs. situierte Lernumgebungen","typ":"matrix","frage":"Welche der folgenden Ansatzpunkte/Beispiele sind welchen Grundpositionen zur Gestaltung von Lernumgebungen zuzuordnen?","spalten":["Gegenstandszentrierte LU","Situierte LU"],"zeilen":[{"text":"Lernen in konkreten, sozialen Situationen","loesung":1},{"text":"Lehren und Lernen im Sinn von Darbieten, Anleiten und Erklären","loesung":0},{"text":"Beispiel: Fahrstunden","loesung":1},{"text":"Steuerung des Lernprozesses von außen","loesung":0},{"text":"Lernen als „Rezeption“","loesung":0},{"text":"Beispiel: Theorieunterricht in der Fahrschule","loesung":0},{"text":"Lernen während der „Anwendung“","loesung":1}],"erklaerung":"Diese Zuordnung ist im Quelldokument selbst nicht markiert (die als „fett“ gekennzeichneten Lösungen gingen bei der Textextraktion verloren) und wurde deshalb über den wörtlichen Abgleich mit den Vorlesungsfolien rekonstruiert. Gegenstandszentrierte Lernumgebungen sind durch „von außen angeleitete Informationsverarbeitung“ und „Unterrichten im Sinn von Anleiten, Darbieten, Erklären“ gekennzeichnet, bei der Wissen als rezeptiv aufzunehmender Gegenstand vermittelt wird (daher: Steuerung von außen, Lernen als Rezeption, Theorieunterricht als klassischer Frontalunterricht). Situierte Lernumgebungen betonen Lernen in authentischen, konkreten sozialen Situationen und während der praktischen Anwendung, wie es die praktische Fahrstunde – im Gegensatz zum theoretischen Fahrschulunterricht – exemplarisch zeigt.","folie":"4 Instruktionsdesign Ged_chtnis.txt, Folie 8 und 15 (Primat der Instruktion / rezeptiver Wissenserwerb vs. Primat der Konstruktion / learning by doing)"},{"id":"hp3a-lu-04","quelle":"Praktisch – Lernumgebung: Aufgaben und Lösungen, HP3-Sammlung S. 34","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Merrill (2002), First Principles of Instruction","typ":"mc-kombi","frage":"Welche der Aussagen (1) – (5) zu den First Principles of Instruction (Merrill, 2002) treffen zu?","aussagen":["Problemzentrierung beinhaltet die Bearbeitung einer kompletten Aufgabe, auf mehreren Ebenen, mit abnehmendem Komplexitätsgrad.","Die Aktivierung von Vorwissen dient als Grundlage für neues Wissen.","Demonstration von bereits bekanntem Wissen fördert den Lernprozess.","Anwendung erfolgt mit Bezug zu den Lernzielen mittels ständigem (gleichbleibendem) Coaching.","Integration bietet dem Lernenden die Möglichkeit, Gelerntes in seiner Umgebung anzuwenden."],"optionen":["Die Aussagen (1) und (3) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu, alle anderen Aussagen nicht.","Die Aussagen (2), (3) und (5) treffen zu, alle anderen Aussagen nicht.","Die Aussagen (2), (3), (4) und (5) treffen zu, alle anderen Aussagen nicht.","Aussage (3) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":1,"aussagen_richtig":[1,4],"erklaerung":"Aussage (1) ist falsch: Das Prinzip der Problemzentrierung verlangt laut Vorlesungsfolien eine Bearbeitung mit zunehmendem, nicht abnehmendem Komplexitätsgrad. Aussage (2) ist korrekt: Die Aktivierung von Vorwissen (Advance Organizers) bildet die Grundlage für den Erwerb neuen Wissens. Aussage (3) ist falsch: Demonstration bedeutet laut Merrill „modelling not telling what is to be learned“, also das Vorführen des noch zu lernenden Wissens, nicht bereits bekannten Wissens. Aussage (4) ist falsch: Anwendung erfolgt mit abnehmendem, nicht gleichbleibendem Coaching (Coaching, Scaffolding, Fading). Aussage (5) ist korrekt: Integration bedeutet den Transfer des Gelernten in die eigene Umgebung/den Alltag. Damit treffen nur (2) und (5) zu. Die Rekonstruktion stützt sich auf Randnotizen im Quelldokument, die explizit auf die betreffenden Foliennummern verweisen, sowie auf den Abgleich mit den Vorlesungsfolien selbst.","folie":"4 Instruktionsdesign Ged_chtnis.txt, Folie 24-25 (First Principles of Instruction: Aktivierung, Demonstration „modelling not telling“, Anwendung mit Fading, Integration = Transfer in den Alltag)"},{"id":"hp3a-mp2019-07","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 22","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Friedrich & Mandl (1997), Förderung selbstregulierten Lernens","typ":"matrix","frage":"In der folgenden Tabelle sind verschiedene Fördermaßnahmen für selbstreguliertes Lernen aufgelistet. Ordnen Sie die Fördermaßnahmen der geeigneten Kategorie von Fördermaßnahmen (direkte Förderung, indirekte Förderung, kombinierte Förderung) nach Friedrich & Mandl (1997) zu. Achtung, pro Maßnahme gibt es nur eine korrekte Antwort.","spalten":["Direkte Förderung","Indirekte Förderung","Kombinierte Förderung"],"zeilen":[{"text":"Einsatz von Lerntagebüchern und vorheriger Erörterung des Nutzens","loesung":0},{"text":"Einsatz einer Lernumgebung mit adaptivem tutoriellem Feedback","loesung":1},{"text":"Erklärung und Einüben von Kontrollstrategien unter variierenden Aufgabenbedingungen","loesung":0},{"text":"Training von Elaborationsstrategien","loesung":0},{"text":"Einsatz von gemeinsam ausgehandelten Lernplänen","loesung":2},{"text":"Reflexion des Lernprozesses an einem bestimmten Lerninhalt","loesung":1}],"erklaerung":"Diese Aufgabe ist inhaltlich nahezu identisch mit der entsprechenden Aufgabe der Gedächtnisklausur WiSe 2020/21 (siehe hp3a-ws2021-06) und wurde anhand dieses Parallelbefunds rekonstruiert. Direkte Förderung trainiert Strategien unmittelbar und explizit, wie das Einüben von Kontrollstrategien oder Elaborationsstrategien. Indirekte Förderung regt Selbstregulation beiläufig an, etwa durch adaptives tutorielles Feedback oder Prompts zur Reflexion des Lernprozesses. Kombinierte Förderung verbindet beides, etwa wenn Lernpläne gemeinsam ausgehandelt und ihre Effekte anschließend besprochen werden. Eine im Quelldokument erhaltene Randnotiz („laut Lösungen c“) bestätigt die Zuordnung der Lernplan-Zeile zur kombinierten Förderung. Da die übrigen Zuordnungen nicht durch eigene X-Markierungen dieses Dokuments, sondern über die Parallelaufgabe abgesichert sind, wird nur mittleres Vertrauen angesetzt."},{"id":"hp3a-mp2019-08","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 23","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Reinmann & Mandl (2006); Friedrich & Mandl (1997), gegenstandszentrierte vs. konstruktivistische Lernumgebungen","typ":"matrix","stamm":"In der pädagogischen Diskussion zur Gestaltung von Lernumgebungen gibt es zwei Extrempole mit unterschiedlichen Grundannahmen (gegenstandszentriert vs. konstruktivistisch). Stellt man diese Extreme gegenüber, werden verschiedene Funktionen der Lehrperson deutlich.","frage":"Ordnen Sie die Aussagen dem Ansatz von Lernumgebungen (konstruktivistisch, gegenstandszentriert) zu, in welchem die Lehrperson diese Funktion erfüllt. Falls die Aussage nicht in direktem Bezug zu einem der Ansätze steht, ordnen Sie diese der Antwortmöglichkeit „in keinem Ansatz“ zu.","spalten":["Gegenstandszentriert","Konstruktivistisch","In keinem Ansatz"],"zeilen":[{"text":"strebt vor allem danach, die Instruktion zu optimieren.","loesung":0},{"text":"schafft vor allem Lernangebote, mit denen Lernende Wissensstrukturen eigenständig aufbauen können.","loesung":1},{"text":"bewertet weder den Lernprozess noch das Lernergebnis.","loesung":2},{"text":"gibt nur Hinweise zu dem Lernprozess selbst, nicht zu den Lerninhalten.","loesung":2},{"text":"strukturiert das Lernmaterial inhaltlich und unterrichtet entsprechend dieser Struktur.","loesung":0},{"text":"definiert Problemsituationen und stellt Werkzeuge zur Problembearbeitung zur Verfügung.","loesung":1},{"text":"definiert zu Beginn kleinschrittige Lehr-Lernziele.","loesung":0},{"text":"zeigt inhaltliche Beziehungen auf und erläutert diese den Lernenden.","loesung":0}],"erklaerung":"Diese Aufgabe entspricht inhaltlich der Aufgabe zu Lehrperson-Funktionen der Gedächtnisklausur WiSe 2020/21 (siehe hp3a-ws2021-13) und wurde über diesen Parallelbefund sowie die Vorlesungsfolien rekonstruiert; die im Quelldokument aufgeführten Zeilen 5 und 6 waren durch ein Layoutproblem der PDF-Extraktion zu einer einzigen Antwortzeile verschmolzen und wurden anhand der Parallelaufgabe wieder getrennt. Gegenstandszentrierte Lernumgebungen folgen dem „Primat der Instruktion“ (Optimieren der Instruktion, kleinschrittige Lernziele, inhaltliche Strukturierung, Aufzeigen von Zusammenhängen). Konstruktivistische Lernumgebungen folgen dem „Primat der Konstruktion“ (Bereitstellen von Problemsituationen und Werkzeugen, damit Lernende Wissen selbst aufbauen). Bewertung des Lernprozesses/-ergebnisses sowie rein prozessbezogene Hinweise ohne Inhaltsbezug gehören zu keinem der beiden Ansätze.","folie":"4 Instruktionsdesign Ged_chtnis.txt, Folie 8 und 15/21 (Primat der Instruktion vs. Primat der Konstruktion)"},{"id":"hp3a-ws2021-01","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 7 (Lösung S. 17)","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","typ":"matrix","frage":"Im Lernprozess können drei verschiedene Arten von Aufgaben hinsichtlich ihrer Zielsetzungen unterschieden werden: Lernaufgaben, Übungsaufgaben und Testaufgaben. Kreuzen Sie an, auf welche Aufgabenart die folgenden Aussagen jeweils zutreffen (nur eine korrekte Antwort pro Aussage).","spalten":["Lernaufgabe","Übungsaufgabe","Testaufgabe"],"zeilen":[{"text":"Diese Aufgaben haben den Anspruch, den aktuellen Wissensstand zu erfassen.","loesung":2},{"text":"Diese Aufgaben sollen kognitive Prozesse anregen, die der Lernende möglicherweise spontan nicht ausführen würde.","loesung":1},{"text":"Diese Aufgaben sollen den Wissenserwerb durch Selektieren, Organisieren oder Generieren unterstützen.","loesung":0},{"text":"Diese Aufgaben dienen dem Festigen bzw. Automatisieren von erworbenem Wissen.","loesung":1},{"text":"Diese Aufgaben zielen darauf ab, Wissen zu verändern.","loesung":0}],"erklaerung":"Lernaufgaben sollen Wissen verändern bzw. neu aufbauen und unterstützen dies durch Selektions-, Organisations- und Generierungsprozesse. Übungsaufgaben festigen und automatisieren bereits erworbenes Wissen und regen dabei kognitive Prozesse an, die der Lernende ohne die Aufgabe nicht spontan ausführen würde. Testaufgaben erheben lediglich den aktuellen Wissensstand, ohne selbst Lernprozesse anzustoßen. Im Quelldokument sind die Zuordnungen der Zeilen 2 und 5 selbst als unsicher markiert, weshalb hier nur mittleres Vertrauen angesetzt wird."},{"id":"hp3a-ws2021-03","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 8 (Lösung S. 17)","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Körndle et al. (2004), Dimensionen der Aufgabenkonstruktion","typ":"matrix","stamm":"Frau Hahnig bereitet einen Workshop zum Thema Erste Hilfe vor. Das Ziel des Workshops ist es, bei den Teilnehmenden praktisches Wissen zur Ein- und Zweihelfermethode in einer Wiederbelebungs-Situation aufzubauen. Zu diesem Zweck möchte Frau Hahnig verschiedene Lernaufgaben konstruieren. Bei der Konstruktion der Aufgaben trifft sie verschiedene Entscheidungen bzgl. Inhalt, kognitive Operationen, Form und Interaktivität.","frage":"Kreuzen Sie für jede der unten aufgeführten Festlegungen an, zu welcher Dimension des Aufgabenkonstruktionsprozesses nach Körndle et al. (2004) sie zuzuordnen ist (pro Aussage nur eine korrekte Antwort).","spalten":["Inhalt","Kogn. Operation","Form","Interaktivität"],"zeilen":[{"text":"Eine Aufgabe soll in Kleingruppen bearbeitet werden.","loesung":3},{"text":"Eine Aufgabe zu Beginn hat die Begriffe der Einhelfer- und Zweihelfermethode zum Gegenstand.","loesung":0},{"text":"Der Inhalt einer Aufgabe wird grafisch dargestellt.","loesung":2},{"text":"Eine Aufgabe bezieht sich auf zentrale Erkenntnisse zur Anzahl der Beatmungen und Herzdruckmassagen.","loesung":0},{"text":"Die richtige Antwort zur Aufgabe soll aus mehreren Antwortalternativen gewählt und angeklickt werden.","loesung":2},{"text":"Eine Aufgabe soll das Bedienelement „Hinweis“ enthalten, das zusätzliche Lösungsinformationen bereitstellt.","loesung":3},{"text":"Eine Aufgabe verlangt, dass die dargebotenen Inhalte in eigenen Worten wiedergegeben werden.","loesung":1},{"text":"Eine Aufgabe soll so konstruiert sein, dass die erforderlichen Teilaufgaben angezeigt werden.","loesung":3},{"text":"Beim Lösen einer Aufgabe sollen Gemeinsamkeiten und Unterschiede gefunden werden.","loesung":1},{"text":"Bei der Aufgabenbearbeitung soll zu den Teilschritten und -lösungen Feedback gegeben werden.","loesung":3}],"erklaerung":"Körndle et al. (2004) unterscheiden bei der Aufgabenkonstruktion vier Dimensionen: Inhalt (welches Wissen thematisiert wird, z. B. Begriffe oder Fakten), kognitive Operation (welcher Verarbeitungsprozess verlangt wird, z. B. Wiedergeben in eigenen Worten oder Vergleichen), Form (die äußere Gestaltung der Aufgabe, z. B. Multiple-Choice oder grafische Darstellung) und Interaktivität (die Interaktionsmöglichkeiten zwischen Lernendem und Aufgabe, z. B. Hinweise, Teilaufgaben-Anzeige, Feedback oder Sozialform der Bearbeitung). Die Zeilen 1 und 8 sind im Quelldokument mit einem Fragezeichen versehen, weshalb hier nur mittleres Vertrauen angesetzt wird."},{"id":"hp3a-ws2021-06","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 9 (Lösung S. 18)","vertrauen":"hoch","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Friedrich & Mandl (1997), Förderung selbstregulierten Lernens","typ":"matrix","frage":"In der folgenden Tabelle sind verschiedene Fördermaßnahmen für selbstreguliertes Lernen aufgelistet. Ordnen Sie die Fördermaßnahmen der geeigneten Kategorie von Fördermaßnahmen nach Friedrich & Mandl (1997) zu (eine korrekte Antwort pro Maßnahme).","spalten":["Direkte Förderung","Indirekte Förderung","Kombinierte Förderung"],"zeilen":[{"text":"Üben von Organisationsstrategien","loesung":0},{"text":"Gemeinsames Generieren von Lernplänen mit anschließendem Einsatz und Diskussion der beobachteten Effekte auf das Lernen","loesung":2},{"text":"Prompts, die die Evaluation des Lernprozesses zu einem bestimmten Lerninhalt anregen","loesung":1},{"text":"Einsatz eines Intelligenten Tutoriellen Systems mit adaptivem informativem Feedback","loesung":1},{"text":"Erläuterung und Training von Kontrollstrategien unter variierenden Aufgabenbedingungen","loesung":0},{"text":"Erörterung des Nutzens von Lerntagebüchern mit anschließenden Übungsgelegenheiten","loesung":0}],"erklaerung":"Direkte Förderung trainiert Lern- und Kontrollstrategien unmittelbar und explizit, etwa durch Üben von Organisationsstrategien oder angeleitetes Training von Kontrollstrategien unter variierenden Bedingungen. Indirekte Förderung schafft Lernumgebungen, die selbstreguliertes Lernen beiläufig anregen, ohne Strategien direkt zu vermitteln, etwa durch Prompts zur Prozessevaluation oder adaptives Feedback eines tutoriellen Systems. Kombinierte Förderung verbindet beide Wege, etwa wenn Lernpläne gemeinsam ausgehandelt und anschließend deren Effekte gemeinsam reflektiert werden, sodass sowohl direkte Erörterung als auch indirekte Selbststeuerung durch Diskussion zusammenwirken."},{"id":"hp3a-ws2021-07","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 10 (Lösung S. 19)","vertrauen":"hoch","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Schnotz (2005), integriertes Modell des Text- und Bildverstehens","typ":"multi","stamm":"Anhand eines Videos soll Psychologie-Studierenden der anatomische und funktionale Aufbau des menschlichen Gehirns vermittelt werden. Dabei werden mehrere Bilder mit gesprochenem sowie geschriebenem Text kombiniert, jedoch nicht immer auf eine lernförderliche Art und Weise.","frage":"Beurteilen Sie anhand der Implikationen aus Schnotz' integriertem Modell des Text- und Bildverstehens (2005) die Richtigkeit der folgenden Aussagen. Kreuzen Sie die Aussagen an, die nach dem Modell zutreffen.","optionen":["Bei nicht gleichzeitiger Darbietung von Text- und Bildelementen sollte zuerst der Text präsentiert werden.","Dynamische Sachverhalte sollten grundsätzlich mithilfe von Animationen veranschaulicht werden.","Besonders bei der Darstellung komplexer Hirnfunktionen und -zusammenhänge sollten Bilder durch geschriebenen Text ergänzt werden.","Die Darbietung auditiver Informationen sollte durch Musik und Geräusche ergänzt werden.","Eine Information sollte nicht durch mehrere Bilder, sondern nur durch dasjenige visualisiert werden, das den Wissensinhalt am besten repräsentiert."],"loesungen":[2,4],"erklaerung":"Nach Schnotz' Modell unterstützen deskriptionale (Text) und depiktionale (Bild) Repräsentationen unterschiedliche kognitive Prozesse und sollten sich ergänzen: Komplexe Hirnfunktionen profitieren davon, wenn Bilder durch erklärenden Text ergänzt werden, da Bilder allein die zugrunde liegenden Relationen oft nicht hinreichend explizit machen (c). Zudem sollte pro Wissensinhalt die Bildquelle gewählt werden, die den Sachverhalt am besten repräsentiert, statt redundant mehrere Bilder anzubieten, da überzählige Bilder unnötige kognitive Verarbeitungskapazität binden (e). Eine generelle Regel, Text stets vor Bild zu zeigen (a), oder dynamische Inhalte grundsätzlich zu animieren (b), lässt sich aus dem Modell nicht ableiten; auch die Ergänzung auditiver Informationen durch Musik und Geräusche (d) ist nicht durch das Modell begründet und würde eher zusätzliche, irrelevante kognitive Belastung erzeugen."},{"id":"hp3a-ws2021-10","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 11 (Lösung S. 18)","vertrauen":"hoch","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Sweller (1993), Cognitive Load Theory","typ":"single","stamm":"In einem Online-Lernangebot werden zu verschiedenen Themen Erklärvideos angeboten. Darüber hinaus können sich die Lernenden Arbeitsblätter zu den Videos ausdrucken und bearbeiten. Die Videos sind aufwendig produziert und die Inhalte wurden verständlich aufbereitet; es wurden Illustrationen, Bilder, Grafiken und Simulationen verwendet. Eine Evaluation ergab, dass sowohl die Videos als auch die Arbeitsblätter als hilfreich wahrgenommen wurden, dass der Lernzuwachs bei vielen Lernenden jedoch gering ist und sie sich kaum an das Gesehene erinnern können.","frage":"Welche Maßnahme wäre vor dem Hintergrund der Cognitive Load Theory (Sweller, 1993) sinnvoll, um den Wissenserwerb zu fördern?","optionen":["Um den Germane Load zu erhöhen, sollen die Lernenden die Videos an gekennzeichneten Stellen anhalten und die Inhalte auf dem Arbeitsblatt in eigenen Worten zusammenfassen.","Um den Intrinsic Load zu reduzieren, sollen die Lernenden alle Videos zu Beginn komplett anschauen, um einen Überblick zu erhalten.","Um den Intrinsic Load zu erhöhen, sollen die Lernenden während des Anschauens der Videos das dazugehörige Arbeitsblatt parallel ausfüllen.","Um den Extraneous Load zu reduzieren, sollen sich die Lernenden immer nur ein Video anschauen und vor dem nächsten Video eine längere Pause machen.","Um den Germane Load zu reduzieren, sollen sich die Lernenden vor dem Anschauen der Videos die vom Lehrer bereitgestellten Fragen zu den Videos anschauen und diese nach dem Anschauen beantworten."],"loesung":0,"erklaerung":"Germane Load ist die kognitive Belastung, die für lernrelevante Verarbeitung wie Elaboration und Schemabildung aufgewendet wird; Zusammenfassen in eigenen Worten an sinnvollen Haltepunkten regt genau diese Prozesse an und erhöht damit gezielt den Germane Load, ohne die Extraneous Load zu steigern (a, richtig). Die übrigen Optionen benennen die falsche Ladungsart oder die falsche Wirkrichtung: Ein vollständiges Vorab-Anschauen aller Videos reduziert nicht den Intrinsic Load, der durch die Komplexität des Lerninhalts selbst bestimmt wird (b); paralleles Ausfüllen des Arbeitsblatts während des Videos erhöht die Extraneous statt der Intrinsic Load und überlastet das Arbeitsgedächtnis durch Aufteilen der Aufmerksamkeit (c); lange Pausen zwischen einzelnen Videos senken nicht gezielt die Extraneous Load, die durch die Gestaltung des Materials selbst entsteht (d); und die vorherige Durchsicht von Leitfragen (Segmenting/Pre-Training) dient dem Management des Intrinsic Load, nicht der Reduktion des Germane Load (e)."},{"id":"hp3a-ws2021-11","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 11 (Lösung S. 18f.)","vertrauen":"hoch","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Generative Lernaktivitäten (Selektion, Organisation, Elaboration)","typ":"matrix","stamm":"Peter arbeitet als Techniker in einem biologischen Labor und beschließt an einer Fernuniversität Psychologie zu studieren. Den zentralen Schwerpunkt des Fernstudiums bilden Studienbriefe, die Peter zuhause durcharbeiten, Verständnisprobleme klären und deren Inhalte gründlich lernen muss. Er weiß, dass ihm generative Lernaktivitäten dabei helfen werden.","frage":"Kreuzen Sie für jede der folgenden generativen Lernaktivitäten an, inwiefern sie vorrangig die kognitiven Prozesse der Selektion, Organisation oder Elaboration anregen. Organisation und Elaboration beinhalten in der Regel Selektion; kreuzen Sie in solchen Fällen nur die übergeordnete Kategorie an (nur eine richtige Antwort pro Aktivität).","spalten":["Selektion","Organisation","Elaboration","Keinen der Prozesse"],"zeilen":[{"text":"Unbekannte Begriffe unterstreichen","loesung":0},{"text":"Haupt- und Unterbegriffe bestimmen","loesung":1},{"text":"Zentrale Aussagen nach Wichtigkeit sortieren","loesung":1},{"text":"Wortwörtliche Stichpunkte herausschreiben","loesung":0},{"text":"Analogien zu bereits bekannten Konzepten suchen","loesung":2},{"text":"Textinformationen in Form von Grafiken visualisieren","loesung":1},{"text":"Ein Beispiel ausdenken","loesung":2},{"text":"Die gesamten Studienmaterialien noch einmal selbst abtippen","loesung":3},{"text":"Die Materialien wiederholt durchlesen","loesung":3}],"erklaerung":"Selektion umfasst das Herausfiltern relevanter Information aus dem Text, ohne sie bereits zu strukturieren oder mit Vorwissen zu verknüpfen, wie beim Unterstreichen unbekannter Begriffe oder beim wortwörtlichen Herausschreiben von Stichpunkten. Organisation bündelt selektierte Informationen zu einer inneren Struktur, etwa durch Bestimmen einer Begriffshierarchie, Sortieren nach Wichtigkeit oder grafisches Visualisieren. Elaboration verknüpft den Lerninhalt aktiv mit vorhandenem Wissen, etwa durch das Suchen von Analogien oder das Ausdenken eigener Beispiele. Wortwörtliches Abtippen und wiederholtes Durchlesen sind rein rezeptive, nicht-generative Aktivitäten und regen keinen der drei Prozesse an."},{"id":"hp3a-ws2021-13","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 13 (Lösung S. 19)","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Reinmann & Mandl (2006); Friedrich & Mandl (1997), gegenstandszentrierte vs. konstruktivistische Lernumgebungen","typ":"matrix","stamm":"In der pädagogischen Diskussion zur Gestaltung von Lernumgebungen gibt es zwei Extrempole mit unterschiedlichen Grundannahmen (gegenstandszentriert vs. konstruktivistisch). Stellt man diese Extreme gegenüber, werden verschiedene Funktionen der Lehrperson deutlich.","frage":"Ordnen Sie die Aussagen dem Ansatz von Lernumgebungen zu, in welchem die Lehrperson diese Funktion erfüllt. Falls die Aussage nicht in direktem Bezug zu einem der Ansätze steht, ordnen Sie diese der Antwortmöglichkeit „in keinem Ansatz“ zu (pro Aussage nur eine korrekte Antwort).","spalten":["Gegenstandszentriert","Konstruktivistisch","In keinem Ansatz"],"zeilen":[{"text":"Die Lehrperson bewertet weder den Lernprozess noch das Lernergebnis.","loesung":2},{"text":"Die Lehrperson strebt vor allem danach, die Instruktion zu optimieren.","loesung":0},{"text":"Die Lehrperson definiert zu Beginn kleinschrittige Lehr-Lernziele.","loesung":0},{"text":"Die Lehrperson schafft Lernangebote, mit denen Lernende Wissensstrukturen eigenständig aufbauen können.","loesung":1},{"text":"Die Lehrperson gibt nur Hinweise zu dem Lernprozess selbst, nicht zu den Lerninhalten.","loesung":2},{"text":"Die Lehrperson strukturiert das Lernmaterial inhaltlich und unterrichtet entsprechend dieser Struktur.","loesung":0},{"text":"Die Lehrperson definiert Problemsituationen und stellt Werkzeuge zur Problembearbeitung zur Verfügung.","loesung":1},{"text":"Die Lehrperson zeigt inhaltliche Beziehungen auf und erläutert diese den Lernenden.","loesung":0}],"erklaerung":"Gegenstandszentrierte Lernumgebungen folgen dem „Primat der Instruktion“: Wissen wird als strukturiertes System begriffen, das die Lehrperson durch kleinschrittige Lernziele, inhaltliche Strukturierung und das Aufzeigen von Zusammenhängen an die Lernenden vermittelt; auch das Optimieren der Instruktion selbst ist hier zentral. Konstruktivistische Lernumgebungen folgen dem „Primat der Konstruktion“: Die Lehrperson schafft Problemsituationen und stellt Werkzeuge bereit, damit Lernende Wissen eigenständig aufbauen. Bewertung des Lernprozesses/-ergebnisses sowie reine Prozesshinweise ohne Inhaltsbezug gehören zu keinem der beiden Ansätze, sondern zur Diagnostik bzw. zum Coaching/Scaffolding. Die Quelle selbst markiert ihre Lösung für die Zeile „Instruktion optimieren“ als Konstruktivistisch; laut Vorlesungsfolien (4 Instruktionsdesign Ged_chtnis.txt) ist „Primat der Instruktion“ jedoch explizit ein Merkmal gegenstandszentrierter Lernumgebungen, weshalb hier die theoretisch begründete Zuordnung übernommen und die Angabe der Quelle korrigiert wurde; auch drei weitere Zeilen sind im Quelldokument mit Fragezeichen markiert. Deshalb nur mittleres statt hohes Vertrauen.","folie":"4 Instruktionsdesign Ged_chtnis.txt, Folie 8 und 15/21 (Primat der Instruktion vs. Primat der Konstruktion)"},{"id":"hp3a-ws2021-14","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 13 (Lösung S. 20)","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Collins, Brown & Newman (1989), Cognitive Apprenticeship","typ":"matrix","stamm":"Im Cognitive Apprenticeship-Ansatz von Collins, Brown & Newman (1989) kommen verschiedene Methoden zum Einsatz. In einem Kurs zum Erwerb von Leseverständnis-Strategien wird die Strategie des Generierens von Fragen an den Text geübt.","frage":"Ordnen Sie die Anwendungsbeispiele den Methoden zu (nur eine korrekte Antwort pro Aussage).","spalten":["Modelling","Scaffolding","Fading","Articulation","Reflection"],"zeilen":[{"text":"Die Lehrperson gibt mit jedem Übungsdurchlauf weniger Hinweise und überlässt die Aufgabenbearbeitung schließlich komplett den Lernenden.","loesung":2},{"text":"Nachdem die Lernenden die Fragen der jeweils anderen Lernenden beurteilt haben, sollen sie ihr Urteil begründen.","loesung":3},{"text":"Die Lernenden bekommen so viele Hinweise, wie sie benötigen, um die Aufgabe zu bewältigen.","loesung":1},{"text":"Um Fragen an den Text zu formulieren, gibt die Lehrperson zuerst das Fragewort „Warum?“ vor und empfiehlt, einfache Fragen zur Hauptperson zu erstellen.","loesung":0},{"text":"Die Lehrperson liest selbst einen Abschnitt und erstellt Fragen zu diesem; sie erklärt, warum sie genau diese Fragen erstellt hat.","loesung":0},{"text":"Im Zuge der Bearbeitung mehrerer Abschnitte können die Lernenden ihre Fragen an den Text mit denen der Lehrperson vergleichen und analysieren, was zu möglichen Unterschieden geführt hat.","loesung":4}],"erklaerung":"Modelling zeigt den Lernenden, wie ein Experte die Aufgabe löst, etwa indem die Lehrperson selbst Fragen an den Text erstellt und ihr Vorgehen erklärt oder einfache Startvorgaben (Fragewort „Warum?“) macht. Scaffolding bedeutet, genau so viel Unterstützung zu geben, wie zur Bewältigung nötig ist. Fading ist das schrittweise Zurücknehmen dieser Unterstützung bis zur eigenständigen Bearbeitung. Articulation verlangt, das eigene Vorgehen oder Urteil explizit zu verbalisieren und zu begründen. Reflection vergleicht die eigene Vorgehensweise mit der eines Experten oder anderer Lernender, um Unterschiede zu analysieren. Drei Zeilen sind im Quelldokument mit Fragezeichen versehen, daher mittleres statt hohes Vertrauen.","folie":"4 Instruktionsdesign Ged_chtnis.txt, Folie 17-19 (Cognitive Apprenticeship: Modelling, Coaching, Scaffolding, Fading, Articulation, Reflection, Exploration)"},{"id":"hp3a-ws2021-17","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 15 (Lösung S. 20)","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Merrill (2002), First Principles of Instruction","typ":"matrix","frage":"Ordnen Sie die nachfolgenden Aussagen zu verschiedenen Lernumgebungen den First Principles of Instruction (Merrill, 2002) zu (nur eine korrekte Antwort pro Aussage).","spalten":["Problemorientierung","Aktivierung","Demonstration","Anwendung","Integration"],"zeilen":[{"text":"Den Lernenden werden verschiedene Lösungswege für ein Problem gezeigt.","loesung":2},{"text":"Vor der Demonstration eines Experiments sollen die Lernenden Hypothesen aufstellen, welche Ergebnisse zu erwarten sind.","loesung":1},{"text":"Die Lernenden sollen reflektieren, welche Inhalte des behandelten Themas für sie besonders relevant waren.","loesung":4},{"text":"Die Lernenden bearbeiten ein Problem in mehreren Teilschritten mit zunehmender Komplexität.","loesung":0},{"text":"Die Lernenden bearbeiten im Verlauf leicht unterschiedliche Problemstellungen.","loesung":3},{"text":"Zu Beginn der Bearbeitung eines neuen Problems sollen die Lernenden die Vor- und Nachteile verschiedener Lösungen reflektieren.","loesung":1},{"text":"Die Lernenden sollen die neu erworbenen Fähigkeiten vor der restlichen Klasse demonstrieren.","loesung":4},{"text":"Während der Problembearbeitung wird die Unterstützung durch den Lernenden schrittweise reduziert.","loesung":3}],"erklaerung":"Problemorientierung verlangt die Bearbeitung eines vollständigen, authentischen Problems auf mehreren Ebenen mit zunehmender Komplexität. Aktivierung nutzt vorhandenes Wissen und vorherige Erfahrungen als Grundlage, etwa durch Hypothesenbildung oder Reflexion vor der Bearbeitung eines neuen Problems. Demonstration zeigt das zu Lernende, etwa alternative Lösungswege, statt bereits Bekanntes zu wiederholen. Anwendung besteht im variierten Üben mit abnehmender Unterstützung (Coaching, Scaffolding, Fading) bei leicht unterschiedlichen Problemstellungen. Integration überträgt das Gelernte in den Alltag, etwa durch Demonstration vor anderen oder Reflexion der persönlichen Relevanz des Gelernten. Eine Zeile ist im Quelldokument mit Fragezeichen versehen, daher mittleres statt hohes Vertrauen.","folie":"4 Instruktionsdesign Ged_chtnis.txt, Folie 24-25 (First Principles of Instruction: Aktivierung, Demonstration, Anwendung, Integration, Problemorientierung)"},{"id":"hp3a-ws2021-19","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 16 (Lösung S. 21)","vertrauen":"hoch","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Boekaerts (1999), Drei-Schichten-Modell der Selbstregulation","typ":"matrix","stamm":"Jörg ist Studierender der Medizin und bereitet sich gerade auf sein Staatsexamen vor. Er hat noch vier Wochen Zeit bis zur Prüfung und versucht, seinen Lernprozess möglichst effektiv zu gestalten.","frage":"Ordnen Sie die Maßnahmen der jeweiligen Regulationsebene des Drei-Schichten-Modells von Boekaerts (1999) zu (pro Aussage nur eine korrekte Antwort).","spalten":["Kognitive Regulation","Metakognitive Regulation","Regulation des Selbst"],"zeilen":[{"text":"Er belohnt sich nach jedem erreichten Zwischenziel mit einer Folge seiner Lieblingsserie.","loesung":2},{"text":"Er erstellt sich zu jedem Kapitel eine Mindmap.","loesung":0},{"text":"Er überprüft seinen Lernstand, indem er frühere Prüfungsfragen bearbeitet.","loesung":0},{"text":"Er legt auf Grundlage seiner bisherigen Erfahrungen einen Zeitplan an.","loesung":1},{"text":"Er sucht gezielt einen Lernort auf, an dem er sich gut konzentrieren kann.","loesung":1},{"text":"Er hört auf zu lernen, wenn er merkt, dass er müde wird.","loesung":2},{"text":"Er sucht zu jeder Aussage ein Beispiel aus seiner Praxiserfahrung.","loesung":0},{"text":"Er studiert die Prüfungsliteratur sorgfältig.","loesung":0}],"erklaerung":"Kognitive Regulation umfasst den direkten Umgang mit dem Lernstoff durch Lernstrategien wie Mindmaps erstellen, Beispiele suchen, Prüfungsfragen bearbeiten oder die Literatur sorgfältig durcharbeiten. Metakognitive Regulation betrifft die Planung, Überwachung und Steuerung des eigenen Lernprozesses, etwa das Anlegen eines erfahrungsbasierten Zeitplans oder das gezielte Aufsuchen eines geeigneten Lernortes. Regulation des Selbst bezieht sich auf motivationale und volitionale Steuerung der eigenen Person, etwa Selbstbelohnung nach Zwischenzielen oder das Beenden des Lernens bei aufkommender Müdigkeit, um die eigenen Ressourcen zu schützen."},{"id":"hp3b-sose2020-05","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 53","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Situierte vs. gegenstandsorientierte (konstruktivistische vs. objektivistische) Lernumgebungen","typ":"matrix","stamm":"Ordnen Sie die Aussagen den Arten von Lernumgebungen (situiert, gegenstandsorientiert oder beides) zu. Pro Zeile gibt es nur eine korrekte Antwort.","frage":"Trifft zu für …","spalten":["situiert","gegenstandsorientiert","beides"],"zeilen":[{"text":"Um sich erfolgreich Wissen aneignen zu können, müssen die Lernenden aktiv sein.","loesung":0},{"text":"Der Fokus für den Lernenden liegt darin, die Instruktionen zu optimieren.","loesung":1},{"text":"Der Fokus für den Lehrenden liegt darin, Problemsituationen und Werkzeuge zur Problembearbeitung zur Verfügung zu stellen.","loesung":0},{"text":"Die Wissensinhalte werden von der Lehrperson inhaltlich strukturiert und entsprechend dieser Struktur unterrichtet.","loesung":1},{"text":"Der Lernerfolg kann im Sinne vorher definierter Lehr-Lernziele bestimmt und gemessen werden.","loesung":1},{"text":"Die zentrale Aufgabe der Lehrperson ist es, Lernangebote zu schaffen, mit denen Lernende Wissen eigenständig konstruieren können.","loesung":0}],"erklaerung":"Situierte (konstruktivistische) Lernumgebungen betonen aktive, eigenständige Wissenskonstruktion der Lernenden anhand authentischer Problemsituationen, für die die Lehrperson Werkzeuge und Lernangebote bereitstellt. Gegenstandsorientierte (objektivistische) Lernumgebungen dagegen gehen von einer durch die Lehrperson vorab strukturierten Wissensvermittlung mit klar definierten, messbaren Lehr-Lernzielen aus, bei der der Lernende die Instruktion möglichst effizient nutzt. Die Notiz 'situiert = konstruktivistisch' im Dokument bestätigt diese Terminologie. Da im Text keine eindeutigen Kreuze erhalten sind, wurde die Zuordnung aus der Gegenüberstellung von situierten und gegenstandszentrierten Lernumgebungen auf der Instruktionsdesign-Folie abgeleitet.","folie":"4 Instruktionsdesign Gedächtnis, Seite 7 (Gegenstandszentrierte vs. situierte Lernumgebungen)"},{"id":"hp3b-sose2020-09","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 56","vertrauen":"niedrig","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Transfer von Wissen, Organisationshilfen beim Wissenserwerb","typ":"multi","stamm":"Herr Wagner bietet seinen SchülerInnen am Ende jeder Unterrichtseinheit gut strukturierte Übersichten, die sie zur Vorbereitung auf Klassenarbeiten nutzen sollen.","frage":"Unter welchen Bedingungen wird sich aus Sicht der Gedächtnispsychologie diese Organisationshilfe für den Transfer des Wissens nicht bewähren, obwohl sich die SchülerInnen beim Einprägen der Übersichten große Mühe geben?","optionen":["Die SchülerInnen haben aufgrund ihres eigenen Wissens die Informationen bereits anders strukturiert.","Die strukturierte Übersicht von Herrn Wagner ist für die SchülerInnen mit ihrem eigenen Wissen nur schwer zu verstehen.","Die SchülerInnen prägen sich die strukturierte Übersicht ohne nachzudenken genauso ein, wie Herr Wagner sie dargestellt hat.","Die strukturierte Übersicht macht Zusammenhänge zwischen Informationen der Unterrichtseinheit eher konkret als abstrakt deutlich.","Die strukturierte Übersicht bezieht sich auf eine Unterrichtseinheit, in der es primär um das Erlernen und Behalten reinen Faktenwissens geht."],"loesungen":[0,1,2,3],"erklaerung":"Transfer setzt voraus, dass Wissen aktiv, elaboriert und passend zum eigenen Vorwissen verarbeitet wird. Passt die vorgegebene Struktur nicht zur bereits vorhandenen Wissensorganisation der Lernenden oder ist sie für sie kaum verständlich, kann sie nicht sinnvoll integriert werden. Wird die Übersicht nur unreflektiert auswendig gelernt, findet keine tiefe Verarbeitung statt, die für die Anwendung auf neue Aufgaben nötig wäre. Da Transfer besonders von der Erkenntnis übergeordneter, abstrakter Zusammenhänge abhängt, behindert eine rein konkrete Darstellung den Transfer auf strukturell ähnliche, aber oberflächlich andere Aufgaben. Die letzte Option betrifft dagegen, ob Transfer als Lernziel überhaupt einschlägig ist, und begründet für sich genommen kein Scheitern des Transfers; diese Einschätzung ist eine eigene, nicht durch die Folien abgesicherte Interpretation der Vignette.","folie":"2 Wissenserwerb Kognition; 4 Instruktionsdesign Gedächtnis (Transferkriterium)"},{"id":"nar-f42","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 42, S. 12","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","typ":"multi","frage":"Durch welche von der Lehrperson beeinflussbaren Faktoren entstehen bei Gruppenaufgaben Motivations- und Prozessverluste?","optionen":["ungünstige Aufgaben","unpassende Ressourcen","unpassende Lernstrategien","ungünstige Gruppenstruktur"],"loesungen":[0,1,3],"erklaerung":"Motivations- und Prozessverluste bei Gruppenarbeit entstehen u. a. durch ungünstig gewählte Aufgaben, etwa solche, bei denen Einzelbeiträge nicht sichtbar werden (a), durch unpassende, zu knappe oder schlecht verteilte Ressourcen (b) und durch eine ungünstige Gruppenstruktur wie zu große oder neu zusammengestellte Gruppen (d). Unpassende Lernstrategien der Gruppenmitglieder (c) sind dagegen kein von der Lehrperson unmittelbar gestaltbarer struktureller Faktor der Aufgaben- oder Gruppenorganisation."},{"id":"nar-f43","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 43, S. 12","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Steiner (1972), Typologie von Gruppenaufgaben","typ":"multi","frage":"Steiner (1972) unterscheidet Gruppenaufgaben u. a. danach, ob sich die Aufgabe in mehrere Komponenten zerlegen lässt und wie sich das Einzelergebnis auf die Gruppenleistung auswirkt. Welche der folgenden Aufgabendimensionen eignen sich aus motivationalen Gründen NICHT für zu bewertende Gruppenarbeiten in der Schule?","optionen":["additiv, teilbar","konjunktiv, nicht teilbar","disjunktiv","konjunktiv, teilbar"],"loesungen":[1,2],"erklaerung":"Konjunktive, nicht teilbare Aufgaben (b) sind ungünstig, weil die Gruppenleistung vom schwächsten Mitglied abhängt, ohne dass Einzelbeiträge sichtbar würden. Disjunktive Aufgaben (c) sind ebenfalls ungünstig, weil hier allein die Leistung des besten Gruppenmitglieds zählt und die übrigen Mitglieder „Trittbrettfahren“ können. Additiv-teilbare Aufgaben (a) sind dagegen motivational günstig, weil Einzelbeiträge sichtbar bleiben, und dasselbe gilt bei Teilbarkeit auch für konjunktive Aufgaben (d), bei denen jedes Mitglied für einen eigenen, abgrenzbaren Teil verantwortlich ist."},{"id":"ueb-037","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 19, Klausuraufgabe 2","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","typ":"matrix","stamm":"Ein Englisch-Lehrer gibt den Schülern Empfehlungen, damit das Vokabellernen möglichst gut gelingt, d.h. die Vokabeln langfristig behalten und abgerufen werden können.","frage":"Kreuzen Sie an, welche der folgenden Empfehlungen sich gedächtnispsychologisch begründen lassen.","spalten":["begründbar","nicht begründbar"],"zeilen":[{"text":"Man sollte beim Einprägen der Vokabeln die Schlüsselwort-Methode anwenden.","loesung":0},{"text":"Man sollte beim Einprägen der Vokabeln die Kontext-Methode anwenden.","loesung":0},{"text":"Man sollte beim Einprägen der Vokabeln die Syntax-Methode anwenden.","loesung":1},{"text":"Man sollte die Vokabelpaare zum Einprägen nach dem Alphabet geordnet aufschreiben.","loesung":1},{"text":"Man sollte die Vokabeln beim Einprägen immer in derselben Reihenfolge durchlesen.","loesung":1},{"text":"Man sollte die Vokabeln beim Einprägen langsam und deutlich laut sprechen.","loesung":1},{"text":"Man sollte die Vokabeln beim Einprägen elaborierend verarbeiten.","loesung":0}],"erklaerung":"Wie bei der vergleichbaren Aufgabe zum Vokabellernen sind Strategien begründbar, die eine tiefe, elaborierte Verarbeitung anregen: Schlüsselwort-Methode, Lernen im Kontext (Enkodierspezifität) und elaborierende Verarbeitung allgemein. Alphabetisches Sortieren, stets gleiche Lesereihenfolge, bloßes lautes Sprechen ohne inhaltliche Verarbeitung und die frei erfundene 'Syntax-Methode' erzeugen dagegen nur oberflächliche, mechanische Verarbeitung ohne organisierende oder elaborierende Wirkung.","folie":"2 Wissenserwerb Kognition.txt"},{"id":"ueb-038","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 19-20, Klausuraufgabe 3","vertrauen":"mittel","teil":"I","thema":"Instruktionsdesign und Lernaufgaben","modell":"Mandl, Gruber & Renkl, Gegenstandszentrierte vs. konstruktivistische (situierte) Lernumgebungen","typ":"matrix","frage":"Ordnen Sie die Aussagen den Arten von Lernumgebungen (situiert, gegenstandszentriert oder beides) zu (pro Zeile nur eine korrekte Antwort).","spalten":["gegenstandszentriert","situiert","beides"],"zeilen":[{"text":"Die zentrale Aufgabe der Lehrperson ist es, Lernangebote zu schaffen, mit denen Lernende Wissen eigenständig konstruieren können.","loesung":1},{"text":"Der Fokus für den Lehrenden liegt darin, Problemsituationen und Werkzeuge zur Problembearbeitung zur Verfügung zu stellen.","loesung":1},{"text":"Die Wissensinhalte werden von der Lehrperson inhaltlich strukturiert und entsprechend dieser Struktur unterrichtet.","loesung":0},{"text":"Der Lernerfolg kann im Sinne vorher definierter Lehr-Lernziele bestimmt und gemessen werden.","loesung":0},{"text":"Der Fokus für den Lehrenden liegt darin, die Instruktionen zu optimieren.","loesung":0},{"text":"Um sich erfolgreich Wissen aneignen zu können, müssen die Lernenden aktiv sein.","loesung":2}],"erklaerung":"Situierte (konstruktivistische) Lernumgebungen stellen Problemsituationen und Werkzeuge bereit und verstehen die Lehrperson als Gestalterin aktiver Lerngelegenheiten, in denen Wissen eigenständig konstruiert wird (Primat der Konstruktion). Gegenstandszentrierte Lernumgebungen strukturieren den Lernstoff von außen, ordnen Lernschritte sequenziell an, definieren Lernziele im Voraus und fragen, wie die Instruktion selbst optimiert werden kann (Primat der Instruktion). Dass Wissenserwerb stets eine aktive Verarbeitung durch die lernende Person erfordert, gilt dagegen nach der Vorlesung für beide Ansätze gleichermaßen und markiert bewusst keinen Gegensatz zwischen ihnen.","folie":"4 Instruktionsdesign Ged_chtnis.txt, Gegenstandszentriert vs. konstruktivistisch"},{"id":"erg-kounin-01","quelle":"Kounin (1970), Techniken der Klassenführung","vertrauen":"hoch","teil":"I","thema":"Lehr-Lernmodelle und Unterrichtsqualität","modell":"Kounin (1970), Dimensionen effektiver Klassenführung","typ":"mc-kombi","frage":"Welche Merkmale kennzeichnen erfolgreiche Klassenführung nach den empirischen Studien von Jacob Kounin?","aussagen":["Allgegenwärtigkeit (Withitness) und Überlappung (Overlapping)","Reibungslosigkeit (Smoothness) und Schwung (Momentum)","Aufrechterhaltung des Gruppenfokus und Gruppenmobilisierung","Erhöhung der Strafhärte bei wiederholten Störungen","Ausführliche Thematisierung und Klärung von Disziplinverstößen vor der gesamten Klasse"],"aussagen_richtig":[0,1,2],"optionen":["Die Aussagen (1), (2) und (3) treffen zu; die Aussagen (4) und (5) treffen nicht zu.","Die Aussagen (1) und (4) treffen zu; die anderen treffen nicht zu.","Die Aussagen (2), (3) und (5) treffen zu; die anderen treffen nicht zu.","Alle Aussagen (1) bis (5) treffen zu."],"loesung":0,"hint":"Kounin zeigte: Proaktive Steuerung (Präsenz, Fluss, Gruppenfokus) verhindert Störungen; Strafhärte und lange Diskussionen schaden.","erklaerung":"Kounins Forschung belegt, dass erfolgreiche Lehrkräfte Störungen nicht härter bestrafen, sondern proaktiv steuern: durch Allgegenwärtigkeit (Withitness), simultane Mehrfachsteuerung (Overlapping), Reibungslosigkeit (Smoothness), dynamischen Unterrichtsschwung (Momentum) und Gruppenmobilisierung. Ausführliche Klärungen vor der Klasse (5) vernichten echte Lernzeit; Strafhärte (4) zeigt keine empirische Korrelation mit gutem Classroom Management."},{"id":"ex2016-11","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 11","vertrauen":"mittel","teil":"I","thema":"Lehr-Lernmodelle und Unterrichtsqualität","modell":"Gegenstandszentrierte und situierte Lernumgebungen","typ":"matrix","frage":"Ordnen Sie die Aussagen den Arten von Lernumgebungen (situiert, gegenstandszentriert oder beides) zu.","spalten":["gegenstandszentriert","situiert","beides"],"zeilen":[{"text":"Der Fokus für den Lehrenden liegt darin, die Instruktion zu optimieren.","loesung":0},{"text":"Die zentrale Aufgabe der Lehrperson ist es, Lernangebote zu schaffen, mit denen Lernende Wissen eigenständig konstruieren können.","loesung":1},{"text":"Um sich erfolgreich Wissen aneignen zu können, müssen die Lernenden aktiv sein.","loesung":2},{"text":"Die Wissensinhalte werden von der Lehrperson inhaltlich strukturiert und entsprechend dieser Struktur unterrichtet.","loesung":0},{"text":"Der Fokus für den Lehrenden liegt darin, Problemsituationen und Werkzeuge zur Problembearbeitung zur Verfügung zu stellen.","loesung":1},{"text":"Der Lernerfolg kann im Sinne vorher definierter Lehr-Lernziele bestimmt und gemessen werden.","loesung":2}],"erklaerung":"Die beiden Pole unterscheiden sich darin, wo die Steuerung liegt. Gegenstandszentriert heißt: Die Lehrperson strukturiert den Inhalt und optimiert die Instruktion, der Weg durch den Stoff ist vorgezeichnet. Situiert heißt: Die Lehrperson stellt Problemsituationen und Werkzeuge bereit, und die Lernenden konstruieren ihr Wissen an authentischen Aufgaben selbst. Zwei Aussagen gehören zu beiden. Dass Lernende aktiv sein müssen, ist heute unstrittiger Konsens und kein Unterscheidungsmerkmal mehr – auch gut gemachte Instruktion setzt auf aktive Verarbeitung. Und messbare Lernziele schließt die situierte Position nicht aus; sie bestimmt sie nur anders, nämlich über die Bewältigung der Problemsituation. Die letzte Zeile ist die strittigste: Wer die vorab definierten und messbaren Lernziele als Kennzeichen der instruktionalen Position liest, kreuzt gegenstandszentriert an. Für diese Aufgabe liegt kein Lösungsschlüssel vor.","folie":"1 Lehr-Lernmodelle"},{"id":"ex2024-10","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 10 (S. 13-14)","vertrauen":"mittel","teil":"I","thema":"Lehr-Lernmodelle und Unterrichtsqualität","modell":"Helmke (2009), Angebots-Nutzungs-Modell","typ":"matrix","stamm":"Das Angebots-Nutzungs-Modell von Unterricht (Helmke, 2009) enthält die wichtigsten Einflussfaktoren zur Erklärung von Lernerfolg. Dazu gehören: Merkmale der Lehrperson, des Lehrangebots, der lernenden Person und des Kontexts. Im Folgenden finden Sie kurze Beschreibungen und Informationen zum Unterricht von Frau Abt.","frage":"Ordnen Sie die aufgeführten Beschreibungen aus dem Unterricht von Frau Abt dem jeweils am besten passenden Einflussfaktor nach Helmke (2009) zu. Pro Zeile gibt es nur eine richtige Antwort.","spalten":["Lehrperson","Lehrangebot","Lernende Person","Kontext"],"zeilen":[{"text":"Frau Abt startet ihr Berufsleben an einer Realschule. Sie hat ihr Referendariat mit sehr guten Leistungen abgeschlossen.","loesung":0},{"text":"In den Unterrichtsstunden stehen ausreichend lernförderliche Materialien bereit.","loesung":1},{"text":"Im Unterricht geht wenig Zeit für Umbau- und Aufräumprozesse verloren.","loesung":1},{"text":"Die Schüler*innen gehen respektvoll miteinander um.","loesung":3},{"text":"Die Schüler*innen erhalten zu ihren Aufgaben informatives Feedback, das auch den Lösungsweg einbezieht.","loesung":1},{"text":"Den Schüler*innen wird demonstriert, wie man Lernprozesse plant und den eigenen Lernprozess überwacht.","loesung":1},{"text":"Einige Schüler*innen können dem Unterricht nicht folgen, da sie nicht alle notwendigen Begriffe kennen.","loesung":2},{"text":"Die Mutter von Lena wertet fortwährend das Bearbeiten der Hausaufgaben ab und sagt, dass man in der Schule sowieso nichts lerne, was man im späteren Leben brauche.","loesung":3},{"text":"Manche Schüler*innen haben eine stark ausgeprägte Furcht vor Misserfolg.","loesung":2},{"text":"Frau Abt setzt sich intensiv mit verschiedenen Methoden der Leistungsstandmessung auseinander.","loesung":0},{"text":"Frau Abt ist fest davon überzeugt, dass die Schüler*innen nur etwas lernen, wenn sie sich aktiv mit Lerninhalten auseinandersetzen.","loesung":0},{"text":"Frau Abt versucht durch Alltagsbeispiele Begeisterung bei ihren Schüler*innen zu wecken.","loesung":1}],"erklaerung":"Das Modell trennt überdauernde Personmerkmale von dem, was im Unterricht tatsächlich angeboten wird. Zur Lehrperson gehören Professionswissen und Ausbildungsstand, diagnostische Kompetenz – also die Auseinandersetzung mit Methoden der Leistungsstandmessung – sowie Beliefs und pädagogische Orientierungen, etwa die Überzeugung, dass nur aktive Auseinandersetzung zu Lernen führt. Zum Lehrangebot zählt alles, was im konkreten Unterricht bereitgestellt oder getan wird: Lernmaterialien, die didaktische Organisation und effiziente Zeitnutzung, Feedback zu Aufgaben, die Demonstration metakognitiver Strategien und das Wecken von Begeisterung durch Alltagsbeispiele. Merkmale der lernenden Person sind ihre individuellen Voraussetzungen: fehlendes Vorwissen bei den notwendigen Begriffen und eine ausgeprägte Misserfolgsfurcht als Motivmerkmal. Zum Kontext gehören die Rahmenbedingungen außerhalb der Gestaltungsmacht von Lehrperson und Lernenden, hier das Klassenklima im respektvollen Umgang miteinander und die abwertende Haltung des Elternhauses. Die Kreuze der Quelle sind durch die PDF-Extraktion nicht eindeutig den Zeilen zuzuordnen; die Zuordnung folgt der Standarddarstellung des Modells.","folie":"1 Lehr-Lernmodelle, Seite 5-6 und 27 (Angebots-Nutzungs-Modell nach Helmke)"},{"id":"hp3b-sose2020-03","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 52","vertrauen":"mittel","teil":"I","thema":"Lehr-Lernmodelle und Unterrichtsqualität","modell":"Helmke (2009), Angebots-Nutzungs-Modell","typ":"matrix","stamm":"Das Angebots-Nutzungs-Modell von Unterricht (Helmke, 2009) enthält die wichtigsten Merkmalsbündel zur Erklärung von Lernerfolg: Merkmale der Lehrperson, des Lehrangebots, der lernenden Person und des Kontextes. Ordnen Sie die folgenden Merkmale dem jeweiligen Merkmalsbündel zu. Pro Zeile gibt es nur eine richtige Antwort.","frage":"Merkmal gehört zu …","spalten":["Lehrangebot","Lernende Person","Kontext","Lehrperson"],"zeilen":[{"text":"Professionswissen","loesung":3},{"text":"Zeitpunkt, Umfang und Elaboriertheit des von der Lehrperson angebotenen Feedbacks","loesung":0},{"text":"Didaktische Organisation innerhalb des Unterrichts","loesung":0},{"text":"Strukturelle Bedingungen in den Familien der SchülerInnen","loesung":2},{"text":"Lernmotivation","loesung":1},{"text":"Klassenklima","loesung":2},{"text":"Diagnostische Kompetenzen","loesung":3},{"text":"Art, Umfang, Inhalt und Implementation von Lernaufgaben","loesung":0},{"text":"Lern- und Gedächtnisstrategien","loesung":1},{"text":"Pädagogische Orientierungen","loesung":3},{"text":"Texte und andere Lernmaterialien, die im Unterricht behandelt werden","loesung":0}],"erklaerung":"Im Angebots-Nutzungs-Modell zählen Professionswissen, diagnostische Kompetenzen und pädagogische Orientierungen zu den überdauernden Merkmalen der Lehrperson, während Feedback, didaktische Organisation, Lernaufgaben und Lernmaterialien Bestandteile des konkreten Lehrangebots im Unterricht sind. Lernmotivation sowie Lern- und Gedächtnisstrategien sind Merkmale der lernenden Person, die die Nutzung des Angebots steuern. Familiäre Bedingungen und Klassenklima zählen zum Kontext, da sie äußere Rahmenbedingungen des Unterrichts sind, die von Lehrperson und Lernenden nicht unmittelbar gestaltet werden. Die Kreuze der Quelle sind durch die PDF-Extraktion nicht eindeutig den Zeilen zuzuordnen; die Zuordnung folgt der Standarddarstellung des Modells nach Helmke (2009).","folie":"1 Lehr-Lernmodelle (Angebots-Nutzungs-Modell nach Helmke)"},{"id":"ueb-001","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 1, Klausuraufgabe 1","vertrauen":"mittel","teil":"I","thema":"Lehr-Lernmodelle und Unterrichtsqualität","typ":"matrix","frage":"Schlechter Unterricht gehört zu den zentralen Verursachungsbedingungen von Lernschwierigkeiten. Kreuzen Sie für jedes der folgenden Unterrichtsmerkmale an, ob es zu einer hohen Qualität von Unterricht beiträgt oder nicht.","spalten":["Ja","Nein"],"zeilen":[{"text":"Die Lernwege der Schüler werden kaum überwacht.","loesung":1},{"text":"Die Lernzeit wird intensiv genutzt.","loesung":0},{"text":"Der Lehrstoff wird straff und tempobetont präsentiert.","loesung":0},{"text":"Es findet Differenzierung im Unterricht statt.","loesung":0},{"text":"Die Klassenführung ist demokratisch.","loesung":0},{"text":"Lob und Tadel werden sehr sparsam eingesetzt.","loesung":0},{"text":"Lehrer stellt meist offene Aufgaben.","loesung":1},{"text":"Störungen im Unterricht werden intensiv geklärt.","loesung":1}],"erklaerung":"Nach den empirisch begründeten Merkmalen leistungsförderlichen Unterrichts (Weinert & Helmke, Scholastik-Studie; Meyer, 10 Merkmale guten Unterrichts) tragen intensive Zeitnutzung, ein zügiges, klar strukturiertes Tempo, Differenzierung nach Lernstand, eine demokratische, unterstützende Klassenführung sowie ein sparsamer, gezielter Einsatz von Lob und Tadel zu hoher Unterrichtsqualität bei. Fehlende Überwachung der Lernwege verhindert dagegen rechtzeitiges Eingreifen bei Verständnisproblemen, überwiegend offene statt klar strukturierte Aufgaben senken die Aufgabenklarheit, und eine intensive Klärung jeder Störung im Plenum kostet echte Lernzeit, statt Störungen mit minimalem Aufwand aufzulösen (Prinzip der Klassenführung nach Kounin). Da die Quelle keine Lösung angibt, stützt sich die Zuordnung auf diese etablierten Unterrichtsqualitätsmodelle."},{"id":"ueb-002","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 1, Klausuraufgabe 2","vertrauen":"mittel","teil":"I","thema":"Lehr-Lernmodelle und Unterrichtsqualität","typ":"matrix","frage":"Welche der folgenden Merkmale von Unterricht tragen empirisch belegt (z.B. Helmke, 1988) zur Leistungsförderung bei möglichst vielen Schülern bei? Kreuzen Sie für jedes der folgenden Merkmale an, ob es – empirisch belegt – zur Leistungsförderung bei Schülern beiträgt.","spalten":["Ja","Nein"],"zeilen":[{"text":"Lob und Tadel werden sehr sparsam eingesetzt.","loesung":0},{"text":"Die Unterrichtszeit wird intensiv zum Wissenserwerb genutzt.","loesung":0},{"text":"Es findet Differenzierung im Unterricht statt.","loesung":0},{"text":"Die Lernwege der Schüler werden kaum überwacht.","loesung":1},{"text":"Aufgaben werden klar und strukturiert gestellt.","loesung":0},{"text":"Der Lehrstoff wird straff und tempobetont präsentiert.","loesung":0},{"text":"Störungen im Unterricht führen zu lebhaften Diskussionen.","loesung":1},{"text":"Es gibt viel Abwechslung im Unterricht.","loesung":0}],"erklaerung":"Diese Aufgabe prüft dieselben empirisch abgesicherten Qualitätsmerkmale wie die vorangehende Aufgabe (Helmke, 1988; Weinert & Helmke, Scholastik-Studie): intensive Zeitnutzung, klare und strukturierte Aufgabenstellung, zügiges Tempo, Differenzierung, sparsamer Einsatz von Lob und Tadel sowie methodische Abwechslung (Methodenvielfalt nach Meyer) wirken leistungsförderlich. Mangelnde Überwachung der Lernwege verhindert rechtzeitiges Feedback und Eingreifen, und wenn Störungen zu ausführlichen Diskussionen im Plenum führen, geht echte Lernzeit verloren, statt sie durch knappes, konsequentes Classroom-Management zu sichern. Da die Quelle keine Lösung angibt, stützt sich die Zuordnung auf diese etablierten Unterrichtsqualitätsmodelle."},{"id":"ex2016-09","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 9","vertrauen":"mittel","teil":"I","thema":"Lernschwierigkeiten","modell":"Zielinski (1995), erweitert nach Gold (2011)","typ":"matrix","stamm":"Die Lehrenden eines Gymnasiums beraten sich über die Schüler ihrer jeweiligen Klassen, die Lernschwierigkeiten aufweisen. Dabei kennen die Lehrenden bereits die Verursachungsbedingungen bei den einzelnen Schülerinnen und Schülern. Sie wollen diese jedoch nun als intern, extern oder moderierend klassifizieren.","frage":"Kreuzen Sie für jede der folgenden Aussagen an, ob diese als externe, interne oder moderierende Ursache einzuordnen ist.","spalten":["extern","intern","moderierend"],"zeilen":[{"text":"Mario hat oft schon Probleme zu verstehen, auf welche Art und Weise die Aufgabe überhaupt zu lösen ist und was die Aufgabenoperatoren bedeuten.","loesung":1},{"text":"Theo darf am Wochenende stets selbst entscheiden, wann und wie lange er fernsieht. Dies wirkt sich negativ auf seine Leistung aus.","loesung":2},{"text":"In der Klasse 9d brauchen wir immer sehr lange, bis wir mit dem Lehrstoff beginnen können. Diese Zeit fehlt den Lernenden dann bei der Erledigung ihrer Aufgaben. Besonders schadet dies Achim.","loesung":0},{"text":"In der Klasse 8b wird immer viel Zeit auf organisatorische Themen wie z. B. das Einhalten der Sitzordnung verwendet, anstatt diese für den Lehrstoff zu nutzen. Dies ist vor allem für Sabine nachteilig.","loesung":0},{"text":"Gustav fehlt viel Wissen über Fakten und Gesetzmäßigkeiten, die in seiner Klasse schon vor langer Zeit behandelt wurden.","loesung":1},{"text":"Die Klasse 6c kommt einfach nicht miteinander aus. Ständig gibt es Störungen und Anfeindungen, die sich besonders stark auf Dorothea auswirken.","loesung":2},{"text":"Peter hat meist einfach keine Ausdauer beim Lernen. Er verbringt die Zeit lieber mit Träumen oder Malen.","loesung":1}],"erklaerung":"Zielinski ordnet die Verursachungsfaktoren in drei Gruppen. Intern sind drei Merkmale des Schülers selbst: aufgabenspezifische Vorkenntnisse, Lernmotivation und die Fähigkeit, Instruktionen zu verstehen. Mario scheitert am Instruktionsverständnis, Gustav an fehlenden Vorkenntnissen, Peter an der Lernmotivation und der volitionalen Regulation. Extern sind Merkmale des Unterrichts: die zugestandene Lernzeit und die Unterrichtsqualität. In der 9d und der 8b geht Lernzeit für Organisation verloren – beides sind Unterrichtsmerkmale, keine Schülermerkmale. Moderierend sind die Kontextfaktoren um Schule und Unterricht herum: Familie, Medien, Kindergarten, Peers, Klassenklima. Theos unbegrenzter Fernsehkonsum fällt unter Medien und Familie, die zerstrittene 6c unter Klassenklima und Peergroup. Merkhilfe: Frage dich, wo die Ursache sitzt – im Kopf des Schülers, im Unterricht selbst, oder im Umfeld drumherum.","folie":"9.1 Lernschwierigkeiten, Folien 11 bis 25 – Verursachungsfaktoren nach Zielinski"},{"id":"ex2024-11","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 11 (S. 15)","vertrauen":"hoch","teil":"I","thema":"Lernschwierigkeiten","modell":"Zielinski (1995), sequentielle Strategie zur Diagnose und Intervention","typ":"matrix","stamm":"Juliane hat erhebliche Schwierigkeiten im Fach Deutsch. Die ihr gestellten Aufgaben zum Lesen und Schreiben zusammengesetzter Wörter kann sie nicht bewältigen. Um festzustellen, welche Ursachen zugrunde liegen, nutzt ihre Lehrerin Frau Schütze die Diagnoseebenen nach Zielinski (1995).","frage":"Kreuzen Sie jeweils an, auf welcher Diagnoseebene nach Zielinski (1995) die folgenden Vorgehensweisen von Frau Schütze einzuordnen sind. Pro Zeile gibt es nur eine korrekte Antwort.","spalten":["Vorkenntnisdiagnose","Unterrichtsdiagnose","Verhaltensdiagnose","Fähigkeitsdiagnose"],"zeilen":[{"text":"Sie übergibt Juliane Aufgaben, die ihre Basiskompetenzen im Bereich der Laut-Buchstaben-Zuordnung überprüfen sollen.","loesung":3},{"text":"Sie beobachtet während der nächsten Lernphasen, inwiefern sich Juliane leicht ablenken lässt.","loesung":2},{"text":"Sie nimmt ihre nächsten Unterrichtsstunden auf Video auf, um herauszubekommen, ob sie Juliane ausreichend Zeit zur Aufgabenbearbeitung einräumt.","loesung":1},{"text":"Sie überprüft während der nächsten Deutschstunden, ob Juliane die Zeit, die sie zur Aufgabenbearbeitung erhält, auch nutzt.","loesung":2},{"text":"Sie übergibt Juliane Aufgaben aus den letzten Unterrichtsstunden, um zu überprüfen, ob sie grundlegende Regeln des Rechtschreibsystems bereits sicher verankert hat, sodass sie die jetzigen Aufgaben mit zusammengesetzten Wörtern lösen kann.","loesung":0}],"erklaerung":"Zielinskis Strategie arbeitet die Ebenen in fester Reihenfolge ab und fragt auf jeder Ebene etwas anderes. Die Vorkenntnisdiagnose prüft, ob der Stoff der vorangegangenen Unterrichtseinheiten verfügbar ist – genau das leisten die Aufgaben aus den letzten Stunden zu den bereits behandelten Rechtschreibregeln. Die Unterrichtsdiagnose prüft, ob der Unterricht selbst optimal ist; die Videoaufnahme zur eigenen Zeitvergabe richtet den Blick auf die Lehrperson und ihre Unterrichtsgestaltung. Die Verhaltensdiagnose prüft das Arbeitsverhalten und die tatsächliche Nutzung der Lernzeit: Sowohl die Ablenkbarkeit als auch die Frage, ob Juliane die gewährte Zeit nutzt, gehören hierher. Die Fähigkeitsdiagnose setzt eine Ebene tiefer an und prüft grundlegende Fähigkeitsvoraussetzungen unabhängig vom aktuellen Stoff – die Laut-Buchstaben-Zuordnung ist eine solche Basiskompetenz.","folie":"9.1 Lernschwierigkeiten, Seite 42-51 (Sequentielle Strategie nach Zielinski)"},{"id":"hp3b-sose2020-11","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 56","vertrauen":"hoch","teil":"I","thema":"Lernschwierigkeiten","modell":"Zielinski (1995), Verursachungsfaktoren für Lernschwierigkeiten","typ":"matrix","stamm":"Lernschwierigkeiten können durch interne, externe oder moderierende Verursachungsbedingungen entstehen. Kreuzen Sie für jedes Beispiel an, inwiefern es hilft, internen, externen oder moderierenden Ursachen von Lernschwierigkeiten vorzubeugen. Kreuzen Sie 'keine' an, wenn die Aussage das Entstehen von Lernschwierigkeiten begünstigt.","frage":"Die/Der Lernende …","spalten":["beugt keinen Verursachungsbedingungen vor","beugt externen Verursachungsbedingungen vor","beugt internen Verursachungsbedingungen vor","beugt moderierenden Verursachungsbedingungen vor"],"zeilen":[{"text":"Die/Der Lernende schaut selten fern.","loesung":3},{"text":"Die/Der Lernende ist in der Lage, Instruktionen zu verstehen.","loesung":2},{"text":"Die/Der Lernende zeigt eine hohe Lernmotivation.","loesung":2},{"text":"Der/Dem Lernenden steht genügend Lernzeit zur Verfügung.","loesung":1},{"text":"Die Eltern verfolgen einen autoritären Führungsstil.","loesung":0}],"erklaerung":"Nach Zielinski (1995) zählen aufgabenspezifisches Vorwissen, Lernmotivation und die Fähigkeit, Instruktionen zu verstehen, zu den internen Faktoren, während die zugestandene Lernzeit ein externer (unterrichtsbezogener) Faktor ist. Medienkonsum gehört zu den moderierenden Kontextfaktoren (Familie/Medien/Peers), sodass geringer Fernsehkonsum diesem Bereich vorbeugt. Ein autoritärer Erziehungsstil der Eltern ist selbst ein moderierender Risikofaktor für Lernschwierigkeiten und beugt folglich nichts vor, sondern begünstigt deren Entstehen, weshalb hier 'keine' zutrifft.","folie":"9.1 Lernschwierigkeiten, Seite 11-12/17/21/25"},{"id":"erg-sorck-01","quelle":"Standardlehrbuch Pädagogische Psychologie (Kanfer & Saslow)","vertrauen":"hoch","teil":"I","thema":"Modelllernen und Verhaltensmanagement","modell":"Kanfer & Saslow (1965), SORCK-Schema","typ":"matrix","frage":"Ordnen Sie die Komponenten des SORCK-Schemas nach Kanfer den jeweiligen Beschreibungen zu. Pro Zeile gibt es genau eine richtige Zuordnung.","spalten":["Stimulus (S)","Organismus (O)","Reaktion (R)","Contingency (K)","Consequence (C)"],"zeilen":[{"text":"Vorhergehende situative Reizbedingungen im Klassenzimmer","loesung":0},{"text":"Biologische Voraussetzungen und Lerngeschichte der Person","loesung":1},{"text":"Das beobachtbare motorische oder verbale Problemverhalten","loesung":2},{"text":"Regelmäßigkeit und zeitlicher Abstand der Konsequenz (Verstärkungsplan)","loesung":3},{"text":"Die auf das gezeigte Verhalten unmittelbar folgende Konsequenz","loesung":4}],"hint":"S = Reizauslöser, O = Personendisposition, R = Verhalten, K = Kontingenzrelation, C = Folgekonsequenz.","erklaerung":"Das SORCK-Schema erweitert das behavioristische S-R-Modell um kognitive und organismische Variablen: S bezeichnet die situativen Reizbedingungen; O die biologischen, physiologischen und biografischen Voraussetzungen der Person; R das beobachtbare Verhalten; K (Kontingenz) die zeitliche und stochastische Bindung der Konsequenz; C die direkte Konsequenz (Verstärkung oder Bestrafung)."},{"id":"ex2016-04-3","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 4.3","vertrauen":"niedrig","teil":"I","thema":"Modelllernen und Verhaltensmanagement","modell":"Bandura, sozial-kognitive Lerntheorie","typ":"matrix","stamm":"Eine Lehrerin gibt ihrer Klasse Werkstattaufgaben, die jeder Schüler für sich und ruhig in einem Unterrichtsblock von zwei Doppelstunden lösen soll. Jeder Schüler ist „Chef“ für eine Aufgabe, das heißt, er löst zuerst diese Aufgabe und überprüft mit Hilfe der von der Lehrerin vorbereiteten Musterlösung, ob alles stimmt. Wenn Mitschüler Fragen zu dieser Aufgabe haben, ist er dann auch die Ansprechperson. Außerdem ist der „Chef“ Ansprechperson für das Kontrollieren der Richtigkeit der Aufgabe. An die Lehrerin sollen sich die Schüler nur dann wenden, wenn ein „Chef“ bei Fragen nicht weiterhelfen kann.\n\nFür Helena ist es besonders wichtig, Rückmeldung zu ihren Aufgaben zu bekommen. Warten empfindet sie als sehr unangenehm. Daher geht sie bei Fragen direkt zur Lehrerin und will, sobald sie eine Aufgabe gelöst hat, diese direkt von der Lehrerin korrigieren lassen. Die Lehrerin schickt sie jedoch jedes Mal zum „Chef“. Helena lässt daraufhin die Richtigkeit ihrer nächsten Lösungen häufiger direkt beim „Chef“ kontrollieren und erhält von ihm entsprechend Rückmeldung zu ihren Aufgaben. Im Verlauf der Doppelstunde muss Helena jedoch manchmal ziemlich lange warten, bis sie beim „Chef“ an der Reihe ist, da dieser auch Fragen anderer Schüler beantworten muss. Beim Warten tippt sie ungeduldig mit dem Fuß. Die Lehrerin erkennt Helenas Problem und ruft alle „Chefs“ noch einmal zusammen. Sie bespricht mit ihnen, wie ein Zeitplan in der Doppelstunde aussehen kann, sodass keine Wartezeit mehr nötig ist. Auf diese Weise muss Helena nicht mehr lange warten, bis sie beim „Chef“ an der Reihe ist. Nun kommt sie nur noch sehr selten zur Lehrerin, anstatt beim „Chef“ die Lösungen kontrollieren zu lassen. Wenn dies doch geschieht, schickt die Lehrerin Helena auch weiterhin konsequent zuerst zu den „Chefs“. Gegen Ende der Stunde verletzt Helena nun genauso wie ihre beste Freundin Maria, die noch nie direkt zur Lehrerin gegangen war, die Werkstattregeln nicht mehr.\n\nEin anderer Kollege schlägt vor, die Prinzipien des Modell-Lernens entsprechend Banduras sozial-kognitiver Lerntheorie anzuwenden, um Helenas Verstöße gegen die Werkstattregeln abzustellen und dagegen das Einhalten der Regeln zu fördern. Um sicher zu gehen, dass das Modell-Lernen auch funktioniert, gibt er ihr noch ein paar Hinweise.","frage":"Kreuzen Sie für jeden Hinweis an, ob er aus Sicht der sozial-kognitiven Lerntheorie sinnvoll ist oder nicht.","spalten":["sinnvoll","nicht sinnvoll"],"zeilen":[{"text":"Man darf konsequent nur dann Fragen beantworten, wenn sich die Schüler zunächst an den „Chef“ gewandt haben, aber dort keine Antwort erhielten.","loesung":1},{"text":"Man sollte konsequent jeden Schüler ermahnen, der sich direkt an die Lehrerin wendet statt an den „Chef“, die Frage aber dennoch klären.","loesung":1},{"text":"Man sollte Helena darauf aufmerksam machen, dass sie sich ein Beispiel an Maria nehmen soll, da diese sich immer zuerst an den „Chef“ wendet.","loesung":0},{"text":"Man sollte Helena, wenn sie sich zuerst an die Lehrerin wendet, konsequent zuerst zum „Chef“ schicken, damit sie dort Fragen klärt bzw. ihre Lösungen prüft.","loesung":0}],"erklaerung":"Die sozial-kognitive Lerntheorie erklärt Verhaltensänderung über ein Modell, dessen Verhalten und dessen Verstärkung beobachtet werden. Wirksam ist ein Hinweis dann, wenn er ein ähnliches, erfolgreiches Modell sichtbar macht und dessen Verhalten konsequent verstärkt wird. Maria ist ein solches Modell: gleichaltrig, befreundet, hält die Regel ein. Und wer Helena konsequent zum „Chef“ schickt, lässt sie dort erleben, dass das Modellverhalten zum Ziel führt. Die ersten beiden Hinweise untergraben das: Wer die Frage am Ende doch beantwortet, verstärkt genau das Verhalten, das abgebaut werden soll – eine Ermahnung ändert daran nichts, weil die Rückmeldung trotzdem kommt. Achtung: Für diese Aufgabe liegt kein Lösungsschlüssel vor und die Zuordnung ist diskutabel. Arbeite hier über die Begründung, nicht über das Auswendiglernen der Kreuze.","folie":"7 Lernen Verhaltensmanagement – Modelllernen"},{"id":"ex2024-04-3","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 4.3 (S. 6)","vertrauen":"mittel","teil":"I","thema":"Modelllernen und Verhaltensmanagement","modell":"Bandura (1963, 1977), sozial-kognitive Lerntheorie","typ":"matrix","stamm":"Frau Schneider gibt den Schüler*innen ihrer Klasse eine Aufgabe, die jeder für sich und ruhig in der Stunde lösen soll. Bei Fragen sollen sich die Schüler*innen melden und warten, bis die Lehrerin zu ihrem Platz kommt. Alle Schüler*innen arbeiten still und konzentriert an der Lösung ihrer Aufgabe. Immer wieder melden sich Schüler*innen, manchmal auch mehrere, sodass man teilweise kurz warten muss, bis die Fragen geklärt werden können. Plötzlich fragt Bruno etwas zur Aufgabe, ohne sich zu melden, und reißt die anderen aus ihrer Tätigkeit heraus. So läuft es nun jedes Mal ab, wenn Bruno nicht weiterkommt. Frau Schneider schimpft dann zwar jedes Mal mit ihm und macht ihn darauf aufmerksam, dass er sich erst melden und warten soll, bis sie zu seinem Platz kommt, um die anderen nicht bei der Aufgabenlösung zu stören. Aber sie beantwortet dann auch gleich anschließend Brunos Frage, selbst wenn andere Schüler*innen bereits darauf warten, dass ihre Frage geklärt wird. Bruno ist ein fleißiger Schüler, der sonst selten ermahnt werden muss und immer bemüht ist, alle Aufgaben richtig und vollständig zu lösen. Kommt es zu Ermahnungen, macht ihm dies nichts aus. Abwarten findet er hingegen blöd. Daher freut er sich, dass er häufig zuerst drankommt, insbesondere vor dem von ihm nicht geschätzten Klassenbesten, der sich immer ordentlich meldet und geduldig abwartet. Außerdem ermöglichen ihm die schnellen Hilfestellungen der Lehrerin, die Aufgaben zügig zu lösen. Frau Schneider weiß sich nicht mehr zu helfen, da trotz ihrer konsequenten Ermahnungen Brunos Reinrufen eher schlimmer als besser wird. Ein Kollege schlägt vor, die Prinzipien des Modell-Lernens entsprechend der sozial-kognitiven Lerntheorie (Bandura, 1963, 1977) anzuwenden, um Brunos Reinrufen abzustellen und stattdessen das Melden zu fördern. Um sicherzugehen, dass das Modell-Lernen auch funktioniert, gibt er ihr noch einige Hinweise.","frage":"Kreuzen Sie für jeden Hinweis an, ob er aus Sicht der sozial-kognitiven Lerntheorie dazu beitragen kann, Brunos Reinrufen zu erhöhen, zu verringern, oder ob er keine Prognose ermöglicht.","spalten":["erhöht","verringert","keine Prognose möglich"],"zeilen":[{"text":"Man kann jeden Mitschüler als Modell nehmen, der nicht reinruft, sondern sich meldet und ruhig auf die Lehrerin wart
