 hat von ihrer Freundin eine selbstgetöpferte Kanne geschenkt bekommen. Sie entscheidet sich aufgrund der Form des Gefäßes, sie als Vase zu verwenden.","loesung":3},{"text":"Julius wendet die neu gelernten Regeln für das Lösen von Ungleichungen auf entsprechende Übungsaufgaben an.","loesung":4},{"text":"Carla wird von Max als „Hippie\" bezeichnet, da sie Dreadlocks trägt und in der Umwelt-Jugend aktiv ist.","loesung":3},{"text":"Als Justus Amelie fragt, wie weit es ist, zu ihr nach Hause zu laufen, stellt sich Amelie die Strecke vor und läuft sie gedanklich ab, um eine Antwort zu finden.","loesung":2}],"erklaerung":"Katjas feste morgendliche Abfolge ist ein Script. Farines Einordnung der Kanne als Vase anhand ihrer Form sowie Carlas Einordnung als 'Hippie' anhand typischer äußerer Merkmale beruhen auf dem Vergleich mit einem typischen Vertreter der Kategorie und entsprechen damit dem Prototypmodell. Julius wendet gelernte WENN-DANN-Regeln an, was ein Produktionssystem kennzeichnet. Amelies gedankliches Ablaufen der Strecke ist eine mentale Simulation, die einer realen Situation strukturell entspricht – eine Analogie.","folie":"3 Ged_chtnis_.txt"},{"id":"ex2024-13","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 13 (S. 18)","vertrauen":"hoch","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Heckhausen & Rheinberg (1980); Rheinberg (1989), Erweitertes Kognitives Motivationsmodell","typ":"matrix","stamm":"Um die Motivation seiner Schüler*innen im Unterricht zu fördern, überlegt sich Herr Adam verschiedene Maßnahmen. Dabei möchte er vor allem die Anreizsituation für die Schüler*innen verbessern.","frage":"Kreuzen Sie für jede der folgenden Maßnahmen an, ob diese vor dem Hintergrund des Erweiterten Kognitiven Motivationsmodells auf Anreize der Ergebnisfolgen, gegenstandsspezifische Anreize oder tätigkeitsspezifische Anreize ausgerichtet ist. Pro Aussage gibt es nur eine korrekte Antwort.","spalten":["Anreiz der Ergebnisfolgen","Gegenstandsspezifischer Anreiz","Tätigkeitsspezifischer Anreiz"],"zeilen":[{"text":"Herr Adam macht detailliert sichtbar, welche Leistungskriterien von den Schüler*innen bereits erfüllt wurden.","loesung":0},{"text":"Herr Adam baut vielfältige Aktionsformen in den Unterricht ein.","loesung":2},{"text":"Herr Adam verbindet den Lernstoff mit Ereignissen, die in der Lebenswelt der Schüler*innen aktuell relevant sind.","loesung":1},{"text":"Herr Adam zeigt den Schüler*innen in Rückmeldungen auf, dass sie ihren Lernerfolg selbst herbeigeführt haben.","loesung":0},{"text":"Herr Adam stellt für die Schüler*innen persönliche Bezüge zum Thema her.","loesung":1},{"text":"Herr Adam gestaltet Übungen so, dass die Schüler*innen unterbrechungsfrei arbeiten können.","loesung":2},{"text":"Herr Adam präsentiert überraschende Ereignisse, um die Schüler*innen neugierig auf das Thema zu machen.","loesung":1}],"erklaerung":"Das Erweiterte Kognitive Motivationsmodell unterscheidet drei Anreizfelder danach, wo der Anreiz ansetzt. Anreize der Ergebnisfolgen betreffen Selbst- und Fremdbewertung sowie Belohnung; die Folie nennt als Maßnahmen Transparenz der Bewertungskriterien, das Festhalten von Ergebnissen und das Fördern des „Stolzes auf die eigene Tüchtigkeit“. Das detaillierte Sichtbarmachen erfüllter Leistungskriterien fällt unter die Transparenz, das Aufzeigen des selbst herbeigeführten Lernerfolgs unter die Stolzförderung. Tätigkeitsspezifische Anreize meinen den Spaß am Tun und das Aufgehen in der Tätigkeit; als Maßnahmen nennt die Folie Vielfalt an Aktionsformen, klare Ziele und eine unterbrechungsfreie Handlungsstruktur – letztere ist eine der Flow-Bedingungen nach Csikszentmihalyi. Gegenstandsspezifische Anreize zielen auf Interesse und Interessantheit des Gegenstands; die Folie zur Interessantheitssteigerung listet dafür wörtlich persönlichen Bezug, Bezug zu aktuellen Ereignissen und Überraschung bzw. Seltenheit auf – genau die drei verbleibenden Maßnahmen.","folie":"4_Motivation_Anreize_09_11_2021, Seite 38, 48 und 51 (Interessantheit steigern, Bedingungen für Flow, Anreizfelder)"},{"id":"ex2024-16-2","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 16.2 (S. 23)","vertrauen":"mittel","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Ames & Archer (1988), Zielstrukturen im Klassenraum","typ":"matrix","stamm":"Um zu verhindern, dass die Motivation so ungünstig beeinflusst wird wie bei der Englischlehrerin, sollten Lehrpersonen ein Klassenklima schaffen, in dem im Sinne von Ames & Archer (1988) Mastery Goals und nicht Performance Goals betont werden.","frage":"Kreuzen Sie für jede der folgenden Lehrerverhaltensweisen an, inwiefern sie „Mastery Goals“ oder „Performance Goals“ salient macht. Pro Aussage gibt es nur eine korrekte Antwort.","spalten":["Mastery Goals","Performance Goals","beide","keine"],"zeilen":[{"text":"Die Lehrperson verhält sich allen Schülern gegenüber gleich.","loesung":3},{"text":"Die Lehrperson lobt insbesondere, wenn Lernfortschritte erkennbar sind.","loesung":0},{"text":"Die Lehrperson zeigt Zufriedenheit, wenn Schüler gut gearbeitet haben.","loesung":0},{"text":"Die Lehrperson hält Begabung für einen zentralen Faktor für Lernerfolg.","loesung":1},{"text":"Die Lehrperson tadelt jeden Fehler und legt großen Wert auf fehlerfreie Schülerarbeiten.","loesung":1},{"text":"Die Lehrperson stellt Aufgaben mit klaren Bewertungskriterien.","loesung":0}],"erklaerung":"Die Vorlesung stellt die Klimaaspekte beider Zielstrukturen Zeile für Zeile gegenüber. Erfolg bedeutet in einer Mastery-Struktur Verbesserung und Lernfortschritt, in einer Performance-Struktur eine überdurchschnittliche Note; entsprechend macht Lob für erkennbare Lernfortschritte Mastery Goals salient. Zur Zufriedenheit heißt es wörtlich: Mastery – wenn gut gearbeitet wurde, Performance – wenn die Leistung besser ist als die der anderen; die dritte Zeile ist damit eindeutig Mastery. Der Wertfokus liegt bei Mastery auf Anstrengung, bei Performance auf hoher Fähigkeit, weshalb die Überzeugung von der zentralen Rolle der Begabung Performance Goals betont. Die Fehlerkultur ist bei Mastery von der Haltung „Fehler sind normal und eine Lernchance“ geprägt, bei Performance von Fehlerangst und Fehlervermeidung – das Tadeln jedes Fehlers gehört daher zu Performance. Evaluationskriterien sind bei Mastery kriteriumsorientiert und individuell, bei Performance sozial vergleichend; klare Bewertungskriterien sind damit ein Mastery-Signal. Die erste Zeile findet in der Tabelle keine Entsprechung: Gleichbehandlung aller ist weder ein Kriteriumsbezug noch ein sozialer Vergleich und macht daher keine der beiden Zielstrukturen salient. Diese Zeile ist die einzige, die sich nicht direkt aus der Folie ableiten lässt.","folie":"4_Motivation_Anreize_09_11_2021, Seite 12 (Ames & Archer, Analyse des Klassenklimas)"},{"id":"hp3a-ws2021-08","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 10 (Lösung S. 18)","vertrauen":"hoch","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Heckhausen & Rheinberg (1980), Erweitertes Kognitives Motivationsmodell","typ":"matrix","stamm":"Hr. Adam möchte die Motivation seiner Kursteilnehmer*innen fördern. Er überlegt sich dazu verschiedene Maßnahmen, um die Anreizsituation des Kurses zu verbessern.","frage":"Kreuzen Sie für jede der folgenden Maßnahmen an, ob diese nach dem Erweiterten Kognitiven Motivationsmodell auf Anreize der Ergebnisfolgen, gegenstandsspezifische Anreize oder tätigkeitsspezifische Anreize ausgerichtet ist (pro Maßnahme nur eine korrekte Antwort).","spalten":["Anreiz der Ergebnisfolgen","Gegenstandsspezifischer Anreiz","Tätigkeitsspezifischer Anreiz"],"zeilen":[{"text":"Der Kursleiter betont die lohnenswerten Folgen einer erfolgreichen Kursteilnahme.","loesung":0},{"text":"Der Kursleiter gestaltet die Bewertungskriterien für eine erfolgreiche Kursteilnahme transparent.","loesung":0},{"text":"Der Kursleiter gestaltet die Kursmaterialien interessant.","loesung":1},{"text":"Der Kursleiter wählt Aufgabeninhalte, die sich an den Interessen der Teilnehmenden orientieren.","loesung":1},{"text":"Der Kursleiter wählt vielfältige Aktionsformen für den Kurs.","loesung":2}],"erklaerung":"Anreize der Ergebnisfolgen beziehen sich auf das, was nach dem Erreichen eines Ergebnisses folgt, etwa lohnenswerte Konsequenzen oder transparente Bewertungskriterien, die die Instrumentalität des Ergebnisses für spätere Folgen verdeutlichen. Gegenstandsspezifische Anreize betreffen das Interesse am Gegenstand bzw. Inhalt selbst, weshalb interessant gestaltete Materialien und an den Interessen der Teilnehmenden orientierte Inhalte hier einzuordnen sind. Tätigkeitsspezifische Anreize beziehen sich auf die Freude an der Ausübung der Tätigkeit selbst, etwa Spaß, Flow oder Abwechslung, die durch vielfältige Aktionsformen gefördert werden."},{"id":"hp3b-wise2021-04","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 62","vertrauen":"mittel","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Csikszentmihalyi (1992), Flow-Erleben","typ":"multi","stamm":"Welche der folgenden Erlebenszustände gehören zu den von M. Csikszentmihalyi (1992) beschriebenen Merkmalen des „Flow“-Erlebens beim Ausführen von Handlungen?","frage":"Merkmal des Flow-Erlebens?","optionen":["Das Gefühl der Kontrolle über die eigenen Handlungen","Eine hohe Bereitschaft, die Aufmerksamkeit willentlich zu fokussieren","Das Gefühl, dass die Handlung glatt und flüssig abläuft","Die zeitweise Ausblendung des Handlungsgegenstandes","Das Erleben optimaler Beanspruchung"],"loesungen":[0,2,4],"erklaerung":"Zu den zentralen Flow-Merkmalen nach Csikszentmihalyi zählen das Gefühl der Kontrolle über das eigene Handeln, das mühelose, flüssige Ineinandergreifen von Handlung und Bewusstsein sowie das Erleben einer optimalen, ausgewogenen Beanspruchung im Gleichgewicht von Anforderung und Fähigkeit. Flow ist gerade durch mühelose, nicht durch willentlich-angestrengte Konzentration gekennzeichnet, sodass eine hohe Bereitschaft zur willentlichen Fokussierung dem Konzept widerspricht. Im Flow-Zustand verschmelzen Handelnde mit dem Handlungsgegenstand und blenden eher das Selbst bzw. die Umgebung aus, nicht den Gegenstand der Handlung selbst, weshalb diese Option nicht zutrifft.","folie":"04_Motivation_Anreize / Anreize und Zielorientierungen (Flow-Konzept)"},{"id":"hp3c-probekl2-07","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Krapp (1992), persönliches vs. situationales Interesse","typ":"matrix","frage":"Geben Sie für jedes der folgenden Szenarien an, inwiefern nach Krapp (1992) persönliches Interesse oder situationales Interesse beschrieben bzw. angeregt wird.","spalten":["persönliches Interesse","situationales Interesse"],"zeilen":[{"text":"Das Thema Europäische Hauptstädte interessiert Max, weil er im Sommer nach London reisen wird.","loesung":1},{"text":"Markus, ein begeisterter Schwimmer, studiert interessiert ein Arbeitsblatt, das die Phasen des Kraularmzugs beschreibt.","loesung":0},{"text":"Julia findet den Lateinunterricht interessant, seitdem die Lehrerin neue Vokabeln mithilfe von Asterix-Comics erarbeitet.","loesung":1},{"text":"Annette bearbeitet interessiert die Matheaufgaben, die zu einer spannenden Abenteuergeschichte gehören.","loesung":1},{"text":"Die Schüler der dritten Klasse dürfen das Thema ihres 10-minütigen Kurzvortrags frei wählen.","loesung":0}],"erklaerung":"Persönliches Interesse ist eine überdauernde Person-Gegenstands-Relation, die für das Individuum von besonderer Bedeutung ist, wie bei Markus' Schwimmleidenschaft. Situationales Interesse entsteht dagegen durch aktuelle, situationsspezifische Anreizbedingungen des Inhalts wie eine anstehende Reise, einen motivierenden comicgestützten Vokabelunterricht oder eine spannend verpackte Aufgabe und muss nicht auf einer stabilen Vorliebe beruhen. Die freie Themenwahl des Kurzvortrags spricht dagegen persönliches Interesse an, weil sie den Schülerinnen und Schülern erlaubt, einen Gegenstand ihrer eigenen, überdauernden Interessenslage zu wählen.","folie":"4_Motivation_Anreize_09_11_2021, Seite 20-21 (Interesse: persönliches vs. situationales Interesse/Interessantheit)"},{"id":"nar-f14","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL3, Frage 14, S. 5","vertrauen":"mittel","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Heckhausen (1980), Rheinberg (1989), Erweitertes Kognitives Motivationsmodell (EKM)","typ":"multi","frage":"Im erweiterten kognitiven Motivationsmodell (Heckhausen und Rheinberg) werden Anreize für verschiedene Stellen der subjektiven Episodenstruktur beschrieben. Welche der folgenden Anreize lassen sich in das Modell einordnen?","optionen":["Kompetenzeinschätzung","Flow-Erleben","Aussicht auf Lob","Selbstwirksamkeitserwartung","Interessantheit des Themas"],"loesungen":[1,2,4],"erklaerung":"Das EKM unterscheidet tätigkeitszentrierte Anreize wie das Flow-Erleben (b) und die Interessantheit des Themas (e) sowie folgenbezogene Anreize wie die Aussicht auf Lob (c). Kompetenzeinschätzung (a) und Selbstwirksamkeitserwartung (d) sind dagegen Erwartungskomponenten und keine Anreize im Sinne des Modells, weshalb sie hier nicht zutreffen."},{"id":"nar-f15","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL3, Frage 15, S. 5","vertrauen":"mittel","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Heckhausen (1980), Rheinberg (1989), Erweitertes Kognitives Motivationsmodell (EKM)","typ":"multi","frage":"Das EKM von Heckhausen und Rheinberg spricht u. a. von gegenstandsspezifischen Anreizen. Mit welcher/n der folgenden konkreten Maßnahmen gelingt es wahrscheinlich, gegenstandsspezifische Anreize für die Lernenden zu setzen?","optionen":["Im Englischunterricht dürfen sich die Lernenden selbst ein Buch aussuchen, welches sie der Klasse präsentieren.","In der ersten Biologiestunde zum Thema Evolution hängt der Lehrer lustige Affenbilder an die Tafel, ohne darauf einzugehen.","Für den Geschichtsunterricht sollen die Lernenden ihre Eltern/Großeltern über Veränderungen in der Familie zur Wendezeit 1989/90 befragen.","Im Matheunterricht baut die Lehrerin zwischen anstrengenden Lernphasen Witze zur Auflockerung ein."],"loesungen":[0,2],"erklaerung":"Gegenstandsspezifische Anreize entstehen, wenn der Lerngegenstand selbst als interessant oder bedeutsam erlebt wird. Die eigene Buchwahl (a) und die Befragung von Angehörigen zur eigenen Familiengeschichte (c) stellen unmittelbar einen persönlichen Bezug zum Inhalt her. Die kommentarlos aufgehängten Affenbilder (b) setzen dagegen keinen inhaltlichen Anreiz, weil sie nicht mit dem Thema verknüpft werden, und die Witze der Lehrerin (d) sind ein situativer, kein gegenstandsspezifischer Anreiz."},{"id":"nar-f16","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL3, Frage 16, S. 6","vertrauen":"hoch","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Ames & Archer (1988), Zielorientierungen (Mastery vs. Performance Goals)","typ":"multi","frage":"Ames und Archer (1988) unterscheiden hinsichtlich der Zielorientierung Performance goals und Mastery goals. Welche der folgenden Aspekte im Klassenklima zeigen an, dass Mastery Goals im Zentrum stehen?","optionen":["Der Lehrerfokus liegt auf dem Lernprozess.","Der Schülerfokus liegt auf dem Lernprozess.","Fehler sind eine Lernchance.","Die soziale Bezugsnorm ist das Evaluationskriterium.","Der Wert-Fokus liegt auf hoher Fähigkeit.","Verbesserung und Lernfortschritt werden als Erfolge gesehen.","Die SuS sind zufrieden, wenn ihre Leistung im Vergleich mit anderen besser ist.","Die SuS strengen sich an, um dazuzulernen und Kompetenzen zu erwerben."],"loesungen":[0,1,2,5,7],"erklaerung":"Ein auf Mastery Goals ausgerichtetes Klassenklima zeigt sich daran, dass Lehrkraft und Schüler den Lernprozess fokussieren (a, b), Fehler als Lernchance gelten (c), Verbesserung selbst als Erfolg zählt (f) und Anstrengung dem Kompetenzerwerb dient (h). Eine soziale Bezugsnorm als Bewertungsmaßstab (d), ein Fokus auf hohe Fähigkeit an sich (e) und Zufriedenheit durch besseres Abschneiden im Vergleich zu anderen (g) kennzeichnen dagegen Performance Goals."},{"id":"nar-f19","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL3, Frage 19, S. 7","vertrauen":"mittel","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Csikszentmihalyi, Flow-Modell (Passung von Anforderung und Fähigkeit)","typ":"multi","stamm":"Tom geht in die 7. Klasse und ist sehr interessiert am Fach Geographie. Wenn Tom Geographieaufgaben bearbeitet, konzentriert er sich praktisch wie von selbst und vergisst auch gern die Zeit dabei. Nun steht ein wichtiger Test bevor und er soll die Topographie Afrikas lernen. Aber heute gerät er nicht in einen Flow-Zustand: Tom hat seinen Atlas in der Schule vergessen. Vaters Atlas, den er nun zum Lernen nutzt, enthält alle Bezeichnungen nur auf Englisch. Mit Englisch steht Tom eher auf Kriegsfuß. Außerdem hört Toms Bruder nebenan sehr laut Musik.","frage":"Tom ist normalerweise sehr interessiert an Geographie und gerät beim Bearbeiten von Aufgaben leicht in einen Flow-Zustand. Heute gerät er beim Lernen der Topographie Afrikas jedoch nicht in Flow: Er nutzt einen englischsprachigen Atlas, mit dem er sich schwertut, und sein Bruder hört nebenan laut Musik. Warum gerät Tom in dieser Situation nicht in einen Flow-Zustand?","optionen":["Das Verstehen der englischen Bezeichnungen stört das Aufgabenbearbeiten.","Die Noten sind für ihn der einzige Ansporn.","Es gibt keine klaren Ziele für die Vorbereitung.","Die momentanen Anforderungen sind höher als seine Fähigkeiten.","Seine Situations-Folge-Erwartung ist niedrig."],"loesungen":[0,3],"erklaerung":"Flow entsteht nach dem Modell nur bei einer Passung zwischen Anforderungen und Fähigkeiten sowie unter Bedingungen wie klaren Zielen und ungestörter Konzentration. Die zusätzliche Sprachhürde durch den englischen Atlas erhöht die Anforderungen über Toms Fähigkeiten hinaus (a), und die laute Musik des Bruders stört die notwendige Konzentration, sodass die Anforderungen die Fähigkeiten faktisch übersteigen (d). Dass Noten sein einziger Ansporn wären (b) widerspricht dem geschilderten intrinsischen Interesse, klare Ziele fehlen der Aufgabe nicht (c), und die Situations-Folge-Erwartung (e) ist im Text kein Thema."},{"id":"pk2017-03","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 3","vertrauen":"hoch","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Csikszentmihalyi, Flow-Erleben und seine Bedingungen","typ":"mc-kombi","stamm":"Tom geht in die 7. Klasse und ist sehr interessiert am Fach Geographie. Wenn Tom Geographieaufgaben bearbeitet, konzentriert er sich praktisch wie von selbst und vergisst auch gern die Zeit dabei. Nun steht ein wichtiger Test bevor und er soll die Topographie Afrikas lernen. Das Thema macht Tom viel Spaß und er hatte bisher immer gute Noten in Topographie-Tests, aber heute gerät er nicht in einen Flow-Zustand beim Bearbeiten der Geographieaufgaben. Tom hat seinen Atlas in der Schule vergessen. Vaters Atlas, den er nun zum Lernen nutzt, enthält alle Bezeichnungen nur in Englisch. Mit Englisch steht Tom eher auf Kriegsfuß. Außerdem hört Toms Bruder nebenan sehr laut Musik.","frage":"Tom gerät in dieser Situation nicht in einen Flow-Zustand, weil…","aussagen":["das Verstehen der englischen Bezeichnungen das Aufgabenbearbeiten stört.","die Noten für ihn der einzige Ansporn sind.","es keine klaren Ziele für die Vorbereitung gibt.","die Anforderungen höher sind als seine Fähigkeiten.","seine Situations-Folge-Erwartung niedrig ist."],"optionen":["Die Aussagen (1) und (2) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (4) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1), (3) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Aussage (4) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":1,"aussagen_richtig":[0,3],"erklaerung":"Flow setzt eine optimale Passung zwischen Fähigkeiten und Anforderungen sowie einen flüssigen, unterbrechungsfreien Handlungsablauf voraus. Beides ist hier verletzt: Der englische Atlas verlangt Tom zusätzlich eine Übersetzungsleistung in einem Fach ab, mit dem er „auf Kriegsfuß“ steht – die Gesamtanforderung übersteigt damit sein Können (4), und die ständige Übersetzungsarbeit unterbricht den Handlungsablauf (1). Aussage (2) widerspricht dem Fall, denn Tom interessiert sich unabhängig von Noten für Geographie. Klare Ziele gibt es sehr wohl – der bevorstehende Test und die Topographie Afrikas sind konkret benannt –, weshalb (3) nicht zutrifft. Aussage (5) verwendet mit „Situations-Folge-Erwartung“ einen Begriff, den das Erwartungsmodell nicht kennt.","folie":"4_Motivation_Anreize_09_11_2021, Seite 47-49 (Flow-Erleben, Bedingungen, Flow-Kanal)"},{"id":"pk2017-07","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 7","vertrauen":"hoch","teil":"II","thema":"Anreize und Zielorientierungen","modell":"Krapp (1992), persönliches und situationales Interesse","typ":"matrix","frage":"Geben Sie für jedes der folgenden Szenarien an, inwiefern nach Krapp (1992) persönliches Interesse oder situationales Interesse beschrieben bzw. angeregt wird.","spalten":["Persönliches Interesse","Situationales Interesse"],"zeilen":[{"text":"Das Thema Europäische Hauptstädte interessiert Max, weil er im Sommer nach London reisen wird.","loesung":1},{"text":"Markus, ein begeisterter Schwimmer, studiert interessiert ein Arbeitsblatt, das die Phasen des Kraularmzugs beschreibt.","loesung":0},{"text":"Julia findet den Lateinunterricht interessant, seitdem die Lehrerin neue Vokabeln mithilfe von Asterix-Comics erarbeitet.","loesung":1},{"text":"Annette bearbeitet interessiert die Matheaufgaben, die zu einer spannenden Abenteuergeschichte gehören.","loesung":1},{"text":"Die Schüler der dritten Klasse dürfen das Thema ihres 10-minütigen Kurzvortrags frei wählen.","loesung":0}],"erklaerung":"Persönliches Interesse ist eine überdauernde Person-Gegenstands-Relation: Der Gegenstand hat für die Person herausgehobene Bedeutung und ist positiv emotional besetzt, unabhängig von der aktuellen Situation. Markus' Schwimmbegeisterung ist eine solche stabile Relation, die er in den Unterricht mitbringt, und die freie Themenwahl beim Kurzvortrag ist genau das Format, das vorhandene persönliche Interessen zum Zug kommen lässt. Situationales Interesse wird dagegen durch Merkmale der Situation oder der Darbietung ausgelöst und ist zunächst vorübergehend: die bevorstehende London-Reise als äußerer Anlass, die Asterix-Comics als Aufbereitungsform und die Abenteuergeschichte als Einkleidung der Matheaufgaben. Aus wiederholt angeregtem situationalem Interesse kann sich über die Interessengenese persönliches Interesse entwickeln, beschrieben ist hier aber jeweils die situationsgebundene Anregung.","folie":"4_Motivation_Anreize_09_11_2021, Seite 19-20 (Interesse, Modell der Interessensgenese)"},{"id":"hp3c-probekl2-01","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Belohnung und Selbstbestimmung","modell":"Selbstbestimmungstheorie (Deci & Ryan), motivationsförderliche Prinzipien nach Vansteenkiste, Ryan & Soenens (2020)","typ":"matrix","frage":"Es können verschiedene Maßnahmen ergriffen werden, um motivationsförderliche Bedingungen zu schaffen. Entscheiden Sie, welche der folgenden Maßnahmen zur Motivationsförderung beitragen und welche nicht.","spalten":["förderlich","nicht förderlich"],"zeilen":[{"text":"Übereinstimmung von Lernvoraussetzungen und Aufgabenschwierigkeiten herstellen","loesung":0},{"text":"Bei Gruppenarbeiten nur die Gesamtleistung aller bewerten","loesung":1},{"text":"Für einen Aufgabenbereich globale Ziele setzen","loesung":1},{"text":"Verschiedene Möglichkeiten der Aufgabenbearbeitung anbieten","loesung":0},{"text":"Größere, aber zeitlich entfernte Belohnungen anbieten","loesung":1},{"text":"Konkrete Rückmeldungen über die Leistung geben","loesung":0}],"erklaerung":"Motivationsförderlich sind Maßnahmen, die die drei Grundbedürfnisse der Selbstbestimmungstheorie ansprechen: Kompetenzerleben (Aufgabenschwierigkeit passend zu den Voraussetzungen, konkrete Rückmeldung) und Autonomieerleben (Wahlmöglichkeiten bei der Bearbeitung). Nicht förderlich sind eine rein gruppenbezogene Bewertung, die individuelle Leistung unsichtbar macht, zu globale statt konkrete, erreichbare Ziele sowie große aber zeitlich weit entfernte Belohnungen, die ihren Anreizwert für aktuelles Handeln verlieren und die intrinsische Motivation eher untergraben als stützen.","folie":"06_Motivation_Belohnung_22_11_2022, Seite 13 (Selbstbestimmungstheorie: Autonomie, Kompetenz, Relatedness)"},{"id":"nar-f29","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL5, Frage 29, S. 9","vertrauen":"mittel","teil":"II","thema":"Belohnung und Selbstbestimmung","modell":"Deci & Ryan (1993), Selbstbestimmungstheorie, Stufen der Verhaltensregulation","typ":"matrix","frage":"Deci und Ryan (1993) beschrieben in ihrer Selbstbestimmungstheorie der Motivation sechs Stufen der Verhaltensregulation. Ordnen Sie die folgenden Aussagen den passenden Regulationsstufen zu.","spalten":["Intrinsische Motivation","Introjizierte Regulation","Externale Regulation","Identifizierte Regulation","Amotivation","Integrierte Motivation"],"zeilen":[{"text":"Zu verstehen, wie etwas funktioniert, finde ich faszinierend. Und das Experimentieren macht auch total Spaß. Ich freue mich schon auf die nächste Stunde!","loesung":0},{"text":"Ich habe zwar keine Lust, mich auf das Gruppentreffen vorzubereiten, aber die Anderen erwarten das von mir. Da hätte ich sonst ein schlechtes Gewissen.","loesung":1},{"text":"Wenn ich meine Hausaufgaben nicht mache, erlauben mir meine Eltern bestimmt nicht mehr so viel Computer zu spielen.","loesung":2},{"text":"In Mathe sollte ich mich mehr anstrengen. Matheunterricht finde ich persönlich irgendwie recht sinnvoll.","loesung":3},{"text":"Ich kann das eh nicht, warum soll ich also für die Klausur lernen? Das ist sowieso verschwendete Zeit.","loesung":4},{"text":"Um frei wählen zu können, was ich machen will, brauche ich einen guten Schulabschluss.","loesung":5}],"erklaerung":"Die sechs Stufen bilden ein Kontinuum von völlig fremdbestimmtem zu vollständig selbstbestimmtem Verhalten. Bei der Amotivation fehlt jeder erkennbare Handlungsgrund („warum soll ich lernen, ich kann das eh nicht“), bei externaler Regulation richtet sich Verhalten nach äußeren Konsequenzen wie Strafen der Eltern, introjizierte Regulation ist durch internalisierten Druck und Schuldgefühle geprägt, identifizierte Regulation liegt vor, wenn eine Person den persönlichen Sinn einer Tätigkeit anerkennt, integrierte Regulation verknüpft das Verhalten mit dem eigenen Wertesystem und eigenen Zielen, und intrinsische Motivation ist an Faszination und Freude an der Tätigkeit selbst erkennbar, ohne dass ein externer Zweck nötig ist.","folie":"Q29 gibt die Stufen im Quelldokument bereits als Beschriftung der Aussagen an; hier als blinde Zuordnungsaufgabe rekonstruiert."},{"id":"nar-f32","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL5, Frage 32, S. 10","vertrauen":"hoch","teil":"II","thema":"Belohnung und Selbstbestimmung","modell":"Korrumpierungseffekt (Deci, Lepper et al.)","typ":"single","frage":"Wird eine Person für eine intrinsisch motivierte Tätigkeit materiell belohnt, so steigert dies die Motivation nicht, sondern führt im Gegenteil zu einer geringeren Motivation der Person. Wie nennt sich dieser Effekt?","optionen":["Korrelations-Effekt","Korrumpierungs-Effekt","Kovarianz-Effekt","Korruptions-Effekt"],"loesung":1,"erklaerung":"Dieser Effekt heißt Korrumpierungseffekt: Eine materielle Belohnung für eine bereits intrinsisch motivierte Tätigkeit verschiebt die wahrgenommene Ursache des eigenen Handelns von der Tätigkeit selbst auf die externe Belohnung, wodurch die intrinsische Motivation sinkt, sobald die Belohnung wegfällt oder für die betreffende Tätigkeit nicht mehr in Aussicht steht. Die übrigen Bezeichnungen (Korrelations-, Kovarianz-, Korruptions-Effekt) sind keine feststehenden Fachbegriffe für dieses Phänomen."},{"id":"nar-f33","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL5, Frage 33, S. 10","vertrauen":"hoch","teil":"II","thema":"Belohnung und Selbstbestimmung","modell":"Deci & Ryan (1993, 2008), intrinsische vs. extrinsische Motivation","typ":"multi","frage":"Deci und Ryan (1993, 2008) unterscheiden zwischen intrinsischer und extrinsischer Motivation. Welche der Aussagen treffen auf extrinsische Motivation zu?","optionen":["Extrinsische Motivation ist durch eine instrumentelle Absicht gekennzeichnet.","Extrinsische Motivation ist interessengeleitet.","Extrinsische Motivation ist fremdbestimmt und wird von außen in Gang gesetzt.","Extrinsisches Verhalten kann auch spontan auftreten.","Extrinsische Motivation zeichnet sich durch das Erleben von Freude an der Tätigkeit aus."],"loesungen":[0,2],"erklaerung":"Extrinsische Motivation ist per Definition instrumentell und fremdbestimmt: Das Verhalten dient einem außerhalb der Tätigkeit liegenden Zweck (a) und wird durch äußere Anreize in Gang gesetzt (c). Interessengeleitetes Verhalten (b), spontanes Auftreten (d) und Freude an der Tätigkeit selbst (e) sind dagegen charakteristisch für intrinsische Motivation und widersprechen der extrinsischen Definition."},{"id":"nar-f34","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL5, Frage 34, S. 10","vertrauen":"hoch","teil":"II","thema":"Belohnung und Selbstbestimmung","modell":"Korrumpierungseffekt (Deci, Lepper et al.)","typ":"single","frage":"Ahmet ist sehr interessiert an Geschichte und recherchiert für seine Hausaufgaben oft zusätzlich stundenlang. Seine Geschichtslehrerin möchte ihm für seine Mühen Süßigkeiten schenken. Sollte sie das tun?","optionen":["Belohnung","Keine Belohnung"],"loesung":1,"erklaerung":"Nein: Ahmets Beschäftigung mit Geschichte ist bereits hoch intrinsisch motiviert. Eine materielle Belohnung wie Süßigkeiten würde hier den Korrumpierungseffekt auslösen, weil eine ohnehin vorhandene intrinsische Motivation durch externe Anreize untergraben werden kann – Ahmet könnte sein Engagement zunehmend auf die Belohnung statt auf sein eigenes Interesse zurückführen."},{"id":"nar-f35","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL5, Frage 35, S. 10","vertrauen":"mittel","teil":"II","thema":"Belohnung und Selbstbestimmung","modell":"Effekte von Lob als verbale Belohnung; paradoxe Effekte von Lob und Tadel (Rheinberg)","typ":"single","frage":"Mathelehrer Herr Kaiser lobt SuS mit geringem Interesse an Mathe jedes Mal, wenn sie eine Aufgabe an der Tafel richtig rechnen, um ihre Freude am Fach anzuregen. Sollte er SuS mit hohem Interesse genauso loben?","optionen":["Belohnung","Keine Belohnung"],"loesung":0,"erklaerung":"Ja, Lob ist als verbale (nicht materielle) Belohnung nach der Befundlage grundsätzlich auch bei bereits hohem Interesse positiv und untergräbt die intrinsische Motivation typischerweise nicht in gleicher Weise wie materielle Belohnungen. Allerdings sollte das Lob dabei nicht in unangemessenem Maß erfolgen, etwa bei einfachen Aufgaben, da sonst paradoxe Effekte von Lob und Tadel auftreten können, wenn Anstrengung statt Fähigkeit betont wird, obwohl die Aufgabe für die leistungsstarken Schüler leicht war."},{"id":"nar-f36","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL5, Frage 36, S. 11","vertrauen":"mittel","teil":"II","thema":"Belohnung und Selbstbestimmung","typ":"single","frage":"Eine Klasse hat keine Lust auf Deutschunterricht. Der Lehrer überlegt, ihre Motivation durch einen Buchpreis für eine gute Leistung in der Klassenarbeit zu stärken.","optionen":["Belohnung","Keine Belohnung"],"loesung":0,"erklaerung":"Da bei der Klasse wenig intrinsische Motivation für Deutsch vorhanden ist, wäre eine Belohnung nach der Befundlage grundsätzlich motivational günstig, weil hier kein Korrumpierungseffekt droht. Ein Buchpreis ist als konkrete Ausgestaltung aber fragwürdig gewählt: Er betont vor allem den extrinsischen Anreiz Wettbewerb/Note und könnte, gerade weil er wenig auf die individuellen Vorlieben der SuS eingeht, eher wie eine zusätzliche Anforderung als eine echte Belohnung wirken. Der Lehrer sollte deshalb eher eine Belohnung wählen, die den Schülern selbst attraktiv erscheint, statt starr einen Buchpreis vorzugeben."},{"id":"ex2016-07-1","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 7.1","vertrauen":"mittel","teil":"II","thema":"Bezugsnormorientierung","modell":"Bezugsnormen; SOGY § 20 / SOGS § 15","typ":"matrix","stamm":"Ein Mathematik-Lehrer hat die Mathematikarbeit korrigiert. Er hat sich dazu zunächst einmal einen Gesamteindruck über das Leistungsspektrum der Klasse verschafft, indem er je zwei Arbeiten von bisher sehr leistungsstarken Schülern sowie von bisher eher leistungsschwachen Schülern durchgesehen hat. Mithilfe dieses Gesamteindrucks hat er anschließend Arbeit für Arbeit korrigiert und in Relation zu den beiden guten und schlechten Arbeiten bewertet.","frage":"Welche Bezugsnorm bzw. Bezugsnormen werden vom Mathematik-Lehrer angewendet und welche werden von der Sächsischen Schulordnung für Gymnasien und Grundschulen verlangt?","spalten":["Mathe-Lehrer","Schulordnung","sowohl als auch","weder noch"],"zeilen":[{"text":"Soziale Bezugsnorm","loesung":0},{"text":"Objektive Bezugsnorm","loesung":3},{"text":"Kriteriumsorientierte Bezugsnorm","loesung":1},{"text":"Individuelle Bezugsnorm","loesung":1},{"text":"Subjektive Bezugsnorm","loesung":3}],"erklaerung":"Der Lehrer bewertet jede Arbeit in Relation zu vier Vergleichsarbeiten aus derselben Klasse. Das ist ein Vergleich zwischen Schülern im zeitlichen Querschnitt, also die soziale Bezugsnorm – und nur er wendet sie an. Die Sächsische Schulordnung verlangt in SOGY § 20 und SOGS § 15 zweierlei: Leistungen werden nach dem Grad des Erreichens von Lernanforderungen bewertet – das ist die kriteriumsorientierte Bezugsnorm – und die Bewertung berücksichtigt den individuellen Lernfortschritt – das ist die individuelle Bezugsnorm. Beide verlangt die Schulordnung, beide wendet dieser Lehrer nicht an. „Objektive“ und „subjektive“ Bezugsnorm sind keine Fachbegriffe der Bezugsnormtheorie; sie werden weder verlangt noch angewendet. Im Klausurexemplar ist die soziale Bezugsnorm als „sowohl als auch“ angekreuzt. Dafür gibt der Wortlaut der Schulordnung nichts her.","folie":"07 Motivation Lehrerverhalten IndBNO, Folie 43 – Schulordnungen; Folie 36 – Rheinberg (1980)"},{"id":"ex2016-10","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 10","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","modell":"Rheinberg (1980), Bezugsnormorientierung","typ":"matrix","stamm":"Lehrende sollen sich im Sinne einer individuellen Bezugsnormorientierung verhalten, um die Motivation von Schülern zu fördern. Allerdings gibt es im Schulkontext noch sehr viele Lehrpersonen, die eine soziale Bezugsnormorientierung aufweisen.","frage":"Kreuzen Sie für jede der folgenden Aussagen an, inwiefern sie für die individuelle (IndBNO) oder soziale Bezugsnormorientierung (SozBNO) oder für beide oder keine der beiden zutreffen.","spalten":["IndBNO","SozBNO","beide","keine"],"zeilen":[{"text":"Die Lehrperson lobt, wenn die Leistung besser als der Klassendurchschnitt ist.","loesung":1},{"text":"Die Lehrperson lobt insbesondere, wenn Lernfortschritte erkennbar sind.","loesung":0},{"text":"Die Lehrperson attribuiert bei leistungsstarken Schülern Erfolg auf Begabung.","loesung":1},{"text":"Die Lehrperson hält Anstrengung für einen zentralen Faktor für Lernerfolg.","loesung":0},{"text":"Die Lehrperson attribuiert bei allen Schülern Erfolg auf Glück.","loesung":3},{"text":"Die Lehrperson stellt Aufgaben nach dem Prinzip der Passung.","loesung":0},{"text":"Die Lehrperson hält Begabung für einen zentralen Faktor für Lernerfolg.","loesung":1},{"text":"Die Lehrperson stellt regelmäßig Aufgaben zur Festigung des Gelernten.","loesung":2}],"erklaerung":"Rheinberg stellt die beiden Orientierungen auf vier Feldern gegenüber. Beim Leistungsvergleich vergleicht die soziale Orientierung zwischen Schülern im Querschnitt, die individuelle innerhalb eines Schülers im Längsschnitt – daher Klassendurchschnitt sozial, erkennbarer Lernfortschritt individuell. Bei der Individualisierung steht Angebotsgleichheit gegen das Prinzip der Passung, weshalb passgenaue Aufgaben individuell sind. Bei der Kausalattribution bevorzugt die soziale Orientierung zeitkonstante Faktoren wie Begabung, die individuelle betont den Zusammenhang von Anstrengung und Erfolg. Deshalb sind Begabung als zentraler Faktor sozial und Anstrengung als zentraler Faktor individuell. Zwei Zeilen fallen heraus. Erfolg pauschal auf Glück zurückzuführen passt zu keiner der beiden: Glück ist weder ein zeitkonstantes Personenmerkmal noch ein anstrengungsbezogener Faktor, und es macht Rückmeldung wertlos. Übungsaufgaben zur Festigung wiederum stellt jede Lehrkraft, unabhängig von ihrer Bezugsnorm – deshalb beide.","folie":"07 Motivation Lehrerverhalten IndBNO, Folie 36 – Übersicht nach Rheinberg (1980); Folie 35"},{"id":"ex2024-17-1","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 17.1 (S. 24)","vertrauen":"mittel","teil":"II","thema":"Bezugsnormorientierung","modell":"Rheinberg (1980), Bezugsnormen; Sächsische Schulordnungen","typ":"matrix","stamm":"Ein Physik-Lehrer hat die Physikarbeit korrigiert. Er hat dabei zunächst Arbeit für Arbeit mit vorbereiteten Kriterien und Punkte-Schema bewertet. Danach prüft er, wo die durchschnittliche Punktzahl für die Arbeit liegt und legt dann den Notenschlüssel fest. Für die durchschnittlich erreichte Punktzahl gibt es die Note 3. Für die höchste Punktzahl vergibt er die Note 1, für die schlechteste die Note 6.","frage":"Welche Bezugsnorm bzw. Bezugsnormen werden vom Physik-Lehrer bei der Beurteilung der Leistung angewendet und welche von den Sächsischen Schulordnungen für allgemeinbildende Schulen verlangt? Kreuzen Sie an, ob die jeweilige Bezugsnorm vom Lehrer angewendet wird, von den Schulordnungen verlangt wird, sowohl angewandt als auch verlangt wird oder weder verlangt noch angewendet wird. Pro Zeile gibt es nur eine richtige Antwort.","spalten":["Physik-Lehrer","Schulordnung","sowohl als auch","weder noch"],"zeilen":[{"text":"Soziale Bezugsnorm","loesung":0},{"text":"Objektive Bezugsnorm","loesung":3},{"text":"Sachliche Bezugsnorm","loesung":2},{"text":"Individuelle Bezugsnorm","loesung":1},{"text":"Subjektive Bezugsnorm","loesung":3}],"erklaerung":"Unterschieden werden drei Bezugsnormen: die soziale (Vergleich mit der Gruppe), die sachliche oder kriteriale (Vergleich mit einem festgelegten Lernziel) und die individuelle (Vergleich mit dem früheren Stand derselben Person). „Objektive“ und „subjektive“ Bezugsnorm sind keine Begriffe des Modells und damit reine Distraktoren – weder angewendet noch verlangt. Der Physik-Lehrer arbeitet zweistufig: Die Punktvergabe erfolgt nach vorbereiteten Kriterien und ist damit sachlich; den Notenschlüssel leitet er anschließend aber aus dem Klassendurchschnitt ab und wendet damit zusätzlich die soziale Bezugsnorm an, die von keiner Schulordnung verlangt wird. Die sächsischen Schulordnungen verlangen ausdrücklich beides, was er nicht vollständig erfüllt: Leistungen sind nach dem Grad des Erreichens der Lernanforderungen zu bewerten (sachliche Bezugsnorm, die er anwendet – daher „sowohl als auch“), und die Bewertung hat den individuellen Lernfortschritt zu berücksichtigen (individuelle Bezugsnorm, die im Fallbeispiel keine Rolle spielt – daher nur „Schulordnung“).","folie":"07_Motivation_Lehrerverhalten_IndBNO_29112022, Seite 43 (Bezugsnormen in den sächsischen Schulordnungen)"},{"id":"hp3b-wise2021-05","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 62-63","vertrauen":"mittel","teil":"II","thema":"Bezugsnormorientierung","modell":"Rheinberg (1980), soziale vs. individuelle Bezugsnormorientierung","typ":"matrix","stamm":"Rheinberg (1980) unterscheidet zwischen einer sozialen und einer individuellen Bezugsnormorientierung (BNO). Beurteilen Sie für die folgenden Verhaltensweisen, ob diese jeweils typisch für eine Lehrperson mit sozialer BNO oder mit individueller BNO sind oder ob anhand der Verhaltensweise nicht auf eine bestimmte BNO geschlossen werden kann. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Verhaltensweise ist typisch für …","spalten":["keine der beiden","soziale BNO","individuelle BNO"],"zeilen":[{"text":"Frau P. schaut sich an, bei welchen Anforderungen die einzelnen Schüler*innen in der letzten Klausur Probleme hatten und gibt ihnen jeweils passende Übungsaufgaben dazu.","loesung":2},{"text":"Frau L. achtet darauf, dass bei Klassenarbeiten nur die Inhalte geprüft werden, die zuvor auch im Unterricht behandelt worden sind.","loesung":0},{"text":"Herr W. hat für die Stunde 10 Übungsaufgaben vorbereitet. Diese sollen von den Schüler*innen in den letzten 20 min. des Unterrichts gelöst werden.","loesung":0},{"text":"Herr D. gibt Paul für seine Leistung im 100-Meter-Lauf folgende Rückmeldung: „Das ist wieder gerade noch eine 4. Das wird wohl auch künftig nichts Besseres werden.“","loesung":1},{"text":"Herr M. dokumentiert die mündlichen Leistungen seiner Schüler*innen über einen längeren Zeitraum, damit er bei seinen Rückmeldungen berücksichtigen kann, ob sich die einzelnen Schüler*innen verbessert oder verschlechtert haben.","loesung":2},{"text":"Frau R. lobt Maria dafür, dass sie ihre Leistungen in der letzten Klassenarbeit steigern konnte und unterstreicht dabei, dass kontinuierliches Üben Früchte trägt.","loesung":2},{"text":"Herr J. macht in Vorbereitung auf die nächste Klausur deutlich, dass intensives Üben zentral ist, um erfolgreich die Klausuraufgaben bearbeiten zu können.","loesung":0},{"text":"Frau K. wartet mit der Notenvergabe für die Referate der einzelnen Schüler*innen, bis die gesamte Klasse vorgetragen hat, damit sie jede einzelne Leistung durch den Vergleich mit den anderen besser einschätzen kann.","loesung":1},{"text":"Frau N. gibt Paula die Klausur mit dem Kommentar zurück, dass sie 80% der Punkte erreicht hat und dass dies eine gute Leistung ist.","loesung":0}],"erklaerung":"Individuelle BNO bewertet Leistung im Vergleich zur eigenen Vorleistung des Lernenden und schreibt Veränderungen vor allem variablen Ursachen wie Anstrengung zu; das zeigt sich bei Frau P., Herrn M. und Frau R., die jeweils den individuellen Verlauf bzw. Fortschritt heranziehen. Soziale BNO vergleicht Leistungen zwischen Lernenden und geht mit stabilen Fähigkeitszuschreibungen einher; das trifft auf Herrn D.s Aussage ('wird auch künftig nichts Besseres') und auf Frau K.s klassenweiten Leistungsvergleich zu. Frau L.s Fokus auf curriculare Validität, Herrn W.s Unterrichtsorganisation, Herrn J.s allgemeiner Motivationsappell und Frau N.s sachlich-kriteriale Prozentrückmeldung lassen dagegen keinen Rückschluss auf eine der beiden Bezugsnormen zu. Eine Notiz im Dokument bestätigt für Herrn D. die stabile Fähigkeitszuschreibung der sozialen BNO und kennzeichnet Frau N.s Rückmeldung explizit als sachliche statt sozialer oder individueller Bezugsnorm.","folie":"07_Motivation_Lehrerverhalten_IndBNO, S. 375-376 PrLit."},{"id":"hp3c-probekl2-10","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","modell":"Soziale vs. individuelle Bezugsnormorientierung (Krampen, 1987)","typ":"matrix","frage":"Ordnen Sie zu, ob das Verhalten der Lehrperson in den folgenden Situationen einer individuellen oder einer sozialen Bezugsnormorientierung entspricht.","spalten":["soziale Bezugsnorm","individuelle Bezugsnorm"],"zeilen":[{"text":"Ich warte mit der Notenvergabe, bis ich alle Referate gehört habe, weil ich dann deine Leistung im Vergleich zu den anderen besser einschätzen kann.","loesung":0},{"text":"Mensch Tina, diesmal hast du fast die volle Punktzahl in der Leistungskontrolle, das ist ja erstaunlich. Da hat dir doch jemand geholfen, oder?","loesung":0},{"text":"Pia, es ist klasse, wie du deine Mitarbeit im letzten Vierteljahr gesteigert hast. Ich sehe, du hast die letzte Rückmeldung ernst genommen.","loesung":1},{"text":"Frau Siever sortiert die Klassenarbeiten vor der Korrektur entsprechend der bisherigen Notenverteilung, weil sie keine großen Veränderungen dieser Verteilung erwartet.","loesung":0},{"text":"Herr Schnorr bezieht bei seinen Bewertungen im Fach Biologie immer den Lernfortschritt der einzelnen Schüler und Schülerinnen mit ein.","loesung":1}],"erklaerung":"Soziale Bezugsnormorientierung beurteilt Leistung im Vergleich zu anderen Lernenden: das Abwarten aller Referate zum Vergleich, die Erwartungshaltung anhand einer üblichen Notenverteilung und das Erstaunen über eine untypisch gute Einzelleistung im Klassenvergleich sind dafür typisch. Individuelle Bezugsnormorientierung bewertet dagegen den Lernfortschritt einer Person gegenüber ihrer eigenen bisherigen Leistung, wie bei der gewürdigten Steigerung von Pias Mitarbeit oder der grundsätzlichen Berücksichtigung des individuellen Lernfortschritts durch Herrn Schnorr.","folie":"07_Motivation_Lehrerverhalten_IndBNO_29112022, Seite 12-14 (Bezugsnormen: soziale vs. individuelle Bezugsnorm-Orientierung, Krampen 1987)"},{"id":"nar-f44","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 44, S. 12","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","typ":"single","frage":"Der Leistungsvergleich bei einer sozialen Bezugsnorm entspricht einem Längsschnitt.","optionen":["Richtig","Falsch"],"loesung":1,"erklaerung":"Die Aussage ist falsch: Die soziale Bezugsnorm vergleicht die Leistung einer Person zu einem Zeitpunkt mit der ihrer Bezugsgruppe – das ist ein Querschnittsvergleich. Ein Längsschnittvergleich, bei dem dieselbe Person über zwei Zeitpunkte hinweg (z. B. T1 und T2) mit sich selbst verglichen wird, kennzeichnet dagegen die individuelle Bezugsnorm."},{"id":"nar-f45","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 45, S. 12","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","typ":"single","frage":"Bei Verwendung der sozialen Bezugsnorm bewerten Lehrpersonen in verschiedenen Klassen unterschiedlich streng.","optionen":["Richtig","Falsch"],"loesung":0,"erklaerung":"Die Aussage ist richtig: Da sich der Bewertungsmaßstab bei der sozialen Bezugsnorm am Klassendurchschnitt orientiert, fällt die Bewertung derselben absoluten Leistung strenger aus, je höher die durchschnittliche Leistung der jeweiligen Klasse ist, und großzügiger, wenn der Durchschnitt niedriger liegt."},{"id":"nar-f46","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 46, S. 12","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","typ":"single","frage":"In der individuellen Bezugsnorm bewertet die Lehrperson verschiedene SuS derselben Klasse unterschiedlich streng.","optionen":["Richtig","Falsch"],"loesung":1,"erklaerung":"Die Aussage ist falsch: Nach sächsischer Schulordnung orientiert sich auch die individuelle Bezugsnorm in der Praxis an einem gemeinsamen sachlichen Maßstab und wird meist nur ergänzend zur sachlichen Bezugsnorm eingesetzt, etwa durch Plus-/Minuszeichen zur Darstellung intraindividueller Leistungstendenzen – nicht durch grundsätzlich unterschiedlich strenge Maßstäbe pro Schüler."},{"id":"nar-f47","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 47, S. 13","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","modell":"Erweitertes Kognitives Motivationsmodell (EKM), Bezugsnormorientierung","typ":"single","frage":"Die soziale Bezugsnormorientierung ist motivational ungünstig, weil die Situations-Ergebnis-Erwartung für alle SuS besonders niedrig ist.","optionen":["Richtig","Falsch"],"loesung":1,"erklaerung":"Die Aussage ist falsch: Bei der sozialen Bezugsnorm ist die Situations-Ergebnis-Erwartung im Gegenteil besonders hoch, weil die relative Rangposition in der Klasse über die Zeit stabil bleibt, unabhängig vom eigenen Handeln. Genau diese hohe Situations-Ergebnis-Erwartung – nicht eine niedrige – macht die soziale Bezugsnorm motivational ungünstig, da eigenes Handeln kaum als wirksam erlebt wird."},{"id":"nar-f48","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 48, S. 13","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","typ":"single","frage":"Die Zielorientierung von SuS ist vergleichbar zu der Bezugsnormorientierung der Lehrperson.","optionen":["Richtig","Falsch"],"loesung":0,"erklaerung":"Die Aussage ist richtig: Beide Konstrukte lassen sich parallel entlang derselben Grundunterscheidung fassen – die Zielorientierung der SuS als mastery- vs. performance-orientiert (bzw. Annäherung vs. Vermeidung) und die Bezugsnormorientierung der Lehrperson als individuell vs. sozial, wobei sich eine soziale Bezugsnormorientierung der Lehrperson typischerweise mit einer performance-orientierten Zielsetzung der SuS verbindet."},{"id":"nar-f49","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 49, S. 13","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","typ":"single","frage":"Lehrpersonen verwenden immer nur eine der beiden Bezugsnormorientierungen in ihrer Laufbahn.","optionen":["Richtig","Falsch"],"loesung":1,"erklaerung":"Die Aussage ist falsch: In der Praxis finden sich meist Mischformen, bei denen Lehrpersonen je nach Fach, Situation oder Schüler zwischen individueller und sozialer Bezugsnormorientierung wechseln oder beide kombinieren, statt sich dauerhaft auf eine einzige Orientierung festzulegen."},{"id":"pk2017-10","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 10","vertrauen":"hoch","teil":"II","thema":"Bezugsnormorientierung","modell":"Rheinberg (1980), Bezugsnorm-Orientierung von Lehrpersonen","typ":"matrix","frage":"Ordnen Sie zu, ob das Verhalten der Lehrperson in den folgenden Situationen einer individuellen oder einer sozialen Bezugsnormorientierung entspricht.","spalten":["Soziale BNO","Individuelle BNO"],"zeilen":[{"text":"Ich warte mit der Notenvergabe, bis ich alle Referate gehört habe, weil ich dann deine Leistung im Vergleich zu den anderen besser einschätzen kann.","loesung":0},{"text":"Mensch Tim, diesmal hast du fast die volle Punktzahl in der Leistungskontrolle, das ist ja erstaunlich. Da hat dir doch jemand geholfen, oder?","loesung":0},{"text":"Pia, es ist klasse, wie du deine Mitarbeit im letzten Vierteljahr gesteigert hast. Ich sehe, du hast die letzte Rückmeldung ernst genommen.","loesung":1},{"text":"Frau Siever sortiert die Klassenarbeiten vor der Korrektur entsprechend der bisherigen Notenverteilung, weil sie keine großen Veränderungen dieser Verteilung erwartet.","loesung":0},{"text":"Herr Schnorr bezieht bei seinen Bewertungen im Fach Biologie immer den Lernfortschritt der einzelnen Schüler und Schülerinnen mit ein.","loesung":1}],"erklaerung":"Das Unterscheidungskriterium ist der Vergleichsmaßstab: Die soziale Bezugsnorm vergleicht die Leistung mit der Gruppe, die individuelle mit dem früheren Stand derselben Person. Das Abwarten aller Referate zur besseren Einordnung im Vergleich ist explizit sozial, ebenso Frau Sievers Erwartung einer stabilen Notenverteilung in der Klasse. Auch der Kommentar an Tim ist sozial: Die Überraschung entsteht, weil das Ergebnis nicht zu dem Platz passt, den die Lehrperson ihm in der Klassenrangfolge zuweist – und die unterstellte fremde Hilfe entwertet den individuellen Fortschritt zusätzlich. Individuell sind dagegen das Lob für Pias Steigerung gegenüber dem eigenen Ausgangsniveau und Herrn Schnorrs grundsätzliche Berücksichtigung des Lernfortschritts einzelner Lernender.","folie":"07_Motivation_Lehrerverhalten_IndBNO_29112022, Seite 21 (Bezugsnorm-Orientierungen nach Rheinberg)"},{"id":"ex2016-07-3","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 7.3","vertrauen":"mittel","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Erweitertes kognitives Motivationsmodell – Erwartungstypen","typ":"mc-kombi","stamm":"Ein Mathematik-Lehrer hat die Mathematikarbeit korrigiert. Er hat sich dazu zunächst einmal einen Gesamteindruck über das Leistungsspektrum der Klasse verschafft, indem er je zwei Arbeiten von bisher sehr leistungsstarken Schülern sowie von bisher eher leistungsschwachen Schülern durchgesehen hat. Mithilfe dieses Gesamteindrucks hat er anschließend Arbeit für Arbeit korrigiert und in Relation zu den beiden guten und schlechten Arbeiten bewertet.","frage":"Warum ist das Vorgehen des Mathematik-Lehrers sowohl für die besonders leistungsstarken als auch die leistungsschwachen Schüler demotivierend?","aussagen":["Das Vorgehen erzeugt eine hohe Situations-Ergebnis-Erwartung.","Das Vorgehen erzeugt eine niedrige Situations-Ergebnis-Erwartung.","Das Vorgehen erzeugt eine hohe Handlungs-Ergebnis-Erwartung.","Das Vorgehen erzeugt eine hohe Ergebnis-Folge-Erwartung.","Das Vorgehen erzeugt eine niedrige Ergebnis-Folge-Erwartung."],"aussagen_richtig":[0],"optionen":["Die Aussagen (3) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2), (3) und (4) treffen zu, alle anderen Aussagen treffen nicht zu.","Aussage (1) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (4) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu, alle anderen Aussagen treffen nicht zu."],"loesung":2,"erklaerung":"Die Situations-Ergebnis-Erwartung ist die Erwartung, dass das Ergebnis schon aus der Situation heraus eintritt, ganz ohne eigenes Zutun. Genau die erzeugt dieses Vorgehen: Wer als leistungsstark gilt, bekommt eine gute Note, weil er am oberen Ende des Vergleichsrahmens eingeordnet wird; wer als leistungsschwach gilt, landet unten. In beiden Fällen steht das Ergebnis vorher fest. Motivation entsteht aber nur, wenn die eigene Handlung etwas ändert. Ist die Situations-Ergebnis-Erwartung hoch, lohnt sich Anstrengung nicht – bei den Starken nicht, weil es auch ohne geht, bei den Schwachen nicht, weil es ohnehin nichts nützt. Deshalb wirkt dasselbe Vorgehen auf beide Gruppen demotivierend, und deshalb ist (1) allein richtig.","folie":"05 Motivation Erwartungen – Erwartungstypen im EKM"},{"id":"ex2024-17-3","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 17.3 (S. 25)","vertrauen":"mittel","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Heckhausen & Rheinberg (1980), Erweitertes Kognitives Motivationsmodell (Erwartungstypen)","typ":"mc-kombi","stamm":"Ein Physik-Lehrer hat die Physikarbeit korrigiert. Er hat dabei zunächst Arbeit für Arbeit mit vorbereiteten Kriterien und Punkte-Schema bewertet. Danach prüft er, wo die durchschnittliche Punktzahl für die Arbeit liegt und legt dann den Notenschlüssel fest. Für die durchschnittlich erreichte Punktzahl gibt es die Note 3. Für die höchste Punktzahl vergibt er die Note 1, für die schlechteste die Note 6.","frage":"Warum ist das Vorgehen des Physik-Lehrers sowohl für die besonders leistungsstarken als auch die leistungsschwachen Schüler*innen demotivierend?","aussagen":["Das Vorgehen erzeugt eine hohe Situations-Ergebnis-Erwartung.","Das Vorgehen erzeugt eine niedrige Situations-Ergebnis-Erwartung.","Das Vorgehen erzeugt eine hohe Handlungs-Ergebnis-Erwartung.","Das Vorgehen erzeugt eine hohe Handlungs-Folge-Erwartung.","Das Vorgehen erzeugt eine niedrige Ergebnis-Folge-Erwartung."],"optionen":["Die Aussagen (1) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (2), (3) und (4) treffen zu; alle anderen Aussagen treffen nicht zu.","Aussage (1) trifft zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (4) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu; alle anderen Aussagen treffen nicht zu."],"loesung":2,"aussagen_richtig":[0],"erklaerung":"Die Situations-Ergebnis-Erwartung beschreibt, in welchem Maß sich das Ergebnis schon aus der Situation selbst ergibt, ohne dass eigenes Handeln nötig wäre. Weil der Lehrer die Noten 1 und 6 automatisch an die beste und die schlechteste Arbeit der Klasse vergibt, steht das Ergebnis für beide Gruppen praktisch schon vor der Arbeit fest: Die Leistungsstarke bekommt die 1 ohnehin, die Leistungsschwache die 6 ohnehin. Diese hohe Situations-Ergebnis-Erwartung ist im Modell der klassische Motivationskiller, denn sie entwertet jede zusätzliche Anstrengung (1). Aussage (2) behauptet das Gegenteil und ist falsch. Die Handlungs-Ergebnis-Erwartung, also der Einfluss des eigenen Handelns auf das Ergebnis, ist in dieser Konstellation gerade nicht hoch, sondern niedrig – damit scheidet (3) aus. Die Handlungs-Folge-Erwartung (4) spielt hier keine Rolle, da die Folgen nicht unmittelbar an die Handlung, sondern an die Note gekoppelt sind. Und die Ergebnis-Folge-Erwartung (5) ist nicht niedrig: Noten ziehen sehr wohl Folgen nach sich, das Problem liegt eine Stufe früher.","folie":"4_Motivation_Anreize_09_11_2021, Seite 5 (Erweitertes Kognitives Motivationsmodell, Erwartungstypen)"},{"id":"hp3a-ws2021-16","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 14 (Lösung S. 20)","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Heckhausen & Rheinberg (1980), Erweitertes Kognitives Motivationsmodell","typ":"multi","stamm":"Eine Seminarteilnehmerin nimmt an einer praktischen Übung zur beispielhaften Darstellung motivationaler Faktoren in Leistungssituationen teil. Dabei soll sie mehrfach versuchen, einen Ball in einen handelsüblichen Eimer zu werfen. Sie kann sich den Abstand zum Eimer selbst wählen und bekommt für jeden erfolgreichen Wurf eine der Tafeln Schokolade, die vor ihr auf dem Tisch liegen.","frage":"Welche Effekte sind nach dem Erweiterten kognitiven Motivationsmodell (Heckhausen & Rheinberg, 1980) in der Situation zu erwarten?","optionen":["Die Folge-Anreize der Seminarteilnehmerin steigen während der Übung, wenn die Belohnung mit Schokolade für erfolgreiches Treffen zuverlässig und kontinuierlich erfolgt.","Die tätigkeitsspezifischen Anreize sind bei dieser Übung für diejenigen Studierenden höher, die Freude am Werfen haben, als für diejenigen, denen Werfen keine Freude bereitet.","Die Ergebnis-Folge-Erwartung der anderen anwesenden Studierenden wird nicht beeinflusst, falls die Teilnehmerin für erfolgreiche Würfe keine Schokolade erhält.","Die Handlungs-Ergebnis-Erwartung der Seminarteilnehmerin wird durch die Belohnung mit Schokolade negativ beeinflusst.","Die Situations-Ergebnis-Erwartung der Seminarteilnehmerin wird durch die eigenständige Wahl der Wurfweite beeinflusst."],"loesungen":[1,4],"erklaerung":"Tätigkeitsspezifische Anreize (Spaß, Freude, Flow an der Tätigkeit selbst) sind per Definition höher für Personen, denen die Tätigkeit – hier das Werfen – Freude bereitet (b). Die Situations-Ergebnis-Erwartung beschreibt, mit welcher Wahrscheinlichkeit eine Situation ohne eigenes Eingreifen zu einem Ergebnis führt; durch die freie Wahl der Wurfweite verändert die Teilnehmerin die Ausgangssituation selbst und beeinflusst damit, wie leicht ein Treffer allein aufgrund der Situation zu erwarten wäre (e). Zuverlässige, kontinuierliche Belohnung sagt nichts über die Höhe der Folge-Anreize aus, die von der Instrumentalität des Ergebnisses für gewünschte Konsequenzen abhängt (a, falsch). Die Ergebnis-Folge-Erwartung anderer Anwesender wird durch das Beobachten der Belohnungspraxis bei der Teilnehmerin durchaus mitbeeinflusst, nicht unberührt gelassen (c, falsch). Die Handlungs-Ergebnis-Erwartung betrifft die Wahrscheinlichkeit, durch eigenes Handeln das gewünschte Ergebnis herbeizuführen, und wird durch eine nachträgliche Belohnung nicht direkt negativ beeinflusst (d, falsch).","folie":"02_Motivation_Modell_25_10_2022.txt, Folie 27 und 40f. (Situations-Ergebnis-Erwartung; tätigkeitsspezifische Anreize = Spaß/Freude/Flow)"},{"id":"hp3b-wise2021-10","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 65","vertrauen":"mittel","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Heckhausen & Rheinberg (1980), Erweitertes Kognitives Motivationsmodell (EKM)","typ":"matrix","stamm":"Das Erweiterte Kognitive Motivationsmodell (EKM; Heckhausen & Rheinberg, 1980) unterscheidet verschiedene Erwartungskomponenten, mit deren Hilfe motiviertes Verhalten von Schüler*innen erklärt werden kann. Entscheiden Sie für jede der folgenden Aussagen, ob diese die Situations-Ergebnis-Erwartung (SEE), die Handlungs-Ergebnis-Erwartung (HEE), die Ergebnis-Folge-Erwartung (EFE) oder keine Erwartungskomponente des EKM anspricht. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Aussage spricht an …","spalten":["SEE","HEE","EFE","keine Erwartungskomponente"],"zeilen":[{"text":"„Ich lerne nicht für die Klausur, weil der Lehrer sowieso allen eine 1 gibt.“","loesung":0},{"text":"„Ich lerne für die Klausur, weil ich dann die Klausuraufgaben besser bearbeiten kann.“","loesung":1},{"text":"„Ich lerne nicht für die Klausur, weil bei diesem Lehrer die Notenvergabe nichts mit der tatsächlichen Leistung zu tun hat.“","loesung":0},{"text":"„Ich lerne für die Klausur, weil ich mich sehr für das Fach interessiere.“","loesung":3},{"text":"„Ich lerne für die Klausur, weil mir das Üben Freude bereitet.“","loesung":3},{"text":"„Ich lerne nicht für die Klausur, denn mit dem Ergebnis dieser Klausur kann ich meine Zeugnisnote sowieso nicht mehr ändern.“","loesung":2},{"text":"„Ich lerne nicht für die Klausur, weil mich die Lehrperson nicht mag und mir sowieso eine schlechte Zensur gibt.“","loesung":0},{"text":"„Ich lerne für die Klausur, denn immer, wenn ich gut geübt habe, konnte ich auch schwierige Aufgaben gut meistern.“","loesung":1},{"text":"„Ich lerne nicht für die Klausur, da ich die Note nicht in den Abiturschnitt einrechnen lassen muss.“","loesung":2},{"text":"„Ich lerne nicht für die Klausur, weil es mir so schwer fällt, den Stoff zu verstehen.“","loesung":1},{"text":"„Ich lerne nicht für die Klausur, weil mir das Thema der Klausur nicht liegt und ich mich durch Üben nicht verbessern kann.“","loesung":1},{"text":"„Ich lerne für die Klausur, weil ich nur noch eine gute Note benötige, um im Zeugnis nicht die schlechtere Note zu bekommen.“","loesung":2}],"erklaerung":"Die Situations-Ergebnis-Erwartung (SEE) beschreibt die Erwartung, dass ein Ergebnis auch ohne eigenes Handeln eintritt (z.B. weil der Lehrer ohnehin allen dieselbe Note gibt oder die Notenvergabe unabhängig von der Leistung erfolgt). Die Handlungs-Ergebnis-Erwartung (HEE) betrifft die Erwartung, dass das eigene Handeln (Üben, Lernen) zu einem bestimmten Ergebnis führt oder eben nicht, wie beim Zweifel, durch Üben etwas verbessern zu können. Die Ergebnis-Folge-Erwartung (EFE) bezieht sich auf die Konsequenzen, die ein erzieltes Ergebnis nach sich zieht, etwa die Auswirkung der Note auf das Zeugnis oder den Abiturschnitt. Reines fachliches Interesse oder Freude an der Tätigkeit selbst sind keine Erwartungskomponenten, sondern intrinsische Anreize, und werden daher keiner der drei Kategorien zugeordnet.","folie":"05_Motivation_Erwartungen_15_11_2022, S. 156 (SEE), S. 159 (HEE)"},{"id":"hp3c-probekl2-04","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Bandura (1977, 1986), Quellen der Self-Efficacy","typ":"matrix","frage":"Welche der folgenden Begriffe bezeichnen klassische Quellen der Selbstwirksamkeitserwartung nach Bandura?","spalten":["Ja","Nein"],"zeilen":[{"text":"eigene Erfolgserlebnisse (Mastery Experience)","loesung":0},{"text":"standardisierte Begabungstests (Standardized Testing)","loesung":1},{"text":"stellvertretende Erfahrung (Vicarious Experience)","loesung":0},{"text":"verbale Ermutigung (Verbal Persuasion)","loesung":0},{"text":"offene Lernarrangements (Open Learning)","loesung":1},{"text":"Aufmerksamkeitsregulation (Attention Control)","loesung":1}],"erklaerung":"Bandura unterscheidet vier klassische Quellen der Self-Efficacy: eigene Erfolgserlebnisse (Mastery Experience), stellvertretende Erfahrung durch Beobachtung anderer (Vicarious Experience), verbale Ermutigung durch andere (Verbal/Social Persuasion) sowie physiologische und affektive Erregungszustände. Standardisierte Begabungstests, offene Lernarrangements und Aufmerksamkeitsregulation gehören nicht zu diesem Quellenkatalog, auch wenn sie mit Lernprozessen im weiteren Sinne zu tun haben.","folie":"05_Motivation_Erwartungen_15_11_2022, Seite 7 (Academic Self-Efficacy: Quellen zur Genese nach Bandura, 1977/1986)"},{"id":"hp3c-probekl2-12","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Erweitertes Kognitives Motivationsmodell (Heckhausen, 1980; Rheinberg, 1989)","typ":"mc-kombi","stamm":"Anton ist Schüler der 8. Klasse und muss demnächst sein Berufspraktikum organisieren. Dies würde er gern in der Metallbranche absolvieren, weil er hier später eine Ausbildung machen möchte und gehört hat, dass Schülerpraktikanten in der Metallbranche sehr willkommen sind. Da Anton immer mal die Kinder der Nachbarn betreut, haben ihm die Eltern der Nachbarskinder gesagt, dass im Kindergarten ein Praktikumsplatz frei wird und sie ihm diesen ohne Probleme besorgen könnten. Anton bedankt sich, lehnt das Angebot jedoch ab. Er beginnt stattdessen voller Vorfreude mit der Recherche für ein Praktikum in der Metallbranche.","frage":"Wie lässt sich Antons Verhalten anhand des Erweiterten Kognitiven Motivationsmodells nach Heckhausen erklären?","aussagen":["Anton möchte den Praktikumsplatz im Kindergarten aufgrund seiner diesbezüglich niedrigen Situations-Folge-Erwartung nicht annehmen.","Anton beginnt aufgrund seiner hohen Handlungs-Ergebnis-Erwartung gleich mit der Recherche für ein Praktikum in der Metallbranche.","Anton verdient sich das Taschengeld via Babysitten aufgrund seiner hohen Handlungs-Folge-Erwartung dazu.","Anton würde sich nicht für ein Praktikum in der Metallbranche bewerben, wenn er eine geringe Situations-Ergebnis-Erwartung hätte.","Anton erwartet sich durch das Praktikum einen guten Einstieg in die Ausbildung, was seine Ergebnis-Folge-Erwartung erhöht."],"aussagen_richtig":[1,4],"optionen":["Aussage (2) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1), (3) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (4) treffen zu; alle anderen Aussagen treffen nicht zu.","Aussage (4) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":2,"erklaerung":"Dass Anton sofort und voller Vorfreude mit der Recherche für das Metallbranchen-Praktikum beginnt, spricht für eine hohe Handlungs-Ergebnis-Erwartung: Er ist überzeugt, durch sein Handeln (Recherche, Bewerbung) das gewünschte Ergebnis (Praktikumsplatz) auch tatsächlich erreichen zu können. Dass er sich davon einen guten Einstieg in die Ausbildung erhofft, betrifft die Ergebnis-Folge-Erwartung, also die Erwartung, dass das Ergebnis die gewünschte Folge nach sich zieht. Die Ablehnung des Kindergartenplatzes lässt sich nicht auf eine Situations-Folge-Erwartung zurückführen, da dieser Erwartungstyp im Modell nicht vorgesehen ist, und Taschengeldverdienst durch Babysitten ist im Fallbeispiel nicht thematisiert.","folie":"02_Motivation_Modell_25_10_2022, Seite 38-41 (Erweitertes Kognitives Motivationsmodell: Situations-Ergebnis-, Handlungs-Ergebnis-, Ergebnis-Folge-Erwartung)"},{"id":"nar-f20","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL4, Frage 20, S. 7","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Bandura (1977), Sozial-kognitive Lerntheorie, Quellen der Selbstwirksamkeit","typ":"multi","frage":"Bandura (1977) befasste sich im Rahmen der sozial-kognitiven Lerntheorie mit den Quellen der Self-efficacy. Durch welche konkreten Maßnahmen kannst du die Self-efficacy von SuS fördern?","optionen":["Feuere SuS im Sportunterricht an.","Lass die Klassenstreberin den Vortrag zuerst halten, damit die anderen sehen, dass gute Leistungen möglich sind.","Gib Bruno im Matheunterricht Aufgaben, die er wahrscheinlich schafft, und zeige ihm, dass er sie aus eigener Kraft geschafft hat.","Für das Anfertigen eines Plakates im Sachunterricht zeige den Kindern Beispiele für gute und schlechte Plakate."],"loesungen":[1,2,3],"erklaerung":"Nach Bandura speist sich Selbstwirksamkeit u. a. aus eigenen Erfolgserlebnissen (mastery experience) und stellvertretender Erfahrung am Modell. Bruno eigene, aus eigener Kraft geschaffte Erfolge erleben zu lassen (c) ist eine klassische Mastery-Experience-Maßnahme, das Vorführen von guten und schlechten Modellen (d) nutzt stellvertretende Erfahrung, und das Vortragen der Klassenbesten zuerst (b) zeigt anderen, dass Erfolg erreichbar ist – ebenfalls stellvertretende Erfahrung. Bloßes Anfeuern im Sport (a) liefert dagegen keine der von Bandura benannten vier Quellen (Mastery Experience, stellvertretende Erfahrung, verbale Ermutigung, emotionaler Zustand) in belastbarer Form und wirkt allenfalls kurzfristig."},{"id":"nar-f21","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL4, Frage 21, S. 7","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Selbstkonzept vs. Selbstwirksamkeitserwartung (Bandura, 1977)","typ":"matrix","frage":"Zur Beschreibung motivationsrelevanter Erwartungen werden sowohl das Selbstkonzept eigener Fähigkeiten als auch die Selbstwirksamkeitserwartung genutzt. Ordnen Sie die folgenden Aussagen von SuS danach ein, ob sie jeweils Aspekte des Selbstkonzeptes oder der Selbstwirksamkeitserwartung betreffen.","spalten":["Selbstkonzept","Selbstwirksamkeitserwartung"],"zeilen":[{"text":"Aufsätze schreiben in Deutsch fällt mir schwer.","loesung":0},{"text":"Ich bin ein guter Zuhörer.","loesung":0},{"text":"Die Chemieklausur heute werde ich bestimmt nicht bestehen.","loesung":1},{"text":"In Mathe erreiche ich gewöhnlich gute Leistungen.","loesung":0},{"text":"Bei der Geographiehausaufgabe für nächste Woche werde ich Hilfe brauchen.","loesung":1},{"text":"Ich erinnere mich noch an alle Spanischvokabeln aus der letzten Stunde.","loesung":1}],"erklaerung":"Das Selbstkonzept ist eine generalisierte, bereichsbezogene Einschätzung der eigenen Fähigkeit, unabhängig von einer konkreten Aufgabe (a, b, d). Die Selbstwirksamkeitserwartung bezieht sich dagegen auf die konkrete, aufgabenspezifische Zuversicht, eine bestimmte Anforderung bewältigen zu können (c, e, f). Die Zuordnung folgt daran, ob die Aussage allgemein von einer überdauernden Fähigkeit oder von einer bevorstehenden konkreten Anforderung spricht."},{"id":"nar-f22","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL4, Frage 22, S. 7","vertrauen":"mittel","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","typ":"multi","frage":"Schätzen Lernende ihre eigene Kompetenz als zu gering ein, kann das verschiedene Folgen haben. Welche der folgenden Faktoren können empirischen Untersuchungen zufolge negativ von einer geringen Kompetenzeinschätzung beeinflusst werden?","optionen":["Zufriedenheit mit eigener Leistung","Gewissenhaftigkeit bei der Aufgabenbearbeitung","Bereitschaft, nach Misserfolgen weiter „dranzubleiben“.","Interesse an Lernstoff","Ergebnis-Folge-Erwartung"],"loesungen":[0,2],"erklaerung":"Eine zu geringe Kompetenzeinschätzung senkt empirisch die Zufriedenheit mit der eigenen Leistung (a), weil selbst gute Ergebnisse nicht der eigenen Fähigkeit zugeschrieben werden, und die Bereitschaft, nach Misserfolgen „dranzubleiben“ (c), weil Anstrengung als aussichtslos erlebt wird. Gewissenhaftigkeit (b) und Interesse am Lernstoff (d) sowie die Ergebnis-Folge-Erwartung (e) sind dagegen nicht die typischerweise berichteten negativen Folgen einer geringen Kompetenzeinschätzung."},{"id":"nar-f23","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL4, Frage 23, S. 7","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Bandura (1977), Mastery Experience","typ":"single","frage":"Mastery Experience entsteht, wenn Erfolgserlebnisse internal attribuiert werden.","optionen":["Richtig","Falsch"],"loesung":0,"erklaerung":"Die Aussage ist richtig: Mastery Experience als wirksamste Quelle der Selbstwirksamkeitserwartung setzt voraus, dass ein Erfolg der eigenen Fähigkeit bzw. Anstrengung zugeschrieben wird. Wird derselbe Erfolg dagegen external attribuiert, etwa auf Glück oder eine leichte Aufgabe, entsteht kein Zuwachs an wahrgenommener Selbstwirksamkeit."},{"id":"nar-f24","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL4, Frage 24, S. 8","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","typ":"single","frage":"Die Überschätzung der eigenen Leistung ist motivational betrachtet schlechter als die Unterschätzung der eigenen Leistung.","optionen":["Richtig","Falsch"],"loesung":1,"erklaerung":"Die Aussage ist falsch: Motivational ungünstiger ist die Unterschätzung, da sie zuverlässig zu geringerer Persistenz nach Misserfolgen, geringerer Zufriedenheit, ungünstigen Attributionsmustern und einer negativeren Affektbilanz führt. Eine moderate Überschätzung wirkt sich dagegen nicht in gleicher Weise nachteilig aus und kann sogar handlungsfördernd sein."},{"id":"nar-f25","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL4, Frage 25, S. 8","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","typ":"single","frage":"Die Begriffe Self-efficacy, Selbstwirksamkeitserwartung, Selbstkonzept, Fähigkeitskonzept und Kompetenzeinschätzung überschneiden sich an vielen Stellen.","optionen":["Richtig","Falsch"],"loesung":0,"erklaerung":"Die Aussage ist richtig: Alle genannten Begriffe beziehen sich auf die subjektive Einschätzung eigener Fähigkeiten und werden in der Literatur oft nicht trennscharf verwendet, auch wenn sie sich im Detail unterscheiden – etwa danach, ob sie aufgabenspezifisch (Selbstwirksamkeit) oder eher global-bereichsbezogen (Selbstkonzept) gefasst sind."},{"id":"nar-f26","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL4, Frage 26, S. 8","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Big-Fish-Little-Pond-Effekt","typ":"single","frage":"Die Wahrnehmung der eigenen Leistung hängt u. a. vom inter-individuellen Leistungsvergleich ab.","optionen":["Richtig","Falsch"],"loesung":0,"erklaerung":"Die Aussage ist richtig, wie der Big-Fish-Little-Pond-Effekt zeigt: Bei gleicher objektiver Leistung fällt die eigene Leistungseinschätzung je nach Vergleichsgruppe unterschiedlich aus – in einer leistungsstarken Klasse wird dieselbe Leistung schlechter eingeschätzt als in einer leistungsschwächeren Klasse."},{"id":"pk2017-04","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 4","vertrauen":"hoch","teil":"II","thema":"Erwartungen und Kompetenzeinschätzung","modell":"Bandura, Quellen der Selbstwirksamkeitserwartung","typ":"matrix","frage":"Welche der folgenden Begriffe bezeichnen klassische Quellen der Selbstwirksamkeitserwartung nach Bandura?","spalten":["Ja","Nein"],"zeilen":[{"text":"eigene Erfolgserlebnisse (Mastery Experience)","loesung":0},{"text":"standardisierte Begabungstests (Standardized Testing)","loesung":1},{"text":"stellvertretende Erfahrung (Vicarious Experience)","loesung":0},{"text":"verbale Ermutigung (Verbal Persuasion)","loesung":0},{"text":"offene Lernarrangements (Open Learning)","loesung":1},{"text":"Aufmerksamkeitsregulation (Attention Control)","loesung":1}],"erklaerung":"Bandura nennt vier Quellen der Selbstwirksamkeitserwartung: eigene Bewältigungserfahrungen (mastery experience) als stärkste Quelle, stellvertretende Erfahrung durch die Beobachtung ähnlicher Modelle (vicarious experience), verbale Ermutigung durch andere (verbal persuasion) sowie die Wahrnehmung eigener emotionaler und physiologischer Zustände. Standardisierte Begabungstests sind ein diagnostisches Instrument und keine Erfahrungsquelle; offene Lernarrangements sind eine Unterrichtsform; Aufmerksamkeitsregulation ist ein metakognitiver Prozess. Alle drei gehören nicht zu den klassischen Quellen des Modells."},{"id":"pk2017-12","quelle":
