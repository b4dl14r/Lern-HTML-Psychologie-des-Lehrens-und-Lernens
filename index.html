 äußert, er habe dies ganz anders eingeschätzt, ist sie überrascht.","Frau Meier erläutert Leon, welche Anforderungen sie an eine gute Mitarbeit hat, und zeigt ihm auf, wo er diese noch nicht erfüllt.","Frau Meier kritisiert, dass Leon in der Stunde schlechter vorbereitet ist, als sie es voraussetzt.","Frau Meier beendet das Gespräch und ermuntert Leon, seine mündliche Note im zweiten Halbjahr zu verbessern, indem er sich häufiger meldet."],"loesungen":[1,2,3],"erklaerung":"Sinnvoll ist es, konkret zu erläutern, welche Anforderungen an gute Mitarbeit gestellt werden und wo Leon diese noch nicht erfüllt (b), weil so der Sollwert geklärt wird; ebenso sinnvoll ist die konkrete Kritik an mangelnder Vorbereitung (c), weil sie eine überprüfbare Diskrepanz benennt, und die Ermunterung, sich im zweiten Halbjahr häufiger zu melden (d), weil sie eine konkrete, umsetzbare Handlung aufzeigt. Lediglich die Mitteilung der Note ohne inhaltliche Erläuterung, gefolgt von Überraschung über Leons abweichende Selbsteinschätzung (a), ist dagegen nicht lernförderlich, weil hier keine Sollwert-Klärung und keine nachvollziehbare Begründung stattfinden."},{"id":"nar-f79","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL9, Frage 79, S. 18","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Rheinberg (1988), paradoxe Effekte von Lob und Tadel","typ":"multi","frage":"Nicht immer führt Feedback, das eine Attribution auf Anstrengung unterstützen soll, zu den erwarteten Effekten. Diese Phänomene werden nach Rheinberg (1988) auch als paradoxe Effekte von Lob und Tadel bezeichnet. Welche Annahmen liegen diesem Phänomen zugrunde?","optionen":["Für eine gute Leistung in einfachen Aufgaben braucht es entweder Fähigkeit oder Anstrengung.","Für eine gute Leistung in schwierigen Aufgaben braucht es sowohl Fähigkeit als auch Anstrengung.","Für eine gute Leistung bei schwierigen Aufgaben sind entsprechende Fähigkeiten ausreichend."],"loesungen":[0,1],"erklaerung":"Die paradoxen Effekte beruhen auf der Annahme, dass für eine gute Leistung bei einfachen Aufgaben entweder Fähigkeit oder Anstrengung ausreicht, sodass Lob für Anstrengung bei einer leichten Aufgabe implizit geringe Fähigkeit unterstellt (a); und dass bei schwierigen Aufgaben sowohl Fähigkeit als auch Anstrengung nötig sind, sodass Lob für Anstrengung dort als Bestätigung hoher Fähigkeit erlebt wird (b). Dass bei schwierigen Aufgaben Fähigkeit allein ausreiche (c), widerspricht dieser Grundannahme, nach der gerade das Zusammenspiel beider Faktoren nötig ist."},{"id":"nar-f80","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL9, Frage 80, S. 18","vertrauen":"mittel","teil":"II","thema":"Feedback","modell":"Rheinberg (1988), paradoxe Effekte von Lob und Tadel","typ":"multi","frage":"In welchem der folgenden Beispiele können sich paradoxe Effekte von Lob und Tadel zeigen?","optionen":["Tim wird von seinem Lehrer für seinen Misserfolg bei einer schwierigen Mathematikaufgabe getadelt. Tim solle sich mehr anstrengen.","Andrea wird für ihren Erfolg bei einer schwierigen Physikaufgabe gelobt. Man sehe, dass sie sich intensiv dem Thema gewidmet habe.","Tim wird für seinen Misserfolg bei einer einfachen Physikaufgabe getadelt. Er habe sich wohl nicht gut auf die Stunde vorbereitet.","Andrea wird für ihren Erfolg bei einer einfachen Deutschaufgabe gelobt. Die Lehrerin betont Andreas Fleiß, mit dem sie sich in das Thema eingearbeitet habe."],"loesungen":[0,3],"erklaerung":"Ein paradoxer Effekt zeigt sich, wenn Tim für seinen Misserfolg bei einer schwierigen Mathematikaufgabe getadelt und zu mehr Anstrengung aufgefordert wird (a): Da bei schwierigen Aufgaben sowohl Fähigkeit als auch Anstrengung nötig sind, deutet der Tadel implizit auf mangelnde Fähigkeit hin. Ebenso zeigt sich ein paradoxer Effekt, wenn Andrea für ihren Erfolg bei einer einfachen Deutschaufgabe für ihren Fleiß gelobt wird (d): Da bei einfachen Aufgaben Anstrengung allein für Erfolg ausreicht, wird ihr durch das Anstrengungslob implizit geringe Fähigkeit unterstellt. Bei Tim (c, einfache Aufgabe, Tadel wegen Vorbereitung) und Andrea (b, schwierige Aufgabe, Lob für intensive Beschäftigung) passt die Rückmeldung dagegen zur jeweiligen Aufgabenschwierigkeit und löst keinen paradoxen Effekt aus."},{"id":"nar-f81","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL9, Frage 81, S. 18","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss (2006, 2013), Prinzipien kompetenzorientierten Feedbacks","typ":"matrix","frage":"Kompetenzorientiertes Feedback soll die Motivation des Lernenden fördern. Ordnen Sie die folgenden Beispielaussagen den Prinzipien des kompetenzorientierten Feedbacks zu.","spalten":["Diskrepanzen zwischen Soll- und Ist-Werten sichtbar machen","Sollwert klären, Kriterien und Standards nennen","Internes Feedback mit Blick auf den Sollwert anregen","Anwendung und Transfer der Feedbackinformation ermöglichen","Lernerfolge und Lernfortschritte sichtbar machen"],"zeilen":[{"text":"„Welche Elemente hast du in deinen Schaltkreis integriert? Sind sie wesentlich?“","loesung":2},{"text":"„Dieses Mal ist dir der Korbleger gut gelungen. Du hast jetzt die Schrittzahl eingehalten und bist vom richtigen Bein abgesprungen.“","loesung":4},{"text":"„Versuche, die Aufgaben nun nochmal zu lösen.“","loesung":3},{"text":"„Für die 1 musst du mindestens 19 von 20 Vokabeln richtig wiedergegeben haben.“","loesung":1},{"text":"„Eine dialektische Erörterung enthält sowohl Argumente, die für deine Idee sprechen, als auch Argumente, die dagegen sprechen. Diese Struktur kann ich in deiner Erörterung noch nicht erkennen.“","loesung":0}],"erklaerung":"Die Prinzipien kompetenzorientierten Feedbacks nach dem ITFL-Modell lassen sich an konkreten Lehreräußerungen festmachen: Diskrepanzen zwischen Soll- und Istwert sichtbar machen entspricht etwa der Rückmeldung zu Note und Kriterien (j), Sollwerte klären entspricht der Nennung konkreter Kriterien (i), internes Feedback anregen entspricht offenen Reflexionsfragen (f), Transfer ermöglichen entspricht der Aufforderung, die Aufgabe erneut zu lösen (h), und Lernfortschritte sichtbar machen entspricht der Rückmeldung über eine konkrete Verbesserung gegenüber dem letzten Mal (g)."},{"id":"pk2017-11","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 11","vertrauen":"hoch","teil":"II","thema":"Feedback","modell":"Narciss, ITFL-Modell (Interactive Tutoring Feedback Loop)","typ":"matrix","frage":"Kreuzen Sie für jede der folgenden Komponenten an, inwiefern sie im ITFL-Modell zur lernenden Person, zur lehrenden Person oder zu beiden zugeordnet werden.","spalten":["Lernende Person","Lehrende Person","beide"],"zeilen":[{"text":"Informationsverarbeitungsstrategien","loesung":0},{"text":"Lehrziele","loesung":1},{"text":"Repräsentation von Standards für Lernaufgaben","loesung":2},{"text":"Regeleinrichtung","loesung":2},{"text":"Stellglied","loesung":0}],"erklaerung":"Das ITFL-Modell beschreibt Feedback als Regelkreis zwischen einer lehrenden und einer lernenden Seite. Lehrziele werden von der lehrenden Person gesetzt und gehören allein auf ihre Seite. Informationsverarbeitungsstrategien beschreiben, wie die lernende Person die eingehende Information verarbeitet, und liegen deshalb allein bei ihr; ebenso das Stellglied, also die Stelle, an der die Korrekturmaßnahme tatsächlich ausgeführt wird – korrigieren kann nur die lernende Person selbst. Standards für Lernaufgaben sind dagegen auf beiden Seiten repräsentiert: Die Lehrperson hat einen Sollwert im Kopf, und die lernende Person bildet einen eigenen, der oft davon abweicht – gerade diese Differenz macht Feedback nötig. Auch die Regeleinrichtung, die Ist- und Sollwert vergleicht, ist auf beiden Seiten vorhanden: extern durch die Rückmeldung der Lehrperson und intern durch die Selbstbewertung der lernenden Person.","folie":"9_Feedback_Grundlagen_13_12_2022 (ITFL-Modell, Regelkreis)"},{"id":"ex2024-09","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 9 (S. 12)","vertrauen":"hoch","teil":"II","thema":"Interaktion und Kommunikation","modell":"Jones & Gerard (1967), Interaktionsarten","typ":"matrix","stamm":"Im Rahmen menschlicher Kommunikation unterscheiden Jones und Gerard (1967) verschiedene Interaktionsarten. Im Folgenden sind kurze Beispiele dargestellt.","frage":"Ordnen Sie die folgenden Aussagen der jeweils passenden Interaktionsart zu. Pro Aussage gibt es nur eine korrekte Antwort.","spalten":["Pseudo-Interaktion","Asymmetrische Interaktion","Reaktive Interaktion","Wechselseitige Interaktion"],"zeilen":[{"text":"Max geht gerade zum Sportunterricht. Herr Meier geht zum Lehrerzimmer. Beim Aneinander-Vorbeigehen im Schulhaus grüßen sich Lehrer und Schüler und tauschen sich kurz über das Volleyballturnier von gestern aus.","loesung":2},{"text":"Im Geschichtsunterricht will Herr Bär sein Thema schaffen und referiert unbeirrt über die Weimarer Republik. Seine Schüler*innen bereiten sich dabei auf den Vokabeltest in der Englischstunde danach vor.","loesung":0},{"text":"Frau Müller hat im Biologieunterricht die Photosynthese erklärt. Sie überprüft nun durch kurze Fragen, inwiefern die Schüler*innen die korrekte Antwort geben können. Zu den Schülerantworten gibt sie dabei jeweils ein kurzes evaluatives Feedback.","loesung":1},{"text":"Eine 10. Klasse bereitet gemeinsam mit ihrem Deutschlehrer ein Theaterstück vor. Dabei ergänzen sie sich gegenseitig mit ihren Ideen.","loesung":3},{"text":"Frau Fink führt eine Klasse durch das Albertinum, um ihren Schüler*innen die Kunstepochen an Originalwerken zu verdeutlichen. Einige Schüler*innen hören dabei heimlich das neueste Buch von Cornelia Funke, weil sie wissen wollen, wie die Geschichte weitergeht.","loesung":0}],"erklaerung":"Das Unterscheidungskriterium ist, wessen Verhaltenspläne die Interaktion steuern. Pseudo-Interaktion liegt vor, wenn beide Seiten ausschließlich ihren eigenen Plänen folgen und lediglich die zeitliche Abfolge sozialer Reize gesteuert wird; die Folie nennt dafür fast wortgleich das Beispiel der vortragenden Lehrperson, während sich die Schüler*innen mit anderem beschäftigen – das trifft auf Herrn Bärs Referat und auf Frau Finks Museumsführung zu. Asymmetrische Interaktion bedeutet, dass A seinen Plan verfolgt und B sein Verhalten daran ausrichtet; die Folie nennt dafür ausdrücklich das I-R-F-Muster Lehrerfrage – Schülerantwort – Lehrerurteil, also genau Frau Müllers Abfragen mit evaluativem Feedback. Reaktive Interaktion bezeichnet wechselseitiges Reagieren ohne eigene Ziele; als Beispiel nennt die Folie Grußverhalten und Small-Talk zwischen Lehrer und Schüler, also die Begegnung von Max und Herrn Meier. Wechselseitige Interaktion liegt vor, wenn beide eigene Ziele verfolgen und zugleich das Verhalten des anderen berücksichtigen – das gemeinsame Theaterprojekt ist das Folienbeispiel dafür.","folie":"11_InteraktionKomm_10_01_2023, Seite 13-14 (Jones & Gerard, dyadische Interaktionssequenzen)"},{"id":"hp3b-wise2021-07","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 63","vertrauen":"mittel","teil":"II","thema":"Interaktion und Kommunikation","modell":"Gordon (1981), Lehrertraining, Ich-Botschaften","typ":"multi","stamm":"Im Lehrertraining von Gordon (1981) wird die Kommunikation mit „Ich-Botschaften“ geübt.","frage":"Was soll durch Ich-Botschaften vermittelt werden?","optionen":["Die konkrete Auswirkung des Verhaltens auf die Lehrperson","Die Beziehung, die zwischen Lehrperson und Schüler*innen besteht","Die Annahmen, die die Lehrperson über das Schülerverhalten hat","Das Verhalten der Schüler*innen, welches Probleme macht","Die Gefühle, die bei der Lehrperson ausgelöst werden"],"loesungen":[0,3,4],"erklaerung":"Eine Ich-Botschaft nach Gordon besteht klassischerweise aus drei Teilen: der konkreten Benennung des störenden Verhaltens, seiner spürbaren Auswirkung auf die Lehrperson und dem dadurch ausgelösten Gefühl. Diese drei Bestandteile entsprechen genau den Optionen 1, 4 und 5. Ich-Botschaften vermitteln bewusst keine Interpretationen oder Unterstellungen über die Motive der Schüler*innen (Du-Botschaften/Vorwürfe) und stellen auch nicht primär die Beziehung selbst in den Vordergrund, sondern die eigene, nachvollziehbare Wahrnehmung der Situation.","folie":"11_InteraktionKomm_10_01_2023 (Gordon, Ich-Botschaften)"},{"id":"hp3b-wise2021-13","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 66-67","vertrauen":"hoch","teil":"II","thema":"Interaktion und Kommunikation","modell":"Jones & Gerard (1967), Interaktionsarten","typ":"matrix","stamm":"Im Rahmen menschlicher Kommunikation unterscheiden Jones und Gerard (1967) verschiedene Interaktionsarten. Ordnen Sie die folgenden Beispiele der jeweils passenden Interaktionsart zu. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Beispiel ist …","spalten":["Asymmetrische Interaktion","Reaktive Interaktion","Wechselseitige Interaktion","Pseudo-Interaktion"],"zeilen":[{"text":"Max geht gerade zum Sportunterricht. Herr Meier geht zum Lehrerzimmer. Beim Aneinander-Vorbeigehen im Schulhaus grüßen sich Lehrer und Schüler und tauschen sich kurz über das Volleyballturnier von gestern aus.","loesung":1},{"text":"Frau Fink führt eine Klasse durch das Albertinum, um ihren Schüler*innen die Kunstepochen an Originalwerken zu verdeutlichen. Die Schüler*innen hören dabei heimlich das neuste Buch von Cornelia Funke, weil sie wissen wollen, wie die Geschichte weitergeht.","loesung":3},{"text":"Im Geschichtsunterricht will Herr Bär sein Thema schaffen und referiert unbeirrt über die Weimarer Republik. Seine Schüler*innen bereiten sich dabei auf den Vokabeltest in der Englischstunde danach vor.","loesung":3},{"text":"Eine 10. Klasse bereitet gemeinsam mit ihrem Deutschlehrer ein Theaterstück vor. Dabei ergänzen sie sich gegenseitig mit ihren Ideen.","loesung":2}],"erklaerung":"Nach Jones und Gerard (1967) liegt Pseudo-Interaktion vor, wenn das Verhalten beider Partner ausschließlich durch die eigenen Verhaltenspläne bestimmt wird und keine echte Abstimmung stattfindet; die Vorlesungsfolie nennt dafür fast wortgleich das Beispiel einer vortragenden Lehrperson, während sich die SchülerInnen mit etwas anderem beschäftigen – das trifft sowohl auf Frau Finks Museumsführung als auch auf Herrn Bärs Vortrag zu, da beide Lehrpersonen ihr Programm durchziehen, während die Lernenden unabhängig davon eigenen Zielen nachgehen. Reaktive Interaktion bezeichnet ein kurzes, ungeplantes wechselseitiges Reagieren ohne eigene Ziele, wofür die Folie explizit Grußverhalten und Small-Talk zwischen Lehrer und Schüler als Beispiel nennt – exakt die Begegnung von Max und Herrn Meier im Schulhaus. Wechselseitige Interaktion liegt vor, wenn beide Seiten sowohl eigene Ziele verfolgen als auch aufeinander eingehen und sich gegenseitig ergänzen, wie es die Folie am Beispiel eines gemeinsamen Unterrichtsprojekts beschreibt und wie es exakt auf die gemeinsame Theaterstück-Vorbereitung zutrifft.","folie":"11_InteraktionKomm_10_01_2023, Seite 13-14 (Jones & Gerard, Interaktionsarten)"},{"id":"nar-f85","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL10, Frage 85, S. 19","vertrauen":"mittel","teil":"II","thema":"Interaktion und Kommunikation","modell":"Hofer (1986), Ebenen der Lehrer-Schüler-Interaktion","typ":"multi","frage":"Die Interaktion zwischen Lehrperson und Lernenden läuft nach Hofer (1986) auf drei Ebenen ab. Welche sind das?","optionen":["Inhaltsebene","Offenbarungsebene","Verhaltensebene","Beziehungsebene","Appellebene","Emotionale Ebene"],"loesungen":[0,2,3],"erklaerung":"Hofer (1986) unterscheidet die Inhaltsebene, auf der es um die fachlichen Inhalte geht, die Verhaltensebene, auf der beobachtbares Handeln stattfindet, und die Beziehungsebene, auf der die soziale Beziehung zwischen Lehrperson und Lernenden zum Ausdruck kommt. „Offenbarungsebene“, „Appellebene“ und „Emotionale Ebene“ sind hier keine von Hofer benannten Interaktionsebenen, sondern könnten mit anderen Kommunikationsmodellen wie dem von Schulz von Thun verwechselt werden."},{"id":"nar-f86","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL10, Frage 86, S. 19","vertrauen":"hoch","teil":"II","thema":"Interaktion und Kommunikation","modell":"Jones & Gerard (1967), Interaktionsarten","typ":"matrix","frage":"Ordnen Sie die folgenden Gesprächssituationen den Interaktionsarten nach Jones und Gerard (1967) zu.","spalten":["Pseudo-Interaktion","Asymmetrische Interaktion","Reaktive Interaktion","Wechselseitige Interaktion"],"zeilen":[{"text":"Herr Schulz plant in seiner Klasse eine Projektarbeit zum Thema Klimaschutz. Dabei tauschen sich die Gruppenmitglieder angeregt und gleichberechtigt mit Herrn Schulz aus.","loesung":3},{"text":"Herr Meier hält einen Lehrervortrag vor seiner Klasse. Die SuS schreiben in der folgenden Stunde einen Chemietest und lernen für diesen, statt Herrn Meier zuzuhören.","loesung":2},{"text":"Frau Schmidt begegnet auf dem Gang einer Referendarin, die sie kaum kennt. Nach einer kurzen Begrüßung und belanglosem Small-Talk gehen beide weiter.","loesung":0},{"text":"Frau Müller stellt in ihrem Lehrervortrag regelmäßig Rückfragen an die Lernenden, um deren Aufmerksamkeit und Verständnis zu überprüfen. Auf die Antworten geht sie jedoch nicht ein, sondern fährt mit ihrem Monolog fort.","loesung":1}],"erklaerung":"Wechselseitige Interaktion liegt vor, wenn sich Gesprächspartner gleichberechtigt und angeregt austauschen, wie bei Herrn Schulz' Projektarbeit. Reaktive Interaktion zeigt sich, wenn eine Person nicht auf den Vortrag, sondern nur auf die davon unabhängige eigene Prüfungsvorbereitung reagiert, wie bei Herrn Meiers Klasse. Pseudo-Interaktion liegt bei belanglosem, folgenlosem Small-Talk zwischen kaum bekannten Personen vor, wie bei Frau Schmidt und der Referendarin. Asymmetrische Interaktion zeigt sich, wenn eine Seite zwar Rückfragen stellt, aber nicht wirklich auf die Antworten eingeht und monologisch fortfährt, wie bei Frau Müller."},{"id":"nar-f87","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL10, Frage 87, S. 20","vertrauen":"hoch","teil":"II","thema":"Interaktion und Kommunikation","modell":"Lewin (1939), Führungsstile","typ":"multi","frage":"Lewin (1939) unterscheidet die drei Führungsstile direkt-autoritär, demokratisch und laissez-faire. Welche Beschreibungen sind für eine Lehrperson mit demokratischem Führungsstil zutreffend?","optionen":["unterstützt den Entscheidungsprozess innerhalb der Gruppe","formuliert Lob und Tadel sozial vergleichend","stellt nur die nötigsten Informationen zur Verfügung, hält sich aber sonst zurück","verteilt einzelne Aufgaben an die Lernenden, diese haben kein Mitspracherecht","deutet allgemeine Lösungsschritte hinsichtlich eines Ziels an und gibt Hilfestellung bei Fragen"],"loesungen":[0,4],"erklaerung":"Ein demokratischer Führungsstil unterstützt den Entscheidungsprozess innerhalb der Gruppe, statt ihn vorzugeben (a), und deutet allgemeine Lösungsschritte an, während bei Bedarf Hilfestellung gegeben wird, ohne die Lösung vollständig vorzugeben (e). Sozial vergleichendes Lob und Tadel (b) sowie das Zurückhalten von Informationen (c) und das Verteilen von Aufgaben ohne Mitspracherecht (d) widersprechen dagegen dem demokratischen Stil und kennzeichnen eher den direkt-autoritären bzw. laissez-fairen Stil."},{"id":"nar-f88","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL10, Frage 88, S. 20","vertrauen":"hoch","teil":"II","thema":"Interaktion und Kommunikation","modell":"Watzlawick, sprachpragmatische Axiome der Kommunikation","typ":"multi","frage":"Watzlawick formuliert fünf sprachpragmatische Axiome, die für die Interaktion und Kommunikation von Bedeutung sind. Welche der folgenden Aussagen zur Kommunikation gehören dazu?","optionen":["Man kann nicht nicht-kommunizieren","Kommunikation ist immer eindeutig, das heißt der Empfänger erhält genau die Information, die der Sender sendet.","Kommunikationsabläufe haben eine klare und festgelegte Struktur","Jede Kommunikation wird von Rollen und Regeln bestimmt","Jede Kommunikation hat einen Inhalts- und einen Beziehungsaspekt"],"loesungen":[0,3,4],"erklaerung":"Zu Watzlawicks Axiomen gehören: Man kann nicht nicht-kommunizieren, auch Schweigen ist eine Botschaft (a); jede Kommunikation wird durch die jeweilige Beziehung zwischen den Beteiligten mitbestimmt, also von impliziten Rollen und Regeln geprägt (d); und jede Kommunikation hat einen Inhalts- und einen Beziehungsaspekt (e). Watzlawick behauptet dagegen nicht, dass Kommunikation immer eindeutig beim Empfänger ankommt (b) – im Gegenteil betont er Interpretationsspielräume –, und auch keine grundsätzlich klare, feste Struktur von Kommunikationsabläufen (c), da Interaktionspartner Ursache und Wirkung oft unterschiedlich interpungieren."},{"id":"nar-f89","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL10, Frage 89, S. 20","vertrauen":"hoch","teil":"II","thema":"Interaktion und Kommunikation","modell":"Schulz von Thun (2013), Vier-Seiten-Modell einer Nachricht","typ":"matrix","stamm":"Die Lehrperson sagt zu einem Schüler: „Max, du hast deine HA schon wieder nicht gemacht.“","frage":"Die Lehrperson sagt zu einem Schüler: „Max, du hast deine HA schon wieder nicht gemacht.“ Ordnen Sie den vier Ebenen einer Nachricht nach Schulz von Thun (2013) die passende mögliche Botschaft zu.","spalten":["Sachinhalt","Selbstoffenbarung","Beziehung","Appell"],"zeilen":[{"text":"Max muss unbedingt seine HA machen.","loesung":3},{"text":"Max hat seine HA zum wiederholten Male nicht erledigt.","loesung":0},{"text":"Max ist ein lieber Junge, aber ich kann einfach keinen Draht zu ihm aufbauen.","loesung":2},{"text":"Max überfordert mich, ich weiß nicht, was ich tun kann, um ihn zu motivieren.","loesung":1}],"erklaerung":"Der Sachinhalt einer Nachricht ist die reine Sachinformation – hier, dass Max seine Hausaufgaben wiederholt nicht erledigt hat. Die Selbstoffenbarung verrät etwas über den Sender selbst, hier die eigene Überforderung der Lehrperson. Die Beziehungsebene zeigt, wie der Sender zum Empfänger steht, hier eine grundsätzlich wohlwollende, aber angespannte Beziehung. Die Appellebene enthält die implizite Aufforderung, hier den unmittelbaren Handlungswunsch, die Hausaufgaben zu erledigen."},{"id":"nar-f90","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL10, Frage 90, S. 21","vertrauen":"mittel","teil":"II","thema":"Interaktion und Kommunikation","modell":"Lewin (1939), Führungsstile","typ":"matrix","frage":"Ordnen Sie die folgenden Verhaltensbeschreibungen den drei Führungsstilen nach Lewin (1939) zu.","spalten":["direkt-autoritär","demokratisch","laissez-faire"],"zeilen":[{"text":"Die Lehrperson stellt lediglich benötigtes Material und Infos zur Verfügung.","loesung":2},{"text":"Die Lehrperson bietet Lösungsschritte hinsichtlich eines Zieles an.","loesung":1},{"text":"Die Lehrperson gibt sozial vergleichend Lob und Tadel.","loesung":0},{"text":"Die Lehrperson teilt Arbeitsgruppen ein.","loesung":0},{"text":"Die Lehrperson bezieht sich bei Lob und Tadel auf Sachinhalte.","loesung":1},{"text":"Die Lehrperson bezieht die Gruppe bei Arbeitsaufteilung mit ein.","loesung":1},{"text":"Die Lehrperson hält sich von der Beteiligung der Gruppenarbeit fern.","loesung":0}],"erklaerung":"Die Zuordnung folgt der Lösung des Quelldokuments. Demokratisches Führungsverhalten zeigt sich darin, dass Lob und Tadel sachbezogen erfolgen und die Gruppe an Arbeitsaufteilung und Entscheidungen beteiligt wird. Laissez-faires Verhalten zeigt sich darin, dass die Lehrperson sich auf die reine Bereitstellung von Material beschränkt. Direkt-autoritäres Verhalten zeigt sich im Dokument bei sozial vergleichendem Lob und Tadel, bei der Einteilung von Arbeitsgruppen ohne Mitsprache und beim Fernhalten von der Gruppenarbeit selbst.","folie":"Zuordnung wie im Lösungsteil des Quelldokuments; die letzte Zeile wirkt inhaltlich eher laissez-faire, folgt hier aber der dort angegebenen Lösung."},{"id":"ex2016-02","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 2","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Hofer (1986), Modell sozialer Kognitionen beim Lehrerhandeln","typ":"matrix","stamm":"Bei der Lehrer-Schüler-Interaktion spielen nach Hofers Modell des Lehrerhandelns zahlreiche kognitive Strukturen und Prozesse eine Rolle (Hofer, 1986).","frage":"Beurteilen Sie für die folgenden kognitiven Komponenten, ob sie Bestandteil von Hofers Modell des Lehrerhandelns sind.","spalten":["Ja","Nein"],"zeilen":[{"text":"Attribution","loesung":0},{"text":"Handlungs-Ergebnis-Erwartung","loesung":0},{"text":"Handlungs-Folge-Erwartung","loesung":1},{"text":"Handlungs-Aufwand-Erwartung","loesung":0},{"text":"Situations-Handlungs-Erwartung","loesung":1},{"text":"Ist-Soll-Vergleich","loesung":1},{"text":"Ist-Wird-Vergleich","loesung":1},{"text":"Wird-Soll-Vergleich","loesung":0},{"text":"Bedeutungsbeimessung","loesung":0}],"erklaerung":"Das vollständige Modell enthält: naive Theorien, Ist-Lage über die Wahrnehmung des Schülerverhaltens, Bedeutungsbeimessung, Attribution, Situations-Folge-Erwartung, Zieldimensionen und Erfolgsniveau als Soll-Lage, den Wird-Soll-Vergleich, Handlungsentwürfe, Handlungs-Ergebnis-Erwartung und Handlungs-Aufwand-Erwartung, die Auswahl des Entwurfs mit der positivsten Bilanz und schließlich die Lehrerreaktion. Die drei Falschen sind nah an echten Begriffen gebaut: Das Modell kennt eine Situations-Folge-Erwartung, keine Situations-Handlungs-Erwartung. Es kennt eine Handlungs-Ergebnis-Erwartung, keine Handlungs-Folge-Erwartung. Und es vergleicht Wird mit Soll, nicht Ist mit Soll oder Ist mit Wird. Achtung: Im Klausurexemplar sind hier nur vier der neun Zeilen so angekreuzt, wie es die Folie hergibt. Die Lösung hier folgt der Folie.","folie":"13 Lehrerkognitionen, Folie 26 – Gesamtdarstellung des Modells"},{"id":"ex2024-08","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 8 (S. 11)","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Rosenthal (1965), Pygmalion-Effekt; Brophy & Good, Lehrerverhalten","typ":"mc-kombi","stamm":"Der Pygmalion-Effekt im Unterricht (Rosenthal, 1965) bezieht sich auf die Wirkung, die Erwartungen einer Lehrperson auf die Leistung der Lernenden haben können. Studien haben gezeigt, dass die Erwartungen von Lehrpersonen über ihr Verhalten für die Schüler*innen sichtbar werden.","frage":"Welche der folgenden Verhaltensweisen zeigen Lehrpersonen häufig bei Schüler*innen, gegenüber denen sie negative Erwartungen bezüglich der Leistung haben?","aussagen":["Die Lehrperson lässt diesen Schüler*innen weniger Zeit für die Beantwortung von Fragen.","Die Lehrperson formuliert die Frage neu, wenn diese Schüler*innen die Antwort nicht sofort wissen.","Die Lehrperson ruft diese Schüler*innen häufiger auf als die anderen Schüler*innen.","Die Lehrperson gibt Hilfestellungen, wenn diese Schüler*innen die Antwort auf eine Frage nicht sofort wissen.","Die Lehrperson lobt diese Schüler*innen, sobald sie sich äußern, auch wenn die Äußerung nicht korrekt ist.","Die Lehrperson gibt diesen Schüler*innen emotionale Unterstützung, auch durch häufigeren Blickkontakt.","Die Lehrperson ist bei der Korrektur von Aufgaben dieser Schüler*innen strenger."],"optionen":["Die Verhaltensweisen (2), (3) und (6) treffen zu; alle anderen treffen nicht zu.","Die Verhaltensweisen (1) und (3) treffen zu; alle anderen treffen nicht zu.","Die Verhaltensweisen (2), (4) und (5) treffen zu; alle anderen treffen nicht zu.","Die Verhaltensweisen (4), (6) und (7) treffen zu; alle anderen treffen nicht zu.","Die Verhaltensweisen (1), (5) und (7) treffen zu; alle anderen treffen nicht zu."],"loesung":4,"aussagen_richtig":[0,4,6],"erklaerung":"Die Vorlesungstabelle zum Lehrerverhalten gegenüber leistungsstarken und leistungsschwachen Schüler*innen ordnet vier Bereiche zu. Output opportunities: Bei negativer Erwartung wird selten aufgerufen, es werden wenige Fragen gestellt und es wird wenig Zeit für die Antwort gelassen – damit trifft (1) zu und (3) gerade nicht. Input: Frage umformulieren und Tipps geben sind Verhaltensweisen gegenüber leistungsstarken Schüler*innen, gegenüber leistungsschwachen wird dagegen streng korrigiert und bei Nichtbeantwortung sofort jemand anderes aufgerufen – (2) und (4) sind also falsch, (7) ist richtig. Feedback: Bei negativer Erwartung wird gelobt, wenn überhaupt geantwortet wird, und sogar falsche Antworten werden gelobt; dieses unverdiente Lob signalisiert geringe Erwartungen und macht (5) richtig. Climate: Leistungsschwache erhalten wenig emotionale Unterstützung und die Lehrperson hält räumliche Distanz, weshalb (6) nicht zutrifft.","folie":"12_Lehrer_Erwartungen_17_01_2023, Seite 28 (Unterschiede im Lehrerverhalten)"},{"id":"hp3b-wise2021-03","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 62","vertrauen":"mittel","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Rosenthal (z.B. 1968), Pygmalion-/Golem-Effekt","typ":"multi","stamm":"Der Pygmalion-Effekt bezieht sich auf die Wirkung, die Erwartungen der Lehrperson auf die Leistung der Lernenden haben können.","frage":"Unter welchen der folgenden Bedingungen kann bei der Schülerin Lisa ein negativer Pygmalion-Effekt (Golem-Effekt) nach Rosenthal (z.B. 1968) auftreten?","optionen":["Lisa nimmt wahr, dass ihr die Lehrkraft häufiger Fragen stellt als anderen.","Lisa nimmt wahr, dass ihr die Lehrkraft für eigentlich fehlerhafte Antworten eher Lob gibt als anderen.","Lisa nimmt wahr, dass ihr die Lehrkraft meist weniger Zeit zum Beantworten von Fragen gibt als anderen.","Lisa nimmt wahr, dass ihr die Lehrkraft eher Hilfestellungen gibt als anderen.","Lisa nimmt wahr, dass ihr die Lehrkraft weniger emotionale Unterstützung gibt als anderen."],"loesungen":[1,2,3,4],"erklaerung":"Nach Rosenthals Forschung äußert sich ein negativer Erwartungseffekt (Golem-Effekt) unter anderem durch kürzere Wartezeiten bei Antworten, weniger emotionale Wärme und unangemessenes, für die tatsächliche Leistung zu großzügiges Lob, das eher niedrige Erwartungen als echte Anerkennung signalisiert. Auch übermäßige Hilfestellung kann als Ausdruck geringer Zutrauens in die eigenständige Leistungsfähigkeit der Schülerin gedeutet werden und ist damit ein Golem-Indikator. Häufigeres Fragenstellen ist dagegen typischerweise ein Indikator für positive, nicht für negative Erwartungseffekte, da es mit mehr Aufmerksamkeit und Fördermöglichkeiten für die Schülerin einhergeht.","folie":"12_Lehrer_Erwartungen_17_01_2023 (Pygmalion-Effekt nach Rosenthal)"},{"id":"hp3b-wise2021-11","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 65-66","vertrauen":"mittel","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Hofer (1986), Modell sozialer Kognitionen beim Lehrerhandeln","typ":"matrix","stamm":"Das Modell von Hofer (1986) erklärt, welche kognitiven Prozesse das Handeln von Lehrpersonen steuern. Die verschiedenen handlungsleitenden Kognitionen können dabei in die zwei großen Bereiche Situationsauffassung und Handlungsauffassung unterteilt werden. Entscheiden Sie auf Basis des Hofer-Modells (1986) für jeden der folgenden Begriffe, ob er der Situationsauffassung, der Handlungsauffassung oder keiner von beiden zugeordnet werden kann. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Begriff gehört zu …","spalten":["Handlungsauffassung","Situationsauffassung","keiner von beiden"],"zeilen":[{"text":"Attribution","loesung":2},{"text":"Situationsentwürfe","loesung":1},{"text":"Handlungs-Aufwand-Erwartung","loesung":0},{"text":"Handlungsfolgen","loesung":0},{"text":"Naive Theorien","loesung":2},{"text":"Handlungs-Ergebnis-Erwartung","loesung":0},{"text":"Zieldimensionen","loesung":1},{"text":"Wahrnehmung","loesung":1},{"text":"Handlungsentwürfe","loesung":0}],"erklaerung":"Im Diagramm des Hofer-Modells sind Wahrnehmung des Schülerverhaltens und die daraus abgeleiteten Zieldimensionen (Soll-Ist-Vergleich) explizit Teil der Situationsauffassung, während Handlungsentwürfe sowie die daran anschließende Handlungs-Ergebnis- und Handlungs-Aufwand-Erwartung explizit der Handlungsauffassung zugeordnet sind. 'Attribution' und 'Naive Theorien' sind im Modell als eigene, vor- bzw. nachgelagerte Elemente dargestellt, die weder eindeutig der Situations- noch der Handlungsauffassung zugerechnet werden, und fallen daher unter 'keiner von beiden'. Situationsentwürfe und Handlungsfolgen sind im Prüfungstext als sinngemäße Parallelbegriffe zur situativen Wahrnehmung/Bedeutungsbeimessung bzw. zur Handlungs-Ergebnis-Erwartung zu verstehen und wurden entsprechend zugeordnet; da diese beiden Begriffe nicht wortgleich auf der Folie erscheinen, ist diese Zuordnung mit größerer Unsicherheit behaftet als die übrigen.","folie":"13_Lehrerkognitionen_24_01_2023, Seite 29 (Modell nach Hofer, 1986)"},{"id":"hp3c-probekl2-02","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Pygmalion-Effekt / Self-fulfilling Prophecy (Rosenthal)","typ":"mc-kombi","frage":"Der Pygmalion-Effekt bezieht sich auf die Wirkung, die Erwartungen der Lehrperson auf die Leistung der Lernenden haben können. Welche Bedingungen müssen erfüllt sein, damit ein positiver Pygmalion-Effekt eintritt?","aussagen":["Die Kinder nehmen wahr, dass eine Lehrkraft manchen Kindern meist leichtere Aufgaben gibt als anderen.","Die Kinder nehmen wahr, dass eine Lehrkraft manche Kinder meist häufiger aufruft als andere.","Die Kinder nehmen wahr, dass eine Lehrkraft manchen Kindern meist kürzeres und knapperes Feedback gibt als anderen.","Die Kinder nehmen wahr, dass eine Lehrkraft manchen Kindern meist weniger Zeit zum Beantworten von Fragen gibt als anderen.","Die Kinder nehmen wahr, dass eine Lehrkraft manchen Kindern meist mehr Unterstützung gibt als anderen."],"aussagen_richtig":[1,4],"optionen":["Die Aussagen (1) und (2) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussage (2) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (4) treffen zu; alle anderen Aussagen treffen nicht zu."],"loesung":3,"erklaerung":"Ein positiver Pygmalion-Effekt setzt eine differentielle Lehrerbehandlung voraus, die von den Lernenden als bevorzugende Zuwendung wahrgenommen wird: häufigeres Aufrufen und mehr Unterstützung sind klassische Indikatoren dafür, dass eine Lehrkraft hohe Erwartungen in einen Schüler setzt, und lösen darüber eine positive Selbsterfüllung der Erwartung aus. Leichtere Aufgaben, knapperes Feedback und weniger Antwortzeit sind dagegen typische Merkmale einer Benachteiligung leistungsschwächerer Schüler und begünstigen keinen positiven, sondern allenfalls einen negativen Erwartungseffekt.","folie":"12_Lehrer_Erwartungen_17_01_2023, Seite 28 (Unterschiede im Lehrerverhalten bei leistungsstarken vs. -schwachen Schülern: Aufrufen, Zeit, Hilfestellung)"},{"id":"nar-f100","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL12, Frage 100, S. 23","vertrauen":"mittel","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","typ":"multi","frage":"Lehrerhandeln lässt sich in verschiedene Phasen einteilen. Welche der Phasen gehören zur Struktur einer Handlungsepisode?","optionen":["Antizipationsphase","Planungsphase","Motivationsphase","Ausführungsphase","Interpretationsphase"],"loesungen":[0,1,3],"erklaerung":"Zur Struktur einer Handlungsepisode gehören die Antizipationsphase, in der die Situation vorausschauend eingeschätzt wird (a), die Planungsphase, in der das Vorgehen festgelegt wird (b), und die Ausführungsphase, in der gehandelt wird (d). Eine eigenständige „Motivationsphase“ (c) und „Interpretationsphase“ (e) sind in diesem Phasenmodell nicht als separate Schritte vorgesehen."},{"id":"nar-f101","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL12, Frage 101, S. 23","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","typ":"single","frage":"Was versteht man unter impliziten Persönlichkeitstheorien?","optionen":["Annahmen einer Person über Zusammenhänge und Organisation von Eigenschaften bei anderen Menschen","Eigene Persönlichkeitsmerkmale, die einen Einfluss auf das eigene Handeln ausüben","Ein hervorstechendes Merkmal beeinflusst die Beurteilung anderer Merkmale","Beim Verhalten anderer Personen werden situative Einflussfaktoren eher überschätzt."],"loesung":0,"erklaerung":"Implizite Persönlichkeitstheorien sind Annahmen einer Person darüber, wie Eigenschaften anderer Menschen zusammenhängen und organisiert sind (a) – etwa die Annahme, dass eine freundliche Person auch automatisch kompetent sei. Die übrigen Optionen beschreiben andere Konzepte: eigene Persönlichkeitsmerkmale (b), den Halo-Effekt (c) bzw. den fundamentalen Attributionsfehler (d), keine impliziten Persönlichkeitstheorien."},{"id":"nar-f92","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL11, Frage 92, S. 21","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Rosenthal & Jacobson (1971), Braun (1976), Lehrererwartungseffekte","typ":"multi","frage":"Aus der Studie von Rosenthal und Jacobson (1971) und nach Braun (1976) unterscheidet sich Lehrerverhalten danach, ob die Lehrperson einen Schüler als leistungsstark oder schwach einschätzt. Welche Aussagen treffen auf das Lehrerverhalten bei vermeintlich leistungsstarken Schülern zu?","optionen":["gibt viel Zeit für die Beantwortung der Fragen","lobt auch bei falschen Antworten","ruft andere Schüler auf, wenn eine Frage nicht beantwortet werden kann","ruft diese häufig auf"],"loesungen":[0,3],"erklaerung":"Bei vermeintlich leistungsstarken Schülern geben Lehrpersonen mehr Zeit für die Beantwortung von Fragen (a) und rufen diese Schüler auch häufiger auf (d), weil ihnen mehr zugetraut wird. Falsche Antworten werden bei ihnen dagegen nicht generell gelobt (b) – das würde unrealistisches positives Feedback bedeuten –, und bei Nichtbeantwortung werden nicht automatisch andere Schüler aufgerufen (c); eher wird dem vermeintlich starken Schüler eine zweite Chance oder ein Hinweis gegeben."},{"id":"nar-f93","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL11, Frage 93, S. 21","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Rosenthal & Jacobson (1971), Braun (1976), Lehrererwartungseffekte","typ":"single","frage":"Aus der Studie von Rosenthal und Jacobson (1971) und nach Braun (1976) unterscheidet sich Lehrerverhalten danach, ob die Lehrperson einen Schüler als leistungsstark oder schwach einschätzt. Welche Aussage trifft auf das Lehrerverhalten bei vermeintlich leistungsstarken Schülern zu?","optionen":["gibt einen Hinweis, wenn die Frage nicht beantwortet werden kann","übersieht Fehler","sucht Augenkontakt und räumliche Nähe","gibt wenig emotionale Unterstützung"],"loesung":2,"erklaerung":"Bei vermeintlich leistungsstarken Schülern suchen Lehrpersonen mehr Augenkontakt und räumliche Nähe (c), was Zuwendung und positive Erwartung signalisiert. Bei ihnen wird dagegen kein Hinweis bei Nichtbeantwortung gegeben, ohne dass zunächst eine eigene Lösung erwartet wird (a), Fehler werden nicht generell übersehen (b), und emotionale Unterstützung ist bei ihnen typischerweise hoch statt gering (d)."},{"id":"nar-f94","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL11, Frage 94, S. 22","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","typ":"matrix","frage":"Unsere Wahrnehmung von Personen ist anfällig für Fehler und Verzerrungen. Ordnen Sie den Verzerrungseffekten die passende Definition zu.","spalten":["Galatea-Effekt","Vorurteil","Golem-Effekt","Recency-Effekt","Halo-Effekt","Stereotyp"],"zeilen":[{"text":"Schüler passt sein Verhalten an die positiven Erwartungen des Lehrers an.","loesung":0},{"text":"Zuschreiben von angenommenen Merkmalen einer Gruppe auf eine unbekannte Person.","loesung":1},{"text":"selbsterfüllende Prophezeiung bzgl. negativer Erwartungen","loesung":2},{"text":"Effekt des letzten Eindrucks","loesung":3},{"text":"ein hervorstechendes Merkmal beeinflusst die Beurteilung anderer Merkmale","loesung":4},{"text":"Zuschreiben von Eigenschaften zu einer sozialen Gruppe","loesung":5}],"erklaerung":"Der Galatea-Effekt beschreibt, dass sich eine Person an positive Erwartungen anderer anpasst. Vorurteil bezeichnet das Zuschreiben angenommener Merkmale einer Gruppe auf eine unbekannte Einzelperson. Der Golem-Effekt ist die selbsterfüllende Prophezeiung negativer Erwartungen. Der Recency-Effekt ist der Effekt des zuletzt gewonnenen Eindrucks. Der Halo-Effekt beschreibt, dass ein hervorstechendes Merkmal die Beurteilung anderer Merkmale beeinflusst. Ein Stereotyp ist das Zuschreiben von Eigenschaften zu einer sozialen Gruppe als Ganzes."},{"id":"nar-f95","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL11, Frage 95, S. 22","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Fundamentaler Attributionsfehler","typ":"single","frage":"Welche der folgenden Aussagen zur Wahrnehmung von Ursachen eines Verhaltens ist bezüglich des fundamentalen Attributionsfehlers richtig?","optionen":["Verhalten anderer Personen wird eher auf stabile, internale Merkmale attribuiert","Verhalten der eigenen Person: situative Einflussfaktoren werden eher unterschätzt","Verhalten der eigenen Person wird häufiger auf dispositionale Faktoren attribuiert","Verhalten anderer Personen: situative Einflussfaktoren werden eher überschätzt"],"loesung":0,"erklaerung":"Der fundamentale Attributionsfehler besagt, dass das Verhalten anderer Personen eher auf stabile, internale (dispositionale) Merkmale zurückgeführt wird, während situative Einflüsse unterschätzt werden (a). Für das eigene Verhalten gilt dagegen das Gegenteil: Situative Einflussfaktoren werden bei sich selbst eher überschätzt, nicht unterschätzt (b), das eigene Verhalten wird seltener auf dispositionale Faktoren attribuiert (c), und situative Einflüsse bei anderen Personen werden gerade unterschätzt statt überschätzt (d)."},{"id":"nar-f96","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL11, Frage 96, S. 22","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Spencer, Steele & Quinn (1999); Schmader & Johns (2003), Stereotype Threat","typ":"multi","frage":"Studien von Spencer, Steele & Quinn (1999) sowie Schmader und Johns (2003) zeigen die Auswirkungen von Stereotype Threat. Unter welchen Bedingungen wirken sich negative Vorurteile über die eigenen Fähigkeiten negativ auf die eigene Leistung aus?","optionen":["ungünstig bei schwierigen Aufgaben","nur, wenn die Situation als Testsituation empfunden wird","sich negativ auf die Leistung des Arbeitsgedächtnisses aus","nur, wenn diese explizit angesprochen werden"],"loesungen":[0,1,2],"erklaerung":"Stereotype Threat wirkt sich vor allem bei schwierigen Aufgaben negativ aus, weil hier kognitive Ressourcen besonders knapp sind (a), tritt vor allem auf, wenn die Situation als Testsituation und damit als Bewertung der eigenen Fähigkeit erlebt wird (b), und beeinträchtigt nachweislich die Leistung des Arbeitsgedächtnisses, weil Kapazität durch Sorgen um die eigene Leistung gebunden wird (c). Der Effekt tritt dabei nicht nur auf, wenn Stereotype explizit angesprochen werden (d) – er zeigt sich auch bei impliziter Aktivierung des Stereotyps."},{"id":"nar-f97","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL12, Frage 97, S. 22","vertrauen":"mittel","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Grundannahmen der Handlungspsychologie","typ":"matrix","frage":"Herr Meier plant seinen Deutschunterricht. Ordnen Sie die folgenden Planungsaussagen den Grundannahmen der Handlungspsychologie zu.","spalten":["Handeln ist zielgerichtet","Handeln ist erfahrungsabhängig","Handeln konkretisiert sich immer in einer Situation","Handeln ist mit Erwartungen verknüpft"],"zeilen":[{"text":"„Ich habe einen Zeitplan für meine Unterrichtsstunde erstellt. Dieser enthält auch einen Puffer für mögliche Rückfragen.“","loesung":2},{"text":"„Zu Beginn der Stunde präsentiere ich die Lernziele.“","loesung":0},{"text":"„Das Thema ist für Schüler relevant. Daher werden sie Interesse zeigen.“","loesung":3},{"text":"„Letztes Jahr ist der Text bei Schülern nicht auf Interesse gestoßen. Deshalb wähle ich dieses Jahr einen anderen Text.“","loesung":1}],"erklaerung":"Die Grundannahmen der Handlungspsychologie lassen sich an Herrn Meiers Planungsschritten zeigen: Dass Handeln zielgerichtet ist, zeigt sich in der Präsentation der Lernziele zu Stundenbeginn. Dass Handeln erfahrungsabhängig ist, zeigt sich darin, dass er wegen früherer Erfahrungen mit mangelndem Interesse dieses Jahr einen anderen Text wählt. Dass Handeln sich in einer Situation konkretisiert, zeigt sich in der Erstellung eines konkreten Zeitplans mit Puffer für Rückfragen. Dass Handeln mit Erwartungen verknüpft ist, zeigt sich in der Erwartung, dass ein relevantes Thema auch Interesse wecken wird."},{"id":"nar-f98","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL12, Frage 98, S. 23","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Miller, Galanter & Pribram (1960), TOTE-Modell","typ":"multi","frage":"Aus welchen Bestandteilen setzt sich das TOTE-Modell (Miller, Galanter, Pribram, 1960) zusammen?","optionen":["Test","Teach","Organize","End","Talk","Operate","Exit"],"loesungen":[0,5,6],"erklaerung":"Das TOTE-Modell besteht aus Test (Abgleich des Ist- mit dem Sollzustand, a), Operate (Ausführung einer Handlung zur Zielerreichung, f) und Exit (Beenden der Handlung bei erreichtem Ziel, g); der erste Test-Schritt wird dabei nach jedem Operate wiederholt, bis Übereinstimmung besteht. „Teach“ (b), „Organize“ (c), „Talk“ (e) und „End“ (d) sind keine Bestandteile des Akronyms TOTE."},{"id":"nar-f99","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL12, Frage 99, S. 23","vertrauen":"mittel","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Hofer (1986), Modell des Lehrerhandelns","typ":"multi","frage":"Welche der folgenden Komponenten gehören zum Modell des Lehrerhandelns (Hofer, 1986)?","optionen":["Wird-Soll-Vergleich","Ist-Soll-Vergleich","Kann-Lage","Ist-Lage","Soll-Lage","Handlungs-Folge-Erwartungen"],"loesungen":[0,3,4],"erklaerung":"Zum Modell gehören der Wird-Soll-Vergleich zwischen erwartetem und angestrebtem Ergebnis (a), die Ist-Lage als Wahrnehmung der aktuellen Situation (d) und die Soll-Lage als Zieldimension (e). Eine eigenständige „Kann-Lage“ (c) benennt Hofers Modell nicht, und Handlungs-Folge-Erwartungen (f) sind Bestandteil anderer Motivationsmodelle wie des EKM, nicht des Hofer-Modells; der Ist-Soll-Vergleich (b) wiederum ist im Modell nicht vorgesehen, da Hofer explizit einen Wird-Soll- statt eines Ist-Soll-Vergleichs beschreibt."},{"id":"pk2017-02","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 2","vertrauen":"hoch","teil":"II","thema":"Lehrererwartungen und Lehrerkognitionen","modell":"Rosenthal (1965), Pygmalion-Effekt","typ":"mc-kombi","stamm":"Der Pygmalion-Effekt bezieht sich auf die Wirkung, die Erwartungen der Lehrperson auf die Leistung der Lernenden haben können.","frage":"Welche Bedingungen müssen erfüllt sein, damit ein positiver Pygmalion-Effekt eintritt?","aussagen":["Die Kinder nehmen wahr, dass eine Lehrkraft manchen Kindern meist leichtere Aufgaben gibt als anderen.","Die Kinder nehmen wahr, dass eine Lehrkraft manche Kinder meist häufiger aufruft als andere.","Die Kinder nehmen wahr, dass eine Lehrkraft manchen Kindern meist kürzeres und knapperes Feedback gibt als anderen.","Die Kinder nehmen wahr, dass eine Lehrkraft manchen Kindern meist weniger Zeit zum Beantworten von Fragen gibt als anderen.","Die Kinder nehmen wahr, dass eine Lehrkraft manchen Kindern meist mehr Unterstützung gibt als anderen."],"optionen":["Die Aussagen (1) und (2) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussage (2) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (1) und (4) treffen zu, alle anderen Aussagen treffen nicht zu."],"loesung":3,"aussagen_richtig":[1,4],"erklaerung":"Ein positiver Pygmalion- bzw. Galatea-Effekt entsteht, wenn hohe Erwartungen über das Lehrerverhalten für die Kinder sichtbar werden und zu mehr Lerngelegenheiten führen. Häufigeres Aufrufen erhöht die Output opportunities, mehr Unterstützung verbessert den Input – beides sind die Verhaltensweisen, die die Vorlesung der Spalte „leistungsstark“ bzw. hohe Erwartung zuordnet. Leichtere Aufgaben (1) signalisieren dagegen geringe Fähigkeitserwartung und wirken als Botschaft „dir traue ich mehr nicht zu“. Kürzeres, knapperes Feedback (3) und weniger Antwortzeit (4) sind typische Merkmale negativer Erwartungen und würden einen Golem-Effekt begünstigen.","folie":"12_Lehrer_Erwartungen_17_01_2023, Seite 7 und 28"},{"id":"hp3c-probekl2-06","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Leistungsbewertung","modell":"Hauptgütekriterien: Objektivität, Reliabilität, Validität","typ":"matrix","frage":"Welche der folgenden Aussagen zum Thema Gütekriterien sind korrekt?","spalten":["korrekt","nicht korrekt"],"zeilen":[{"text":"Hohe Validität einer Messung setzt voraus, dass möglichst wenig systematische Fehler auftreten.","loesung":0},{"text":"Interpretationsobjektivität bedeutet, dass für alle Lernenden die gleichen Bedingungen während der Messung gelten.","loesung":1},{"text":"Eine Messung ist reliabel, wenn möglichst genau und zuverlässig gemessen wird.","loesung":0},{"text":"Objektivität heißt, dass ein Test misst, was er zu messen vorgibt.","loesung":1}],"erklaerung":"Systematische Fehler verzerren das Messergebnis in eine bestimmte Richtung und mindern damit direkt die Validität, weshalb die erste Aussage korrekt ist. Dass für alle Lernenden vergleichbare Bedingungen gelten, beschreibt Durchführungsobjektivität, nicht Interpretationsobjektivität, die sich auf einen vorher festgelegten Transformationsschlüssel bei der Ergebnisinterpretation bezieht. Reliabilität ist korrekt als Genauigkeit und Zuverlässigkeit der Messung definiert. Dass ein Test misst, was er zu messen vorgibt, ist die Definition von Validität, nicht von Objektivität, die die Unabhängigkeit der Ergebnisse von der durchführenden, auswertenden oder interpretierenden Person meint.","folie":"08_Motivation_Leistungsbewertung_06122022, Seite 19-26 (Hauptgütekriterien: Objektivität, Reliabilität, Validität)"},{"id":"ex2024-12-1","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 12.1 (S. 16)","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Weiner (1985), Attributions-Klassifikationsschema","typ":"matrix","stamm":"Beim Üben in Freiarbeitsphasen im Mathematikunterricht dürfen die Schüler*innen selbst wählen, ob sie leichte, mittelschwere oder schwierige Aufgaben bearbeiten. Hans wählt meist zuerst einige Aufgaben aus, die zu leicht für ihn sind. Wenn er diese erfolgreich löst, freut er sich darüber, aber nur wenig. Er sagt dann zu sich, dass es klar war, dass er das schafft, da die Aufgaben so leicht waren. Hin und wieder versucht er daher auch sehr schwere Aufgaben zu lösen, hört aber sofort wieder auf, wenn er nicht mit der Lösung weiterkommt. In solchen Situationen ist er sehr enttäuscht. Er sagt dann, dass er eben nicht begabt sei für Mathe und es daher nie gut können wird. Sein Freund Justin schlägt ihm vor, es doch mal mit einer schwierigeren Aufgabe zu versuchen. Hans löst diese erfolgreich, meint aber dann, das sei schlicht Glück gewesen.","frage":"Hans schreibt seinen Erfolgen bzw. Misserfolgen verschiedene Ursachen zu. Ordnen Sie diese aus Hans' Sicht nach dem Attributions-Klassifikationsschema von Weiner (1985) ein.","spalten":["external kontrollierbar","external unkontrollierbar","internal kontrollierbar","internal unkontrollierbar"],"zeilen":[{"text":"Hans' Attributionen bei Erfolgen","loesung":1},{"text":"Hans' Attributionen bei Misserfolgen","loesung":3}],"erklaerung":"Weiner ordnet Ursachen nach Lokation (internal/external), Stabilität und Kontrollierbarkeit. Hans erklärt seine Erfolge zweimal external: bei den leichten Aufgaben mit der geringen Aufgabenschwierigkeit, bei der schwierigen Aufgabe mit Glück. Beides liegt außerhalb seiner Person und entzieht sich seiner Kontrolle, also external unkontrollierbar. Seine Misserfolge führt er auf fehlende Begabung zurück – eine Eigenschaft der eigenen Person, die er als unveränderlich ansieht, also internal unkontrollierbar. Damit zeigt Hans exakt das misserfolgsmeidende Attributionsmuster: Erfolg external, Misserfolg internal-stabil. Internal kontrollierbar wäre die Anstrengung, external kontrollierbar etwa die Hilfe anderer – beides kommt in Hans' Erklärungen nicht vor.","folie":"3_Leistungsmotivation_02_11_2021, Seite 41 (Attributionsmuster im Selbstbewertungsmodell)"},{"id":"ex2024-12-2","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 12.2 (S. 16)","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Heckhausen (1977), Selbstbewertungsmodell der Leistungsmotivation","typ":"mc-kombi","stamm":"Beim Üben in Freiarbeitsphasen im Mathematikunterricht dürfen die Schüler*innen selbst wählen, ob sie leichte, mittelschwere oder schwierige Aufgaben bearbeiten. Hans wählt meist zuerst einige Aufgaben aus, die zu leicht für ihn sind. Wenn er diese erfolgreich löst, freut er sich darüber, aber nur wenig. Er sagt dann zu sich, dass es klar war, dass er das schafft, da die Aufgaben so leicht waren. Hin und wieder versucht er daher auch sehr schwere Aufgaben zu lösen, hört aber sofort wieder auf, wenn er nicht mit der Lösung weiterkommt. In solchen Situationen ist er sehr enttäuscht. Er sagt dann, dass er eben nicht begabt sei für Mathe und es daher nie gut können wird. Sein Freund Justin schlägt ihm vor, es doch mal mit einer schwierigeren Aufgabe zu versuchen. Hans löst diese erfolgreich, meint aber dann, das sei schlicht Glück gewesen.","frage":"Welche Wirkungen des Verhaltens von Hans lassen sich mit dem Selbstbewertungsmodell der Leistungsmotivation von Heckhausen (1977) begründen? Das Verhalten von Hans führt dazu, dass er…","aussagen":["eine hohe Erfolgserwartung für Mathematikaufgaben ausbilden wird.","das freie Üben in Mathematik zunehmend langweilig findet.","bei Übungsaufgaben in Mathematik keine positive Affektbilanz hat.","seine Kompetenzen in Mathematik nicht realistisch einschätzen kann.","seine Kompetenzen in Mathematik zunehmend überschätzen wird."],"optionen":["Die Aussagen (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Aussage (3) trifft zu; alle anderen treffen nicht zu.","Die Aussagen (1), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (5) treffen zu; alle anderen aber nicht."],"loesung":0,"aussagen_richtig":[2,3],"erklaerung":"Das Selbstbewertungsmodell beschreibt einen sich selbst stabilisierenden Kreislauf aus Zielsetzung, Ursachenerklärung und affektiver Selbstbewertung. Hans setzt sich unrealistische Ziele (zu leichte oder zu schwere Aufgaben), attribuiert Erfolg external und Misserfolg auf mangelnde Begabung. Die Folge auf der Affektebene: geringe Freude und wenig Stolz nach Erfolg, dafür Enttäuschung und Scham nach Misserfolg – die Affektbilanz beim Üben bleibt negativ (3). Die zweite Folge ist der Verlust diagnostischer Information: Nur mittelschwere Aufgaben verraten etwas über das eigene Können; durch die konsequente Wahl der Extreme und das Wegerklären jedes Ergebnisses kann Hans seine Kompetenz nicht realistisch einschätzen (4). Eine hohe Erfolgserwartung (1) baut er gerade nicht auf, Langeweile (2) ist im Modell keine vorhergesagte Folge, und eine Überschätzung (5) ist ausgeschlossen, weil er seine Erfolge konsequent abwertet.","folie":"3_Leistungsmotivation_02_11_2021, Seite 41-42 (Prozessvariablen, Ausgangszustand bei Misserfolgsorientierung)"},{"id":"ex2024-12-3","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 12.3 (S. 17)","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Heckhausen (1972), erfolgszuversichtliches Attributionsmuster","typ":"mc-kombi","frage":"Welche der folgenden Aussagen wären im Sinne einer erfolgszuversichtlichen Ursachenzuschreibung nach einem Misserfolg günstig?","aussagen":["Ich habe nicht genug geübt.","Ich hatte einfach kein Glück.","Ich habe nicht lange genug probiert, die Aufgabe zu lösen.","Ich bin für solche Aufgaben einfach zu ungeschickt.","Ich glaube, die Aufgabe war einfach zu schwer."],"optionen":["Die Aussagen (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Aussage (3) trifft zu; alle anderen treffen nicht zu.","Die Aussagen (1), (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (5) treffen zu; alle anderen aber nicht."],"loesung":3,"aussagen_richtig":[0,1,2],"erklaerung":"Die Vorlesungstabelle zu den Prozessvariablen im Selbstbewertungsmodell nennt für die erfolgszuversichtliche Motivausprägung als Misserfolgsursachen ausdrücklich „mangelnde Anstrengung, evtl. Pech“. Beides sind variable Ursachen: Sie lassen den nächsten Versuch offen und bedrohen das Fähigkeitsselbstkonzept nicht. Auf mangelnde Anstrengung zielen sowohl (1) als auch (3), auf Pech zielt (2) – diese drei sind also günstig. Aussage (4) schreibt den Misserfolg der eigenen fehlenden Fähigkeit zu; das ist internal und stabil und damit genau das misserfolgsmeidende Muster, das die Erwartung für künftige Versuche senkt. Aussage (5) nennt die Aufgabenschwierigkeit, also eine externale und stabile Ursache: Sie entlastet zwar kurzfristig, lässt aber ebenfalls keinen Ansatzpunkt für eigenes Handeln und gehört nicht zum erfolgszuversichtlichen Muster der Folientabelle.","folie":"3_Leistungsmotivation_02_11_2021, Seite 41 (Erfolgs- und misserfolgsmotivierte Prozessvariablen)"},{"id":"ex2024-16-1","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 16.1 (S. 22)","vertrauen":"mittel","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Attributionsforschung; Fähigkeitsselbstkonzept","typ":"mc-kombi","stamm":"Eine Englischlehrerin gibt Feedback grundsätzlich in Verbindung mit zusätzlichen Bemerkungen. Bei Jungen kombiniert sie Lob mit Äußerungen wie: „Na, du hast dich wohl dieses Mal ganz besonders angestrengt!“ oder „Die Aufgaben waren wohl nicht so schwierig.“ Wenn Jungen etwas nicht wissen oder Fehler machen, gibt es Äußerungen wie: „Ach, Jungs und Sprachen, das klappt leider nicht.“ Bei Mädchen gibt es Äußerungen wie: „Sprachenlernen scheint dir zu liegen.“ oder „Super, das ist dir wie immer sehr gut gelungen.“ Wenn Mädchen Fehler unterlaufen, gibt es Äußerungen wie: „Da hast du wohl gerade nicht gut aufgepasst.“ oder „Das war nun aber auch eine sehr schwierige Aufgabe.“","frage":"Aus welchen Bereichen der Motivationsforschung lässt sich ableiten, dass sich das Verhalten der Englischlehrerin ungünstig auf die Motivation und/oder die Leistung der Jungen auswirken wird? Die ungünstigen Auswirkungen lassen sich ableiten aus der Forschung…","aussagen":["zur Wirkung von Attributionsverhalten auf die Leistungsmotivation.","zur Wirkung des Fähigkeitsselbstkonzepts in Leistungssituationen.","zur Wirkung der intrinsischen Motivation auf die Leistungsmotivation.","zur Wirkung von Flow-Erleben in Leistungssituationen.","zur Wirkung von Interesse auf die Leistungsmotivation."],"optionen":["Die Aussagen (1), (4) und (5) treffen zu; die anderen aber nicht.","Die Aussagen (1) und (2) treffen zu; die anderen aber nicht.","Die Aussagen (2), (3), (4) und (5) treffen zu; die andere Aussage aber nicht.","Die Aussagen (1), (2) und (4) treffen zu; die anderen aber nicht.","Die Aussage (3) trifft zu; alle anderen Aussagen treffen nicht zu."],"loesung":1,"aussagen_richtig":[0,1],"erklaerung":"Die Lehrerin kommentiert systematisch die Ursachen von Erfolg und Misserfolg und gibt den Jungen damit ein Attributionsmuster vor: Erfolge erklärt sie mit Anstrengung oder leichten Aufgaben, also variabel und nicht mit Fähigkeit, Misserfolge dagegen mit „Jungs und Sprachen, das klappt leider nicht“ – also internal und stabil. Genau diese Kombination ist das misserfolgsmeidende Muster, das die Erfolgserwartung senkt (1). Weil die wiederholte Zuschreibung fehlender Sprachbegabung an ein ganzes Geschlecht auf ein überdauerndes Personenmerkmal zielt, greift sie zusätzlich in das Fähigkeitsselbstkonzept ein, das die Erwartung künftiger Leistungen mitbestimmt (2). Die übrigen Bereiche werden durch das geschilderte Verhalten nicht berührt: Die Lehrerin sagt nichts über Tätigkeitsanreize (3, 4) oder über den Gegenstand und dessen Interessantheit (5); ihre Bemerkungen beziehen sich ausschließlich auf Ursachen von Leistungsergebnissen.","folie":"3_Leistungsmotivation_02_11_2021, Seite 41 (Attributionsmuster) und 05_Motivation_Erwartungen_15_11_2022 (Fähigkeitsselbstkonzept)"},{"id":"hp3a-mp2019-09-1","quelle":"Gedächtnisprotokoll März 2019, HP3-Sammlung S. 23f.","vertrauen":"mittel","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Weiner (1985), Attributionstheorie","typ":"matrix","stamm":"Beim Üben in Freiarbeitsphasen dürfen die Schülerinnen selbst wählen, ob sie leichte, mittelschwierige oder schwierige Aufgaben bearbeiten. Niklas wählt in der Regel entweder sehr leichte oder sehr schwierige Aufgaben aus. Wenn er leichte Aufgaben erfolgreich löst, freut er sich darüber aber nur wenig; er sagt dann zu sich, dass es klar war, dass er das schafft, da die Aufgaben so leicht waren. Bei sehr schweren Aufgaben hört er sofort wieder auf, wenn er nicht mit der Lösung weiterkommt; er sagt dann, dass er eben nicht begabt sei für Mathe und es trotz des Übens nicht gut können werde. Seine Freundin Christin schlägt ihm vor, es mit einer mittelschwierigen Aufgabe zu versuchen; Niklas löst diese erfolgreich, meint aber danach, das sei schlicht Glück gewesen. Niklas schreibt seinen Erfolgen bzw. Misserfolgen verschiedene Ursachen zu.","frage":"Ordnen Sie Niklas' Attributionen nach dem Klassifikationsschema von Weiner ein (Achtung, pro Zeile gibt es nur eine korrekte Antwort).","spalten":["Internal stabil","External stabil","Internal variabel","External variabel"],"zeilen":[{"text":"Erfolg in leichten Aufgaben","loesung":1},{"text":"Erfolg in mittelschweren Aufgaben","loesung":3},{"text":"Misserfolg in schweren Aufgaben","loesung":0}],"erklaerung":"Die Vignette benennt die Attributionen wörtlich: Den Erfolg bei leichten Aufgaben erklärt Niklas mit der Aufgabenschwierigkeit selbst („es war klar, dass er das schafft, da die Aufgaben so leicht waren“) – Aufgabenschwierigkeit gilt bei Weiner als external-stabile Ursache. Den Erfolg bei der mittelschweren Aufgabe führt er auf Glück zurück, eine external-variable Ursache. Den Misserfolg bei schweren Aufgaben erklärt er mit fehlender Begabung („nicht begabt sei für Mathe“), eine internal-stabile Ursache, was seine ungünstige, änderungsresistente Attribution von Misserfolgen zeigt. Das Quelldokument enthält für diese Teilaufgabe keine markierte Lösung; die Zuordnung ist jedoch direkt aus dem Wortlaut der Fallvignette in Kombination mit Weiners Standardklassifikation ableitbar."},{"id":"hp3a-ws2021-02","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 7 (Lösung S. 17)","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Heckhausen (1989), Selbstbewertungsmodell","typ":"multi","stamm":"Eine Lehrerin berichtet von einem Schüler, Niklas: Beim Üben in Freiarbeitsphasen dürfen die SchülerInnen selbst wählen, ob sie leichte, mittelschwierige oder schwierige Aufgaben bearbeiten. Niklas wählt in der Regel entweder sehr leichte oder sehr schwierige Aufgaben aus. Wenn er leichte Aufgaben erfolgreich löst, freut er sich darüber aber nur wenig; er sagt dann zu sich, dass es klar war, dass er das schafft, da die Aufgaben so leicht waren. Bei sehr schweren Aufgaben hört er sofort wieder auf, wenn er nicht mit der Lösung weiterkommt. In solchen Misserfolgs-Situationen ist er sehr enttäuscht und sagt dann, dass er eben nicht begabt sei für Mathe und es trotz des Übens nicht gut können werde. Auf Vorschlag probiert er eine mittelschwierige Aufgabe, löst diese erfolgreich, meint aber danach, das sei schlicht Glück gewesen.","frage":"Warum ist das Verhalten von Niklas aus Sicht des Selbstbewertungsmodells (Heckhausen, 1989) ungünstig?","optionen":["Das Verhalten von Niklas führt dazu, dass er sein Interesse für Mathematik steigert.","Das Verhalten von Niklas führt dazu, dass er seine Kompetenzen in Mathematik nicht realistisch einschätzen kann.","Das Verhalten von Niklas führt dazu, dass er bei Übungsaufgaben in Mathematik keine positive Affektbilanz hat.","Das Verhalten von Niklas führt dazu, dass er seine Kompetenzen in Mathematik zunehmend überschätzen wird.","Das Verhalten von Niklas führt dazu, dass er eine hohe Erfolgserwartung für Mathematikaufgaben ausbilden wird."],"loesungen":[1,2],"erklaerung":"Niklas wählt konsequent Extremaufgaben und attribuiert Erfolg bei leichten Aufgaben external (Aufgabenschwierigkeit) sowie Misserfolg bei schweren Aufgaben internal-stabil (fehlende Begabung), während er Erfolg bei mittelschweren Aufgaben auf Zufall (Glück) zurückführt. Diese Attributionsmuster verhindern, dass er aus seinen Erfahrungen eine realistische Selbsteinschätzung seiner Kompetenz ableitet (b), und da er bei den von ihm bevorzugten Extremaufgaben kaum echte Erfolgserlebnisse verbucht, entsteht bei den mittleren, tatsächlich diagnostischen Übungsaufgaben keine positive Affektbilanz (c). Die übrigen Optionen sind falsch: Sein Verhalten steigert weder sein Interesse (a) noch führt es zu einer Überschätzung (d) oder einer hohen Erfolgserwartung (e) – im Gegenteil, es stabilisiert eher eine ungünstige, unrealistische Selbstbewertung."},{"id":"hp3b-wise2021-06","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 63","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Weiner (1985), Attributionstheorie","typ":"matrix","stamm":"Herr Müller gibt seiner Klasse die letzte Englisch-Klausur zurück und bittet die einzelnen Schüler*innen, sich zu überlegen, worauf sie ihr Ergebnis jeweils zurückführen. Klassifizieren Sie die in den Aussagen der Schüler*innen zum Ausdruck kommenden Attributionen nach dem Klassifikationsschema von Weiner (1985). Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Attribution ist …","spalten":["external variabel","external stabil","internal variabel","internal stabil"],"zeilen":[{"text":"„Die Fünf zeigt mir mal wieder, dass mir mit Sprachen einfach nicht liegen.“","loesung":3},{"text":"„Ich habe ein ‚sehr gut‘ bekommen. Englisch ist eben einfach mein Fach.“","loesung":3},{"text":"„Nur eine 3. Die Klausuren sind aber auch immer super schwer.“","loesung":1},{"text":"„Die gute Note erstaunt mich. Da habe ich wohl auch mal das richtige Los gezogen.“","loesung":0},{"text":"„Das war gar nicht so schlecht. Das zusätzliche Üben hat sich gelohnt.“","loesung":2},{"text":"„Das habe ich komplett verhauen. Ich hätte mich beim Lernen besser organisieren sollen.“","loesung":2},{"text":"„Das war leider nicht so gut. Ich muss mich wohl mehr ins Zeug legen.“","loesung":2}],"erklaerung":"Im Quelldokument sind zu dieser Aufgabe die zugrundeliegenden Attributionsursachen in der Reihenfolge der Aussagen handschriftlich notiert: Fähigkeit, Fähigkeit, Aufgabenschwierigkeit, Glück, Anstrengung, Anstrengung, Anstrengung. Nach Weiners Klassifikation ist Fähigkeit eine internal-stabile Ursache, Aufgabenschwierigkeit eine external-stabile, Glück eine external-variable und Anstrengung eine internal-variable Ursache. Die Zuordnung der sieben Aussagen zu den vier Kategorien ergibt sich damit direkt aus den im Dokument vermerkten Ursachen.","folie":"05_Motivation_Erwartungen (Weiner, Attributionsschema)"},{"id":"hp3b-wise2021-08","quelle":"Klausur „Psychologie des Lehrens und Lernens 2“, WiSe 2020/2021, HP3-Sammlung S. 64","vertrauen":"mittel","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Atkinson (1957, 1964), Risiko-Wahl-Modell","typ":"multi","stamm":"Welche der folgenden Aussagen lassen sich theoretisch mit dem Risiko-Wahl-Modell von Atkinson (1957, 1964) begründen?","frage":"Mit dem Risiko-Wahl-Modell begründbar?","optionen":["Die Motivation misserfolgsorientierter Personen ist für das Bearbeiten einer extrem schwierigen Aufgabe am niedrigsten.","Die Motivation erfolgszuversichtlicher Personen ist für das Bearbeiten einer mittelschwierigen Aufgabe am höchsten.","Der Anreiz des Erfolges ist sowohl für erfolgszuversichtliche als auch für misserfolgsorientierte Personen bei extrem schwierigen Aufgaben am niedrigsten.","Die Motivation erfolgszuversichtlicher Personen ist für das Bearbeiten einer extrem schwierigen Aufgabe sehr hoch.","Die Motivation misserfolgsorientierter Personen ist für das Bearbeiten einer mittelschwierigen Aufgabe am niedrigsten."],"loesungen":[1,4],"erklaerung":"Im Risiko-Wahl-Modell ist die resultierende Tendenz erfolgszuversichtlicher Personen bei mittlerer Erfolgswahrscheinlichkeit (Ps=.5) am höchsten, da hier das Produkt aus Erfolgswahrscheinlichkeit und Erfolgsanreiz maximal wird; bei misserfolgsorientierten Personen ist die (aversive) Tendenz gerade bei mittelschwierigen Aufgaben am stärksten ausgeprägt, ihre Nettomotivation dort also am niedrigsten. Der Erfolgsanreiz steigt mit sinkender Erfolgswahrscheinlichkeit (Anreiz = 1 - Ps) und ist bei extrem schwierigen Aufgaben somit am höchsten, nicht am niedrigsten; eine Notiz im Quelldokument bestätigt dies wörtlich ('Nein, denn Erfolgsanreiz steigt mit sinkender Erfolgswahrscheinlichkeit'). Bei extrem schwierigen Aufgaben sinkt die Erfolgswahrscheinlichkeit so stark, dass auch bei erfolgszuversichtlichen Personen die resultierende Motivation nicht sehr hoch, sondern vergleichsweise gering ausfällt, weshalb auch Aussage 1 falsch ist.","folie":"3_Leistungsmotivation / 4_Motivation_Anreize (Atkinson, Risiko-Wahl-Modell)"},{"id":"hp3c-probekl2-05","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, HP3-Sammlung S. 74-79 (Lösungen S. 79)","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Heckhausen (1977), Selbstbewertungsmodell der Leistungsmotivation","typ":"mc-kombi","stamm":"Grundschullehrerin Frau Müller beobachtet, dass Tabea im Matheunterricht zwar stets fleißig mitarbeitet, im „Freien Üben“, wo die Schüler und Schülerinnen selbstständig Aufgaben aus dem Trainingsheft auswählen können, über das Abschreiben der Aufgaben aber nicht hinauskommt. Frau Müller bemerkt, dass Tabea immer versucht, die besonders schwierigen Aufgaben zu bearbeiten. Auf Nachfrage meint Tabea: „Ich glaube, ich bin einfach nicht schlau genug für Mathe.“","frage":"Welche Empfehlungen zur Unterstützung von Tabea lassen sich aus Heckhausens Selbstbewertungsmodell der Leistungsmotivation (1977) ableiten?","aussagen":["Frau Müller sollte Tabea damit trösten, dass sie ja in anderen Fächern sehr begabt ist.","Frau Müller sollte Tabea dabei unterstützen, Aufgaben entsprechend ihrer Fähigkeiten auszuwählen.","Frau Müller sollte Tabea den Rat geben, möglichst einfache Übungsaufgaben auszuwählen.","Frau Müller sollte Tabea erklären, dass die Übungsaufgaben regelmäßig benotet werden.","Frau Müller sollte Tabea verdeutlichen, dass Misserfolge bei besonders schwierigen Aufgaben nicht verwunderlich sind."],"aussagen_richtig":[1,4],"optionen":["Die Aussage (1) trifft zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (4) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (3) und (5) treffen zu; alle anderen Aussagen treffen nicht zu.","Aussage (5) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":2,"erklaerung":"Tabea wählt systematisch zu schwierige Aufgaben und attribuiert ihr daraus resultierendes Scheitern internal auf mangelnde Fähigkeit, statt eine realistische, an ihre Fähigkeiten angepasste Zielsetzung vorzunehmen. Nach dem Selbstbewertungsmodell sollte man sie daher bei einer passenden Aufgabenwahl unterstützen und ihr verdeutlichen, dass Misserfolg bei besonders schwierigen Aufgaben normal und nicht auf mangelnde Begabung zurückzuführen ist. Trösten mit Stärken in anderen Fächern ändert nichts an der ungünstigen Zielsetzung, der Rat zu durchweg einfachen Aufgaben fördert Erfolge ohne Leistungszuwachs und regelmäßige Benotung adressiert nicht die zugrundeliegende Zielsetzungs- und Attributionsproblematik.","folie":"03_LeistMotivation_Erläuterung_Narciss-etal (Selbstbewertungsmodell der Leistungsmotivation nach Heckhausen: Zielsetzung, Kausalattribution, Selbstbewertung)"},{"id":"nar-f07","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL2, Frage 7, S. 3","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Atkinson (1957, 1964), Risiko-Wahl-Modell","typ":"multi","frage":"Welche der folgenden Größen sind Bestandteil des Risiko-Wahl-Modells (Atkinson, 1957, 1964)?","optionen":["Anreiz der Situation","Wahrscheinlichkeit des Erfolges","Resultierende Aufgabenschwierigkeit","Anreiz des Erfolges"],"loesungen":[1,3],"erklaerung":"Atkinsons Risiko-Wahl-Modell erklärt die Wahl einer Aufgabenschwierigkeit über die Wahrscheinlichkeit des Erfolgs und den Anreiz des Erfolgs, der als Komplement zur Erfolgswahrscheinlichkeit definiert ist (b, d). Der „Anreiz der Situation“ (a) und die „resultierende Aufgabenschwierigkeit“ (c) sind im Modell nicht als eigenständige Größen benannt; die Aufgabenschwierigkeit ist vielmehr die unabhängige Variable, über die Erfolgswahrscheinlichkeit und Erfolgsanreiz definiert werden."},{"id":"nar-f08","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL2, Frage 8, S. 3","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Heckhausen (1977), Selbstbewertungsmodell der Leistungsmotivation","typ":"multi","frage":"Welche der folgenden Prozesse wirken zentral im Selbstbewertungsmodell der Leistungsmotivation (Heckhausen 1977)?","optionen":["Zufriedenheit mit der eigenen Tüchtigkeit","Wird-Soll-Vergleich","Fremdbewertung","Attribution des Ergebnisses","Vergleich des Ergebnisses mit Standards"],"loesungen":[0,1,3,4],"erklaerung":"Im Selbstbewertungsmodell bewertet die Person ihr Ergebnis im Wird-Soll-Vergleich (b), attribuiert es auf Ursachen (d) und vergleicht es mit selbstgesetzten Standards (e); aus diesem Attributions- und Bewertungsprozess resultiert die Zufriedenheit mit der eigenen Tüchtigkeit (a). Eine Fremdbewertung durch andere (c) ist dagegen kein zentraler Baustein des Modells, das explizit die Selbstbewertung in den Mittelpunkt stellt."},{"id":"nar-f09","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL2, Frage 9, S. 4","vertrauen":"hoch","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Weiner, Attributionstheorie (Kausaldimensionen)","typ":"single","frage":"Lea hat im Geschichtstest eine 5 bekommen. Wie immer macht sie für das Ergebnis den Lehrer verantwortlich, da sie der Ansicht ist, dieser könne sie nicht leiden. Wie lässt sich Leas Attribution in Weiners Schema einordnen?","optionen":["Kontrollierbar, external, stabil","Kontrollierbar, external, variabel","Unkontrollierbar, external, stabil","Unkontrollierbar, internal, variabel"],"loesung":2,"erklaerung":"Lea schreibt ihren Misserfolg einer Ursache außerhalb ihrer eigenen Person zu (external: die Abneigung des Lehrers), die sie selbst nicht beeinflussen kann (unkontrollierbar) und die sie als überdauernd erlebt, weil sie „wie immer“ so attribuiert (stabil). Damit passt nur die Kombination unkontrollierbar-external-stabil (c); die übrigen Optionen widersprechen mindestens einem der drei Merkmale, etwa der Kontrollierbarkeit oder der zeitlichen Stabilität."},{"id":"nar-f10","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL2, Frage 10, S. 4","vertrauen":"mittel","teil":"II","thema":"Leistungsmotivation und Attribution","modell":"Heckhausen (1977), Selbstbewertungsmodell der Leistungsmotivation","typ":"multi","frage":"Welche Ansatzpunkte zur Förderung von Motivation finden sich nach dem Selbstbewertungsmodel
