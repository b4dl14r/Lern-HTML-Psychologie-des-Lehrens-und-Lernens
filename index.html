<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Staatsexamen Pädagogische Psychologie | TU Dresden</title>
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --border:#cbd5e1;
  --text:#0f172a; --text-dim:#475569; --text-faint:#64748b;
  --accent:#1e3a8a; --accent-soft:#eff6ff; --accent-text:#1d4ed8;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --hint:#b45309; --hint-soft:#fef3c7;
  --radius:10px; --gutter:16px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --surface:#1e293b; --surface-2:#334155; --border:#475569;
    --text:#f8fafc; --text-dim:#94a3b8; --text-faint:#64748b;
    --accent:#3b82f6; --accent-soft:#1e293b; --accent-text:#93c5fd;
    --ok:#22c55e; --ok-soft:#064e3b; --bad:#ef4444; --bad-soft:#7f1d1d;
    --hint:#f59e0b; --hint-soft:#451a03;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --surface:#1e293b; --surface-2:#334155; --border:#475569;
  --text:#f8fafc; --text-dim:#94a3b8; --text-faint:#64748b;
  --accent:#3b82f6; --accent-soft:#1e293b; --accent-text:#93c5fd;
  --ok:#22c55e; --ok-soft:#064e3b; --bad:#ef4444; --bad-soft:#7f1d1d;
  --hint:#f59e0b; --hint-soft:#451a03;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:820px; margin:0 auto; padding:0 var(--gutter)}

header{
  position:sticky; top:0; z-index:50; background:var(--surface);
  border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top);
}
.hdr{display:flex; align-items:center; gap:10px; min-height:48px}
.hdr h1{font-size:15px; font-weight:700; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hdr .sub{color:var(--text-faint); font-weight:400}
.iconbtn{
  background:none; border:1px solid var(--border); color:var(--text-dim);
  width:32px; height:32px; border-radius:6px; cursor:pointer; display:grid; place-items:center;
}
.progressbar{height:3px; background:var(--surface-2)}
.progressbar>i{display:block; height:100%; background:var(--accent); width:0; transition:width .2s}

.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; margin:12px 0;
}
h2{font-size:17px; margin:20px 0 10px; font-weight:700}
h3{font-size:13px; margin:16px 0 6px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.05em}

button{font-family:inherit; font-size:inherit}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--accent); color:#fff; border:none; border-radius:6px;
  padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border)}
.btn.wide{width:100%}
.btn.hint{background:var(--hint-soft); color:var(--hint); border:1px solid transparent}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row>.btn{flex:1 1 auto; min-width:120px}

.tag{
  display:inline-block; font-size:11px; font-weight:600; padding:2px 6px;
  border-radius:4px; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);
}
.tag.q-hoch{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.tag.q-mittel{background:var(--hint-soft); color:var(--hint); border-color:transparent}
.tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}

.mode{
  display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:10px; cursor:pointer; color:inherit;
}
.mode:hover{border-color:var(--accent); background:var(--surface-2)}
.mode b{display:block; font-size:15px; font-weight:700; margin-bottom:2px}
.mode span{display:block; color:var(--text-dim); font-size:13px; line-height:1.4}

.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px; text-align:center}
.stat b{display:block; font-size:20px; font-weight:800}
.stat span{display:block; font-size:11px; color:var(--text-dim); font-weight:600}

.stamm{
  background:var(--surface-2); border-left:3.5px solid var(--accent);
  padding:11px 13px; border-radius:0 6px 6px 0; margin-bottom:12px; font-size:14px; line-height:1.55;
}
.frage{font-size:15px; line-height:1.45; margin-bottom:12px; font-weight:600}
.aussagen{margin:0 0 14px; padding:0; list-style:none; counter-reset:a}
.aussagen li{
  position:relative; padding:5px 0 5px 32px; font-size:14px; line-height:1.45; border-bottom:1px solid var(--border);
}
.aussagen li::before{
  counter-increment:a; content:"(" counter(a) ")";
  position:absolute; left:0; top:5px; color:var(--text-faint); font-weight:700; font-size:13px;
}
.aussagen li.mark-ok{background:var(--ok-soft); color:var(--ok); font-weight:600; border-radius:4px}
.aussagen li.mark-no{opacity:.55}

.opts{display:flex; flex-direction:column; gap:6px}
.opt{
  display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; cursor:pointer; color:inherit; font-size:14px; line-height:1.4;
}
.opt:hover:not(.locked){border-color:var(--accent)}
.opt .key{
  flex:none; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border);
  display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--text-dim);
}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.sel .key{background:var(--accent); border-color:var(--accent); color:#fff}
.opt.right{border-color:var(--ok); background:var(--ok-soft); color:var(--ok); font-weight:600}
.opt.right .key{background:var(--ok); border-color:var(--ok); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.opt.wrong .key{background:var(--bad); border-color:var(--bad); color:#fff}

/* Horizontale Matrix-Tabelle */
.matrix-box{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:10px; border:1px solid var(--border); border-radius:8px}
.m-table{width:100%; min-width:480px; border-collapse:collapse; font-size:13px}
.m-table th, .m-table td{border:1px solid var(--border); padding:8px 10px; text-align:left}
.m-table th{background:var(--surface-2); font-weight:700}
.m-table th.center, .m-table td.center{text-align:center; width:80px}
.m-table tr.r-ok{background:var(--ok-soft)}
.m-table tr.r-bad{background:var(--bad-soft)}
.m-table input[type="radio"]{transform:scale(1.15); cursor:pointer}

.inline-hint{
  display:none; background:var(--hint-soft); border:1px dashed var(--hint);
  color:var(--text); padding:9px 12px; border-radius:6px; font-size:13px; margin:10px 0; line-height:1.45;
}
.inline-hint.open{display:block}

.reveal{margin-top:14px; border-radius:8px; padding:12px 14px; font-size:13.5px; line-height:1.55}
.reveal.ok{background:var(--ok-soft); border:1px solid var(--ok); color:var(--text)}
.reveal.bad{background:var(--bad-soft); border:1px solid var(--bad); color:var(--text)}
.reveal.neutral{background:var(--surface-2); border:1px solid var(--border); color:var(--text)}
.reveal b.verdict{display:block; margin-bottom:4px; font-size:14px; font-weight:700}
.reveal.ok b.verdict{color:var(--ok)}
.reveal.bad b.verdict{color:var(--bad)}
.reveal .exp-text{margin-top:4px}
.reveal .src-box{
  margin-top:8px; padding-top:8px; border-top:1px solid rgba(0,0,0,0.1);
  font-size:12px; color:var(--text-faint); font-weight:600;
}

.foot{
  position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border);
  padding:9px 0 calc(9px + env(safe-area-inset-bottom)); margin-top:20px; z-index:40;
}
.foot .wrap{display:flex; gap:8px; align-items:center}
.foot .btn{flex:1 1 0; min-width:0; padding:9px 10px; text-align:center}
.foot .btn.narrow{flex:0 0 auto; width:44px; padding:9px 0}

.grade-badge{font-size:1.8rem; font-weight:800; border-radius:8px; padding:0.2rem 0.8rem; display:inline-block}
.grade-pass{background:var(--ok-soft); color:var(--ok)}
.grade-fail{background:var(--bad-soft); color:var(--bad)}
select{font-family:inherit; font-size:14px; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); width:100%}
label.fld{display:block; margin:12px 0 0}
label.fld>span{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:4px}
</style>
</head>

<script>
"use strict";

const FRAGEN = [{"id":"ex2016-07-2","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 7.2","vertrauen":"mittel","teil":"I","thema":"Diagnostik und Gütekriterien","modell":"Testtheoretische Gütekriterien","typ":"mc-kombi","stamm":"Ein Mathematik-Lehrer hat die Mathematikarbeit korrigiert. Er hat sich dazu zunächst einmal einen Gesamteindruck über das Leistungsspektrum der Klasse verschafft, indem er je zwei Arbeiten von bisher sehr leistungsstarken Schülern sowie von bisher eher leistungsschwachen Schülern durchgesehen hat. Mithilfe dieses Gesamteindrucks hat er anschließend Arbeit für Arbeit korrigiert und in Relation zu den beiden guten und schlechten Arbeiten bewertet.","frage":"Inwiefern verstößt das Vorgehen des Mathematik-Lehrers gegen die testtheoretischen Gütekriterien?","aussagen":["Das Vorgehen verstößt gegen die Durchführungsobjektivität.","Das Vorgehen verstößt gegen die Auswertungsobjektivität.","Das Vorgehen verstößt gegen die Interpretationsobjektivität.","Das Vorgehen erzeugt eine geringe Reliabilität.","Das Vorgehen erzeugt eine geringe Validität."],"aussagen_richtig":[1,2,3,4],"optionen":["Die Aussagen (1), (2) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (3), (4) und (5) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (3) treffen zu, alle anderen Aussagen treffen nicht zu.","Die Aussagen (2), (3), (4) und (5) treffen zu, die andere Aussage trifft nicht zu.","Aussage (3) trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":3,"erklaerung":"Die Durchführungsobjektivität betrifft die Bedingungen, unter denen die Arbeit geschrieben wird – daran hat der Lehrer nichts verändert, deshalb trifft (1) nicht zu. Alles andere geht schief. Die Auswertung hängt davon ab, welche vier Arbeiten er zufällig zuerst gesehen hat, ein anderer Korrektor käme zu anderen Punkten – das verletzt die Auswertungsobjektivität. Ebenso die Deutung der Ergebnisse, weil der Maßstab ein zufälliger Klassenausschnitt ist – das verletzt die Interpretationsobjektivität. Objektivität ist die Voraussetzung für Reliabilität: Was vom Korrektor und vom Zufall der Vergleichsarbeiten abhängt, misst nicht zuverlässig. Und ohne Reliabilität keine Validität – die Note bildet dann nicht mehr die Leistung im Fach ab, sondern die Position in einem willkürlichen Vergleichsrahmen. Für diese Aufgabe liegt kein Lösungsschlüssel vor; das Klausurexemplar zeigt (b), was die Auswertungsobjektivität unberücksichtigt ließe.","folie":"8 Diagnostik – Gütekriterien"},{"id":"ex2024-17-2","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 17.2 (S. 24)","vertrauen":"mittel","teil":"I","thema":"Diagnostik und Gütekriterien","modell":"Hauptgütekriterien: Objektivität, Reliabilität, Validität","typ":"mc-kombi","stamm":"Ein Physik-Lehrer hat die Physikarbeit korrigiert. Er hat dabei zunächst Arbeit für Arbeit mit vorbereiteten Kriterien und Punkte-Schema bewertet. Danach prüft er, wo die durchschnittliche Punktzahl für die Arbeit liegt und legt dann den Notenschlüssel fest. Für die durchschnittlich erreichte Punktzahl gibt es die Note 3. Für die höchste Punktzahl vergibt er die Note 1, für die schlechteste die Note 6.","frage":"Inwiefern verstößt das Vorgehen des Physik-Lehrers gegen die testtheoretischen Gütekriterien?","aussagen":["Das Vorgehen verstößt gegen die Durchführungsobjektivität.","Das Vorgehen verstößt gegen die Auswertungsobjektivität.","Das Vorgehen verstößt gegen die Interpretationsobjektivität.","Das Vorgehen erzeugt eine geringe Reliabilität.","Das Vorgehen erzeugt eine geringe Validität."],"optionen":["Die Aussagen (1), (2) und (3) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (2) und (4) treffen zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (2), (3), (4) und (5) treffen zu; die andere Aussage trifft nicht zu.","Aussage (3) trifft zu; alle anderen Aussagen treffen nicht zu.","Die Aussagen (3), (4) und (5) treffen zu; alle anderen Aussagen treffen nicht zu."],"loesung":3,"aussagen_richtig":[2],"erklaerung":"Die Vorlesung definiert die drei Facetten der Objektivität über den Zeitpunkt der Festlegung: Durchführungsobjektivität heißt, dass für alle Lernenden vergleichbare Bedingungen bei der Messung gelten; Auswertungsobjektivität heißt, dass nach eindeutig vorher festgelegten Beurteilungskriterien ausgewertet wird; Interpretationsobjektivität heißt, dass die ausgewerteten Ergebnisse nach einem vorher definierten Transformationsschlüssel interpretiert werden. Der Lehrer schreibt dieselbe Arbeit unter denselben Bedingungen, verletzt also (1) nicht, und er wertet mit vorbereiteten Kriterien und einem Punkte-Schema aus, womit (2) ebenfalls nicht verletzt ist. Verletzt ist genau der dritte Schritt: Den Notenschlüssel legt er erst nach der Auswertung und abhängig vom Klassendurchschnitt fest, sodass dieselbe Punktzahl in einer anderen Klasse eine andere Note ergäbe (3). Die Reliabilität (4) hängt von der Zahl und Genauigkeit der Messungen ab und wird durch den Notenschlüssel nicht berührt; die Validität (5) betrifft die Frage, ob die Arbeit das misst, was sie messen soll, und ist durch die nachträgliche Notenzuordnung ebenfalls nicht angesprochen.","folie":"08_Motivation_Leistungsbewertung_06122022, Seite 23 (Objektivität – Implikationen)"},{"id":"hp3a-ws2021-12","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 12 (Lösung S. 19)","vertrauen":"hoch","teil":"I","thema":"Diagnostik und Gütekriterien","modell":"Klassische Testtheorie, systematische vs. unsystematische Messfehler","typ":"matrix","stamm":"Die Gymnasiallehrerin Frau Wilhelm braucht für das Halbjahreszeugnis ihrer 7. Klasse noch Noten für ihr Fach Deutsch. Sie möchte daher im Unterricht das Gedicht „Der Handschuh“ von Friedrich Schiller von ihren Schülern rezitieren lassen. Bei der Bewertung lassen sich folgende Situationen beobachten.","frage":"Entscheiden Sie, ob Frau Wilhelm in den folgenden geschilderten Situationen jeweils ein systematischer Fehler, ein unsystematischer Fehler oder kein Fehler unterläuft (pro Zeile nur eine korrekte Antwort).","spalten":["Unsystematischer Fehler","Systematischer Fehler","Kein Fehler"],"zeilen":[{"text":"Maria, die in der Reihe der leistungsschwächeren Schüler*innen dran ist, hat sich gut vorbereitet und zeigt eine gute Leistung. Vor dem Hintergrund der schlechteren Leistungen der Mitschüler*innen erhält sie die Note „Sehr gut“.","loesung":0},{"text":"Zu Beginn der Stunde ist Frau Wilhelm konzentriert und achtet auf kleinste Details. Im weiteren Verlauf der Stunde schaut sie jedoch immer wieder aus dem Fenster oder blättert im Klassenbuch.","loesung":0},{"text":"Von Elias weiß sie, dass dieser intensiv Leistungssport betreibt und dadurch weniger üben kann. Bei der Beurteilung von Elias' Gedichtvortrag ist sie daher nicht so streng.","loesung":1},{"text":"Frau Wilhelm möchte sich das Beste bis zum Schluss aufheben und lässt zuerst die leistungsschwächeren Schüler*innen rezitieren. Bruno kommt zuerst dran; obwohl er sich diesmal gut vorbereitet hat und kaum Fehler macht, bekommt er wie immer eine der schlechtesten Noten.","loesung":1},{"text":"Margarethe (Tochter aus einem Akademikerhaushalt) erhält nach ihrem unerwartet stockenden Gedichtvortrag trotzdem die Note „sehr gut“, da sie sonst auch immer sehr gute Leistungen zeigt.","loesung":1},{"text":"Direkt nach Marcos Gedichtrezitation notiert Frau Wilhelm auf dem Kriterienschema zu jedem Bewertungskriterium, inwiefern es erfüllt wurde.","loesung":2},{"text":"Während Hannas Gedichtrezitation klopft es an der Tür, Frau Wilhelm wird kurz abgelenkt und merkt nicht, dass Hanna eine Strophe vergisst. Hanna bekommt die Note „sehr gut“.","loesung":0}],"erklaerung":"Unsystematische (zufällige) Fehler entstehen durch situative Schwankungen wie Kontrasteffekte (Marias Leistung wirkt vor schwächerem Hintergrund besser), Müdigkeits- bzw. Aufmerksamkeitsschwankungen (Frau Wilhelm schaut aus dem Fenster, wird durch Klopfen abgelenkt) und mindern die Reliabilität der Messung. Systematische Fehler entstehen durch stabile, wiederkehrende Verzerrungstendenzen wie Milde/Strenge gegenüber bestimmten Personen (Elias), Reihenfolgeeffekte (Bruno kommt immer zuerst dran und wird dadurch systematisch benachteiligt) oder Erwartungseffekte (Margarethes generell gute Leistungen führen zu einer wohlwollenden Beurteilung trotz abweichender Ist-Leistung) und mindern die Validität der Messung. Kein Fehler liegt vor, wenn kriteriumsorientiert und unmittelbar nach der Beobachtung dokumentiert wird, wie im Fall von Marco."},{"id":"hp3a-ws2021-18","quelle":"Gedächtnisklausur WiSe 2020/21, HP3-Sammlung S. 15f. (Lösung S. 21)","vertrauen":"hoch","teil":"I","thema":"Diagnostik und Gütekriterien","modell":"Klassische Testtheorie, Gütekriterien (Objektivität, Reliabilität, Validität)","typ":"matrix","stamm":"Ein Dozent der Rechtspsychologie führt eine Klausur zu den Seminarinhalten des letzten Semesters durch. Dabei trifft er einige Entscheidungen, die den Gütekriterien bei Leistungsmessungen widersprechen. Verfehlungen eines Kriteriums ziehen stets die Verletzung weiterer Kriterien nach sich; markieren Sie deshalb nur das Kriterium, welchem die Aussage ursprünglich widerspricht.","frage":"Kreuzen Sie für die einzelnen Aussagen an, welchem Gütekriterium sie widersprechen. Sollte die Aussage keinem Kriterium widersprechen, kreuzen Sie „weder noch“ an (nur eine korrekte Antwort pro Aussage).","spalten":["Objektivität","Reliabilität","Validität","Weder noch"],"zeilen":[{"text":"Am nächsten Tag nimmt er die Leistungsbewertung der Klausuren vor.","loesung":3},{"text":"Er wählt bei der Klausur einen Platz, von dem aus er nur einen Teil der Studierenden überblicken und darauf achten kann, dass dort niemand in die eigenen Unterlagen schaut.","loesung":0},{"text":"Im folgenden Jahr setzt er bei der nächsten Kohorte die gleiche Klausur erneut ein, obwohl er die notwendigen Grundlagen zu einer Aufgabe im Seminar diesmal nicht behandelt hat.","loesung":2},{"text":"Er korrigiert die Klausuren sehr spät am Abend, sodass er zum Teil Fehler übersieht.","loesung":1},{"text":"Für die Klausur konstruiert er insgesamt zwei Aufgabenstellungen. Für jede Aufgabe wird die Hälfte der zu erreichenden Gesamtpunktzahl vergeben.","loesung":3},{"text":"Während des Schreibens der Klausur gibt er manchen Studierenden einen Tipp.","loesung":0}],"erklaerung":"Objektivität (Durchführungsobjektivität) verlangt für alle Prüflinge vergleichbare Bedingungen; ungleiche Aufsicht oder punktuelle Tipps an einzelne Studierende verletzen dieses Kriterium unmittelbar. Reliabilität betrifft die Genauigkeit der Messung und wird durch zufällige, unsystematische Fehler wie Flüchtigkeitsfehler bei später, ermüdeter Korrektur gemindert. Validität ist verletzt, wenn systematisch etwas anderes gemessen wird als beabsichtigt, etwa wenn eine Aufgabe Inhalte abfragt, die im Unterricht gar nicht behandelt wurden – das Ergebnis spiegelt dann nicht die intendierte Kompetenz wider. Die zeitliche Verzögerung der Bewertung an sich sowie eine gleichmäßige Punkteverteilung auf zwei Aufgaben verletzen für sich genommen keines der drei Gütekriterien."},{"id":"hp3b-sose2020-02","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 52","vertrauen":"mittel","teil":"I","thema":"Diagnostik und Gütekriterien","modell":"Testtheoretische Gütekriterien: Validität, Reliabilität, Objektivität","typ":"matrix","stamm":"Um die Ausprägung der testtheoretischen Gütekriterien bei der Leistungsbewertung zu erhöhen, gibt es verschiedene Prinzipien. Kreuzen Sie an, mit welchem Gütekriterium sich die folgenden Prinzipien direkt begründen lassen. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Prinzip lässt sich begründen mit …","spalten":["Validität","Reliabilität","Objektivität"],"zeilen":[{"text":"Es sollten nur die zum Thema gehörenden Aspekte in die Leistungsbewertung einfließen.","loesung":0},{"text":"Leistungskontrollen zu einer Unterrichtseinheit sollten nur das prüfen, was unterrichtet wurde.","loesung":0},{"text":"Die Zuordnung der Leistungen zu Noten soll nach eindeutigen, vorher definierten Regeln erfolgen.","loesung":2},{"text":"Der Auswertungs- und Interpretationsschritt sollten getrennt voneinander erfolgen.","loesung":2},{"text":"Zensuren sollten auf der Grundlage so vieler Kennwerte wie möglich berechnet werden.","loesung":1}],"erklaerung":"Validität bezeichnet, ob wirklich das gemessen wird, was gemessen werden soll; deshalb betreffen die Prinzipien 'nur themenrelevante Aspekte' und 'nur unterrichteter Stoff' die Validität (curriculare Validität). Eindeutige, vorab definierte Bewertungsregeln sowie die Trennung von Auswertung und Interpretation sichern die Objektivität, weil sie den Einfluss des einzelnen Bewertenden minimieren (Auswertungs- bzw. Interpretationsobjektivität). Die Berücksichtigung möglichst vieler Kennwerte erhöht die Reliabilität, da eine breitere Datenbasis die Messgenauigkeit stabilisiert. Ein handschriftlicher Vermerk im Dokument ('= Interpretationsobjektivität?') bestätigt die Zuordnung von Zeile 4 zur Objektivität; die übrigen Zeilen sind aus der Gütekriterien-Systematik abgeleitet, da die Kreuze in der Quelle durch die PDF-Extraktion nicht eindeutig den Zeilen zuzuordnen sind.","folie":"8 Diagnostik (Gütekriterien: Validität, Reliabilität, Objektivität)"},{"id":"hp3b-sose2020-13","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 58","vertrauen":"mittel","teil":"I","thema":"Diagnostik und Gütekriterien","modell":"Testtheoretische Gütekriterien bei der Leistungsbewertung","typ":"matrix","stamm":"Frau Schuster muss einen Stapel ihrer Englischklasse korrigieren. Sie ist sich ihrer Verantwortung als Lehrerin sehr bewusst, möchte keine Fehler machen und jeder SchülerIn gerecht werden. Entscheiden Sie, wie sich die folgenden Verhaltensweisen von Frau Schuster auf die Erfüllung der Gütekriterien bei der Leistungsmessung auswirken. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Die Verhaltensweise …","spalten":["wirkt negativ","wirkt positiv","hat keinen Einfluss"],"zeilen":[{"text":"Frau Schuster hält sich an ihren vorab festgelegten Notenschlüssel.","loesung":1},{"text":"Frau Schuster schreibt zur Ziffernnote einen motivationsfördernden Kommentar unter jede Arbeit.","loesung":2},{"text":"Frau Schuster prüft nach Abschluss der Korrektur zufällig ausgewählte Arbeiten, um sicherzugehen, dass sie korrekt bewertet hat.","loesung":1},{"text":"Frau Schuster kommentiert die Klausuren der SchülerInnen mit schlechteren Leistungen zusätzlich nach der individuellen Bezugsnorm.","loesung":2},{"text":"Frau Schuster berücksichtigt bei jeder Klausur, ob es gerade besondere Vorkommnisse im Leben der SchülerInnen gibt, die ihre Leistungsfähigkeit beeinflussen könnten.","loesung":0},{"text":"Frau Schuster nimmt sich vor der Korrektur jeder Klausur ein paar Minuten Zeit, um eine kurze Prognose des Ergebnisses zu formulieren.","loesung":0},{"text":"Frau Schuster hat vor der Korrektur der Arbeiten ein für sie verbindliches Bewertungsraster (Kriterien und Punkte) entwickelt.","loesung":1}],"erklaerung":"Ein vorab festgelegter Notenschlüssel und ein verbindliches Bewertungsraster erhöhen die Objektivität und Reliabilität der Bewertung, ebenso eine nachträgliche Stichprobenprüfung zur Fehlerkontrolle. Ein zusätzlicher motivierender Kommentar oder ein Hinweis nach individueller Bezugsnorm verändert die eigentliche Notengebung nicht und hat daher keinen Einfluss auf die Gütekriterien der Messung selbst. Das nachträgliche Berücksichtigen persönlicher Umstände beim Korrigieren verletzt dagegen die Objektivität, da die Bewertung dann nicht mehr ausschließlich von der gezeigten Leistung abhängt; das bestätigt eine Notiz im Dokument ('Schlecht: Man kann doch nicht einfach Ergebnisse abändern...'). Ein vor der Korrektur gebildetes Ergebnis-Vorurteil birgt die Gefahr einer Erwartungsverzerrung ähnlich dem Pygmalion-Effekt und wirkt sich daher negativ auf die Objektivität aus.","folie":"8 Diagnostik (Gütekriterien bei der Leistungsbewertung)"},{"id":"hp3b-sose2020-14","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 58","vertrauen":"mittel","teil":"I","thema":"Diagnostik und Gütekriterien","modell":"Objektivität, Vergleichbarkeit von Bewertungsschlüsseln","typ":"multi","stamm":"Die Physiklehrer zweier 8. Klassen haben gemeinsam eine Physikklausur mit gemeinsamem Punkteschema erarbeitet, verwenden zur Notenvergabe aber ihre jeweils an ihrer Schule üblichen, unterschiedlichen Bewertungsschlüssel (Herr Meier: 60 P.=1 bis <31 P.=6; Herr Gnädig: 60-58 P.=1 bis <15 P.=6).","frage":"Kreuzen Sie an, welche der folgenden Aussagen auf der Basis dieser Schulnoten getroffen werden können!","optionen":["Die Klasse von Herrn Meier zeigt schlechtere Physikleistungen als die Klasse von Herrn Gnädig.","Die Klassen sind auf der Grundlage der Schulnoten nicht zu vergleichen.","Die Interpretationsobjektivität ist verletzt, da die gleiche Leistung nicht zur gleichen Note führt.","Die Auswertungsobjektivität ist hoch, da die Lehrer das gleiche Punkteschema für die Korrektur der Aufgaben verwenden.","Herr Meier kann Physik nicht so gut vermitteln wie Herr Gnädig."],"loesungen":[1,2,3],"erklaerung":"Da die beiden Lehrer unterschiedliche Bewertungsschlüssel verwenden, führt dieselbe Punktzahl zu unterschiedlichen Noten; damit sind die Noten der beiden Klassen nicht direkt vergleichbar, und die Interpretationsobjektivität ist verletzt. Die Auswertungsobjektivität ist dagegen hoch, weil beide Lehrer beim Korrigieren dasselbe Punkteschema anwenden – das betrifft einen anderen Schritt der Bewertung als die abschließende Notenzuordnung. Aus den unterschiedlichen Notenverteilungen lässt sich weder eine schlechtere Leistung der einen Klasse noch eine schlechtere Vermittlungsleistung eines Lehrers ableiten, da der Unterschied ebenso gut allein durch den strengeren bzw. milderen Notenschlüssel erklärbar ist.","folie":"8 Diagnostik (Objektivität, Notenschlüssel)"},{"id":"nar-f102","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL12, Frage 102, S. 23","vertrauen":"mittel","teil":"I","thema":"Diagnostik und Gütekriterien","typ":"matrix","frage":"Bevor Leistungsbeurteilungen vorgenommen werden können, müssen Vorarbeiten geleistet werden, damit die Bewertung von Lernleistungen unter Einhaltung von Gütekriterien erfolgt. Ordnen Sie die folgenden Tätigkeiten der passenden Stelle des Bewertungsprozesses zu.","spalten":["Diagnoseobjekt spezifizieren","Diagnostische Information erfassen","Diagnostisches Urteil fällen"],"zeilen":[{"text":"„Lerninhalte beschreiben“","loesung":1},{"text":"„Festlegung, was gemessen werden soll“","loesung":0},{"text":"„Form der Urteile festlegen“","loesung":2},{"text":"„Messergebnisse transformieren“","loesung":2},{"text":"„Aufgaben konstruieren“","loesung":1},{"text":"„Ziel des Bewertungssystems bestimmen“","loesung":2},{"text":"„Zielkriterien festlegen“","loesung":0}],"erklaerung":"Der Bewertungsprozess gliedert sich in die Schritte Diagnoseobjekt spezifizieren, diagnostische Information erfassen und diagnostisches Urteil fällen. Laut Lösung des Quelldokuments gehören die Beschreibung der Lerninhalte und die Aufgabenkonstruktion zur Erfassung diagnostischer Information, die Festlegung, was gemessen werden soll, sowie die Bestimmung von Zielkriterien zur Spezifikation des Diagnoseobjekts, und die Festlegung der Urteilsform, die Transformation von Messergebnissen sowie die Bestimmung des Ziels des Bewertungssystems zum Fällen des diagnostischen Urteils.","folie":"Zeile „Ziel des Bewertungssystems bestimmen“ ordnet die Quelle dem Urteilsschritt zu statt intuitiv der Spezifikation; hier wie im Dokument übernommen."},{"id":"nar-f39","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 39, S. 11","vertrauen":"mittel","teil":"I","thema":"Diagnostik und Gütekriterien","typ":"multi","frage":"Was sind Charakteristika einer Lehrperson, die einen Einfluss auf den Beurteilungsprozess ausüben?","optionen":["soziales Wissen","epistemische Überzeugungen","subjektive Kompetenzen","subjektive Theorien","pädagogische Orientierungen","pädagogische Kompetenzen"],"loesungen":[0,1,3,4,5],"erklaerung":"Auf den Beurteilungsprozess wirken das soziale Wissen der Lehrperson über SuS (a), ihre epistemischen Überzeugungen etwa zur Natur von Wissen und Lernen (b), ihre subjektiven Theorien über Lernen und Leistung (d), ihre pädagogischen Orientierungen (e) und pädagogischen Kompetenzen (f). Die subjektiven Kompetenzen der Lehrperson selbst (c) sind dagegen nicht als eigener beurteilungsrelevanter Faktor in dieser Aufzählung enthalten."},{"id":"nar-f40","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 40, S. 11","vertrauen":"hoch","teil":"I","thema":"Diagnostik und Gütekriterien","typ":"matrix","frage":"Ordnen Sie den Testgütekriterien die passende Definition zu.","spalten":["Validität","Durchführungsobjektivität","Interpretationsobjektivität","Auswertungsobjektivität","Reliabilität"],"zeilen":[{"text":"Für alle Lernenden gelten vergleichbare Bedingungen bei der Messung der Leistung.","loesung":1},{"text":"Die ausgewerteten Testwerte werden nach einem vorher definierten Transformationsschlüssel bewertet.","loesung":2},{"text":"Die Messung erfolgt möglichst genau und zuverlässig, sodass der Messwert möglichst genau den wahren Wert abbildet.","loesung":4},{"text":"Der Test misst das, was er zu messen vorgibt.","loesung":0},{"text":"Die Messdaten werden nach eindeutig vorher festgelegten Beurteilungskriterien in einen Messwert transformiert.","loesung":3}],"erklaerung":"Validität bedeutet, dass ein Test tatsächlich das misst, was er zu messen vorgibt. Reliabilität bezeichnet die Genauigkeit und Zuverlässigkeit der Messung. Durchführungsobjektivität liegt vor, wenn für alle Lernenden vergleichbare Testbedingungen gelten, Auswertungsobjektivität, wenn Messdaten nach einem festgelegten Schlüssel in einen Wert transformiert werden, und Interpretationsobjektivität, wenn Testwerte nach einem vorher definierten Transformationsschlüssel bewertet werden."},{"id":"nar-f41","quelle":"Klausurübungsfragen der Vorlesung Narciss – Feedback, Motivation, Grundlagen der Psychologie des Lehrens und Lernens II (TU Dresden, Studocu), VL6, Frage 41, S. 12","vertrauen":"mittel","teil":"I","thema":"Diagnostik und Gütekriterien","typ":"multi","frage":"Welche der folgenden Punkte sollten für das Vorgehen beim Messen und Beurteilen erfüllt werden?","optionen":["Lehr-Lernziele und Standards formulieren","Kriterien für Lernerfolg kommunizieren","Aufgaben klar stellen","Punktzahl nach der sozialen Bezugsnorm festlegen"],"loesungen":[0,1,2],"erklaerung":"Gütekriteriengerechtes Messen und Beurteilen setzt voraus, dass Lehr-Lernziele und Standards vorab formuliert (a), Kriterien für Lernerfolg den SuS kommuniziert (b) und Aufgaben klar und eindeutig gestellt werden (c). Die Punktzahl von vornherein an einer sozialen Bezugsnorm auszurichten (d) widerspricht dagegen dem Grundsatz eines vorab festgelegten, sachlich begründeten Bewertungsmaßstabs und gehört nicht zu den Gütekriterien."},{"id":"pk2017-06","quelle":"Probeklausur Psychologie des Lehrens und Lernens II, 2017 (Lösungsschlüssel am Dokumentende), Aufgabe 6","vertrauen":"hoch","teil":"I","thema":"Diagnostik und Gütekriterien","modell":"Hauptgütekriterien: Objektivität, Reliabilität, Validität","typ":"matrix","frage":"Welche der folgenden Aussagen zum Thema Gütekriterien sind korrekt?","spalten":["korrekt","nicht korrekt"],"zeilen":[{"text":"Hohe Validität einer Messung setzt voraus, dass möglichst wenig systematische Fehler auftreten.","loesung":0},{"text":"Interpretationsobjektivität bedeutet, dass für alle Lernenden die gleichen Bedingungen während der Messung gelten.","loesung":1},{"text":"Eine Messung ist reliabel, wenn möglichst genau und zuverlässig gemessen wird.","loesung":0},{"text":"Objektivität heißt, dass ein Test misst, was er zu messen vorgibt.","loesung":1}],"erklaerung":"Die drei Hauptgütekriterien sind klar voneinander abgegrenzt. Objektivität heißt, dass die Ergebnisse unabhängig von der Person sind, die den Test durchführt, auswertet und interpretiert – die Definition in Zeile 4 beschreibt dagegen die Validität und ist damit falsch. Die Interpretationsobjektivität verlangt, dass die ausgewerteten Ergebnisse nach einem vorher definierten Transformationsschlüssel interpretiert werden; gleiche Bedingungen während der Messung sind die Durchführungsobjektivität, weshalb Zeile 2 falsch ist. Reliabilität ist die Genauigkeit einer Messung, also die Frage, wie genau der Messwert den wahren Wert abbildet – Zeile 3 ist korrekt. Validität meint, dass der Test die relevanten und nicht irrelevante Merkmale erfasst; systematische Fehler verzerren genau diese Gültigkeit, weshalb Zeile 1 korrekt ist.","folie":"08_Motivation_Leistungsbewertung_06122022, Seite 21-27 (Hauptgütekriterien)"},{"id":"ex2016-05-1","quelle":"Erste Staatsprüfung (Lehramt Grundschule), Klausur Bildungswissenschaften – Pädagogische Psychologie, Winter 2016, Sächsische Bildungsagentur Dresden, Aufgabe 5.1","vertrauen":"hoch","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"mc-kombi","stamm":"Sie wurden gebeten, dem Lehrerkollegium einige gedächtnispsychologische Grundlagen in einem Workshop zu vermitteln. Gerade haben Sie das Mehrspeichermodell vorgestellt. Jetzt fassen Sie die Merkmale des Kurzzeitgedächtnisses noch einmal zusammen.","frage":"Welche der folgenden Aussagen sind in Bezug auf das Kurzzeitgedächtnis (KZG) richtig?","aussagen":["Informationen im KZG sind nach semantischen Merkmalen organisiert.","Die Haltedauer des KZG ist begrenzt, aber die Kapazität ist sehr groß.","Das KZG kann Informationen für 1 bis 2 Tage behalten, nach dem Abruf (z. B. in einer Prüfung) sind diese aber nicht mehr verfügbar.","Die Haltedauer des KZG beträgt ca. 30 Sekunden.","Das KZG kann 5 bis 9 Informationseinheiten in kurzer Zeit aufnehmen und verarbeiten."],"aussagen_richtig":[3,4],"optionen":["Die Aussagen (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (4) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (4) und (5) treffen zu; alle anderen aber nicht."],"loesung":4,"erklaerung":"Das Kurzzeitgedächtnis ist in beidem begrenzt: rund 20 bis 30 Sekunden Haltedauer und 7 plus minus 2 Chunks Kapazität, also 5 bis 9 Einheiten. Damit treffen (4) und (5) zu. (2) ist die klassische Falle – die Haltedauer ist zwar begrenzt, die Kapazität aber gerade nicht groß. Wer (2) mitankreuzt, landet bei (d) statt bei (e). (1) beschreibt das Langzeitgedächtnis, in dem Wissen semantisch organisiert abgelegt wird. (3) passt zu keinem der Speicher: 1 bis 2 Tage sind für das KZG viel zu lang, und Abruf löscht im Langzeitgedächtnis nichts.","folie":"3 Gedächtnis – Mehrspeichermodell, Kennwerte der Speicher"},{"id":"ex2024-06-1","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 6.1 (S. 8)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"mc-kombi","stamm":"Sie wurden gebeten, dem Lehrkollegium einige gedächtnispsychologische Grundlagen in einem Workshop zu vermitteln. Gerade haben Sie das Mehrspeichermodell nach Atkinson und Shiffrin (1968) vorgestellt. Jetzt fassen Sie die Merkmale des Kurzzeitgedächtnisses noch einmal zusammen.","frage":"Welche der folgenden Aussagen sind in Bezug auf das Kurzzeitgedächtnis richtig?","aussagen":["Das KZG hat eine nahezu unbegrenzte Kapazität.","Das KZG verliert Infos, z.B. durch Interferenzen.","Das KZG hat eine Behaltensdauer von ca. 20-30 Sekunden.","Das KZG arbeitet überwiegend modalitätsspezifisch.","Das KZG dient vorwiegend der Informationsaufnahme."],"optionen":["Die Aussagen (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (2) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (2), (3) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (5) treffen zu; alle anderen aber nicht."],"loesung":0,"aussagen_richtig":[1,2],"erklaerung":"Im Mehrspeichermodell trägt das Kurzzeitgedächtnis zwei Kennwerte: Kapazität 7 ± 2 Chunks und Haltedauer 20-30 Sekunden. Damit ist (3) richtig und (1) falsch – nahezu unbegrenzt ist die Kapazität des Langzeitgedächtnisses. Als Ursache des Informationsverlusts nennt das Modell für das KZG ausdrücklich Interferenz, also die Verdrängung älterer durch neue Information, weshalb (2) zutrifft. Die Aussagen (4) und (5) beschreiben dagegen das sensorische Register: Dieses arbeitet modalitätsspezifisch (hören, sehen, fühlen) und steht für die Stufe der Informationsaufnahme, während das KZG der Informationsverarbeitung zugeordnet ist.","folie":"3 Gedächtnis, Seite 4 (Mehrspeichermodell, Kennwerte der Speicher)"},{"id":"ex2024-06-2","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 6.2 (S. 8)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"mc-kombi","stamm":"Sie wurden gebeten, dem Lehrkollegium einige gedächtnispsychologische Grundlagen in einem Workshop zu vermitteln. Gerade haben Sie das Mehrspeichermodell nach Atkinson und Shiffrin (1968) vorgestellt. Im nächsten Schritt fassen Sie die Merkmale des Langzeitgedächtnisses zusammen.","frage":"Welche der folgenden Aussagen sind in Bezug auf das Langzeitgedächtnis (LZG) richtig?","aussagen":["Die Speicherung von Wissen erfolgt im LZG organisiert.","Die Haltedauer des LZG ist begrenzt.","Die Kapazität des LZG ist riesig.","Das LZG dient der Informationsspeicherung.","Das LZG verliert Inhalte, z.B. durch Zerfall nicht beachteter Informationen."],"optionen":["Die Aussagen (2) und (3) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (2) und (5) treffen zu; alle anderen aber nicht.","Die Aussagen (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1), (3) und (4) treffen zu; alle anderen aber nicht.","Die Aussagen (1) und (4) treffen zu; alle anderen aber nicht."],"loesung":3,"aussagen_richtig":[0,2,3],"erklaerung":"Die Folie zum Mehrspeichermodell nennt für das Langzeitgedächtnis drei Merkmale: riesige Kapazität (3), lebenslange Haltedauer und organisierte Speicherung von Wissen (1) – episodisch, semantisch, prozedural. In der Prozesskette steht das LZG für die Stufe der Informationsspeicherung, womit auch (4) zutrifft. Aussage (2) widerspricht der lebenslangen Haltedauer und ist damit falsch. Aussage (5) ordnet dem LZG die Verlustursache des sensorischen Registers zu: Dort geht Information durch den Zerfall nicht beachteter Informationen verloren. Beim LZG scheitert dagegen der Abruf, weil Hinweisreize fehlen oder Interferenz auftritt.","folie":"3 Gedächtnis, Seite 4 (Mehrspeichermodell, Kennwerte und Verlustursachen)"},{"id":"ex2024-06-3","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 6.3 (S. 9)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Lernstrategien: Elaboration und Organisation","typ":"matrix","stamm":"Im weiteren Verlauf des Workshops möchten Sie auf der Grundlage des Mehrspeichermodells Tipps zusammenstellen, die beim Speichern von Informationen im Langzeitgedächtnis helfen können. Sie haben den Teilnehmer*innen erläutert, dass Elaboration und Organisation wichtige Strategien sind. Gemeinsam suchen Sie nun nach konkreten Beispielen, wie diese Strategien beim Lernen aus Texten umgesetzt werden können.","frage":"Kreuzen Sie für jeden der folgenden Tipps an, inwiefern er ein Beispiel für Elaboration, Organisation oder keine der beiden Strategien darstellt. Pro Aussage gibt es nur eine korrekte Antwort.","spalten":["Elaboration","Organisation","keine"],"zeilen":[{"text":"Die Schüler*innen sollen eine Concept Map zum Text anlegen.","loesung":1},{"text":"Die Schüler*innen sollen sich Beispiele zum Textinhalt ausdenken.","loesung":0},{"text":"Die Schüler*innen sollen Zwischenüberschriften für die einzelnen Textabschnitte finden.","loesung":1},{"text":"Die Schüler*innen sollen alle Fachbegriffe aus dem Text abschreiben.","loesung":2},{"text":"Die Schüler*innen sollen den Text mehrmals durchlesen.","loesung":2},{"text":"Die Schüler*innen sollen ihnen unbekannte Begriffe aufschreiben und deren Bedeutung erschließen.","loesung":0},{"text":"Die Schüler*innen sollen sich Anwendungsfragen ausdenken, mit denen sie das Wissen ihrer Banknachbar*innen über den Text überprüfen können.","loesung":0}],"erklaerung":"Organisation meint Strukturierungstechniken, die den Stoff reduzieren und ordnen: Chunking, Kategorisierung, Mind- und Concept Maps, Gliederungen. Darunter fallen die Concept Map und das Finden von Zwischenüberschriften, denn beide bringen den vorhandenen Inhalt in eine Struktur, ohne etwas hinzuzufügen. Elaboration meint dagegen das Anreichern des Stoffs mit zusätzlichen Bedeutungen und Verknüpfungen zum Vorwissen: eigene Beispiele bilden, die Bedeutung unbekannter Begriffe erschließen und Anwendungsfragen generieren sind genau solche generativen Verknüpfungsleistungen. Weder das eine noch das andere sind das bloße Abschreiben von Fachbegriffen und das mehrmalige Durchlesen: Beides ist reine Wiederholung (rehearsal), die den Stoff weder strukturiert noch semantisch anreichert.","folie":"4 Instruktionsdesign Gedächtnis, Seite 30 und 35 (Strukturierungstechniken, Assoziationstechniken)"},{"id":"ex2024-07","quelle":"Gedächtnisprotokoll Erste Staatsprüfung (Lehramt), Pädagogische Psychologie und Entwicklungspsychologie, Winter 2024, Aufgabe 7 (S. 10)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Baddeley (1974), Arbeitsgedächtnismodell","typ":"matrix","frage":"Welche der folgenden Aussagen sind für die jeweilige Komponente im Arbeitsgedächtnismodell von Baddeley (1974) zutreffend? Pro Aussage gibt es nur eine korrekte Antwort.","spalten":["Phonologische Schleife","Visuell-räumlicher Notizblock","Sowohl als auch","Weder noch"],"zeilen":[{"text":"Gestattet fortwährendes sub-vokales Sprechen.","loesung":0},{"text":"Gestattet Kontrolle und Koordination eingegangener Informationen.","loesung":3},{"text":"Gestattet mentale Rotation von Figuren.","loesung":1},{"text":"Ist ein modalitätsspezifisches Teilsystem.","loesung":2},{"text":"Weist eine begrenzte Kapazität auf.","loesung":2},{"text":"Beispiel: eine Straße im Kopf entlanggehen, wenn wir jemandem einen Weg beschreiben.","loesung":1},{"text":"Beispiel: eine Telefonnummer im Kopf wiederholen, wenn wir uns diese merken wollen.","loesung":0},{"text":"Beispiel: Wohnung vorstellen und im Kopf Fenster abzählen, um die Frage zu beantworten, wie viele Fenster eine Wohnung hat.","loesung":1}],"erklaerung":"Baddeleys Arbeitsgedächtnis besteht aus der zentralen Exekutive und zwei ihr untergeordneten, modalitätsspezifischen Sklavensystemen. Die phonologische Schleife hält sprachlich-akustische Information durch inneres, sub-vokales Wiederholen aufrecht; dahin gehören das fortwährende sub-vokale Sprechen und das Wiederholen einer Telefonnummer. Der visuell-räumliche Notizblock hält bildhafte und räumliche Information; dahin gehören die mentale Rotation von Figuren, das gedankliche Abgehen einer Straße und das Abzählen der Fenster in der vorgestellten Wohnung. Zwei Merkmale gelten für beide Sklavensysteme: Beide sind modalitätsspezifisch, und beide haben eine begrenzte Kapazität. Kontrolle und Koordination eingehender Informationen leistet dagegen keines der beiden Teilsysteme, sondern die zentrale Exekutive – daher hier „weder noch“.","folie":"2 Wissenserwerb Kognition (Arbeitsgedächtnismodell nach Baddeley)"},{"id":"hp3b-sose2020-06","quelle":"Klausurfragen Psychologie des Lehrens und Lernens 1, SoSe 2020, HP3-Sammlung S. 54","vertrauen":"hoch","teil":"I","thema":"Gedächtnis","modell":"Modelle des Vergessens: Spurenzerfall, proaktive und retroaktive Interferenz","typ":"matrix","stamm":"Um Phänomene des Vergessens zu beschreiben und zu erklären, wurden mehrere Modelle des Vergessens in der Psychologie erarbeitet. Kreuzen Sie für jedes Beispiel an, ob es am besten durch Spurenzerfall, retroaktive Interferenz, proaktive Interferenz oder durch keines der genannten Modelle erklärt werden kann. Pro Aussage gibt es nur eine korrekte Antwort.","frage":"Beispiel wird erklärt durch …","spalten":["proaktive Interferenz","Spurenzerfall","keines der Modelle","retroaktive Interferenz"],"zeilen":[{"text":"Aisha lernt entspannt zu Hause in einer ruhigen Atmosphäre anatomische Begriffe. Als sie diese wenige Tage später in der Prüfung unter Zeitdruck abrufen will, fallen ihr nur noch wenige Begriffe ein.","loesung":2},{"text":"Frau Nemec ist Lehrerin für Biologie und Geschichte. Einige Jahre hat sie ausschließlich Biologie unterrichtet. Als sie plötzlich wieder Geschichte unterrichten soll, merkt sie, dass sie bestimmte Inhalte neu lernen muss.","loesung":3},{"text":"Josch hatte gerade Spanischunterricht. Als er nun versucht, Portugiesisch zu lernen, fällt es ihm schwer, sich portugiesische Vokabeln einzuprägen.","loesung":0},{"text":"Referendar Tim versucht sich die Namen der SchülerInnen seiner neuen Klasse gleich einzuprägen. Als er in der darauffolgenden Stunde die SchülerInnen seiner anderen Klasse kennenlernt und sich deren Namen einprägt, denkt er, dass er nicht mehr alle Namen seiner ersten Klasse abrufen kann.","loesung":3},{"text":"Josephine hat sich vor vier Wochen eine Definition eingeprägt und dann das Thema nicht weiterbearbeitet. Nun kann sie die Definition nicht wiedergeben.","loesung":1}],"erklaerung":"Die Folie trennt die drei Ansätze scharf. Proaktive Interferenz heißt: Schon vorhandene Informationen stören die Aufnahme weiterer – das ist Josch, dessen frisches Spanisch das Portugiesischlernen behindert. Retroaktive Interferenz heißt: Neu Gelerntes verhindert die Einprägung bzw. den Abruf des zuvor Gelernten – das trifft auf Referendar Tim zu, dessen zweite Namensliste die erste überlagert, und ebenso auf Frau Nemec: Sie hat jahrelang ausschließlich Biologie unterrichtet, und dieses fortlaufende neue Arbeiten überlagert ihr älteres Geschichtswissen. Spurenzerfall erklärt Vergessen allein über fehlende Aktivierung, ohne konkurrierende Lerntätigkeit – das ist Josephine, die das Thema vier Wochen lang schlicht nicht mehr angefasst hat. Das Unterscheidungsmerkmal ist also: Ist in der Zwischenzeit etwas Ähnliches dazugelernt worden (Interferenz) oder ist einfach nur Zeit vergangen (Spurenzerfall)? Aishas Fall betrifft den Wechsel von entspanntem Lernkontext zur Prüfungssituation und gehört zu keinem der drei Modelle.","folie":"3 Gedächtnis, Folien 9 und 21 – Spurenzerfall und Interferenzeffekte"},{"id":"ueb-003","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 2, Übung 1 (a)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"multi","frage":"Welche Komponente(n) gehört/gehören zum Mehrspeichermodell von Atkinson und Shiffrin (1968)?","optionen":["sensorisches Register","visueller Speicher","Kurzzeitgedächtnis"],"loesungen":[0,2],"erklaerung":"Das Mehrspeichermodell von Atkinson und Shiffrin (1968) besteht aus drei Speicherinstanzen: sensorisches Register, Kurzzeitgedächtnis (bzw. Arbeitsgedächtnis) und Langzeitgedächtnis. Ein eigenständiger 'visueller Speicher' ist im Modell nicht als benannte Komponente vorgesehen; visuelle Information wird lediglich als eine Modalität im modalitätsspezifischen sensorischen Register erfasst.","folie":"2 Wissenserwerb Kognition.txt, Mehrspeichermodell-Schaubild"},{"id":"ueb-004","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 3, Übung 1 (b)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"single","frage":"Wie groß ist die Kapazität des Arbeitsgedächtnisses nach dem Mehrspeichermodell von Atkinson und Shiffrin (1968)?","optionen":["3+-3 chunks","7+-2 chunks","5+-2 chunks"],"loesung":1,"erklaerung":"Nach dem Mehrspeichermodell fasst das Kurzzeit- bzw. Arbeitsgedächtnis rund 7±2 Informationseinheiten (Chunks) – die klassische 'Millersche Zahl'. Die anderen Angaben entsprechen keiner in der Vorlesung berichteten Kapazitätsangabe für diesen Speicher.","folie":"2 Wissenserwerb Kognition.txt, Mehrspeichermodell-Schaubild"},{"id":"ueb-005","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 3, Übung 1 (c)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"multi","frage":"Wie sind nach dem Mehrspeichermodell (Atkinson und Shiffrin, 1968) Inhalte des Langzeitgedächtnisses organisiert?","optionen":["modalspezifisch","episodisch","prozedural"],"loesungen":[1,2],"erklaerung":"Im Schaubild der Vorlesung wird das Langzeitgedächtnis als organisierter Speicher mit episodischen, semantischen und prozeduralen Wissensanteilen beschrieben. 'Modalitätsspezifisch' ist dagegen ein Merkmal des sensorischen Registers, das Informationen getrennt nach Sinneskanal (visuell, auditiv usw.) und nur extrem kurz hält, nicht des Langzeitgedächtnisses.","folie":"2 Wissenserwerb Kognition.txt, Mehrspeichermodell-Schaubild"},{"id":"ueb-006","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 3, Übung 1 (d)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Baddeley (1986), Arbeitsgedächtnismodell","typ":"multi","frage":"Welche Verarbeitungsinstanz(en) ist/sind Teil des AG Modells von Baddeley (1986)?","optionen":["Visuell-räumlicher Notizblock","Phonologische Schleife","Semantischer Detektor"],"loesungen":[0,1],"erklaerung":"Baddeleys Arbeitsgedächtnismodell besteht aus der zentralen Exekutive und den beiden untergeordneten Systemen visuell-räumlicher Notizblock (für bildhaft-räumliche Information) und phonologische Schleife (für sprachliche Information); später ergänzt um den episodischen Puffer. Einen 'semantischen Detektor' kennt das Modell nicht."},{"id":"ueb-007","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 3, Klausuraufgabe 1","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Craik & Lockhart (1975), Levels-of-Processing","typ":"single","frage":"Für Fernsehsendungen wie z.B. Nachrichten oder Wissensmagazine werden Informationen von einem großen Redaktionsteam möglichst verständlich und publikumswirksam aufbereitet. Wenn möglich werden dazu die gesprochenen Informationen mit Bildern, Grafiken, Simulationen und kurzen Filmsequenzen illustriert. Gedächtnispsychologische Untersuchungen zeigen jedoch, dass trotz der aufwendigen Informationsaufbereitung, sich viele Personen bereits am nächsten Tag kaum noch konkret erinnern können, was in der Sendung präsentiert wurde. Wie kann man vor dem Hintergrund gedächtnispsychologischer Erkenntnisse zum Levels-of-Processing Modell erklären, dass die Behaltensleistungen trotz der aufwendigen redaktionellen Informationsaufbereitung so schlecht sind?","stamm":"Die Behaltensleistungen sind so schlecht, weil ...","optionen":["die meisten Zuschauer Schwierigkeiten haben, die gesprochenen Informationen gleichzeitig mit Bildern, Grafiken etc. zu verarbeiten.","die meisten Zuschauer sich nicht aktiv und intensiv mit den Informationen auseinandersetzen, sondern diese einfach passiv rezipieren.","die meisten Zuschauer zu wenig Vorwissen haben, um die Informationen einer Fernsehsendung verstehen zu können.","die meisten Zuschauer bei einer Fernsehsendung die Informationen leicht aufnehmen, aber nicht tief verarbeiten können.","den meisten Zuschauern wichtige Abrufreize fehlen, um sich an die im Fernsehen präsentierten Informationen erinnern zu können."],"loesung":3,"erklaerung":"Das Levels-of-Processing-Modell (Craik & Lockhart, 1975) erklärt Behaltensleistung über die Tiefe der Verarbeitung: Nur eine semantisch-elaborierte, tiefe Verarbeitung führt zu dauerhaften Gedächtnisspuren, während oberflächliche, flache Verarbeitung schnell wieder verblasst. Beim beiläufigen Fernsehkonsum werden Informationen zwar mühelos aufgenommen, aber kaum inhaltlich durchdrungen oder mit Vorwissen verknüpft – also flach statt tief verarbeitet, was Option (d) direkt benennt. Die anderen Optionen beschreiben zwar plausible Nebenaspekte (Doppelbelastung durch Bild und Ton, Passivität, fehlendes Vorwissen, fehlende Abrufreize), greifen aber nicht das zentrale Konstrukt der Verarbeitungstiefe auf, das im Modell explizit als Erklärung gefragt ist.","folie":"2 Wissenserwerb Kognition.txt, Levels-of-Processing"},{"id":"ueb-008","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 3-4, Klausuraufgabe 2","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Craik & Lockhart (1975), Levels-of-Processing","typ":"matrix","stamm":"Um den Schülern das Lernen eines langen Gedichts zu erleichtern, möchte der Lehrer mit Hinweisreizen arbeiten. Dazu wählt er aus jeder Strophe zentrale Stichwörter aus, unterstreicht diese und stellt zu diesen Wörtern Aufgaben.","frage":"Welche der folgenden Aufgabenstellungen erfordert nach dem Modell der Verarbeitungstiefe (Craik & Lockhart) eine flache, mittlere oder tiefe Verarbeitung dieser Stichwörter? Kreuzen Sie für jede Aufgabe an, welche Verarbeitungstiefe angeregt wird.","spalten":["Flach","Mittel","Tief"],"zeilen":[{"text":"Findet Worte, die sich auf die unterstrichenen Wörter reimen.","loesung":1},{"text":"Sucht bei den unterstrichenen Wörtern nach Rechtschreibbesonderheiten.","loesung":0},{"text":"Setzt alle unterstrichenen Worte nach inhaltlichen Aspekten in Beziehung.","loesung":2},{"text":"Bildet einen sinnvollen Satz mit jeweils einem unterstrichenen Wort.","loesung":2},{"text":"Sagt mir für jedes der unterstrichenen Wörter, an welcher Stelle in der Strophe das Wort steht.","loesung":0},{"text":"Ordnet die Wörter entsprechend ihres Anfangsbuchstabens in alphabetischer Reihenfolge.","loesung":0}],"erklaerung":"Craik und Lockhart unterscheiden strukturelle/visuelle Verarbeitung (flach, z. B. Schreibweise oder Position eines Wortes), phonologische Verarbeitung (mittel, z. B. Reime) und semantische Verarbeitung (tief, z. B. inhaltliche Bezüge herstellen oder das Wort sinnvoll in einen Satz einbauen). Rechtschreibprüfung, Positionsangabe und alphabetische Sortierung greifen nur auf visuell-strukturelle Merkmale zurück, das Reimen verlangt eine phonologische Analyse, während inhaltliche Verknüpfung und Satzbildung eine Bedeutungsanalyse – also tiefe Verarbeitung – erfordern.","folie":"2 Wissenserwerb Kognition.txt, Levels-of-Processing"},{"id":"ueb-009","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 4-5, Klausuraufgabe 3","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","typ":"matrix","stamm":"Sie bereiten eine Fortbildung zum Thema „Lernen lernen\" für Fremdsprachenlehrer vor. Zu Beginn sammeln Sie zunächst einmal die Empfehlungen zum guten Vokabellernen, die die Lehrpersonen üblicherweise ihren Schülern geben.","frage":"Kreuzen Sie an, welche der folgenden Empfehlungen sich gedächtnispsychologisch begründen lassen.","spalten":["begründbar","nicht begründbar"],"zeilen":[{"text":"Man sollte die Vokabelpaare zum Einprägen nach dem Alphabet geordnet aufschreiben.","loesung":1},{"text":"Man sollte beim Einprägen der Vokabeln die Schlüsselwort-Methode anwenden.","loesung":0},{"text":"Man sollte die Vokabeln immer wieder in derselben Reihenfolge durchlesen.","loesung":1},{"text":"Man sollte die Vokabeln beim Einprägen langsam und deutlich laut sprechen.","loesung":1},{"text":"Man sollte zum Einprägen der Vokabeln die PQ4R-Methode verwenden.","loesung":0},{"text":"Man sollte die Vokabeln zum Einprägen klar und sauber aufschreiben.","loesung":1},{"text":"Man sollte beim Einprägen der Vokabeln die Orthographie-Methode anwenden.","loesung":1},{"text":"Man sollte beim Einprägen der Vokabeln die Syntax-Methode anwenden.","loesung":1},{"text":"Man sollte beim Einprägen der Vokabeln die Ankerwort-Methode anwenden.","loesung":0},{"text":"Man sollte beim Einprägen der Vokabeln die Kontext-Methode anwenden.","loesung":0},{"text":"Man sollte Vokabeln beim Einprägen elaboriert verarbeiten.","loesung":0}],"erklaerung":"Gedächtnispsychologisch begründbar sind Strategien, die eine tiefe, elaborierte oder organisierte Verarbeitung anregen: die Schlüsselwort- und Ankerwort-Methode (Bildung bedeutungshaltiger Eselsbrücken), die PQ4R-Methode (aktive, mehrschrittige Textbearbeitung), das Lernen im bedeutsamen Kontext (Prinzip der Enkodierspezifität) sowie elaborierte Verarbeitung allgemein. Alphabetisches Sortieren, wiederholtes Lesen in gleicher Reihenfolge, lautes Sprechen ohne inhaltliche Verarbeitung, sauberes Abschreiben sowie die frei erfundenen 'Orthographie-' und 'Syntax-Methoden' erzeugen dagegen nur oberflächliche, mechanische Verarbeitung ohne organisierende oder elaborierende Wirkung und lassen sich gedächtnispsychologisch nicht als lernförderlich begründen.","folie":"2 Wissenserwerb Kognition.txt"},{"id":"ueb-011","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 5-6, Klausuraufgabe 5","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","typ":"matrix","frage":"Kreuzen Sie an, durch welches Modell des Vergessens das jeweilige Beispiel erklärt wird.","spalten":["keines der Modelle","proaktive Interferenz","Spurenzerfall","retroaktive Interferenz"],"zeilen":[{"text":"Aisha lernt entspannt zu Hause in einer ruhigen Atmosphäre anatomische Begriffe. Als sie diese wenige Tage später in der Prüfung unter Zeitdruck abrufen will, fallen ihr nur noch wenige Begriffe ein.","loesung":0},{"text":"Josch hatte gerade Spanischunterricht. Als er nun versucht, Portugiesisch zu lernen, fällt es ihm schwer, sich portugiesische Vokabeln einzuprägen.","loesung":1},{"text":"Referendar Tim versucht sich die Namen der Schüler*innen seiner neuen Klasse gleich einzuprägen. Als er in der darauffolgenden Stunde die Schüler*innen seiner anderen Klasse kennenlernt und sich deren Namen einprägt, merkt er, dass er nicht mehr alle Namen seiner ersten Klasse abrufen kann.","loesung":3},{"text":"Josephine hat sich vor vier Wochen eine Definition eingeprägt und dann das Thema nicht weiter bearbeitet. Nun kann sie die Definition nicht wiedergeben.","loesung":2},{"text":"Frau Nemec ist Lehrerin für Biologie und Geschichte. Einige Jahre hat sie ausschließlich Biologie unterrichtet. Als sie plötzlich wieder Geschichte unterrichten soll, merkt sie, dass sie bestimmte Inhalte neu lernen muss.","loesung":3}],"erklaerung":"Proaktive Interferenz liegt vor, wenn älteres Wissen das Einprägen neuen, ähnlichen Wissens stört (Joschs Spanischkenntnisse behindern das Portugiesischlernen). Retroaktive Interferenz liegt vor, wenn neues Lernen den Abruf von zuvor Gelerntem stört (Tims neue Schülernamen verdrängen die alten; Frau Nemecs jahrelanges Biologie-Unterrichten überlagert ihr Geschichtswissen). Spurenzerfall betrifft den reinen Zeitverlauf ohne weitere Lerntätigkeit (Josephines vier Wochen ohne Wiederholung). Aishas Fall lässt sich keinem der drei Modelle eindeutig zuordnen, da hier keine konkurrierende Lerntätigkeit und kein reiner Zeitverlauf, sondern die Prüfungssituation mit Zeitdruck als Ursache genannt wird.","folie":"3 Ged_chtnis_.txt"},{"id":"ueb-012","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 6-7, Klausuraufgabe 6 (1)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"mc-kombi","stamm":"Sie wurden gebeten, im Lehrer*innenkollegium einige gedächtnispsychologische Grundlagen in einem Workshop zu vermitteln. Gerade haben Sie das Mehrspeichermodell vorgestellt. Jetzt fassen Sie die Merkmale des Kurzzeitgedächtnisses noch einmal zusammen.","frage":"Welche der folgenden Aussagen sind in Bezug auf das Kurzzeitgedächtnis (KZG) richtig?","aussagen":["Informationen im KZG sind nach semantischen Merkmalen organisiert.","Die Haltedauer des KZG ist begrenzt, aber die Kapazität ist sehr hoch.","Das KZG kann Informationen über 1-2 Tage behalten, nach dem Abruf sind diese aber weg.","Die Haltedauer des KZG beträgt ca. 30 Sekunden.","Das KZG kann 5-9 Informationseinheiten in kurzer Zeit aufnehmen und verarbeiten."],"optionen":["Die Aussagen 2 und 3 treffen zu, alle anderen nicht.","Die Aussagen 1, 2 und 5 treffen zu, alle anderen nicht.","Die Aussagen 2 und 4 treffen zu, alle anderen nicht.","Die Aussagen 2, 4 und 5 treffen zu, alle anderen nicht.","Die Aussagen 4 und 5 treffen zu, alle anderen nicht."],"loesung":4,"aussagen_richtig":[3,4],"erklaerung":"Das Kurzzeitgedächtnis hält Informationen nach dem Mehrspeichermodell nur ca. 20-30 Sekunden (4) und fasst ca. 7±2, also 5-9, Informationseinheiten (5). Eine semantische Organisation (1) ist ein Merkmal des Langzeit-, nicht des Kurzzeitgedächtnisses; die Kapazität des KZG ist gerade nicht hoch, sondern eng begrenzt (2), und ein Behalten über 1-2 Tage (3) übersteigt die tatsächliche Haltedauer bei weitem. Richtig sind daher nur die Aussagen 4 und 5, also Option (e).","folie":"2 Wissenserwerb Kognition.txt, Mehrspeichermodell-Schaubild"},{"id":"ueb-013","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 7, Klausuraufgabe 6 (2)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","typ":"matrix","stamm":"Den Teilnehmer*innen ist deutlich geworden, dass das KZG nicht unbegrenzt belastbar ist. Sie wollen dieses Wissen für die Unterrichtsgestaltung nutzen und lassen in Gruppenarbeit Ideen sammeln, wie man das KZG in verschiedenen Unterrichtssituationen entlasten kann.","frage":"Welche der folgenden Empfehlungen sind bei Erklären von Unterrichtsinhalten sinnvoll, um das KZG zu entlasten?","spalten":["sinnvoll","nicht sinnvoll"],"zeilen":[{"text":"Man sollte nicht gleichzeitig schon das nächste Thema erläutern, wenn sich die Schüler*innen noch Notizen zu den vorherigen Erklärungen machen.","loesung":0},{"text":"Man sollte mündliche Erklärungen möglichst gleichzeitig noch einmal wortwörtlich auf einer Folie präsentieren.","loesung":1},{"text":"Man sollte die Schüler*innen für wichtige Informationen, die noch nicht im Langzeitgedächtnis gespeichert sind, einen externen Speicher anlegen lassen.","loesung":0},{"text":"Man sollte mündliche Erklärungen visuell unterstützen, indem man gleichzeitig möglichst viele verschiedene Bilder zum Thema präsentiert.","loesung":1},{"text":"Man sollte die Schüler*innen dazu auffordern, mündlich gegebene Aufgabenstellungen immer wieder vor sich hin zu sprechen, damit sie die Aufgabe nicht vergessen.","loesung":1}],"erklaerung":"Das KZG wird entlastet, wenn parallele Anforderungen vermieden werden: Notizen anfertigen und gleichzeitig neuen Stoff aufnehmen zu müssen überlastet die begrenzte Kapazität, ebenso das gleichzeitige Verarbeiten von gesprochenem Text und wortgleichem Folientext (Redundanzeffekt) oder vieler unterschiedlicher Bilder gleichzeitig (Kohärenzprinzip der Cognitive-Load-Forschung). Sinnvoll ist dagegen ein externer Speicher für noch nicht gefestigtes Wissen. Das beständige innere Vor-sich-hin-Sprechen einer Aufgabenstellung wirkt dagegen entlastend nur auf das Behalten der Aufgabe, nicht auf das KZG selbst: Das Rehearsal belegt dauerhaft die phonologische Schleife und bindet damit genau die Kapazität, die zum eigentlichen Lösen der Aufgabe benötigt würde – es entlastet das KZG also nicht, sondern beansprucht es zusätzlich. Im Klausurexemplar der Staatsprüfung Winter 2016 ist diese Zeile entsprechend als nicht sinnvoll markiert.","folie":"2 Wissenserwerb Kognition.txt; 4 Instruktionsdesign Ged_chtnis.txt"},{"id":"ueb-014","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 7, Klausuraufgabe 7 (1)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"mc-kombi","stamm":"Sie wurden gebeten, dem Lehrer*innenkollegium einige gedächtnispsychologische Grundlagen in einem Workshop zu vermitteln. Gerade haben Sie das Mehrspeichermodell vorgestellt. Jetzt fassen Sie die Merkmale des Langzeitgedächtnisses noch einmal zusammen.","frage":"Welche der folgenden Aussagen sind in Bezug auf das Langzeitgedächtnis (LZG) richtig?","aussagen":["Die Speicherung von Wissen erfolgt im LZG organisiert.","Die Haltedauer des LZG ist begrenzt.","Die Kapazität des LZG ist riesig.","Das LZG dient der Informationsspeicherung.","Das LZG verliert Inhalte z. B. durch Zerfall nicht beachteter Informationen."],"optionen":["Die Aussagen 2 und 3 treffen zu, alle anderen nicht.","Die Aussagen 1, 2 und 5 treffen zu, alle anderen nicht.","Die Aussagen 3 und 4 treffen zu, alle anderen nicht.","Die Aussagen 1, 3 und 4 treffen zu, alle anderen nicht.","Aussage 1 trifft zu, alle anderen nicht."],"loesung":3,"aussagen_richtig":[0,2,3],"erklaerung":"Nach dem Mehrspeichermodell speichert das Langzeitgedächtnis Wissen organisiert (1), mit riesiger Kapazität (3) und dient generell der Informationsspeicherung (4). Die Haltedauer des LZG ist gerade nicht begrenzt, sondern lebenslang (2 falsch), und der 'Zerfall nicht beachteter Informationen' ist im Modell dem sensorischen Register bzw. der Aufmerksamkeitsselektion zugeordnet, nicht dem LZG selbst (5 falsch). Richtig sind daher die Aussagen 1, 3 und 4, also Option (d).","folie":"2 Wissenserwerb Kognition.txt, Mehrspeichermodell-Schaubild"},{"id":"ueb-015","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 7, Klausuraufgabe 7 (2)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","typ":"matrix","stamm":"Im weiteren Verlauf möchten Sie auf der Grundlage des Mehrspeichermodells Tipps zusammenstellen, die beim Speichern von Informationen im LZG helfen können. Sie haben erläutert, dass Elaboration und Organisation wichtige Strategien sind und suchen nun gemeinsam nach konkreten Beispielen, wie diese beim Lernen aus Texten umgesetzt werden können.","frage":"Kreuzen Sie für jeden der folgenden Tipps an, wofür er ein Beispiel darstellt (nur eine korrekte Antwort pro Aussage).","spalten":["Elaboration","Organisation","keines"],"zeilen":[{"text":"Die Schüler*innen sollen eine Concept Map zum Text anlegen.","loesung":1},{"text":"Die Schüler*innen sollen sich Beispiele zum Textinhalt ausdenken.","loesung":0},{"text":"Die Schüler*innen sollen Zwischenüberschriften für die einzelnen Textabschnitte finden.","loesung":1},{"text":"Die Schüler*innen sollen alle Fachbegriffe aus dem Text abschreiben.","loesung":2},{"text":"Die Schüler*innen sollen den Text mehrmals durchlesen.","loesung":2},{"text":"Die Schüler*innen sollen ihnen unbekannte Begriffe aufschreiben und deren Bedeutung erschließen.","loesung":0},{"text":"Die Schüler*innen sollen sich Anwendungsfragen ausdenken, mit denen sie das Wissen ihres Banknachbarn über den Text überprüfen können.","loesung":0}],"erklaerung":"Organisation strukturiert den Lernstoff in seiner Struktur sichtbar (Concept Map, Zwischenüberschriften), während Elaboration neue, eigene Verknüpfungen zum Inhalt herstellt (eigene Beispiele ausdenken, unbekannte Begriffe selbst erschließen, Anwendungsfragen für andere formulieren). Bloßes Abschreiben von Fachbegriffen und wiederholtes Lesen ohne inhaltliche Bearbeitung regen dagegen weder Organisation noch Elaboration an und zählen zu 'keines'.","folie":"2 Wissenserwerb Kognition.txt"},{"id":"ueb-016","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 8, Klausuraufgabe 8 (1)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"matrix","frage":"Aus gedächtnispsychologischer Sicht werden durch verschiedene Forscher mehrere Modelle beschrieben, die sich mit Prozessen der Informationsverarbeitung beschäftigen. Ordnen Sie die folgenden Gedächtnisprozesse der Informationsaufnahme in die korrekte Reihenfolge.","spalten":["Erster Schritt","Zweiter Schritt","Dritter Schritt"],"zeilen":[{"text":"Speicherung","loesung":1},{"text":"Enkodierung","loesung":0},{"text":"Abruf","loesung":2}],"erklaerung":"Die grundlegenden Gedächtnisprozesse laufen in der Reihenfolge Enkodierung (Verschlüsselung der aufgenommenen Information), Speicherung (Ablage im Gedächtnis) und Abruf (Zugriff auf die gespeicherte Information) ab. Diese Abfolge ist unabhängig vom jeweiligen Speicher (KZG oder LZG) grundlegend für jede Informationsverarbeitung.","folie":"2 Wissenserwerb Kognition.txt, Gedächtnisprozesse"},{"id":"ueb-017","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 8-9, Klausuraufgabe 8 (2)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"mc-kombi","frage":"Entscheiden Sie, welche Aussagen über das Mehrspeichermodell nach Atkinson und Shiffrin (1968) wahr sind.","aussagen":["Die Reizaufnahme erfolgt im sensorischen Register.","Interferenz ist sowohl im Kurzzeitgedächtnis als auch im Langzeitgedächtnis möglich.","Das sensorische Register ist modalitätsspezifisch.","Informationen im Langzeitgedächtnis werden im semantischen, prozeduralen oder episodischen Gedächtnis organisiert.","Rehearsal beschreibt den Prozess, der für die Aufmerksamkeitszuwendung charakteristisch ist."],"optionen":["Die Aussagen (1), (3) und (5) sind richtig, alle anderen nicht.","Die Aussagen (2) und (4) sind richtig, alle anderen nicht.","Die Aussagen (1) und (4) sind richtig, alle anderen nicht.","Die Aussagen (2), (3) und (4) sind richtig, alle anderen nicht.","Die Aussagen (3) und (5) sind richtig, alle anderen nicht."],"loesung":3,"aussagen_richtig":[1,2,3],"erklaerung":"Das sensorische Register ist modalitätsspezifisch (3), Interferenz kann sowohl im KZG (z. B. durch neue Reize) als auch im LZG (proaktive/retroaktive Interferenz) auftreten (2), und das Langzeitgedächtnis organisiert Wissen episodisch, semantisch und prozedural (4). Aussage 1 ist falsch, da die Reizaufnahme selbst vor dem sensorischen Register steht bzw. dieses nur die erste, sehr kurze Zwischenstufe ist, nicht die 'Aufnahme' im engeren Sinn; Aussage 5 verwechselt Rehearsal (Aufrechterhaltung von Information im KZG durch Wiederholung) mit Aufmerksamkeitszuwendung, die ein eigener, vorgelagerter Prozess ist. Richtig sind daher 2, 3 und 4, also Option (d).","folie":"2 Wissenserwerb Kognition.txt, Mehrspeichermodell-Schaubild"},{"id":"ueb-018","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 9, Klausuraufgabe 8 (3)","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"matrix","frage":"Das Mehrspeichermodell besteht aus mehreren Einheiten mit unterschiedlichen Funktionen. Ordnen Sie zu, wofür die genannten Begriffe charakteristisch sind.","spalten":["Langzeitgedächtnis","Sensorisches Register","Kurzzeitgedächtnis","Weder noch"],"zeilen":[{"text":"Chunking","loesung":2},{"text":"haptisches Gedächtnis","loesung":1},{"text":"Bottom-up-Processing","loesung":3},{"text":"Haltedauer lebenslang","loesung":0},{"text":"Millersche Zahl","loesung":2},{"text":"Informationsaufnahme","loesung":1}],"erklaerung":"Chunking und die Millersche Zahl (7±2) betreffen die begrenzte Kapazität des Kurzzeitgedächtnisses. Das haptische Gedächtnis ist – analog zum ikonischen (visuellen) und echoischen (auditiven) Gedächtnis – eine Modalität des sensorischen Registers, das auch die erste Informationsaufnahme leistet. 'Haltedauer lebenslang' beschreibt das Langzeitgedächtnis. Bottom-up-Processing ist ein allgemeiner, reizgetriebener Verarbeitungsmodus der Wahrnehmung und keinem der drei Speicher spezifisch zugeordnet, daher 'weder noch'.","folie":"2 Wissenserwerb Kognition.txt, Mehrspeichermodell-Schaubild"},{"id":"ueb-019","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 9-10, Klausuraufgabe 9","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","typ":"mc-kombi","stamm":"Herr Meyer liest wie jeden Morgen seine Tageszeitung. Heute geht es um einen spannenden politischen Artikel zu einer EU-Debatte, in dem viele Fakten und Zahlen erscheinen, die ihn brennend interessieren. Da seine Frau heute früher zur Arbeit ging, hat sie ihm einen Zettel mit Dingen geschrieben, die Herr Meyer im Verlauf des Tages einkaufen soll. Herr Meyer merkt sich diese nach dem Lesen seiner Zeitung. Am Abend im Supermarkt kann er sich nicht mehr an alle Produkte erinnern, dafür fallen ihm aber einige Fakten des Zeitungsartikels ein. Als kleine Entschuldigung beschließt er, für seine Frau Rosen zu kaufen, da sie bei der Hochzeit einen roten Rosenbrautstrauß hatte und sie diesen sehr mochte. Zuhause berichtet Herr Meyer seiner Frau über sein Vergessen und schenkt ihr den Strauß. Seine Frau lacht und sagt, ihr Hochzeitsstrauß sei aus orangen Nelken gewesen, da sie damals etwas Untypisches haben wollte.","frage":"Entscheiden Sie, welche Aussagen nach den Modellen des Vergessens wahr sind.","aussagen":["Herr Meyer erlag dem Spurenverfall.","Herr Meyer erlag einer systematischen Verzerrung.","Herr Meyer erlag der Zugriffsstörung bezüglich der Einkaufsliste.","Herr Meyer erlag einer retrograden Hemmung bezüglich der Einkaufsliste.","Herr Meyer erlag einer proaktiven Hemmung bezüglich der Einkaufsliste."],"optionen":["Die Aussage (5) ist richtig, alle anderen nicht.","Die Aussagen (2), (3) und (4) sind richtig, alle anderen nicht.","Die Aussagen (2) und (4) sind richtig, alle anderen nicht.","Die Aussagen (1) und (5) sind richtig, alle anderen nicht.","Die Aussagen (2) und (5) sind richtig, alle anderen nicht."],"loesung":2,"aussagen_richtig":[1,3],"erklaerung":"Herr Meyer prägt sich die Einkaufsliste vor dem inhaltlich fesselnden, elaboriert verarbeiteten Zeitungsartikel ein; das spätere, intensivere Lernen (der Artikel) stört den Abruf des zuvor Gelernten (der Liste) – das ist retroaktive Hemmung (Aussage 4). Bei der Auswahl der Blumen rekonstruiert er die Erinnerung schemakonform ('Hochzeitsblumen sind rote Rosen') statt korrekt ('orange Nelken') – eine systematische Verzerrung durch schemabasierte Rekonstruktion (Aussage 2). Spurenzerfall (1) passt nicht, da eine konkurrierende Lerntätigkeit vorliegt statt reinen Zeitverlaufs; eine reine Zugriffsstörung (3) oder proaktive Hemmung (5) beschreiben die Richtung der Störung nicht korrekt, da hier neueres Lernen älteres überlagert. Richtig sind daher 2 und 4, also Option (c).","folie":"3 Ged_chtnis_.txt"},{"id":"ueb-020","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 10-11, Klausuraufgabe 11","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","modell":"Atkinson & Shiffrin (1968), Mehrspeichermodell","typ":"mc-kombi","stamm":"Frau Maier unterrichtet Deutsch. In ihrer aktuellen Klasse hat sie festgestellt, dass einige Schüler die Epochen der Literaturgeschichte nicht richtig beherrschen. Um das Problem anzugehen, hat sie sich überlegt, das Mehrspeichermodell von Atkinson und Shiffrin (1968) zu nutzen.","frage":"Welche der folgenden Aussagen trifft/treffen auf das Modell zu?","aussagen":["Das Modell unterscheidet Arbeitsgedächtnis, Kurzzeitgedächtnis und Langzeitgedächtnis.","Damit die Schüler die Epochen gut lernen, sollte Frau Maier das gedankliche Wiederholen (rehearsal) beim Kurzzeitgedächtnis fördern.","Frau Maier kann sich getrost auf das Kurzzeitgedächtnis verlassen, weil Informationsverlust nur im sensorischen Register stattfindet.","Bei fehlerhaftem Abruf, sollte Frau Maier Interferenzen, Hinweisreize und den Spurenzerfall beachten.","Die Informationsverarbeitung findet lediglich im Langzeitgedächtnis statt."],"optionen":["Aussage 1 trifft zu, alle anderen Aussagen treffen nicht zu.","Aussagen 2 und 4 treffen zu, alle anderen Aussagen treffen nicht zu.","Aussagen 1 und 5 treffen zu, alle anderen Aussagen treffen nicht zu.","Aussagen 2 und 3 treffen zu, alle anderen Aussagen treffen nicht zu.","Aussage 5 trifft zu, alle anderen Aussagen treffen nicht zu."],"loesung":1,"aussagen_richtig":[1,3],"erklaerung":"Rehearsal im Kurzzeitgedächtnis zu fördern hilft, Information dort aktiv zu halten und in das Langzeitgedächtnis zu überführen (Aussage 2), und bei Abrufproblemen sind tatsächlich Interferenzen, fehlende Hinweisreize und möglicher Spurenzerfall als Ursachen zu prüfen (Aussage 4). Aussage 1 ist falsch, da 'Arbeitsgedächtnis' im Modell ein alternativer Name für das Kurzzeitgedächtnis ist und keinen vierten, eigenständigen Speicher darstellt. Aussage 3 ist falsch, da Informationsverlust auf allen Stufen des Modells auftreten kann, nicht nur im sensorischen Register. Aussage 5 ist falsch, da Informationsverarbeitung in allen drei Speichern stattfindet. Richtig sind daher 2 und 4, also Option (b).","folie":"2 Wissenserwerb Kognition.txt, Mehrspeichermodell-Schaubild"},{"id":"ueb-021","quelle":"Übungssammlung Psychologie L+L, Aufgaben psycho blanko, S. 11-12, Klausuraufgabe 12","vertrauen":"mittel","teil":"I","thema":"Gedächtnis","typ":"matrix","frage":"Kreuzen Sie für jedes der Beispiele an, welches Modell des Vergessens hier am zutreffendsten ist (pro Aussage nur eine korrekte Antwort).","spalten":["Spurenzerfall","Zugriffsstörung","Retroaktive Interferenz","Systematische Verzerrung","Ke
